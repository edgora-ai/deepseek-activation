<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Black Hole</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  #info {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,.55); font: 13px/1.5 system-ui, sans-serif;
    text-align: center; pointer-events: none; letter-spacing: .04em;
    text-shadow: 0 1px 2px rgba(0,0,0,.8);
  }
  canvas { display: block; }
</style>
</head>
<body>
<div id="info">3D Black Hole — accretion disk · bloom · starfield · orbiting camera</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------- renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 3.2, 9);

// ---------- orbiting camera controls ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.minDistance = 4;
controls.maxDistance = 24;
controls.maxPolarAngle = Math.PI * 0.48;

// ---------- starfield ----------
function createStarfield(count = 6000, radius = 220) {
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const color = new THREE.Color();
  for (let i = 0; i < count; i++) {
    const r = radius * (0.5 + Math.random() * 0.5);
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    positions[i*3+1] = r * Math.cos(phi);
    positions[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
    const t = Math.random();
    color.setHSL(0.55 + Math.random() * 0.2, 0.5, 0.55 + t * 0.45);
    colors[i*3]   = color.r;
    colors[i*3+1] = color.g;
    colors[i*3+2] = color.b;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.35,
    vertexColors: true,
    sizeAttenuation: true,
    transparent: true,
    opacity: 0.9,
  });
  return new THREE.Points(geo, mat);
}
scene.add(createStarfield());

// ---------- black hole (event horizon) ----------
const BH_RADIUS = 1.25;
const bhMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
const bh = new THREE.Mesh(new THREE.SphereGeometry(BH_RADIUS, 48, 48), bhMat);
scene.add(bh);

// thin photon-ring glow shell around the horizon
const ringMat = new THREE.MeshBasicMaterial({
  color: 0xffcc66,
  transparent: true,
  opacity: 0.35,
  side: THREE.BackSide,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});
const ring = new THREE.Mesh(new THREE.SphereGeometry(BH_RADIUS * 1.04, 64, 64), ringMat);
scene.add(ring);

// ---------- accretion disk (particles) ----------
const DISK_OUTER = 7.5;
const DISK_INNER = 2.0;
const DISK_PARTICLES = 14000;

const diskPos = new Float32Array(DISK_PARTICLES * 3);
const diskCol = new Float32Array(DISK_PARTICLES * 3);
const diskSize = new Float32Array(DISK_PARTICLES);
const diskSpeed = new Float32Array(DISK_PARTICLES);
const diskPhase = new Float32Array(DISK_PARTICLES);
const diskTilt = new Float32Array(DISK_PARTICLES);

const innerC = new THREE.Color(0xffffff);
const midC   = new THREE.Color(0xffb347);
const outerC = new THREE.Color(0xff5f3c);

for (let i = 0; i < DISK_PARTICLES; i++) {
  // radius: dense near inner edge, falls off outward
  const u = Math.pow(Math.random(), 0.45);
  const r = DISK_INNER + (DISK_OUTER - DISK_INNER) * u;
  const angle = Math.random() * Math.PI * 2;

  diskPos[i*3]   = Math.cos(angle) * r;
  diskPos[i*3+1] = (Math.random() - 0.5) * 0.06 * (r - DISK_INNER + 0.5) * 0.5; // thin flat disk
  diskPos[i*3+2] = Math.sin(angle) * r;

  // temperature gradient: hotter (white/orange) inside, redder outside
  const t = (r - DISK_INNER) / (DISK_OUTER - DISK_INNER);
  const c = innerC.clone().lerp(midC, Math.min(1, t * 2)).lerp(outerC, Math.max(0, (t - 0.5) * 2));
  const b = 0.6 + 0.4 * Math.random();
  diskCol[i*3]   = c.r * b;
  diskCol[i*3+1] = c.g * b;
  diskCol[i*3+2] = c.b * b;

  diskSize[i]    = 0.05 + Math.random() * 0.12;
  // Keplerian-ish speed: faster near horizon
  diskSpeed[i]   = 1.6 / Math.sqrt(r) * (0.7 + Math.random() * 0.6);
  diskPhase[i]   = Math.random() * Math.PI * 2;
  diskTilt[i]    = (Math.random() - 0.5) * 0.001;
}

const diskGeo = new THREE.BufferGeometry();
diskGeo.setAttribute('position', new THREE.BufferAttribute(diskPos, 3));
diskGeo.setAttribute('color', new THREE.BufferAttribute(diskCol, 3));
diskGeo.setAttribute('aSize', new THREE.BufferAttribute(diskSize, 1));

// custom shader so particles glow as soft round sprites
const diskMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uPointsTex: { value: makeGlowTexture() },
  },
  vertexShader: `
    attribute float aSize;
    attribute vec3 color;
    varying vec3 vColor;
    uniform float uTime;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * (300.0 / -mv.z);
      gl_PointSize = min(gl_PointSize, 28.0);
      gl_Position = projectionMatrix * mv;
      vColor = color;
    }
  `,
  fragmentShader: `
    uniform sampler2D uPointsTex;
    varying vec3 vColor;
    void main() {
      float a = texture2D(uPointsTex, gl_PointCoord).r;
      gl_FragColor = vec4(vColor, a);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});

const disk = new THREE.Points(diskGeo, diskMat);
scene.add(disk);

// helper: soft radial gradient texture for particle sprites
function makeGlowTexture() {
  const size = 64;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  g.addColorStop(0.0, 'rgba(255,255,255,1)');
  g.addColorStop(0.35, 'rgba(255,255,255,0.6)');
  g.addColorStop(1.0, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}

// ---------- faint outer disk haze (for soft falloff) ----------
const haze = new THREE.Mesh(
  new THREE.RingGeometry(DISK_INNER * 0.95, DISK_OUTER * 1.15, 128, 1),
  new THREE.MeshBasicMaterial({
    color: 0xff8844,
    transparent: true,
    opacity: 0.08,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  })
);
haze.rotation.x = -Math.PI / 2;
scene.add(haze);

// ---------- bloom postprocessing ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  1.1,   // strength
  0.6,   // radius
  0.25   // threshold
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- animation ----------
const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  elapsed += dt;

  // orbit the disk particles (rotate each ring by its Keplerian speed)
  const pos = diskGeo.attributes.position;
  for (let i = 0; i < DISK_PARTICLES; i++) {
    const idx = i * 3;
    const r = Math.hypot(pos.array[idx], pos.array[idx+2]);
    const newAngle = Math.atan2(pos.array[idx+2], pos.array[idx]) + diskSpeed[i] * dt;
    pos.array[idx]   = Math.cos(newAngle) * r;
    pos.array[idx+2] = Math.sin(newAngle) * r;
    pos.array[idx+1] = pos.array[idx+1] + diskTilt[i] * dt; // subtle shimmer
  }
  pos.needsUpdate = true;

  diskMat.uniforms.uTime.value = elapsed;

  // slowly pulse the photon ring
  ring.scale.setScalar(1 + 0.02 * Math.sin(elapsed * 1.5));
  ring.rotation.z = elapsed * 0.2;

  // rotate starfield imperceptibly
  scene.children[0].rotation.y = elapsed * 0.003;

  controls.update();
  composer.render();
}

// ---------- resize ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
