<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Hole</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #info {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.55); font: 13px/1.4 system-ui, sans-serif;
    letter-spacing: 0.5px; text-align: center; pointer-events: none;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="info">Drag to orbit &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; Auto-orbit enabled</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const params = {
  bloomStrength: 1.15,
  bloomRadius: 0.7,
  bloomThreshold: 0.15,
  diskTilt: 0.18,
};

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02020a);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(7, 4.2, 9);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 3.2;
controls.maxDistance = 30;
controls.target.set(0, 0, 0);

// ---------- glow sprite texture ----------
function makeGlowTexture() {
  const size = 128;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  g.addColorStop(0.0, 'rgba(255,255,255,1)');
  g.addColorStop(0.15, 'rgba(255,220,160,0.9)');
  g.addColorStop(0.4, 'rgba(255,140,60,0.45)');
  g.addColorStop(0.7, 'rgba(255,80,40,0.12)');
  g.addColorStop(1.0, 'rgba(255,40,20,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}

// ---------- black hole (event horizon + photon ring) ----------
const BH_RADIUS = 1.15;
const bhGroup = new THREE.Group();
scene.add(bhGroup);

const horizon = new THREE.Mesh(
  new THREE.SphereGeometry(BH_RADIUS, 48, 48),
  new THREE.MeshBasicMaterial({ color: 0x000000 })
);
bhGroup.add(horizon);

// photon ring: thin glowing ring hugging the horizon, slightly larger
const ringGeo = new THREE.RingGeometry(BH_RADIUS * 1.02, BH_RADIUS * 1.18, 96);
const ringMat = new THREE.MeshBasicMaterial({
  color: 0xffa45c,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.0,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});
const photonRing = new THREE.Mesh(ringGeo, ringMat);
photonRing.rotation.x = Math.PI / 2 - params.diskTilt;
bhGroup.add(photonRing);

// ---------- accretion disk: particle system ----------
const ACCRETION_COUNT = 14000;
const positions = new Float32Array(ACCRETION_COUNT * 3);
const sizes = new Float32Array(ACCRETION_COUNT);
const colors = new Float32Array(ACCRETION_COUNT * 3);

const INNER = BH_RADIUS * 2.1;
const OUTER = BH_RADIUS * 8.0;

const innerColor = new THREE.Color(0xffd9a0);
const midColor = new THREE.Color(0xff8c3a);
const outerColor = new THREE.Color(0x6633ff);

for (let i = 0; i < ACCRETION_COUNT; i++) {
  const angle = Math.random() * Math.PI * 2;
  const r = INNER + Math.pow(Math.random(), 0.7) * (OUTER - INNER);
  const thickness = 0.035 * r * (0.5 + 0.5 * Math.random());
  const x = Math.cos(angle) * r;
  const z = Math.sin(angle) * r;
  const y = (Math.random() - 0.5) * thickness;

  positions[i * 3 + 0] = x;
  positions[i * 3 + 1] = y;
  positions[i * 3 + 2] = z;

  sizes[i] = 0.05 + Math.random() * 0.16 + (r < INNER * 1.8 ? 0.06 : 0);

  const t = THREE.MathUtils.clamp((r - INNER) / (OUTER - INNER), 0, 1);
  const col = t < 0.5 ? innerColor.clone().lerp(midColor, t * 2) : midColor.clone().lerp(outerColor, t * 2 - 1);
  const bright = 0.8 + Math.random() * 0.6;
  colors[i * 3 + 0] = col.r * bright;
  colors[i * 3 + 1] = col.g * bright;
  colors[i * 3 + 2] = col.b * bright;
}

const diskGeo = new THREE.BufferGeometry();
diskGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
diskGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
diskGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const glowTex = makeGlowTexture();
const diskMat = new THREE.ShaderMaterial({
  uniforms: {
    glowMap: { value: glowTex },
    uPixelRatio: { value: renderer.getPixelRatio() },
  },
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute float size;
    attribute vec3 color;
    varying vec3 vColor;
    varying float vAlpha;
    uniform float uPixelRatio;
    void main() {
      vColor = color;
      vAlpha = clamp(size * 3.0, 0.15, 1.0);
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * uPixelRatio * (360.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform sampler2D glowMap;
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      vec4 tex = texture2D(glowMap, gl_PointCoord);
      gl_FragColor = vec4(vColor, 1.0) * tex * vAlpha;
    }
  `,
});

const disk = new THREE.Points(diskGeo, diskMat);
disk.rotation.x = params.diskTilt;
scene.add(disk);

// ---------- starfield ----------
const STAR_COUNT = 2600;
const starPos = new Float32Array(STAR_COUNT * 3);
const starSizes = new Float32Array(STAR_COUNT);
for (let i = 0; i < STAR_COUNT; i++) {
  const rad = 90 + Math.random() * 160;
  const theta = Math.acos(2 * Math.random() - 1);
  const phi = Math.random() * Math.PI * 2;
  starPos[i * 3 + 0] = rad * Math.sin(theta) * Math.cos(phi);
  starPos[i * 3 + 1] = rad * Math.sin(theta) * Math.sin(phi);
  starPos[i * 3 + 2] = rad * Math.cos(theta);
  starSizes[i] = 0.6 + Math.random() * 1.8;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
starGeo.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
const starMat = new THREE.PointsMaterial({
  color: 0xffffff,
  size: 0.7,
  sizeAttenuation: true,
  map: glowTex,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  opacity: 0.9,
});
scene.add(new THREE.Points(starGeo, starMat));

// ---------- postprocessing: bloom ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  params.bloomStrength,
  params.bloomRadius,
  params.bloomThreshold
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

// ---------- animation ----------
const clock = new THREE.Clock();
let diskAngle = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  diskAngle += dt * 0.06;
  disk.rotation.y = diskAngle;

  photonRing.rotation.y = -diskAngle * 1.6;
  photonRing.material.opacity = 0.35 + 0.2 * Math.sin(clock.elapsedTime * 2.0);

  const pulse = 1 + 0.03 * Math.sin(clock.elapsedTime * 1.4);
  bhGroup.scale.setScalar(pulse);

  controls.update();
  composer.render();
}
animate();

// ---------- resize ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  diskMat.uniforms.uPixelRatio.value = renderer.getPixelRatio();
});
</script>
</body>
</html>
