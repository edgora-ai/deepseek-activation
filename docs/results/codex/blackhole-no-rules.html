<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Hole — Three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 16px; bottom: 14px; z-index: 10;
    color: rgba(255,255,255,.55); font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
    pointer-events: none; text-shadow: 0 0 6px rgba(0,0,0,.8);
  }
</style>
</head>
<body>
<div id="hud">blackhole.html — drag to look, scroll to zoom</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060c);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(7, 3.2, 9);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 4;
controls.maxDistance = 40;
controls.target.set(0, 0, 0);

// ---------- glow sprite (procedural radial gradient) ----------
function makeGlowTexture(inner = 'rgba(255,255,255,1)', outer = 'rgba(255,255,255,0)') {
  const size = 64;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  g.addColorStop(0, inner);
  g.addColorStop(0.35, 'rgba(255,220,180,0.55)');
  g.addColorStop(1, outer);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(canvas);
}

// ---------- starfield ----------
{
  const starTexture = makeGlowTexture('rgba(255,255,255,1)', 'rgba(255,255,255,0)');
  const count = 4500;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const color = new THREE.Color();
  for (let i = 0; i < count; i++) {
    const r = 60 + Math.random() * 240;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    positions[i*3+1] = r * Math.cos(phi);
    positions[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
    const t = Math.random();
    if (t < 0.7) color.setHSL(0.6, 0.3, 0.7 + Math.random() * 0.3);       // blue-white
    else if (t < 0.9) color.setHSL(0.1, 0.6, 0.75 + Math.random() * 0.25); // warm stars
    else color.setHSL(0.0, 0, 0.95);                                       // bright white
    colors[i*3] = color.r; colors[i*3+1] = color.g; colors[i*3+2] = color.b;
  }
  const stars = new THREE.Points(
    new THREE.BufferGeometry()
      .setAttribute('position', new THREE.BufferAttribute(positions, 3))
      .setAttribute('color', new THREE.BufferAttribute(colors, 3)),
    new THREE.PointsMaterial({
      size: 1.4, map: starTexture, vertexColors: true,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    })
  );
  scene.add(stars);
}

// ---------- black hole: event horizon + photon ring ----------
{
  const horizon = new THREE.Mesh(
    new THREE.SphereGeometry(1.15, 48, 48),
    new THREE.MeshBasicMaterial({ color: 0x000000 })
  );
  scene.add(horizon);

  const ringGeo = new THREE.RingGeometry(1.5, 1.62, 128);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0xffe9c4, transparent: true, opacity: 0.9,
    side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2 + 0.12;
  scene.add(ring);
}

// ---------- accretion disk: glowing particles ----------
const count = 4200;
const positions = new Float32Array(count * 3);
const colors = new Float32Array(count * 3);
const sizes = new Float32Array(count);

const radius = new Float32Array(count);
const speed = new Float32Array(count);
const phase = new Float32Array(count);
const bob = new Float32Array(count);
const color = new THREE.Color();

const inner = 3.0, outer = 10.5;
for (let i = 0; i < count; i++) {
  radius[i] = inner + Math.pow(Math.random(), 0.8) * (outer - inner);
  speed[i] = 0.35 * Math.pow(inner / radius[i], 1.5);   // Keplerian-ish shear
  phase[i] = Math.random() * Math.PI * 2;
  bob[i] = (Math.random() - 0.5) * 0.25 * (radius[i] / outer);  // thin disk

  positions[i*3]   = radius[i] * Math.cos(phase[i]);
  positions[i*3+1] = bob[i];
  positions[i*3+2] = radius[i] * Math.sin(phase[i]);

  // temperature gradient: white-hot inner, orange/red outer
  const t = (radius[i] - inner) / (outer - inner);
  color.setHSL(0.03 + 0.10 * t, 0.95, 0.62 - 0.28 * t);
  colors[i*3] = color.r; colors[i*3+1] = color.g; colors[i*3+2] = color.b;
  sizes[i] = 0.55 + Math.random() * 0.9;
}

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

const diskTexture = makeGlowTexture('rgba(255,244,224,1)', 'rgba(255,255,255,0)');
const material = new THREE.PointsMaterial({
  size: 0.9, map: diskTexture, vertexColors: true,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  sizeAttenuation: true
});

const disk = new THREE.Points(geometry, material);
disk.userData = { radius, speed, phase, bob, count };
disk.rotation.x = -0.35; // slight tilt for depth
scene.add(disk);

// accretion streamers: a few brighter inner streaks
const streamCount = 260;
const sPos = new Float32Array(streamCount * 3);
const sCol = new Float32Array(streamCount * 3);
const sRad = new Float32Array(streamCount);
const sSpd = new Float32Array(streamCount);
const sPhs = new Float32Array(streamCount);
for (let i = 0; i < streamCount; i++) {
  sRad[i] = 1.6 + Math.random() * 1.8;
  sSpd[i] = 0.9 * Math.pow(1.6 / sRad[i], 1.5);
  sPhs[i] = Math.random() * Math.PI * 2;
  sPos[i*3] = sRad[i] * Math.cos(sPhs[i]);
  sPos[i*3+1] = (Math.random() - 0.5) * 0.1;
  sPos[i*3+2] = sRad[i] * Math.sin(sPhs[i]);
  color.setHSL(0.08, 0.9, 0.8);
  sCol[i*3] = color.r * 1.2; sCol[i*3+1] = color.g * 1.2; sCol[i*3+2] = color.b * 1.2;
}
const sGeo = new THREE.BufferGeometry();
sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
sGeo.setAttribute('color', new THREE.BufferAttribute(sCol, 3));
const streamers = new THREE.Points(sGeo, new THREE.PointsMaterial({
  size: 0.42, map: diskTexture, vertexColors: true,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
}));
streamers.userData = { radius: sRad, speed: sSpd, phase: sPhs, bob: new Float32Array(streamCount), count: streamCount };
streamers.rotation.x = -0.35;
scene.add(streamers);

// ---------- animation ----------
function animateDisk(points, dt) {
  const p = points.geometry.attributes.position.array;
  const { radius, speed, phase, bob, count } = points.userData;
  for (let i = 0; i < count; i++) {
    phase[i] += speed[i] * dt;
    const r = radius[i];
    p[i*3]   = r * Math.cos(phase[i]);
    p[i*3+1] = bob[i] * Math.sin(phase[i] * 3 + radius[i]);
    p[i*3+2] = r * Math.sin(phase[i]);
  }
  points.geometry.attributes.position.needsUpdate = true;
}
disk.userData.animate = animateDisk;
streamers.userData.animate = animateDisk;

// soft ambient light so the sphere renders with a hint of rim
scene.add(new THREE.AmbientLight(0xffffff, 0.12));

// ---------- postprocessing: bloom ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight), 1.25, 0.55, 0.12
);
composer.addPass(bloom);

// ---------- resize ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

// ---------- render loop ----------
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  disk.userData.animate(disk, dt);
  streamers.userData.animate(streamers, dt);
  controls.update();
  composer.render();
}

animate();
</script>
</body>
</html>
