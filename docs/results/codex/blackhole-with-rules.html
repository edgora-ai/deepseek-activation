<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Hole — Three.js</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #hud {
    position: fixed;
    left: 18px;
    bottom: 16px;
    z-index: 10;
    font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: rgba(255, 214, 170, 0.6);
    letter-spacing: 0.08em;
    pointer-events: none;
    user-select: none;
    text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
  }
  #hud b { color: rgba(255, 240, 210, 0.95); font-weight: 600; }
</style>
</head>
<body>
<div id="hud"><b>BLACK HOLE</b> — Gargantua-class · move the mouse to look around</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------------------------------------------------------------- renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02030a);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 900);
camera.position.set(8, 3, 5);

// --------------------------------------------------------- shared texture
function glowTexture(size = 128) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0.0, 'rgba(255,255,255,1)');
  g.addColorStop(0.35, 'rgba(255,255,255,0.4)');
  g.addColorStop(1.0, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// ------------------------------------------------------------- starfield
function makeStarfield() {
  const count = 4500;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const palette = [0xffffff, 0xffffff, 0xffffff, 0xc9dbff, 0xffe0b0, 0xffc0c0];
  const c = new THREE.Color();
  const v = new THREE.Vector3();
  for (let i = 0; i < count; i++) {
    v.randomDirection().multiplyScalar(150 + Math.random() * 320);
    positions[i * 3] = v.x;
    positions[i * 3 + 1] = v.y;
    positions[i * 3 + 2] = v.z;
    c.setHex(palette[(Math.random() * palette.length) | 0]);
    const b = 0.55 + Math.random() * 0.45;
    colors[i * 3] = c.r * b;
    colors[i * 3 + 1] = c.g * b;
    colors[i * 3 + 2] = c.b * b;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  return new THREE.Points(geo, new THREE.PointsMaterial({
    size: 1.35,
    sizeAttenuation: false,
    vertexColors: true,
    transparent: true,
    opacity: 0.9,
    depthWrite: false
  }));
}
scene.add(makeStarfield());

// ---------------------------------------------------- faint nebulae
const nebulaTex = glowTexture(256);
const nebulaColors = [0x6d5bff, 0x2f7fe0, 0x27b8a8, 0xa94dff, 0x3558e8];
for (let i = 0; i < 5; i++) {
  const dir = new THREE.Vector3().randomDirection();
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: nebulaTex,
    color: nebulaColors[i],
    transparent: true,
    opacity: 0.08 + Math.random() * 0.07,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  }));
  sprite.position.copy(dir).multiplyScalar(150 + Math.random() * 70);
  sprite.scale.setScalar(110 + Math.random() * 90);
  scene.add(sprite);
}

// ------------------------------------------------------ accretion disk
const DISK_INNER = 2.5;
const DISK_OUTER = 9.0;
const DISK_COUNT = 14000;

const diskUniforms = { uTime: { value: 0 } };

const diskVertexShader = `
  attribute vec3 aBase;
  attribute vec3 aColor;
  attribute float aSize;
  uniform float uTime;
  varying vec3 vColor;
  void main() {
    float r = length(aBase.xz);
    float ang = atan(aBase.z, aBase.x) + uTime * 1.9 * pow(r, -1.5);
    vec3 pos = vec3(cos(ang) * r, aBase.y, sin(ang) * r);
    vec4 mv = modelViewMatrix * vec4(pos, 1.0);
    gl_PointSize = aSize * (420.0 / max(1.0, -mv.z));
    gl_Position = projectionMatrix * mv;
    vColor = aColor;
  }
`;

const diskFragmentShader = `
  varying vec3 vColor;
  void main() {
    vec2 uv = gl_PointCoord * 2.0 - 1.0;
    float a = smoothstep(1.0, 0.0, length(uv));
    a = a * a * (3.0 - 2.0 * a);
    gl_FragColor = vec4(vColor, a);
  }
`;

function makeDisk() {
  const base = new Float32Array(DISK_COUNT * 3);
  const colors = new Float32Array(DISK_COUNT * 3);
  const sizes = new Float32Array(DISK_COUNT);
  const cHot = new THREE.Color(0xfff2cc);
  const cMid = new THREE.Color(0xff8f3f);
  const cCool = new THREE.Color(0xd43b2a);
  const c = new THREE.Color();

  for (let i = 0; i < DISK_COUNT; i++) {
    const r = DISK_INNER * Math.pow(DISK_OUTER / DISK_INNER, Math.random());
    const t = (r - DISK_INNER) / (DISK_OUTER - DISK_INNER);
    const thick = 0.05 * Math.pow(r / DISK_INNER, 1.35);
    const a = Math.random() * Math.PI * 2;
    base[i * 3] = Math.cos(a) * r;
    base[i * 3 + 1] = (Math.random() * 2 - 1) * thick;
    base[i * 3 + 2] = Math.sin(a) * r;

    c.lerpColors(cHot, cMid, Math.min(1, t * 2.2));
    if (t > 0.45) c.lerpColors(cMid, cCool, (t - 0.45) / 0.55);
    const flicker = 0.75 + Math.random() * 0.5;
    colors[i * 3] = c.r * flicker;
    colors[i * 3 + 1] = c.g * flicker;
    colors[i * 3 + 2] = c.b * flicker;
    sizes[i] = (0.05 + 0.06 * t) * (0.7 + Math.random() * 0.7);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(base.slice(), 3));
  geo.setAttribute('aBase', new THREE.BufferAttribute(base, 3));
  geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: diskUniforms,
    vertexShader: diskVertexShader,
    fragmentShader: diskFragmentShader,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });

  const points = new THREE.Points(geo, mat);
  points.rotation.x = -1.15; // ~66° inclination
  return points;
}

const disk = makeDisk();
scene.add(disk);

// --------------------------------------------------------- black hole
const horizon = new THREE.Mesh(
  new THREE.SphereGeometry(1.62, 64, 64),
  new THREE.MeshBasicMaterial({ color: 0x000000 })
);
scene.add(horizon);

const photonRing = new THREE.Mesh(
  new THREE.RingGeometry(2.14, 2.3, 160),
  new THREE.MeshBasicMaterial({
    color: 0xffe7ad,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.95,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
photonRing.rotation.x = -Math.PI / 2;
scene.add(photonRing);

const halo = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTexture(),
  color: 0xffa55c,
  transparent: true,
  opacity: 0.38,
  blending: THREE.AdditiveBlending,
  depthWrite: false
}));
halo.scale.setScalar(9.5);
scene.add(halo);

// ------------------------------------------------- post-processing
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  1.15, 0.55, 0.18
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

// ------------------------------------------------------------ controls
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

const pointerTarget = new THREE.Vector2();
const pointer = new THREE.Vector2();
addEventListener('pointermove', (event) => {
  pointerTarget.set(
    (event.clientX / innerWidth) * 2 - 1,
    (event.clientY / innerHeight) * 2 - 1
  );
});

// -------------------------------------------------------------- loop
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  diskUniforms.uTime.value = t;
  photonRing.material.opacity = 0.82 + Math.sin(t * 1.6) * 0.13;
  halo.material.opacity = 0.33 + Math.sin(t * 0.9) * 0.05;

  pointer.lerp(pointerTarget, 0.035);
  const orbit = t * 0.1;
  const radius = 9.6 + Math.sin(t * 0.05) * 1.4;
  const height = 3.1 + Math.sin(t * 0.08) * 1.3;

  camera.position.set(
    Math.cos(orbit) * radius + pointer.x * 1.7,
    Math.max(0.5, height - pointer.y * 1.1),
    Math.sin(orbit) * radius
  );
  camera.lookAt(0, 0, 0);

  composer.render();
}

animate();
</script>
</body>
</html>
