<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cc-norules — Space Shooter</title>
<style>
  :root {
    --bg: #05070f;
    --panel: rgba(13, 20, 38, 0.82);
    --border: #24304f;
    --text: #dbe6ff;
    --accent: #4ea1ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(1200px 700px at 50% 30%, #0a1024, var(--bg));
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .wrap {
    display: flex;
    gap: 18px;
    align-items: stretch;
    padding: 18px;
    max-width: 1020px;
    width: 100%;
  }
  #game {
    display: block;
    background: #04060d;
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
    cursor: crosshair;
    flex-shrink: 0;
  }
  .side {
    width: 230px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    justify-content: flex-start;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .panel h2 {
    margin: 0 0 8px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #7d92c4;
  }
  .hud-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 16px;
    margin: 6px 0;
  }
  .hud-row .val { font-family: ui-monospace, monospace; font-size: 20px; color: #fff; }
  .lives {
    display: flex;
    gap: 5px;
    font-size: 16px;
    color: #ff6b81;
    letter-spacing: 1px;
  }
  .controls { font-size: 12px; line-height: 1.7; color: #9fb2d9; }
  .controls b { color: #dbe6ff; }
  kbd {
    background: #1a2440;
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 11px;
    font-family: ui-monospace, monospace;
  }
  .btn {
    display: block;
    width: 100%;
    margin-top: 6px;
    padding: 9px 10px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.4px;
    color: var(--text);
    background: #182240;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.12s, transform 0.05s;
  }
  .btn:hover { background: #22325e; }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: #1c4a8f; border-color: #2d63b5; }
  .btn.primary:hover { background: #245bb0; }
  .btn.danger { background: #5c1f33; border-color: #8a3550; }
  .btn.danger:hover { background: #772a43; }
  #startBtn { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="game" width="760" height="560" tabindex="0"></canvas>
  <aside class="side">
    <div class="panel">
      <h2>Mission Status</h2>
      <div class="hud-row"><span>Score</span><span class="val" id="hudScore">0</span></div>
      <div class="hud-row"><span>Level</span><span class="val" id="hudLevel">1</span></div>
      <div class="hud-row"><span>Next wave</span><span class="val" id="hudWave">--</span></div>
      <div class="hud-row"><span>Lives</span><span class="lives" id="hudLives">♥♥♥</span></div>
    </div>
    <div class="panel">
      <h2>Power-ups</h2>
      <div class="hud-row"><span>x2 bullets</span><span class="val" id="hudMult" style="font-size:15px">off</span></div>
      <div class="hud-row"><span>Shield</span><span class="val" id="hudShield" style="font-size:15px">off</span></div>
    </div>
    <div class="panel controls">
      <h2>Controls</h2>
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span> move<br>
      <span><kbd>Space</kbd></span> shoot<br>
      <span><kbd>P</kbd></span> pause &nbsp;<span><kbd>M</kbd></span> mute<br>
      <span><kbd>Enter</kbd></span> start / restart
      <button class="btn primary" id="startBtn"></button>
      <button class="btn" id="pauseBtn">Pause <kbd>P</kbd></button>
      <button class="btn danger" id="restartBtn">Restart</button>
    </div>
  </aside>
</div>

<!-- Game-Over / Start overlay -->
<div id="stateOverlay">
  <div class="panel ov-panel" id="ovPanel">
    <div id="ovTitle" class="ov-title">STARFALL</div>
    <div id="ovSub" class="ov-sub">Blast the invaders. Dodge the rocks.</div>
    <div id="ovStats" class="ov-stats"></div>
    <button class="btn primary" id="ovBtn">Start Mission</button>
  </div>
</div>

<script>
(() => {
"use strict";

/* ============================== Setup ============================== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const OVERLAY_TITLE = ["STARFALL", "GAME OVER", "HULL CRITICAL"];

const keys = {};
addEventListener("keydown", e => {
  if ([" ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === "KeyP") togglePause();
  else if (e.code === "Space" && state === "over") startGame();
  else if (e.code === "Enter") { state === "over" ? startGame() : (state === "playing" && togglePause()); }
});
addEventListener("keyup", e => { keys[e.code] = false; });

/* ============================== Audio ============================== */
let muted = false;
const audio = (() => {
  const ac = window.AudioContext || window.webkitAudioContext;
  if (!ac) return null;
  let ctx = null;
  const ensure = () => { if (!ctx) ctx = new ac(); if (ctx.state === "suspended") ctx.resume(); return ctx; };
  function beep(freq, dur, type = "square", vol = 0.08, slideTo = null) {
    if (muted) return;
    const c = ensure(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, c.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, c.currentTime + dur);
    g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + dur);
  }
  return {
    shoot:  () => beep(880, 0.05, "square", 0.03, 220),
    boom:   () => beep(160, 0.28, "sawtooth", 0.10, 40),
    hurt:   () => beep(110, 0.35, "sawtooth", 0.12, 45),
    pickup: () => { beep(660, 0.07, "sine", 0.09); beep(990, 0.09, "sine", 0.09); },
    wave:   () => beep(440, 0.09, "triangle", 0.06, 660),
    gameover: () => { beep(330, 0.18, "sawtooth", 0.10, 165); setTimeout(() => beep(247, 0.3, "sawtooth", 0.10, 123), 160); }
  };
})();

/* ============================== Game state ============================== */
let state = "idle";            // idle | playing | paused | over
let gameOverReason = null;
let score = 0, lives = 3, level = 1;
let nextWaveIn = 3.0;
let multUntil = 0, shieldUntil = 0, invulnUntil = 0;
let gameTime = 0, pauseTime = 0, pauseAccum = 0, runStart = 0;

const player = { x: W / 2, y: H - 70, vx: 0, vy: 0 };
const bulletCooldown = 0.22, yMax = H - 16;
let shootCd = 0, bulletDamage = 1;
let deadTime = 0, deadFlash = 0;

const enemies = [], bullets = [], ebullets = [], rocks = [], pickups = [], particles = [], floaters = [];
let shakeAmp = 0, shakeTime = 0;
let frameCount = 0;

const SCORE_WEAPON = 40, SCORE_SCOUT = 10, SCORE_ASTEROID = 20;
const rockSizes = [34, 26, 20];

/* ============================== Helpers ============================== */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
function circleHit(ax, ay, ar, bx, by, br) {
  const dx = ax - bx, dy = ay - by, r = ar + br;
  return dx * dx + dy * dy <= r * r;
}
function collideRect(r, x, y, rad) {
  const nx = clamp(x, r.left, r.right), ny = clamp(y, r.top, r.bottom);
  const dx = x - nx, dy = y - ny;
  return dx * dx + dy * dy <= rad * rad;
}
function damageTrail(e) {
  for (let i = 0; i < 4; i++) {
    particles.push({ x: e.x, y: e.y, vx: rand(-70, 70), vy: rand(-70, 70),
      life: rand(0.25, 0.55), maxLife: 0.55, size: rand(2.5, 5), color: "#ffb84d" });
  }
}

/* ============================== Spawning ============================== */
function spawnEnemy(type) {
  const w = type === "weapon" ? 46 : 34;
  enemies.push({
    type, x: rand(30, W - 30), y: -46, hp: type === "weapon" ? 3 : 1, r: w / 2,
    speed: type === "weapon" ? 25 : rand(60, 95),
    sway: rand(0.3, 1.8), swayT: rand(0, 6.28),
    lastShot: rand(0, 0.6),
    angle: 0
  });
}
function spawnAsteroid() {
  const r = rockSizes[Math.min(Math.floor(rand(0, level + 1.99)), 2)];
  rocks.push({
    x: rand(0, W), y: -r - 10, r,
    ang: rand(0, 6.28), spin: rand(-1.6, 1.6),
    vx: rand(-55, 55), vy: rand(60, 130) + level * 6,
    hp: Math.max(1, Math.round(r / 15))
  });
}
function spawnWave(n) {
  for (let i = 0; i < n; i++) {
    const t = Math.random() < 0.45 ? "weapon" : "scout";
    spawnEnemy(t);
  }
}
function decideCount(levelNum) {
  let n = Math.round((levelNum + 1) * rand(0.85, 1.15));
  return clamp(n, 3, 15);
}

/* ============================== Pickups ============================== */
function dropPickup(x, y, kind) {
  pickups.push({ x, y, vy: 75, kind, ttl: 9, pulse: 0, radius: 13 });
}
function applyPickup(kind, nowSecs) {
  if (kind === "mult") {
    multUntil = nowSecs + 10 + Math.min(level * 2, 8);
    pushFloat(`x2 BULLETS`, "#7df9ff", "player");
    audio.pickup();
  } else {
    shieldUntil = nowSecs + 8;
    pushFloat("SHIELD", "#8affc1", "player");
    audio.pickup();
  }
}

/* ============================== Player ============================== */
function killPlayer(nowSecs) {
  for (let i = 0; i < 34; i++) {
    particles.push({ x: player.x, y: player.y, vx: rand(-190, 190), vy: rand(-190, 190),
      life: rand(0.3, 0.85), maxLife: 0.85, size: rand(2, 5.5), color: "#ff8e5e" });
  }
  shake(9);
  audio.hurt();
  lives--;
  updateHUD();
  if (lives <= 0) {
    endGame("destroyed");
  } else {
    player.x = W / 2; player.y = H - 70; player.vx = 0; player.vy = 0;
    invulnUntil = nowSecs + 2.2;
    deadTime = nowSecs + 0.8;        // brief delay before controls return
    deadFlash = 1;
  }
}
function updatePlayer(dt, nowSecs) {
  const a = 780, drag = 3.2;
  let ax = 0, ay = 0;
  if (state === "playing" && deadTime <= 0) {
    if (keys.KeyW || keys.ArrowUp)    ay -= a;
    if (keys.KeyS || keys.ArrowDown)  ay += a;
    if (keys.KeyA || keys.ArrowLeft)  ax -= a;
    if (keys.KeyD || keys.ArrowRight) ax += a;
  }
  player.vx += ax * dt;
  player.vy += ay * dt;
  const f = Math.max(0, 1 - drag * dt);
  player.vx *= f; player.vy *= f;
  player.x = clamp(player.x + player.vx * dt, 22, W - 22);
  player.y = clamp(player.y + player.vy * dt, 60, yMax);
  deadFlash = Math.max(0, deadFlash - dt * 2);

  if (state === "playing" && deadTime <= 0 && keys.Space) {
    shootCd -= dt;
    if (shootCd <= 0) {
      const mult = nowSecs < multUntil;
      bullets.push({ x: player.x, y: player.y - 18, vx: 0, vy: -640, r: 4, dmg: bulletDamage });
      audio.shoot();
      if (mult) {
        bullets.push({ x: player.x - 10, y: player.y - 12, vx: -70, vy: -620, r: 3.5, dmg: bulletDamage });
        bullets.push({ x: player.x + 10, y: player.y - 12, vx: 70, vy: -620, r: 3.5, dmg: bulletDamage });
      }
      shootCd = bulletCooldown;
      // muzzle flash
      particles.push({ x: player.x, y: player.y - 20, vx: 0, vy: -60,
        life: 0.09, maxLife: 0.09, size: 7, color: "#9fd7ff" });
    }
  } else shootCd = Math.max(0, shootCd - dt);
}
function drawPlayer(nowSecs) {
  // thruster
  if (state === "playing" && frameCount % 2 === 0) {
    particles.push({ x: player.x + rand(-2.5, 2.5), y: player.y + 15,
      vx: rand(-15, 15), vy: rand(90, 190),
      life: rand(0.1, 0.28), maxLife: 0.28, size: rand(2.5, 5.5), color: "#ffb066" });
  }
  const shieldActive = nowSecs < shieldUntil;
  const invuln = nowSecs < invulnUntil;
  if (invuln && state === "playing" && Math.floor(nowSecs * 12) % 2 === 0) return;
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(Math.atan2(player.vy, player.vx) * 0.3);

  // ship hull
  ctx.fillStyle = "#79b8ff";
  ctx.beginPath();
  ctx.moveTo(0, -20); ctx.lineTo(14, 14); ctx.lineTo(0, 8); ctx.lineTo(-14, 14);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#cfe6ff";
  ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(5, 8); ctx.lineTo(0, 4); ctx.lineTo(-5, 8); ctx.closePath(); ctx.fill();
  // cockpit
  ctx.fillStyle = "#1c4a8f";
  ctx.beginPath(); ctx.arc(0, -5, 4, 0, 6.28); ctx.fill();

  ctx.restore();

  if (shieldActive) {
    ctx.strokeStyle = "rgba(138,255,193,0.55)";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(player.x, player.y, 30, 0, 6.28);
    ctx.stroke();
    ctx.fillStyle = "rgba(138,255,193,0.10)";
    ctx.fill();
  }
}

/* ============================== Enemies ============================== */
function updateEnemies(dt, nowSecs) {
  const dir = Math.sin(nowSecs * 0.3) > 0 ? 1 : -1;
  const maxDanger = clamp(0.25 + level * 0.035, 0.25, 0.85);

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.swayT += dt * e.sway;
    e.x += dir * e.speed * dt * 0.4;
    e.x = clamp(e.x, 25, W - 25);
    e.y += e.speed * dt * (0.6 + 0.5 * Math.sin(e.swayT));
    e.angle += dt * 1.4;

    if (e.type === "weapon" && nowSecs < Math.min(1.6 + level * 0.55, 6.0)) {
      e.lastShot -= dt;
      if (e.lastShot <= 0 && e.y > 0 && e.y < H * 0.72) {
        e.lastShot = 2.2;
        const mx = player.x - e.x, my = (player.y + 8) - e.y;
        const m = Math.hypot(mx, my) || 1;
        const sp = 210 + Math.min(level * 14, 150);
        ebullets.push({ x: e.x, y: e.y + 16, vx: mx / m * sp, vy: my / m * sp, r: 5, angle: Math.atan2(my, mx) });
        if (nowSecs < multUntil) {
          const a0 = Math.atan2(my, mx);
          for (const da of [-0.2, 0.2]) {
            ebullets.push({ x: e.x, y: e.y + 16, vx: Math.cos(a0 + da) * sp, vy: Math.sin(a0 + da) * sp, r: 4.5, angle: a0 + da });
          }
        }
      }
    }
    // homing-ish laser pips (weapon ships only, ramps with level)
    if (e.type === "weapon" && nowSecs >= 6.0 && frameCount % 44 === 0 && e.y > 0 && e.y < H * 0.7) {
      const mx = player.x - e.x, my = player.y - e.y;
      const m = Math.hypot(mx, my) || 1;
      const sp = 240 + level * 20;
      ebullets.push({ x: e.x, y: e.y + 16, vx: mx / m * sp * 0, vy: my / m * sp * 0, r: 5, angle: Math.atan2(my, mx), homing: true, speed: sp });
    }

    // collisions with player
    if (circleHit(e.x, e.y, e.r + 6, player.x, player.y, 14)) {
      if (nowSecs < invulnUntil) {
        explodeEnemy(i);
        score += 5;
        pushFloat("+5", "#ffe28a", e.x, e.y);
      } else if (nowSecs < shieldUntil) {
        explodeEnemy(i);
        pushFloat("SHIELD BONK", "#8affc1", e.x, e.y);
        shake(4);
      } else {
        explodeEnemy(i);
        killPlayer(nowSecs);
      }
      updateHUD();
      continue;
    }
  }

  // phase-through enemies: drop them behind the player
  for (let i = enemies.length - 1; i >= 0; i--) {
    if (enemies[i].y > H + 60) {
      enemies.splice(i, 1);
    }
  }

  // enemy bullets (homing)
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i];
    if (b.homing) {
      const mx = player.x - b.x, my = player.y - b.y;
      const m = Math.hypot(mx, my) || 1;
      const desired = Math.atan2(my, mx);
      const cur = b.angle;
      let diff = desired - cur;
      while (diff > Math.PI) diff -= 2 * Math.PI;
      while (diff < -Math.PI) diff += 2 * Math.PI;
      const turn = clamp(diff, -2.2 * dt, 2.2 * dt);
      b.angle += turn;
      if (Math.abs(diff) > 0.05 && (nowSecs % 2 < 0.05)) {
        b.x += Math.cos(cur + Math.PI / 2) * 0; // keep direction consistent
      }
      b.vx = Math.cos(b.angle) * b.speed;
      b.vy = Math.sin(b.angle) * b.speed;
    }
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30) { ebullets.splice(i, 1); continue; }
    if (!(nowSecs < invulnUntil) && circleHit(b.x, b.y, b.r, player.x, player.y, 13)) {
      ebullets.splice(i, 1);
      if (nowSecs < shieldUntil) {
        pushFloat("BONK", "#8affc1", player.x, player.y - 20);
        shake(3);
        for (let k = 0; k < 12; k++) {
          particles.push({ x: player.x, y: player.y, vx: rand(-160, 160), vy: rand(-160, 160),
            life: rand(0.15, 0.4), maxLife: 0.4, size: rand(2, 4), color: "#8affc1" });
        }
      } else {
        killPlayer(nowSecs);
      }
      continue;
    }
  }
}
function explodeEnemy(index) {
  const e = enemies[index];
  const color = e.type === "weapon" ? "#ff79c1" : "#ff914d";
  const n = e.type === "weapon" ? 26 : 16;
  for (let i = 0; i < n; i++) {
    particles.push({ x: e.x, y: e.y, vx: rand(-150, 150), vy: rand(-150, 150),
      life: rand(0.25, 0.7), maxLife: 0.7, size: rand(2, 5), color });
  }
  // ring flash
  particles.push({ x: e.x, y: e.y, vx: 0, vy: 0, life: 0.14, maxLife: 0.14, size: 32, color: "#ffffff", ring: true });
  shake(e.type === "weapon" ? 8 : 5);
  const gain = e.type === "weapon" ? SCORE_WEAPON : SCORE_SCOUT;
  score += gain;
  pushFloat("+" + gain, "#ffe28a", e.x, e.y - 14);
  updateHUD();
  audio.boom();
  if (Math.random() < 0.16) dropPickup(e.x, e.y, Math.random() < 0.6 ? "mult" : "shield");
  enemies.splice(index, 1);
}
function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  if (e.type === "weapon") {
    ctx.rotate(e.angle * 0.5);
    ctx.fillStyle = "#c4508f";
    ctx.beginPath();
    ctx.moveTo(0, 16); ctx.lineTo(19, -8); ctx.lineTo(10, -14); ctx.lineTo(0, -6);
    ctx.lineTo(-10, -14); ctx.lineTo(-19, -8);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#ff9fd6";
    ctx.beginPath(); ctx.moveTo(0, 11); ctx.lineTo(9, -7); ctx.lineTo(0, -4); ctx.lineTo(-9, -7);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#7a1d4b";
    ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, 6.28); ctx.fill();
    ctx.strokeStyle = "#c4508f";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 22, 0, 6.28); ctx.stroke();
  } else {
    ctx.rotate(e.angle);
    ctx.fillStyle = "#d98a4d";
    ctx.beginPath();
    ctx.moveTo(0, 13); ctx.lineTo(11, -11); ctx.lineTo(0, -5); ctx.lineTo(-11, -11);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#ffd9b3";
    ctx.beginPath(); ctx.moveTo(0, 8); ctx.lineTo(5, -7); ctx.lineTo(0, -3); ctx.lineTo(-5, -7);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#8c3a1d";
    ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, 6.28); ctx.fill();
  }
  ctx.restore();
}

/* ============================== Asteroids ============================== */
function updateRocks(dt) {
  for (let i = rocks.length - 1; i >= 0; i--) {
    const r = rocks[i];
    r.x += r.vx * dt;
    r.y += r.vy * dt;
    r.ang += r.spin * dt;
    if (r.x < -r.r - 20) r.x = W + r.r + 20;
    if (r.x > W + r.r + 20) r.x = -r.r - 20;
    if (r.y > H + r.r + 30) { rocks.splice(i, 1); continue; }

    // bullets vs rock
    for (let b = bullets.length - 1; b >= 0; b--) {
      const bu = bullets[b];
      if (circleHit(bu.x, bu.y, bu.r, r.x, r.y, r.r)) {
        bullets.splice(b, 1);
        r.hp -= bulletDamage;
        damageTrail(r);
        if (r.hp <= 0) {
          score += SCORE_ASTEROID;
          pushFloat("+" + SCORE_ASTEROID, "#c98aff", r.x, r.y - r.r);
          updateHUD();
          for (let k = 0; k < 14; k++) {
            particles.push({ x: r.x, y: r.y, vx: rand(-140, 140), vy: rand(-140, 140),
              life: rand(0.25, 0.6), maxLife: 0.6, size: rand(2, 5), color: "#9a8f76" });
          }
          audio.boom();
          const scale = r.r >= 30 ? 0.55 : 0;
          if (scale > 0) {
            for (let s = 0; s < 2; s++) {
              rocks.push({ x: r.x, y: r.y, r: rockSizes[1], ang: rand(0, 6.28), spin: rand(-2, 2),
                vx: rand(-80, 80), vy: rand(20, 90), hp: 2 });
            }
          }
          rocks.splice(i, 1);
        }
        break;
      }
    }
    if (rocks[i] === undefined) continue; // split invalidated index

    // rock vs player
    if (circleHit(r.x, r.y, r.r, player.x, player.y, 14)) {
      if (nowSecs < invulnUntil) {
        splitRock(i);
        score += 5;
      } else if (nowSecs >= shieldUntil) {
        splitRock(i);
        killPlayer(nowSecs);
      } else {
        splitRock(i);
        pushFloat("CLANG", "#8affc1", r.x, r.y - r.r - 10);
        shake(5);
      }
    }
  }
  // splitRock hides the rock, so run a cleanup pass for rocks below screen
  for (let i = rocks.length - 1; i >= 0; i--) {
    if (rocks[i].y > H + rocks[i].r + 40) rocks.splice(i, 1);
  }
}
function splitRock(index) {
  const r = rocks[index];
  for (let k = 0; k < 12; k++) {
    particles.push({ x: r.x, y: r.y, vx: rand(-120, 120), vy: rand(-120, 120),
      life: rand(0.2, 0.5), maxLife: 0.5, size: rand(2, 4.5), color: "#9a8f76" });
  }
  audio.boom();
  const scale = r.r >= 30 ? 0.55 : 0;
  if (scale > 0) {
    for (let s = 0; s < 2; s++) {
      rocks.push({ x: r.x, y: r.y, r: rockSizes[1], ang: rand(0, 6.28), spin: rand(-2, 2),
        vx: rand(-80, 80), vy: rand(20, 90), hp: 2 });
    }
  }
  rocks.splice(index, 1);
  updateHUD();
}
function drawRock(r) {
  ctx.save();
  ctx.translate(r.x, r.y);
  ctx.rotate(r.ang);
  const poly = r.poly || (r.poly = (() => {
    const p = [];
    const n = 9;
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2;
      p.push([Math.cos(a) * (r.r * rand(0.8, 1.2)), Math.sin(a) * (r.r * rand(0.8, 1.2))]);
    }
    return p;
  })());
  ctx.fillStyle = "#6e6653";
  ctx.beginPath();
  ctx.moveTo(poly[0][0], poly[0][1]);
  for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i][0], poly[i][1]);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#4a4436";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

/* ============================== Projectiles ============================== */
function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.y < -20) { bullets.splice(i, 1); continue; }

    let hit = false;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (circleHit(b.x, b.y, b.r, e.x, e.y, e.r)) {
        bullets.splice(i, 1);
        e.hp -= bulletDamage;
        if (e.hp <= 0) explodeEnemy(j);
        else damageTrail(e);
        hit = true;
        break;
      }
    }
    if (hit) continue;
    for (let j = rocks.length - 1; j >= 0; j--) {
      const r = rocks[j];
      if (circleHit(b.x, b.y, b.r, r.x, r.y, r.r)) {
        bullets.splice(i, 1);
        damageTrail(r);
        hit = true;
        break;
      }
    }
  }
}
function drawBullet(b) {
  ctx.strokeStyle = "#7df9ff";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(b.x, b.y);
  ctx.lineTo(b.x - b.vx * 0.028, b.y - b.vy * 0.028);
  ctx.stroke();
  ctx.fillStyle = "#eafcff";
  ctx.beginPath(); ctx.arc(b.x, b.y, 2.4, 0, 6.28); ctx.fill();
}
function drawEnemyBullet(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.angle + Math.PI / 2);
  ctx.fillStyle = "#ff6b81";
  ctx.beginPath();
  ctx.moveTo(0, -6); ctx.lineTo(4, 5); ctx.lineTo(0, 2.5); ctx.lineTo(-4, 5);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.fillStyle = "rgba(255,107,129,0.35)";
  ctx.beginPath(); ctx.arc(b.x, b.y, 8, 0, 6.28); ctx.fill();
}

/* ============================== Pickups draw/update ============================== */
function updatePickups(dt, nowSecs) {
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.y += p.vy * dt;
    p.pulse += dt * 5;
    if (p.ttl <= 0 || p.y > H + 20) { pickups.splice(i, 1); continue; }
    p.ttl -= dt;
    if (state === "playing" && circleHit(p.x, p.y, p.radius, player.x, player.y, 16)) {
      pickups.splice(i, 1);
      applyPickup(p.kind, nowSecs);
      for (let k = 0; k < 10; k++) {
        particles.push({ x: p.x, y: p.y, vx: rand(-80, 80), vy: rand(-80, 80),
          life: rand(0.2, 0.5), maxLife: 0.5, size: rand(2, 4.5),
          color: p.kind === "mult" ? "#7df9ff" : "#8affc1" });
      }
    }
  }
}
function drawPickup(p) {
  const blink = p.ttl < 2 && Math.floor(p.ttl * 6) % 2 === 0;
  if (blink) return;
  const col = p.kind === "mult" ? "#7df9ff" : "#8affc1";
  const label = p.kind === "mult" ? "x2" : "S";
  ctx.save();
  ctx.translate(p.x, p.y);
  const s = 1 + 0.12 * Math.sin(p.pulse);
  ctx.scale(s, s);
  ctx.rotate(p.pulse * 0.4);
  ctx.fillStyle = "rgba(20,30,50,0.6)";
  ctx.beginPath(); ctx.arc(0, 0, 14, 0, 6.28); ctx.fill();
  ctx.strokeStyle = col;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, 13, 0, 6.28); ctx.stroke();
  ctx.fillStyle = col;
  ctx.font = "bold 12px ui-monospace, monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(label, 0, 1);
  ctx.restore();
}

/* ============================== Effects ============================== */
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= Math.max(0, 1 - 1.5 * dt);
    p.vy *= Math.max(0, 1 - 1.5 * dt);
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.life -= dt;
    if (f.life <= 0) { floaters.splice(i, 1); continue; }
    f.y -= 40 * dt;
    if (f.attach === "player") { f.x = player.x; f.y = player.y - 40; }
  }
}
function drawParticles() {
  for (const p of particles) {
    const a = clamp(p.life / p.maxLife, 0, 1);
    ctx.globalAlpha = a;
    if (p.ring) {
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 3 * a;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.6 - a), 0, 6.28); ctx.stroke();
    } else {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
  }
  ctx.globalAlpha = 1;
}
function drawFloaters() {
  ctx.font = "bold 13px ui-monospace, monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (const f of floaters) {
    const a = clamp(f.life / f.maxLife, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = f.color;
    ctx.strokeStyle = "rgba(0,0,0,0.6)";
    ctx.lineWidth = 3;
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}
function pushFloat(text, color, x, y, attach) {
  floaters.push({ text, color, x, y, life: 1.2, maxLife: 1.2, attach });
}
let shakeAmpLocal = 0, shakeTimeLocal = 0;
function shake(amp) { shakeAmpLocal = Math.max(shakeAmpLocal, amp); shakeTimeLocal = 0.45; }
function applyShake() {
  if (shakeTimeLocal <= 0) return 0;
  const a = shakeAmpLocal * (shakeTimeLocal / 0.45);
  shakeTimeLocal -= 1 / 60;
  return a;
}
function drawStars(dt) {
  for (let i = 0; i < stars.length; i++) {
    stars[i].y += stars[i].sp * dt;
    if (stars[i].y > H) { stars[i].y = 0; stars[i].x = rand(0, W); }
  }
  for (const s of stars) {
    ctx.globalAlpha = s.a;
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }
  ctx.globalAlpha = 1;
}

/* ============================== HUD ============================== */
function updateHUD() {
  document.getElementById("hudScore").textContent = score;
  document.getElementById("hudLevel").textContent = level;
  document.getElementById("hudLives").textContent = "♥".repeat(Math.max(0, lives)) || "—";
  document.getElementById("hudMult").textContent = multUntil > gameTime ? "ON" : "off";
  document.getElementById("hudShield").textContent = shieldUntil > gameTime ? "ON" : "off";
}
function drawWaveHUD(dt, nowSecs) {
  document.getElementById("hudWave").textContent = state === "playing"
    ? Math.max(0, nextWaveIn).toFixed(1)
    : (state === "paused" ? "paused" : "—");
}

/* ============================== State transitions ============================== */
function startGame() {
  state = "playing";
  score = 0; lives = 3; level = 1;
  nextWaveIn = 3; multUntil = 0; shieldUntil = 0; invulnUntil = 0;
  gameTime = 0; pauseTime = 0; pauseAccum = 0; runStart = 0;
  player.x = W / 2; player.y = H - 70; player.vx = 0; player.vy = 0;
  deadTime = 0; deadFlash = 0;
  enemies.length = 0; bullets.length = 0; ebullets.length = 0;
  rocks.length = 0; pickups.length = 0; particles.length = 0; floaters.length = 0;
  shakeAmpLocal = 0; shakeTimeLocal = 0;
  updateHUD();
  document.getElementById("startBtn").textContent = "Restart";
  const ov = document.getElementById("stateOverlay");
  ov.style.display = "none";
  audio.wave();
}
function endGame(reason) {
  state = "over";
  gameOverReason = reason;
  const ov = document.getElementById("stateOverlay");
  const title = document.getElementById("ovTitle");
  const sub = document.getElementById("ovSub");
  const stats = document.getElementById("ovStats");
  title.textContent = OVERLAY_TITLE[1];
  sub.textContent = reason === "destroyed" ? "Your ship was destroyed." : "Mission complete!";
  stats.innerHTML = "Score <b>" + score + "</b> · Level <b>" + level + "</b>";
  ov.style.display = "flex";
  const btn = document.getElementById("ovBtn");
  btn.textContent = "Try Again";
  audio.gameover();
  updateHUD();
}
function togglePause() {
  if (state === "playing") {
    state = "paused";
    pauseTime = performance.now() / 1000;
    document.getElementById("pauseBtn").textContent = "Resume (P)";
  } else if (state === "paused") {
    state = "playing";
    pauseAccum += performance.now() / 1000 - pauseTime;
    document.getElementById("pauseBtn").textContent = "Pause (P)";
  }
}

/* ============================== Buttons ============================== */
const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pauseBtn");
const restartBtn = document.getElementById("restartBtn");
const ovBtn = document.getElementById("ovBtn");
startBtn.addEventListener("click", startGame);
ovBtn.addEventListener("click", startGame);
pauseBtn.addEventListener("click", () => togglePause());
restartBtn.addEventListener("click", () => { togglePause(); startGame(); });
document.addEventListener("keydown", e => {
  if (e.code === "KeyM" && !e.repeat) muted = !muted;
});

/* ============================== Main loop ============================== */
const stars = [];
for (let i = 0; i < 130; i++) {
  stars.push({ x: rand(0, W), y: rand(0, H), size: rand(0.8, 2.2), sp: rand(14, 60), a: rand(0.25, 0.85) });
}

let last = performance.now() / 1000;
function frame(ts) {
  const now = ts / 1000;
  let dt = clamp(now - last, 0, 0.05);
  last = now;
  if (state === "paused") { dt = 0; }
  const nowSecs = state === "playing" ? now - pauseAccum : gameTime;

  // wave spawning & difficulty ramp (playing only)
  if (state === "playing") {
    gameTime = nowSecs;
    nextWaveIn -= dt;
    if (nextWaveIn <= 0) {
      level++;
      nextWaveIn = clamp(Math.max(8 - level * 0.65, 3), 3, 8);
      spawnWave(decideCount(level));
      audio.wave();
    }
  }

  // updates
  if (state !== "over") {
    updatePlayer(dt, nowSecs);
    updateEnemies(dt, nowSecs);
    updateRocks(dt);
    updateBullets(dt);
  }
  updatePickups(dt, nowSecs);
  updateParticles(dt);

  // draw
  ctx.save();
  const shk = applyShake();
  if (shk) ctx.translate(rand(-shk, shk), rand(-shk, shk));
  ctx.fillStyle = "#04060d";
  ctx.fillRect(-12, -12, W + 24, H + 24);
  drawStars(dt);
  if (state !== "idle" && state !== "paused") {
    for (const r of rocks) drawRock(r);
    for (const p of pickups) drawPickup(p);
    for (const e of enemies) drawEnemy(e);
    for (const b of ebullets) drawEnemyBullet(b);
    for (const b of bullets) drawBullet(b);
    if (state === "over" && nowSecs > 0) { /* keep ship drawn on game over */
      drawPlayer(nowSecs);
    } else if (state === "playing") {
      drawPlayer(nowSecs);
    }
  }
  drawParticles();
  drawFloaters();
  ctx.restore();

  // vignette
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.42, W / 2, H / 2, H * 0.85);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(1, "rgba(0,0,0,0.45)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  frameCount++;
  drawWaveHUD(dt, nowSecs);
  updateHUD();
  requestAnimationFrame(frame);
}

/* ============================== Boot ============================== */
const ov = document.getElementById("stateOverlay");
ov.style.display = "flex";
document.getElementById("ovBtn").textContent = "Start Mission";
drawStars(0);
requestAnimationFrame(frame);
})();
</script>
