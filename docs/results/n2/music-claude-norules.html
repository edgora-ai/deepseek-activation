<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PulseWave — Real-Time Music Visualizer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 800px at 20% 10%, #1b2a4a 0%, #10131f 55%, #07070c 100%);
    color: #e8ecf8;
    overflow: hidden;
  }
  /* subtle animated aurora blobs behind the canvas */
  .bg { position: fixed; inset: 0; z-index: 0; filter: blur(90px); opacity: .5; }
  .bg span {
    position: absolute; border-radius: 50%;
    transition: background 1.2s ease;
  }
  .bg span:nth-child(1) { width: 42vmax; height: 42vmax; left: -12vmax; top: -14vmax; background: #3b4d94; }
  .bg span:nth-child(2) { width: 38vmax; height: 38vmax; right: -10vmax; top: 8vmax; background: #5c2e7e; }
  .bg span:nth-child(3) { width: 30vmax; height: 30vmax; left: 28vmax; bottom: -16vmax; background: #0f6a5f; }

  #stage { position: fixed; inset: 0; z-index: 1; width: 100%; height: 100%; }
  canvas { display: block; }

  .ui {
    position: fixed; z-index: 2; left: 50%; transform: translateX(-50%);
    bottom: 26px; display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-radius: 14px;
    background: rgba(10, 12, 24, .72);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.09);
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
    flex-wrap: wrap; justify-content: center; max-width: min(96vw, 860px);
  }
  button, .btn {
    font: 600 13px/1 inherit; color: #dfe6ff;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14);
    border-radius: 9px; padding: 8px 12px; cursor: pointer;
    transition: background .18s, border-color .18s, transform .05s;
    white-space: nowrap;
  }
  button:hover { background: rgba(255,255,255,.14); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .38; cursor: default; }
  button.active {
    background: linear-gradient(135deg, #4f7cff, #8b5cf6);
    border-color: transparent; box-shadow: 0 4px 18px rgba(90,110,255,.45);
  }
  .sep { width: 1px; height: 26px; background: rgba(255,255,255,.14); }

  #fileLabel { cursor: pointer; }
  #fileInput { display: none; }

  #status {
    position: fixed; z-index: 2; top: 18px; left: 50%; transform: translateX(-50%);
    font: 500 12.5px/1 inherit; color: #aab4d8; letter-spacing: .04em;
    background: rgba(10,12,24,.6); padding: 7px 14px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.08);
    max-width: 90vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #status b { color: #fff; font-weight: 600; }
  #status.cued { color: #9be8b0; }

  #hud {
    position: fixed; z-index: 2; top: 18px; right: 20px; text-align: right;
    font: 500 12px/1.8 ui-monospace, "SF Mono", Consolas, monospace; color: #8f9bc4;
    background: rgba(10,12,24,.5); padding: 8px 12px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,.07); min-width: 150px;
  }
  #hud b { color: #cfd9ff; font-weight: 700; }

  @media (max-width: 620px) {
    .ui { bottom: 12px; gap: 8px; padding: 8px 10px; }
    button, .btn { padding: 7px 10px; font-size: 12px; }
    #hud { display: none; }
  }
</style>
</head>
<body>

<div class="bg"><span></span><span></span><span></span></div>
<canvas id="stage"></canvas>

<div id="status">No audio — pick a file or allow microphone access</div>

<div id="hud">
  <div><b id="hdrName">—</b></div>
  <div><b id="hdrFreq">0.0</b> kHz</div>
  <div><b id="hdrPeak">0.00</b> peak</div>
  <div><b id="hdrFps">0</b> fps</div>
</div>

<div class="ui">
  <button id="btnToggle" disabled>▶ Play</button>
  <label class="btn" id="fileLabel" title="Load an audio file from disk">🎵 Open file
    <input type="file" id="fileInput" accept="audio/*">
  </label>
  <button id="btnMic">🎤 Mic</button>

  <div class="sep"></div>

  <u id="themeGroup" style="display: contents">
    <button id="thBars" class="active">▮▮ Bars</button>
    <button id="thRings">◉ Rings</button>
    <button id="thField">✦ Particles</button>
  </u>

  <div class="sep"></div>

  <button id="btnColor" title="Cycle the color palette">🎨 Color</button>
  <button id="btnReset" title="Reset smoothing / response back to defaults">↺ Reset</button>
</div>

<script>
"use strict";

/* ---------------------------------------------------------------- core ---- */
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* ------------------------------------------------------------- audio io ---- */
const audio   = new Audio();
audio.crossOrigin = "anonymous";
const ctxAC   = new (window.AudioContext || window.webkitAudioContext)();
const source  = ctxAC.createMediaElementSource(audio);
const analyser  = ctxAC.createAnalyser();
const analyser2 = ctxAC.createAnalyser();

const SMOOTHING = 0.78;          // analyser time-domain smoothing (average over frames)
const FFTSIZE   = 2048;          // 1024 frequency bins, plenty for 60+ bars
analyser.smoothingTimeConstant = SMOOTHING;
analyser2.smoothingTimeConstant = SMOOTHING;
analyser.fftSize = FFTSIZE;
analyser2.fftSize = FFTSIZE;

source.connect(analyser);
analyser.connect(analyser2);
analyser2.connect(ctxAC.destination);

const freqData  = new Uint8Array(analyser.frequencyBinCount);  // 1024 bins
const timeData  = new Uint8Array(analyser.fftSize);            // 2048 samples
const smoothPeak = { v: 0 };

/* Mic support: analyser1 stays wired to the element source (so `<audio>` keeps
   working for file playback), while analyser2's input can be re-routed to the
   mic. analyser2 is always the one feeding the renderer. */
let micStream = null;
const mic = { node: null, enabled: false };

async function enableMic() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus("Microphone not supported in this browser"); return;
  }
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    if (mic.node) mic.node.disconnect();
    mic.node = ctxAC.createMediaStreamSource(micStream);
    mic.node.connect(analyser2);
    mic.enabled = true;
    await ctxAC.resume();
    setStatus(`Microphone live — <b>${micStream.getAudioTracks()[0].label || "input"}</b>`);
  } catch (err) {
    setStatus(`Mic denied: ${err.name} — ${err.message}`);
  }
}
function disableMic() {
  if (!mic.enabled) return;
  try { mic.node.disconnect(); } catch (_) {}
  mic.node.disconnect && mic.node.disconnect();
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  micStream = null; mic.node = null; mic.enabled = false;
}
function toggleMic() {
  mic.enabled ? disableMic()
              : (audio.paused && audio.src && audio.play().catch(() => {}), enableMic());
}

/* -------------------------------------------------------------- render ---- */
const SPECTRUM_BARS = 72;
const LOG_MIN = 2.3, LOG_MAX = 10.8;   // log2 range over the 0..22.05 kHz band
const barEnergies = new Float32Array(SPECTRUM_BARS);   // smoothed per-band energy
const barTargets  = new Float32Array(SPECTRUM_BARS);
const waveform    = new Float32Array(512);
const MAX_WAVE_T = 0.30;   // waveform decays to (almost) zero in ~0.3 s of silence

let theme = "bars";
let paletteIndex = 0;
let frames = 0, lastFrame = performance.now(), fps = 0;
let beat = 0, beatColor = null;

const PALETTES = [
  { a: "#5ae0ff", b: "#4f7cff", c: "#b44cff", glow: "rgba(64,144,255,.55)" },  // ice
  { a: "#ffd166", b: "#ff6b9d", c: "#ff3d77", glow: "rgba(255,90,120,.55)" },  // ember
  { a: "#8be87a", b: "#2fd9a8", c: "#3fa8ff", glow: "rgba(60,220,180,.55)" },  // mint
  { a: "#e0a8ff", b: "#9d7bff", c: "#5a7bff", glow: "rgba(150,110,255,.55)" }, // violet
  { a: "#ffe27a", b: "#ffb14c", c: "#ff7a4c", glow: "rgba(255,170,80,.55)" },  // gold
];

function hslOf(hex) {
  const { a, b, c } = PALETTES[paletteIndex];
  const p = [a, b, c];
  const idx = p.indexOf(hex);
  const [r, g, bl] = [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  const max = Math.max(r, g, bl) / 255, min = Math.min(r, g, bl) / 255;
  let h = 0, s = 0;
  const d = max - min;
  if (d) {
    s = d / max;
    if (max === r / 255) h = ((g - bl) / 255 / d) % 6;
    else if (max === g / 255) h = ((bl - r) / 255 / d) + 2;
    else h = ((r - g) / 255 / d) + 4;
    h *= 60; if (h < 0) h += 360;
  }
  return { p: idx, h, s, l: (max + min) / 2 };
}
function paletteGradient(g) {
  const col = PALETTES[paletteIndex];
  const grd = g.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, col.a); grd.addColorStop(0.5, col.b); grd.addColorStop(1, col.c);
  return grd;
}

function spectrumRange(center, width) {
  const half = width / 2;
  const lo = Math.max(LOG_MIN, center - half), hi = Math.min(LOG_MAX, center + half);
  return { loBin: Math.max(0, Math.floor(Math.pow(2, lo))),
           hiBin: Math.min(freqData.length - 1, Math.ceil(Math.pow(2, hi))) };
}

function updateSpectrum() {
  analyser2.getByteFrequencyData(freqData);
  analyser2.getByteTimeDomainData(timeData);

  // 60+ logarithmically spaced bars that grow with frequency: each band spans
  // an octave (log2 width 1) except the first, which widens to cover the bass
  // wash below it.
  const step = (LOG_MAX - LOG_MIN) / SPECTRUM_BARS;
  for (let i = 0; i < SPECTRUM_BARS; i++) {
    const center = LOG_MIN + (i + 0.5) * step;
    const width  = i === 0 ? (LOG_MIN - 0) + step / 2 : step;
    const { loBin, hiBin } = spectrumRange(center, width);
    let sum = 0;
    for (let b = loBin; b <= hiBin; b++) sum += freqData[b];
    const n = hiBin - loBin + 1 || 1;
    const energy = Math.min(1.05, sum / n / 255 * 1.6);
    barTargets[i] = Math.max(energy * energy, barTargets[i] * 0.15);
    barEnergies[i] += (barTargets[i] - barEnergies[i]) * (1 - Math.exp(-1 / 6));
  }

  // peak meter
  const rawPeak = Math.max.apply(null, freqData) / 255;
  smoothPeak.v += (rawPeak - smoothPeak.v) * 0.4;
  if (smoothPeak.v < 0.001) smoothPeak.v = 0;

  // beat flash: sudden jump in low-band energy
  const bass = (freqData[1] + freqData[2] + freqData[4] + freqData[6] + freqData[8]) / 5 / 255;
  const cur = 1 - Math.exp(-1 / 6);
  beat = Math.max(bass, beat * (1 - cur)) > 0.82 && bass > 0.55 ? cur : beat * (1 - cur);
  beatColor = beat > cur * 0.55
    ? PALETTES[paletteIndex].glow.replace(/rgba\(([^)]+)/, (m, c) => `rgba(${c.slice(0, c.lastIndexOf(","))},${Math.min(0.95, beat * 1.4)})`)
    : null;

  // waveform with fast attack, slow decay
  const n = timeData.length;
  const dt = 1 - Math.exp(-1 / 3.2);
  for (let i = 0; i < 512; i++) {
    const v = timeData[Math.floor(i * n / 512)] / 128 - 1;
    waveform[i] = v > waveform[i] ? v : waveform[i] * Math.max(0.04, 1 - dt);
  }

  // HUD
  let lf = -1;
  for (let i = 0; i < freqData.length; i++) { if (freqData[i] > 240) { lf = i; break; } }
  document.getElementById("hdrFreq").textContent = (lf > 0 ? lf * 44100 / freqData.length / 1000 : 0).toFixed(1);
  document.getElementById("hdrPeak").textContent = smoothPeak.v.toFixed(2);
}

function render() {
  updateSpectrum();
  const t = performance.now() / 1000;

  const fade = { a: 0.30, b: 0.22 }[theme] ?? 0.30;
  ctx.fillStyle = `rgba(6, 8, 18, ${fade})`;
  ctx.fillRect(0, 0, W, H);
  ctx.lineWidth = 2;

  if (theme === "rings")      drawRings(t);
  else if (theme === "field") drawField(t);
  else                        drawBars();

  const peak = smoothPeak.v;
  if (peak > 0.01) {
    ctx.fillStyle = beatColor || PALETTES[paletteIndex].glow;
    ctx.globalAlpha = beatColor ? Math.min(0.85, peak * 0.85) : peak * 0.14;
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, Math.min(W, H) * (0.34 + peak * 0.10), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  frames++;
  const now = performance.now();
  if (now - lastFrame >= 500) {
    fps = Math.round(frames * 1000 / (now - lastFrame));
    frames = 0; lastFrame = now;
    document.getElementById("hdrFps").textContent = fps;
  }
  requestAnimationFrame(render);
}

/* bar + waveform theme */
function drawBars() {
  const pad = 60, bw = (W - pad * 2) / SPECTRUM_BARS;
  const gHalf = Math.max(0.01, Math.min(0.3, 1 / SPECTRUM_BARS * 0.3));
  const bcol = PALETTES[paletteIndex];
  const grad = paletteGradient(ctx);

  for (let i = 0; i < SPECTRUM_BARS; i++) {
    const e = barEnergies[i];
    if (e < 0.006) continue;
    const x = pad + i * bw + bw / 2;
    const hgt = Math.max(2, e * (H * 0.78));
    const y = H - hgt;
    ctx.fillStyle = grad;
    ctx.globalAlpha = 0.94;
    ctx.fillRect(x - bw * 0.36, y, bw * 0.72, hgt);
    ctx.globalAlpha = Math.min(1, e * 1.1);
    ctx.fillRect(x - bw * 0.36, y, bw * 0.72, Math.min(5, hgt * 0.3));
    // mirrored reflection below
    ctx.globalAlpha = 0.16;
    ctx.fillRect(x - bw * 0.36, H + 10, bw * 0.72, hgt * 0.28);
    ctx.globalAlpha = 1;
  }

  // shimmer line at the bar tips
  ctx.strokeStyle = bcol.a;
  ctx.globalAlpha = 0.55;
  ctx.beginPath();
  for (let i = 0; i < SPECTRUM_BARS; i++) {
    const x = pad + i * bw + bw / 2;
    const y = H - barEnergies[i] * (H * 0.78);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;

  // waveform line in the lower third
  const wy = H * 0.72, amp = H * 0.12;
  ctx.strokeStyle = "rgba(255,255,255,.85)";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let i = 0; i < 512; i++) {
    const x = pad + (i / 511) * (W - pad * 2);
    const y = wy + waveform[i] * amp;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();

  // thin center guide
  ctx.strokeStyle = "rgba(255,255,255,.10)";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad, wy); ctx.lineTo(W - pad, wy); ctx.stroke();
  ctx.lineWidth = 2;
}

/* radial rings theme */
function drawRings(t) {
  const col = PALETTES[paletteIndex];
  const cx = W / 2, cy = H / 2;
  const R = Math.min(W, H) * 0.30;
  const n = 84;  // ring segments
  const gap = Math.PI * 2 / n;
  const base = -Math.PI / 2;

  for (let k = 0; k < n; k++) {
    const i = Math.floor((n - 1 - k) / n * SPECTRUM_BARS);
    const e = barEnergies[i];
    if (e < 0.006) continue;
    const ang = base + k * gap;
    const push = e * R * 0.74;
    const grad = ctx.createRadialGradient(cx, cy, R - push, cx, cy, R);

    const hue = hslOf(PALETTES[paletteIndex].a);
    grad.addColorStop(0, `hsla(${hue.h}, 95%, ${62 - push / (R * 0.74) * 20}%, 0)`);
    grad.addColorStop(0.85, `hsla(${hue.h}, 95%, 62%, 0)`);
    const rg = hslOf(PALETTES[paletteIndex].a);
    const gs = rg.h + (i / SPECTRUM_BARS) * 50;
    grad.addColorStop(1, `hsla(${gs}, 92%, 58%, ${0.05 + e * 0.45})`);

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R + push, ang + gap * 0.10, ang + gap * 0.90);
    ctx.closePath();
    ctx.fill();
  }

  // glowing rotating ring + core
  const rot = t * 0.35;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.strokeStyle = col.a;
  ctx.lineWidth = 1.6;
  ctx.globalAlpha = 0.8;
  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.stroke();
  ctx.rotate(-rot * 2);
  ctx.strokeStyle = col.b;
  ctx.globalAlpha = 0.45;
  ctx.beginPath(); ctx.arc(0, 0, R * 0.9, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.shadowColor = col.c; ctx.shadowBlur = 40;
  ctx.fillStyle = beatColor || col.c;
  ctx.globalAlpha = Math.max(0.25, smoothPeak.v * 1.2);
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.06 + smoothPeak.v * R * 0.05, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // waveform orbiting the outer edge as a circular line
  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = "rgba(255,255,255,.7)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i <= 512; i++) {
    const a = (i / 512) * Math.PI * 2 - Math.PI / 2;
    const r = R * 1.28 + waveform[i % 512] * R * 0.22;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.restore();
}

/* particle field theme */
const particles = [];
function ensureParticles() {
  if (particles.length) return;
  const count = Math.min(420, Math.max(180, Math.round(W * H / 3200)));
  for (let i = 0; i < count; i++) particles.push({
    x: Math.random() * W, y: Math.random() * H,
    vx: (Math.random() - 0.5) * 0.6, vy: (Math.random() - 0.5) * 0.6,
    r: 1 + Math.random() * 2.4,
    seed: Math.random() * Math.PI * 2,
    hue: Math.random() * 360,
  });
}
function drawField() {
  ensureParticles();
  const col = PALETTES[paletteIndex];
  const t = performance.now() / 1000;

  for (const p of particles) {
    const i = Math.min(SPECTRUM_BARS - 1, Math.floor(p.seed / (Math.PI * 2) * SPECTRUM_BARS));
    const e = barEnergies[i];
    const pulse = 1 + e * 2.2;

    p.vx += (Math.random() - 0.5) * 0.25;
    p.vy += (Math.random() - 0.5) * 0.25;
    const vmax = 2.2;
    const sp = Math.hypot(p.vx, p.vy);
    if (sp > vmax) { p.vx *= vmax / sp; p.vy *= vmax / sp; }

    p.x += p.vx; p.y += p.vy;
    if (p.x < -20) p.x = W + 20;  if (p.x > W + 20) p.x = -20;
    if (p.y < -20) p.y = H + 20;  if (p.y > H + 20) p.y = -20;

    // gentle wobble with the music
    p.x += Math.sin(t * 1.7 + p.seed) * e * 1.4;
    p.y += Math.cos(t * 1.3 + p.seed * 2) * e * 1.4;

    const lg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * pulse * 2.5);
    lg.addColorStop(0, `hsla(${p.hue}, 90%, 68%, ${0.25 + e * 0.7})`);
    lg.addColorStop(1, "hsla(0,0%,0%,0)");
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * pulse * 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // spectrum circle
  const cx = W / 2, cy = H / 2;
  const R = Math.min(W, H) * 0.34;
  ctx.save();
  ctx.strokeStyle = "rgba(255,255,255,.35)";
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();

  // waveform spiral through the center
  ctx.save();
  ctx.strokeStyle = col.a;
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.8;
  ctx.beginPath();
  for (let i = 0; i <= 512; i++) {
    const a = (i / 512) * Math.PI * 2;
    const r = R * 0.95 + waveform[i % 512] * R * 0.28;
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r * 0.7;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.restore();
}

/* ------------------------------------------------------------- controls ---- */
const $ = id => document.getElementById(id);
const btnToggle = $("btnToggle"), btnMic = $("btnMic"), btnColor = $("btnColor"), btnReset = $("btnReset");
const fileInput = $("fileInput");
const hdrName = $("hdrName");

function setStatus(msg) { $("status").innerHTML = msg; }

function updatePlayBtn() {
  btnToggle.disabled = !audio.src && !mic.enabled;
  btnToggle.textContent = audio.paused ? "▶ Play" : "⏸ Pause";
}

function loadFile(file) {
  const url = URL.createObjectURL(file);
  audio.src = url;
  audio.currentTime = 0;
  hdrName.textContent = file.name;
  setStatus(`Loaded <b>${file.name}</b> — press Play`);
  updatePlayBtn();
}

fileInput.addEventListener("change", () => {
  const f = fileInput.files[0];
  if (f) loadFile(f);
});

btnToggle.addEventListener("click", async () => {
  if (!audio.src && !mic.enabled) return;
  await ctxAC.resume();
  if (audio.paused) audio.play().catch(err => setStatus(`Playback error: ${err.message}`));
  else audio.pause();
  updatePlayBtn();
});

btnMic.addEventListener("click", () => {
  if (mic.enabled) { disableMic(); setStatus("Microphone off"); }
  else {
    if (audio.src) { audio.pause(); audio.currentTime = 0; }
    enableMic();
  }
  updatePlayBtn();
});

btnColor.addEventListener("click", () => {
  paletteIndex = (paletteIndex + 1) % PALETTES.length;
  document.querySelectorAll(".bg span").forEach((el, i) => {
    el.style.background = [PALETTES[paletteIndex].a, PALETTES[paletteIndex].b, PALETTES[paletteIndex].c][i];
  });
});

btnReset.addEventListener("click", () => {
  analyser.smoothingTimeConstant = SMOOTHING;
  analyser2.smoothingTimeConstant = SMOOTHING;
  barEnergies.fill(0);
  setStatus("Smoothing & response reset");
});

document.getElementById("themeGroup").addEventListener("click", ev => {
  const id = ev.target.id;
  if (!id.startsWith("th")) return;
  theme = id.slice(2).toLowerCase();
  document.querySelectorAll("#themeGroup button").forEach(b => b.classList.toggle("active", b === ev.target));
  if (theme === "field") ensureParticles();
});

audio.addEventListener("play", () => { updatePlayBtn(); setStatus(`Playing <b>${hdrName.textContent}</b>`); });
audio.addEventListener("pause", () => updatePlayBtn());
audio.addEventListener("ended", () => {
  setStatus(`Finished <b>${hdrName.textContent}</b> — replay or pick another file`);
  updatePlayBtn();
});
audio.addEventListener("error", () => {
  setStatus("File could not be loaded — is it a valid audio file?");
  audio.src = "";
  updatePlayBtn();
});

/* ---------------------------------------------------------------- go ------ */
render();
updatePlayBtn();
</script>
</body>
</html>
