<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HeliSim — Interactive 3D Helicopter (Three.js)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87b7e0;
    font-family: 'Segoe UI', system-ui, sans-serif; }
  #c { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud {
    position: fixed; top: 12px; left: 12px; min-width: 210px;
    color: #eaffea; background: rgba(10, 22, 16, .55);
    border: 1px solid rgba(255,255,255,.25); border-radius: 10px;
    padding: 10px 14px 12px;
    font: 600 13px/1.55 ui-monospace, Consolas, monospace;
    text-shadow: 0 1px 2px rgba(0,0,0,.8); user-select: none;
    pointer-events: none; backdrop-filter: blur(3px);
  }
  #hud .hd { font-size: 12px; letter-spacing: 3px; color: #7fd8a8; margin-bottom: 5px; }
  #hud .row { display: flex; align-items: center; gap: 10px; }
  #hud .lbl { color: #9fd8a8; width: 34px; }
  #hud .val { color: #fff; min-width: 52px; text-align: right; }
  #hud .bar { width: 96px; height: 7px; margin-left: auto;
    background: rgba(255,255,255,.18); border-radius: 4px; overflow: hidden; }
  #hud .bar > i { display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, #ffb347, #ff6b35); border-radius: 4px; }
  #hud .bar.rpm > i { background: linear-gradient(90deg, #4fd1ff, #2f7bff); }
  #hud .bar.clt > i { background: linear-gradient(90deg, #9fe88a, #4fc45a); }
  #help {
    position: fixed; bottom: 12px; left: 12px; color: #dfeef2;
    background: rgba(10, 22, 16, .5); border: 1px solid rgba(255,255,255,.18);
    border-radius: 10px; padding: 8px 13px;
    font: 500 12px/1.8 ui-monospace, Consolas, monospace;
    user-select: none; pointer-events: none;
  }
  kbd { background: rgba(255,255,255,.16); border-radius: 4px;
    padding: 0 5px; font-weight: 700; }
  #err {
    position: fixed; inset: 0; display: none; place-items: center;
    background: rgba(20,0,0,.86); color: #ffd7d7;
    font: 600 15px/1.7 ui-monospace, monospace; z-index: 99;
    white-space: pre-wrap; padding: 30px; text-align: center;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="hd">HELI-SIM</div>
  <div class="row"><span class="lbl">ALT</span><span class="val" id="h-alt">0 m</span></div>
  <div class="row"><span class="lbl">SPD</span><span class="val" id="h-spd">0 km/h</span></div>
  <div class="row"><span class="lbl">RPM</span><span class="val" id="h-rpm">0</span>
    <div class="bar rpm"><i id="b-rpm"></i></div></div>
  <div class="row"><span class="lbl">THR</span><span class="val" id="h-thr">0%</span>
    <div class="bar"><i id="b-thr"></i></div></div>
  <div class="row"><span class="lbl">CLT</span><span class="val" id="h-clt">0%</span>
    <div class="bar clt"><i id="b-clt"></i></div></div>
  <div class="row"><span class="lbl">HDG</span><span class="val" id="h-hdg">0°</span></div>
</div>

<div id="help">
  <kbd>W</kbd>/<kbd>S</kbd> pitch&nbsp; <kbd>A</kbd>/<kbd>D</kbd> roll&nbsp;
  <kbd>Q</kbd>/<kbd>E</kbd> yaw&nbsp; <kbd>SPACE</kbd> throttle/lift<br>
  <kbd>&uarr;</kbd>/<kbd>&darr;</kbd> collective&nbsp; <kbd>&larr;</kbd>/<kbd>&rarr;</kbd> cyclic&nbsp;
  drag = orbit view&nbsp; wheel = zoom
</div>

<div id="err"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE || document.write('<script src="https://unpkg.com/three@0.128.0/build/three.min.js"><\/script>');</script>
<script>
"use strict";
(function () {

  // ---------------------------------------------------------------- helpers
  var errEl = document.getElementById('err');
  function fail(msg) {
    errEl.style.display = 'grid';
    errEl.textContent = 'ERROR: ' + msg;
  }
  window.addEventListener('error', function (e) { fail(e.message + '\n' + (e.filename || '')); });
  if (!window.THREE) { fail('Three.js failed to load from CDN. Check your network connection and reload.'); return; }
  var T = THREE;
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function canvasTex(w, h, draw, repeat) {
    var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    draw(cv.getContext('2d'), w, h);
    var tex = new T.CanvasTexture(cv);
    tex.encoding = T.sRGBEncoding;
    if (repeat) { tex.wrapS = tex.wrapT = T.RepeatWrapping; tex.repeat.set(repeat, repeat); }
    return tex;
  }
  // cylinder between two points (unit helper for skid struts)
  function strut(p1, p2, r, mat) {
    var dir = new T.Vector3().subVectors(p2, p1);
    var len = dir.length();
    var g = new T.CylinderGeometry(r, r, len, 8);
    g.translate(0, len / 2, 0);
    var m = new T.Mesh(g, mat);
    m.position.copy(p1);
    m.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), dir.clone().normalize());
    return m;
  }

  // ------------------------------------------------------------------ scene
  var renderer;
  try {
    renderer = new T.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
  } catch (e) { fail('WebGL is not available: ' + e.message); return; }
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.outputEncoding = T.sRGBEncoding;

  var scene = new T.Scene();
  scene.background = new T.Color(0x87b7e0);
  scene.fog = new T.Fog(0x87b7e0, 380, 1700);

  var camera = new T.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 6000);

  // lights
  var sun = new T.DirectionalLight(0xfff1d6, 1.15);
  sun.position.set(180, 300, 120);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -280; sun.shadow.camera.right = 280;
  sun.shadow.camera.top = 280;   sun.shadow.camera.bottom = -280;
  sun.shadow.camera.near = 20;   sun.shadow.camera.far = 900;
  sun.shadow.bias = -0.0005;
  scene.add(sun); scene.add(sun.target);
  scene.add(new T.HemisphereLight(0xcfe4ff, 0x4a6b3a, 0.5));

  // ------------------------------------------------------------------ world
  // ground
  var grassTex = canvasTex(64, 64, function (g) {
    g.fillStyle = '#4e7d38'; g.fillRect(0, 0, 64, 64);
    for (var i = 0; i < 700; i++) {
      g.fillStyle = Math.random() < 0.5 ? 'rgba(30,70,25,0.25)' : 'rgba(120,170,80,0.22)';
      g.fillRect(Math.random() * 64, Math.random() * 64, 1.6, 1.6);
    }
  }, 260);
  var ground = new T.Mesh(
    new T.PlaneGeometry(4200, 4200),
    new T.MeshLambertMaterial({ map: grassTex })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  var grid = new T.GridHelper(900, 36, 0x2c4a2e, 0x2c4a2e);
  grid.position.y = 0.02;
  grid.material.transparent = true; grid.material.opacity = 0.14;
  scene.add(grid);

  // helipad
  var padDirt = new T.Mesh(new T.CircleGeometry(34, 40),
    new T.MeshLambertMaterial({ color: 0x776f62 }));
  padDirt.rotation.x = -Math.PI / 2; padDirt.position.y = 0.005; padDirt.receiveShadow = true;
  scene.add(padDirt);
  var pad = new T.Mesh(new T.CircleGeometry(16, 40),
    new T.MeshLambertMaterial({ color: 0x383d40 }));
  pad.rotation.x = -Math.PI / 2; pad.position.y = 0.012; pad.receiveShadow = true;
  scene.add(pad);
  var padRing = new T.Mesh(new T.RingGeometry(16, 16.9, 48),
    new T.MeshBasicMaterial({ color: 0xe8e4d8 }));
  padRing.rotation.x = -Math.PI / 2; padRing.position.y = 0.018;
  scene.add(padRing);
  var hTex = canvasTex(128, 128, function (g) {
    g.clearRect(0, 0, 128, 128);
    g.fillStyle = '#ffd23f';
    g.fillRect(38, 30, 13, 68); g.fillRect(77, 30, 13, 68); g.fillRect(38, 56, 52, 13);
  });
  var hPlane = new T.Mesh(new T.PlaneGeometry(9, 9),
    new T.MeshBasicMaterial({ map: hTex, transparent: true }));
  hPlane.rotation.x = -Math.PI / 2; hPlane.position.y = 0.025;
  scene.add(hPlane);

  // buildings
  var bldgColors = [0x8a97a8, 0xb0a088, 0x9a8f7a, 0x7d8a9c, 0xa8a29a, 0x88a0a8];
  for (var bi = 0; bi < 13; bi++) {
    var bw = rnd(14, 30), bh = rnd(20, 68), bd = rnd(14, 30);
    var b = new T.Mesh(new T.BoxGeometry(bw, bh, bd),
      new T.MeshLambertMaterial({ color: bldgColors[bi % bldgColors.length] }));
    var ba = rnd(0, Math.PI * 2), br = rnd(150, 430);
    b.position.set(Math.cos(ba) * br, bh / 2, Math.sin(ba) * br);
    b.castShadow = true; b.receiveShadow = true;
    scene.add(b);
    var roof = new T.Mesh(new T.BoxGeometry(bw + 1.2, 1.4, bd + 1.2),
      new T.MeshLambertMaterial({ color: 0x4a4f55 }));
    roof.position.set(b.position.x, bh + 0.7, b.position.z);
    roof.castShadow = true; roof.receiveShadow = true;
    scene.add(roof);
  }

  // trees
  var treeMat = new T.MeshLambertMaterial({ color: 0x3c7a3c });
  var treeMat2 = new T.MeshLambertMaterial({ color: 0x2f6b2f });
  var trunkMat = new T.MeshLambertMaterial({ color: 0x5d4030 });
  for (var ti = 0; ti < 30; ti++) {
    var ta = rnd(0, Math.PI * 2), tr = rnd(70, 320);
    var tx = Math.cos(ta) * tr, tz = Math.sin(ta) * tr;
    var trunk = new T.Mesh(new T.CylinderGeometry(0.28, 0.4, 2.4, 7), trunkMat);
    trunk.position.set(tx, 1.2, tz); trunk.castShadow = true;
    scene.add(trunk);
    var leaf = new T.Mesh(new T.ConeGeometry(rnd(2.2, 3.4), rnd(5.5, 8), 8),
      Math.random() < 0.5 ? treeMat : treeMat2);
    leaf.position.set(tx, 4.6 + Math.random() * 1.5, tz);
    leaf.castShadow = true;
    scene.add(leaf);
  }

  // distant hills + mountains
  for (var hi = 0; hi < 5; hi++) {
    var ha = rnd(0, Math.PI * 2), hr = rnd(550, 760);
    var hill = new T.Mesh(new T.ConeGeometry(rnd(90, 160), rnd(60, 110), 7),
      new T.MeshLambertMaterial({ color: 0x557a55 }));
    hill.position.set(Math.cos(ha) * hr, 20, Math.sin(ha) * hr);
    scene.add(hill);
  }
  for (var mi = 0; mi < 9; mi++) {
    var ma = rnd(0, Math.PI * 2), mr = rnd(1150, 1600);
    var mt = new T.Mesh(new T.ConeGeometry(rnd(150, 260), rnd(180, 340), 8),
      new T.MeshLambertMaterial({ color: 0x5f7d8a }));
    mt.position.set(Math.cos(ma) * mr, 30, Math.sin(ma) * mr);
    scene.add(mt);
  }

  // clouds
  var cloudMat = new T.MeshLambertMaterial({ color: 0xffffff, emissive: 0x666666 });
  var clouds = [];
  for (var ci = 0; ci < 14; ci++) {
    var cg = new T.Group();
    for (var cj = 0; cj < 3; cj++) {
      var sph = new T.Mesh(new T.SphereGeometry(rnd(9, 16), 10, 8), cloudMat);
      sph.scale.set(1.6, 0.55, 1.2);
      sph.position.set(rnd(-14, 14), rnd(-3, 3), rnd(-9, 9));
      cg.add(sph);
    }
    cg.position.set(rnd(-900, 900), rnd(110, 200), rnd(-900, 900));
    scene.add(cg);
    clouds.push(cg);
  }

  // blob shadow under the helicopter
  var blobTex = canvasTex(128, 128, function (g) {
    var gr = g.createRadialGradient(64, 64, 6, 64, 64, 64);
    gr.addColorStop(0, 'rgba(0,0,0,0.55)');
    gr.addColorStop(0.55, 'rgba(0,0,0,0.30)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  });
  var blob = new T.Sprite(new T.SpriteMaterial({
    map: blobTex, transparent: true, depthWrite: false, fog: false
  }));
  blob.position.y = 0.08;
  scene.add(blob);

  // --------------------------------------------------------- rotor textures
  var blurTex = canvasTex(256, 256, function (g) {
    g.clearRect(0, 0, 256, 256);
    for (var i = 0; i < 30; i++) {
      var a0 = i / 30 * Math.PI * 2, a1 = (i + 0.4) / 30 * Math.PI * 2;
      g.beginPath(); g.moveTo(128, 128);
      g.arc(128, 128, 122, a0, a1); g.closePath();
      g.fillStyle = 'rgba(255,255,255,' + (0.09 + 0.05 * (i % 3)) + ')';
      g.fill();
    }
    var gr = g.createRadialGradient(128, 128, 18, 128, 128, 128);
    gr.addColorStop(0, 'rgba(255,255,255,0.10)');
    gr.addColorStop(0.72, 'rgba(255,255,255,0.5)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(128, 128, 122, 0, 7); g.fill();
  });

  // ------------------------------------------------------------ helicopter
  var heli = new T.Group();          // world root: position + heading yaw
  scene.add(heli);
  var airframe = new T.Group();      // body: pitch/roll tilt
  heli.add(airframe);

  // materials
  var bodyMat = new T.MeshPhongMaterial({ color: 0xc93a2e, shininess: 55, specular: 0x333333 });
  var bellyMat = new T.MeshPhongMaterial({ color: 0x23292e, shininess: 20 });
  var darkMat = new T.MeshPhongMaterial({ color: 0x2b3036, shininess: 30 });
  var glassMat = new T.MeshPhongMaterial({
    color: 0x9fd8ff, transparent: true, opacity: 0.38,
    shininess: 100, specular: 0xffffff, side: T.DoubleSide, depthWrite: false
  });
  var skidMat = new T.MeshPhongMaterial({ color: 0x9aa2a8, shininess: 80, specular: 0x444444 });
  var stripeMat = new T.MeshPhongMaterial({ color: 0xf2ede2, shininess: 30 });
  var bladeMat = new T.MeshPhongMaterial({ color: 0x2a3138, shininess: 40 });
  var tipMat = new T.MeshPhongMaterial({ color: 0xbf3b2a, shininess: 40 });

  // fuselage: lathe body, long axis along Z (nose at -Z)
  var prof = [
    [0.02, -3.0], [0.10, -2.55], [0.26, -2.1], [0.48, -1.45], [0.66, -0.8],
    [0.76, -0.1], [0.79, 0.7], [0.72, 1.2], [0.55, 1.5], [0.34, 1.75], [0.12, 1.9], [0.02, 2.0]
  ].map(function (p) { return new T.Vector2(p[0], p[1]); });
  var fusGeo = new T.LatheGeometry(prof, 26);
  fusGeo.rotateX(-Math.PI / 2);           // lathe axis Y -> Z
  fusGeo.scale(0.82, 0.78, 1.0);
  var fus = new T.Mesh(fusGeo, bodyMat);
  fus.castShadow = true; fus.receiveShadow = true;
  airframe.add(fus);

  // belly
  var belly = new T.Mesh(new T.SphereGeometry(0.72, 18, 12, 0, Math.PI * 2, Math.PI * 0.45, Math.PI * 0.55),
    bellyMat);
  belly.scale.set(1.25, 0.55, 1.35);
  belly.position.set(0, -0.32, 0.1);
  airframe.add(belly);

  // side stripes
  var stripe = new T.BoxGeometry(2.1, 0.34, 0.03);
  var s1 = new T.Mesh(stripe, stripeMat); s1.position.set(0.79, -0.06, -0.15); airframe.add(s1);
  var s2 = new T.Mesh(stripe, stripeMat); s2.position.set(-0.79, -0.06, -0.15); airframe.add(s2);

  // windshield (glass canopy at the front)
  var glassGeo = new T.SphereGeometry(0.62, 22, 12, 0, Math.PI * 2, 0, Math.PI * 0.55);
  glassGeo.scale(0.85, 0.55, 0.8);
  var glass = new T.Mesh(glassGeo, glassMat);
  glass.position.set(0, 0.42, -0.95);
  airframe.add(glass);
  // glass frame strips
  var f1 = new T.Mesh(new T.BoxGeometry(1.05, 0.06, 0.07), darkMat);
  f1.position.set(0, 0.68, -0.95); airframe.add(f1);
  var f2 = new T.Mesh(new T.BoxGeometry(0.06, 0.4, 0.07), darkMat);
  f2.position.set(0.42, 0.44, -0.95); airframe.add(f2);
  var f3 = f2.clone(); f3.position.x = -0.42; airframe.add(f3);
  // side windows
  var sideWin = new T.Mesh(new T.PlaneGeometry(0.62, 0.34), glassMat);
  sideWin.position.set(0.57, 0.14, -0.55); sideWin.rotation.y = Math.PI / 2; airframe.add(sideWin);
  var sideWin2 = sideWin.clone(); sideWin2.position.x = -0.57; airframe.add(sideWin2);

  // instrument panel (canvas texture, redrawn every frame)
  var panelCv = document.createElement('canvas'); panelCv.width = 320; panelCv.height = 180;
  var panelCtx = panelCv.getContext('2d');
  var panelTex = new T.CanvasTexture(panelCv);
  var panel = new T.Mesh(new T.PlaneGeometry(0.92, 0.52),
    new T.MeshBasicMaterial({ map: panelTex }));
  panel.position.set(0, 0.12, -1.12);
  airframe.add(panel);
  var panelBox = new T.Mesh(new T.BoxGeometry(1.0, 0.6, 0.08), darkMat);
  panelBox.position.set(0, 0.12, -1.18);
  airframe.add(panelBox);
  var cabinLight = new T.PointLight(0x9fd4ff, 0.45, 8);
  cabinLight.position.set(0, 0.35, -0.8);
  airframe.add(cabinLight);

  // tail boom + fins + tail skid
  var boom = new T.Mesh(new T.CylinderGeometry(0.17, 0.08, 2.2, 12), bodyMat);
  boom.rotation.x = Math.PI / 2;
  boom.position.set(0, 0.42, 2.5);
  boom.castShadow = true;
  airframe.add(boom);
  var fin = new T.Mesh(new T.BoxGeometry(0.07, 1.0, 0.62), bodyMat);
  fin.position.set(0, 0.78, 3.6);
  fin.castShadow = true;
  airframe.add(fin);
  var stab = new T.Mesh(new T.BoxGeometry(0.85, 0.05, 0.4), bodyMat);
  stab.position.set(0, 0.46, 3.1);
  stab.castShadow = true;
  airframe.add(stab);
  var tailSkid = new T.Mesh(new T.CylinderGeometry(0.04, 0.04, 0.42, 8), darkMat);
  tailSkid.position.set(0, -0.42, 3.2);
  airframe.add(tailSkid);

  // skids
  var skidGeo = new T.CylinderGeometry(0.055, 0.055, 2.5, 10);
  skidGeo.rotateZ(Math.PI / 2);
  var skidL = new T.Mesh(skidGeo, skidMat); skidL.position.set(-0.62, -0.95, 0.15); airframe.add(skidL);
  var skidR = new T.Mesh(skidGeo, skidMat); skidR.position.set(0.62, -0.95, 0.15); airframe.add(skidR);
  skidL.castShadow = skidR.castShadow = true;
  [ [-0.85, -1], [1.15, -1], [-0.85, 1], [1.15, 1] ].forEach(function (s) {
    airframe.add(strut(new T.Vector3(0, -0.55, s[0]),
      new T.Vector3(s[1] * 0.62, -0.95, s[0]), 0.03, darkMat));
  });

  // main rotor: mast -> tilt group (cyclic disc tilt) -> spin group
  var mast = new T.Mesh(new T.CylinderGeometry(0.06, 0.06, 0.55, 10), darkMat);
  mast.position.set(0, 0.92, 0);
  airframe.add(mast);
  var rotorTilt = new T.Group();
  rotorTilt.position.set(0, 1.2, 0);
  airframe.add(rotorTilt);
  var rotorSpin = new T.Group();
  rotorTilt.add(rotorSpin);
  var hub = new T.Mesh(new T.CylinderGeometry(0.1, 0.1, 0.16, 10), darkMat);
  hub.position.y = 0.03; rotorSpin.add(hub);
  var hubCap = new T.Mesh(new T.ConeGeometry(0.1, 0.14, 10), tipMat);
  hubCap.position.y = 0.18; rotorSpin.add(hubCap);
  var blades = [];
  for (var bl = 0; bl < 4; bl++) {
    var bg = new T.Group();
    bg.rotation.y = bl * Math.PI / 2;
    var blade = new T.Mesh(new T.BoxGeometry(4.4, 0.035, 0.42), bladeMat);
    blade.position.x = 2.2;
    bg.add(blade);
    var tip = new T.Mesh(new T.BoxGeometry(0.5, 0.04, 0.42), tipMat);
    tip.position.x = 4.3;
    bg.add(tip);
    rotorSpin.add(bg);
    blades.push(bg);
  }
  var blurMat = new T.MeshBasicMaterial({
    map: blurTex, transparent: true, opacity: 0, side: T.DoubleSide, depthWrite: false, fog: false
  });
  var blurTop = new T.Mesh(new T.CircleGeometry(4.65, 48), blurMat);
  blurTop.position.y = 0.05; rotorSpin.add(blurTop);
  var blurBot = new T.Mesh(new T.CircleGeometry(4.65, 48), blurMat);
  blurBot.position.y = -0.04; rotorSpin.add(blurBot);

  // tail rotor: spins about local X at the tail
  var tailSpin = new T.Group();
  tailSpin.position.set(0.1, 0.82, 3.62);
  airframe.add(tailSpin);
  var tHub = new T.Mesh(new T.CylinderGeometry(0.05, 0.05, 0.12, 8), darkMat);
  tHub.rotation.z = Math.PI / 2; tailSpin.add(tHub);
  var tBladeMat = new T.MeshPhongMaterial({ color: 0x39414a, shininess: 30 });
  for (var tb = -1; tb <= 1; tb += 2) {
    var tbMesh = new T.Mesh(new T.BoxGeometry(0.09, 0.55, 0.15), tBladeMat);
    tbMesh.position.y = tb * 0.34;
    tailSpin.add(tbMesh);
  }
  var tailBlurMat = new T.MeshBasicMaterial({
    map: blurTex, transparent: true, opacity: 0.75, side: T.DoubleSide, depthWrite: false, fog: false
  });
  var tailBlur = new T.Mesh(new T.CircleGeometry(0.6, 24), tailBlurMat);
  tailBlur.rotation.y = Math.PI / 2;
  tailBlur.position.x = 0.04;
  tailSpin.add(tailBlur);

  // tail beacon (pulsing)
  var beaconMat = new T.MeshBasicMaterial({ color: 0xff3020 });
  var beacon = new T.Mesh(new T.SphereGeometry(0.07, 10, 8), beaconMat);
  beacon.position.set(0, 1.45, 3.42);
  airframe.add(beacon);

  // ------------------------------------------------------------- simulation
  var G = 9.81;
  var MAX_RPM = 420;
  var SKID_H = 1.05;              // heli center height when resting on skids
  var p = {                       // physics state
    x: 0, y: 15, z: 0,
    vx: 0, vy: 0, vz: 0,
    heading: 0,
    throttle: 0.62,               // Space-hold target; starts in a gentle hover
    collective: 0.50,
    rpm: 60,
    pitchV: 0, rollV: 0, bank: 0,
    onGround: false
  };

  var pressed = {};
  function keyDown(e) {
    if (e.code === 'Space' || e.code.indexOf('Arrow') === 0) e.preventDefault();
    pressed[e.code] = true;
  }
  function keyUp(e) { pressed[e.code] = false; }
  window.addEventListener('keydown', keyDown);
  window.addEventListener('keyup', keyUp);
  window.addEventListener('blur', function () { pressed = {}; });

  // camera orbit (mouse drag + wheel)
  var camTheta = Math.PI * 0.72, camPhi = 0.48, camDist = 19;
  var dragging = false, lx = 0, ly = 0;
  var cvEl = renderer.domElement;
  cvEl.addEventListener('pointerdown', function (e) {
    dragging = true; lx = e.clientX; ly = e.clientY;
    cvEl.setPointerCapture(e.pointerId);
  });
  cvEl.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    camTheta -= (e.clientX - lx) * 0.006;
    camPhi = clamp(camPhi + (e.clientY - ly) * 0.006, 0.12, 1.45);
    lx = e.clientX; ly = e.clientY;
  });
  cvEl.addEventListener('pointerup', function () { dragging = false; });
  cvEl.addEventListener('wheel', function (e) {
    e.preventDefault();
    camDist = clamp(camDist * Math.exp(e.deltaY * 0.0012), 7, 90);
  }, { passive: false });

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // panel dials
  function drawPanel(spdKmh, alt, rpm, hdgDeg) {
    var g = panelCtx;
    g.fillStyle = '#0b1113'; g.fillRect(0, 0, 320, 180);
    g.strokeStyle = '#2a3a40'; g.lineWidth = 2; g.strokeRect(2, 2, 316, 176);
    g.fillStyle = '#12343c'; g.fillRect(4, 152, 312, 22);
    g.fillStyle = '#7fd8a8'; g.font = 'bold 11px monospace'; g.textAlign = 'center';
    g.fillText('ALT ' + Math.round(alt) + ' m   |   SPD ' + Math.round(spdKmh) +
      ' km/h   |   RPM ' + Math.round(rpm), 160, 167);
    function dial(x, y, r, val, max, label) {
      g.strokeStyle = '#9fb6bd'; g.lineWidth = 2;
      g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.stroke();
      g.strokeStyle = '#4d6a74'; g.lineWidth = 1;
      for (var i = 0; i < 12; i++) {
        var a = i / 12 * Math.PI * 2;
        g.beginPath();
        g.moveTo(x + Math.cos(a) * (r - 6), y + Math.sin(a) * (r - 6));
        g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
        g.stroke();
      }
      var na = -Math.PI / 2 + (val / max) * Math.PI * 2;
      g.strokeStyle = '#ffd166'; g.lineWidth = 2.5;
      g.beginPath(); g.moveTo(x, y);
      g.lineTo(x + Math.cos(na) * (r - 9), y + Math.sin(na) * (r - 9));
      g.stroke();
      g.fillStyle = '#cfe8ee'; g.font = '9px monospace';
      g.fillText(label, x, y + r + 13);
    }
    dial(60, 66, 40, clamp(spdKmh, 0, 240), 240, 'SPD');
    dial(160, 66, 40, alt % 500, 500, 'ALT');
    dial(260, 66, 40, clamp(rpm, 0, 500), 500, 'RPM');
    dial(60, 132, 36, hdgDeg, 360, 'HDG');
    dial(160, 132, 36, clamp(p.collective * 100, 0, 100), 100, 'CLT');
    dial(260, 132, 36, clamp(p.throttle * 100, 0, 100), 100, 'THR');
    panelTex.needsUpdate = true;
  }

  // HUD
  function $(id) { return document.getElementById(id); }
  var hudAlt = $('h-alt'), hudSpd = $('h-spd'), hudRpm = $('h-rpm'),
      hudThr = $('h-thr'), hudClt = $('h-clt'), hudHdg = $('h-hdg'),
      barRpm = $('b-rpm'), barThr = $('b-thr'), barClt = $('b-clt');

  var clock = new T.Clock();
  var t = 0;

  function update(dt) {
    var k = pressed;
    var pitchI = (k.KeyW ? 1 : 0) - (k.KeyS ? 1 : 0);        // W = nose down
    var rollI = (k.KeyA ? 1 : 0) - (k.KeyD ? 1 : 0);         // A = roll left
    var yawI = (k.KeyQ ? 1 : 0) - (k.KeyE ? 1 : 0);          // Q = turn left
    var cyclicX = (k.ArrowLeft ? 1 : 0) - (k.ArrowRight ? 1 : 0); // <- = left strafe

    // throttle (Space) and collective (arrows)
    p.throttle += ((k.Space ? 1 : 0) - p.throttle) * Math.min(1, dt * 2.2);
    p.collective = clamp(p.collective + ((k.ArrowUp ? 1 : 0) - (k.ArrowDown ? 1 : 0)) * dt * 0.45, 0.05, 1);

    // main rotor rpm: spools toward throttle target
    var rpmTarget = MAX_RPM * (0.18 + 0.82 * p.throttle);
    p.rpm += (rpmTarget - p.rpm) * Math.min(1, dt * 2.6);
    var rr = p.rpm / MAX_RPM;

    // lift vs gravity
    var lift = 35 * rr * rr * (0.2 + 0.8 * p.collective);
    var ay = lift - G - (Math.abs(p.pitchV) + Math.abs(p.rollV)) * 2.5;

    // cyclic tilt targets (airframe) + turn banking
    var pitchT = -pitchI * 0.35;
    var rollT = rollI * 0.42;
    var bankT = yawI * 0.5;
    p.pitchV += (pitchT - p.pitchV) * Math.min(1, dt * 4);
    p.rollV += (rollT - p.rollV) * Math.min(1, dt * 4);
    p.bank += (bankT - p.bank) * Math.min(1, dt * 3.2);

    // heading: yaw input + tail-rotor torque compensation (drift when collective low)
    var yawRate = yawI * 1.35 * (0.35 + 0.65 * rr);
    var torqueDrift = -0.06 * rr * rr * (1 - p.collective) * (1 - Math.abs(yawI));
    p.heading += (yawRate + torqueDrift) * dt;

    // horizontal acceleration in world frame (body-forward = -Z at heading 0)
    var fwdX = -Math.sin(p.heading), fwdZ = -Math.cos(p.heading);
    var leftX = -Math.cos(p.heading), leftZ = Math.sin(p.heading);
    var fwdAcc = -Math.sin(p.pitchV) * 16;         // nose down -> accelerate forward
    var latAcc = p.rollV * 8 + cyclicX * 8;        // roll + cyclic strafe
    var ax = fwdX * fwdAcc + leftX * latAcc;
    var az = fwdZ * fwdAcc + leftZ * latAcc;

    p.vx += ax * dt; p.vz += az * dt; p.vy += ay * dt;
    // drag
    var hDrag = Math.exp(-dt * 0.28), vDrag = Math.exp(-dt * 0.15);
    p.vx *= hDrag; p.vz *= hDrag; p.vy *= vDrag;
    p.vy = Math.max(p.vy, -14);   // cap sink rate (arcade descent)
    var sp = Math.hypot(p.vx, p.vz);
    if (sp > 70) { p.vx *= 70 / sp; p.vz *= 70 / sp; }

    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;

    // ground
    p.onGround = p.y <= SKID_H;
    if (p.onGround) {
      p.y = SKID_H;
      if (p.vy < -3) { p.vy = -p.vy * 0.25; }   // soft bounce
      else p.vy = 0;
      p.vx *= Math.exp(-dt * 3); p.vz *= Math.exp(-dt * 3);
    }

    // ---- visuals ----
    // hover bob when nearly level-flight
    var bob = Math.sin(t * 1.9) * 0.07 * clamp(1 - Math.abs(p.vy), 0, 1) * (p.onGround ? 0 : 1);
    heli.position.set(p.x, p.y + bob, p.z);
    heli.rotation.y = p.heading;
    airframe.rotation.x = p.pitchV;
    airframe.rotation.z = p.rollV + p.bank;

    // rotor spin + blur crossfade + cyclic disc tilt
    rotorSpin.rotation.y += rr * MAX_RPM * (Math.PI * 2 / 60) * dt;
    rotorTilt.rotation.x = -p.pitchV * 0.5;
    rotorTilt.rotation.z = -p.rollV * 0.5;
    var blurTgt = clamp((rr - 0.25) / 0.5, 0, 1) * 0.8;
    blurMat.opacity = lerp(blurMat.opacity, blurTgt, Math.min(1, dt * 8));
    var showBlades = rr < 0.72;
    for (var i = 0; i < 4; i++) blades[i].visible = showBlades;

    // tail rotor: counteracts main-rotor torque; extra authority during yaw
    var tailRpm = 1400 + 2400 * rr + Math.abs(yawI) * 1800;
    tailSpin.rotation.x -= tailRpm * (Math.PI * 2 / 60) * dt;
    tailBlurMat.opacity = 0.5 + 0.35 * clamp(rr * 1.4, 0, 1);
    var tailBladesVisible = rr < 0.55;
    for (var j = 0; j < tailSpin.children.length; j++) {
      var ch = tailSpin.children[j];
      if (ch !== tHub && ch !== tailBlur) ch.visible = tailBladesVisible;
    }

    // beacon pulse
    var pulse = 0.5 + 0.5 * Math.sin(t * 6);
    beaconMat.color.setRGB(1, 0.1 + 0.5 * pulse, 0.1 + 0.5 * pulse);

    // blob shadow follows (ground level)
    var alt = Math.max(0, p.y - SKID_H);
    var blobS = 17 + alt * 0.35;
    blob.scale.set(blobS, blobS, 1);
    blob.material.opacity = clamp(0.5 - alt * 0.0035, 0.04, 0.5);
    blob.position.set(p.x, 0.08, p.z);

    // sun shadow camera follows the helicopter
    sun.position.set(p.x + 180, 300, p.z + 120);
    sun.target.position.set(p.x, 0, p.z);

    // clouds drift
    for (var ci = 0; ci < clouds.length; ci++) {
      clouds[ci].position.x += 1.6 * dt;
      if (clouds[ci].position.x > 1100) clouds[ci].position.x = -1100;
    }

    // camera: follow + mouse-orbit, look slightly ahead of motion
    var cx = p.x + camDist * Math.sin(camPhi) * Math.sin(camTheta);
    var cy = p.y + bob + camDist * Math.cos(camPhi);
    var cz = p.z + camDist * Math.sin(camPhi) * Math.cos(camTheta);
    camera.position.set(cx, cy, cz);
    camera.lookAt(p.x + p.vx * 0.45, p.y + p.vy * 0.12, p.z + p.vz * 0.45);

    // HUD
    hudAlt.textContent = Math.round(alt) + ' m';
    hudSpd.textContent = Math.round(sp * 3.6) + ' km/h';
    hudRpm.textContent = Math.round(p.rpm);
    hudThr.textContent = Math.round(p.throttle * 100) + '%';
    hudClt.textContent = Math.round(p.collective * 100) + '%';
    hudHdg.textContent = Math.round((((p.heading * 180 / Math.PI) % 360) + 360) % 360) + '\u00B0';
    barRpm.style.width = (rr * 100) + '%';
    barThr.style.width = (p.throttle * 100) + '%';
    barClt.style.width = (p.collective * 100) + '%';

    drawPanel(sp * 3.6, alt, p.rpm, (((p.heading * 180 / Math.PI) % 360) + 360) % 360);

    renderer.render(scene, camera);
  }

  function frame() {
    requestAnimationFrame(frame);
    var dt = Math.min(clock.getDelta(), 0.1);
    t += dt;
    try { update(dt); } catch (e) { fail(e.stack || e.message); }
  }
  frame();

})();
</script>
</body>
</html>
