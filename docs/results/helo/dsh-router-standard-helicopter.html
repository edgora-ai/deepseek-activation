<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helicopter Simulator — Three.js</title>
<link rel="preconnect" href="https://unpkg.com">
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0b0f14; }
  body { font-family:"SF Mono","Cascadia Mono",Consolas,Menlo,monospace; }
  #scene { position:fixed; inset:0; cursor:grab; }
  #scene.dragging { cursor:grabbing; }
  #hud { position:fixed; inset:0; pointer-events:none; z-index:5; color:#bfe9ff; }
  .panel {
    position:absolute; background:rgba(6,16,24,.55);
    border:1px solid rgba(110,210,255,.35); border-radius:6px;
    padding:8px 12px; font-size:12px; line-height:1.55;
    text-shadow:0 1px 2px rgba(0,0,0,.8);
  }
  .panel b { font-size:20px; color:#eaffff; display:inline-block; min-width:64px; }
  .lbl { color:rgba(140,220,255,.85); letter-spacing:1px; font-size:10px; }
  #p-alt { left:16px; top:14px; }
  #p-spd { left:16px; top:110px; }
  #p-atti { right:16px; top:14px; text-align:center; min-width:132px; }
  #ai { display:block; margin:5px auto 2px; border-radius:50%;
        background:rgba(6,16,24,.55); box-shadow:0 0 0 1px rgba(110,210,255,.35); }
  #p-rpm { right:16px; top:210px; }
  #p-thr { right:16px; bottom:14px; }
  #p-help { left:16px; bottom:14px; font-size:11px; line-height:1.7; color:#bfe9ff; }
  #p-help .key { color:#ffe9a8; }
  #cross { position:absolute; left:50%; top:50%; width:14px; height:14px;
           margin:-7px 0 0 -7px; border:1.5px solid rgba(255,255,255,.4); border-radius:50%; }
  #cross::before, #cross::after { content:""; position:absolute; background:rgba(255,255,255,.4); }
  #cross::before { left:6px; top:-4px; width:1.5px; height:22px; }
  #cross::after { top:6px; left:-4px; height:1.5px; width:22px; }
  .bar { width:140px; height:10px; border:1px solid rgba(110,210,255,.4);
         border-radius:3px; margin-top:2px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0%;
           background:linear-gradient(90deg,#2fd06a,#c8e84a); }
  #bar-rpm i { background:linear-gradient(90deg,#2f8fd0,#4ad0e8); }
  #err { position:fixed; inset:0; z-index:99; background:rgba(20,0,0,.88); color:#ff7b72;
         display:none; align-items:center; justify-content:center; font-size:15px;
         text-align:center; padding:40px; box-sizing:border-box; }
</style>
</head>
<body>
<div id="scene"></div>
<div id="hud">
  <div class="panel" id="p-alt">
    <div class="lbl">ALTITUDE</div>
    <b id="v-alt">0.0</b> m
    <div class="lbl" style="margin-top:4px">CLIMB <b style="font-size:12px;min-width:0" id="v-vs">0.0</b> m/s</div>
  </div>
  <div class="panel" id="p-spd">
    <div class="lbl">SPEED</div>
    <b id="v-spd">0</b> km/h
    <div class="lbl" style="margin-top:4px">PITCH <b style="font-size:12px;min-width:0" id="v-pitch">0.0</b>&deg;
      &nbsp; ROLL <b style="font-size:12px;min-width:0" id="v-roll">0.0</b>&deg;</div>
  </div>
  <div class="panel" id="p-atti">
    <div class="lbl">ATTITUDE</div>
    <canvas id="ai" width="132" height="132"></canvas>
  </div>
  <div class="panel" id="p-rpm">
    <div class="lbl">MAIN ROTOR</div>
    <b id="v-rpm">0</b> RPM
    <div class="bar" id="bar-rpm"><i id="i-rpm"></i></div>
    <div class="lbl" style="margin-top:7px">TAIL ROTOR</div>
    <b id="v-rpm2">0</b> RPM
  </div>
  <div class="panel" id="p-thr">
    <div class="lbl">THROTTLE / COLLECTIVE</div>
    <b id="v-thr">55</b> %
    <div class="bar" id="bar-thr"><i id="i-thr"></i></div>
  </div>
  <div id="cross"></div>
  <div class="panel" id="p-help">
    <div><span class="key">W/S</span> pitch &nbsp; <span class="key">A/D</span> roll &nbsp; <span class="key">Q/E</span> yaw</div>
    <div><span class="key">SPACE</span>/<span class="key">&uarr;</span> collective up &nbsp; <span class="key">&darr;</span> down &nbsp; <span class="key">&larr;/&rarr;</span> cyclic (roll)</div>
    <div><span class="key">R</span> reset &nbsp;&nbsp; <span class="key">drag</span> orbit view &nbsp; <span class="key">scroll</span> zoom</div>
  </div>
</div>
<div id="err"><div><b>Helicopter failed to start</b><br><br><span id="err-msg"></span></div></div>

<script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
<script>window.THREE || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');</script>
<script>
(function () {
  'use strict';

  var errEl = document.getElementById('err');
  var errMsg = document.getElementById('err-msg');
  function showErr(msg) {
    errMsg.textContent = msg || 'unknown error';
    errEl.style.display = 'flex';
    document.body.dataset.health = 'err';
  }
  window.addEventListener('error', function (e) { showErr(e.message || String(e)); });
  if (typeof THREE === 'undefined') {
    showErr('Three.js failed to load from CDN — check network access.');
    return;
  }

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  /* ------------------------------------------------------------------ */
  /* Renderer / scene                                                    */
  /* ------------------------------------------------------------------ */
  var sceneEl = document.getElementById('scene');
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9fc6e6);
  scene.fog = new THREE.Fog(0xa8cfe8, 260, 750);

  var camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2000);

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true });
  } catch (e) {
    showErr('WebGL not available: ' + e.message);
    return;
  }
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  sceneEl.appendChild(renderer.domElement);

  /* Lights */
  var hemi = new THREE.HemisphereLight(0xcfe2ff, 0x4c5b41, 0.9);
  var sun = new THREE.DirectionalLight(0xfff1d6, 1.5);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  var sunCam = sun.shadow.camera;
  sunCam.left = -90; sunCam.right = 90; sunCam.top = 90; sunCam.bottom = -90;
  sunCam.near = 5; sunCam.far = 260;
  sun.shadow.bias = -0.0005;
  scene.add(hemi, sun, sun.target);

  /* Terrain */
  var ground = new THREE.Mesh(
    new THREE.PlaneGeometry(900, 900),
    new THREE.MeshStandardMaterial({ color: 0x6f9a55, roughness: 1 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  function makePadTexture() {
    var c = document.createElement('canvas');
    c.width = c.height = 512;
    var g = c.getContext('2d');
    g.fillStyle = '#39443a'; g.fillRect(0, 0, 512, 512);
    g.fillStyle = '#2c322c';
    g.beginPath(); g.arc(256, 256, 242, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#e8e4d0'; g.lineWidth = 10;
    g.beginPath(); g.arc(256, 256, 226, 0, Math.PI * 2); g.stroke();
    g.lineWidth = 8;
    g.beginPath(); g.arc(256, 256, 198, 0, Math.PI * 2); g.stroke();
    g.fillStyle = '#e8e4d0';
    g.font = 'bold 200px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('H', 256, 264);
    var tex = new THREE.CanvasTexture(c);
    tex.anisotropy = 4;
    return tex;
  }
  var pad = new THREE.Mesh(
    new THREE.PlaneGeometry(26, 26),
    new THREE.MeshStandardMaterial({ map: makePadTexture(), roughness: 0.92 })
  );
  pad.rotation.x = -Math.PI / 2;
  pad.position.y = 0.02;
  pad.receiveShadow = true;
  scene.add(pad);

  function addBox(w, h, d, x, y, z, color) {
    var m = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      new THREE.MeshStandardMaterial({ color: color, roughness: 0.85 })
    );
    m.position.set(x, y, z);
    m.castShadow = m.receiveShadow = true;
    scene.add(m);
    return m;
  }
  addBox(10, 18, 10, -42, 9, -32, 0x8d929a);
  addBox(14, 26, 14, 46, 13, -22, 0xa0a6ae);
  addBox(8, 12, 8, -58, 6, 38, 0x7f858d);
  addBox(4, 6, 4, 30, 3, -14, 0x9aa880);

  function addSilo(r, h, x, z, color) {
    var m = new THREE.Mesh(
      new THREE.CylinderGeometry(r, r, h, 20),
      new THREE.MeshStandardMaterial({ color: color, roughness: 0.6, metalness: 0.25 })
    );
    m.position.set(x, h / 2, z);
    m.castShadow = m.receiveShadow = true;
    scene.add(m);
  }
  addSilo(4, 14, 38, 32, 0x9aa2aa);

  function addTree(x, z, s) {
    var trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.18 * s, 0.24 * s, 1.1 * s, 8),
      new THREE.MeshStandardMaterial({ color: 0x6b4a2c, roughness: 1 })
    );
    trunk.position.set(x, 0.55 * s, z);
    var crown = new THREE.Mesh(
      new THREE.ConeGeometry(1.25 * s, 3.2 * s, 9),
      new THREE.MeshStandardMaterial({ color: 0x3f7a3a, roughness: 0.95 })
    );
    crown.position.set(x, 2.8 * s, z);
    trunk.castShadow = trunk.receiveShadow = true;
    crown.castShadow = crown.receiveShadow = true;
    scene.add(trunk, crown);
  }
  addTree(12, 8, 1); addTree(-14, 10, 1.2); addTree(20, -30, 1);
  addTree(-26, -6, 0.9); addTree(8, -40, 1.1); addTree(-8, 44, 0.9);

  function addHill(x, z, r, h) {
    var m = new THREE.Mesh(
      new THREE.SphereGeometry(r, 22, 12),
      new THREE.MeshStandardMaterial({ color: 0x5d8a48, roughness: 1 })
    );
    m.position.set(x, -r * 0.9 + h, z);
    m.scale.y = h / r;
    m.receiveShadow = true;
    scene.add(m);
  }
  addHill(-120, -95, 45, 11);
  addHill(115, -120, 52, 13);
  addHill(-140, 110, 40, 9);
  addHill(130, 90, 47, 12);

  /* ------------------------------------------------------------------ */
  /* Helicopter model                                                    */
  /* ------------------------------------------------------------------ */
  var matRed   = new THREE.MeshStandardMaterial({ color: 0xb0202f, roughness: 0.38, metalness: 0.15 });
  var matWhite = new THREE.MeshStandardMaterial({ color: 0xf2efdf, roughness: 0.5, metalness: 0.08 });
  var matDark  = new THREE.MeshStandardMaterial({ color: 0x262b31, roughness: 0.62, metalness: 0.3 });
  var matBlack = new THREE.MeshStandardMaterial({ color: 0x15181c, roughness: 0.7, metalness: 0.2 });
  var matBlade = new THREE.MeshStandardMaterial({ color: 0x2e333b, roughness: 0.5, metalness: 0.35 });
  var matGlass = new THREE.MeshPhongMaterial({
    color: 0xbfe8ff, transparent: true, opacity: 0.3, shininess: 110,
    side: THREE.DoubleSide, depthWrite: false
  });
  var blurMat = new THREE.MeshBasicMaterial({
    color: 0xcfd6de, transparent: true, opacity: 0, depthWrite: false,
    side: THREE.DoubleSide, renderOrder: 3
  });

  function mesh(geo, mat, x, y, z) {
    var m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    m.castShadow = true;
    return m;
  }

  var heli = new THREE.Group();
  var body = new THREE.Group();
  heli.add(body);

  /* --- fuselage --- */
  var pod = mesh(new THREE.SphereGeometry(1.15, 26, 18), matRed, 0, 1.35, -0.35);
  pod.scale.set(1, 0.82, 1.35);
  body.add(pod);

  var nose = mesh(new THREE.SphereGeometry(0.55, 22, 14), matRed, 0, 1.28, -1.6);
  nose.scale.set(0.8, 0.68, 0.95);
  body.add(nose);

  var boom = mesh(new THREE.BoxGeometry(0.3, 0.3, 2.7), matWhite, 0, 1.6, 2.35);
  body.add(boom);

  var boomTaper = mesh(new THREE.BoxGeometry(0.22, 0.22, 1.0), matWhite, 0, 1.62, 3.24);
  body.add(boomTaper);

  var cowl = mesh(new THREE.CylinderGeometry(0.34, 0.3, 0.4, 14), matRed, 0, 2.06, 0.15);
  body.add(cowl);

  var fin = mesh(new THREE.BoxGeometry(0.07, 1.1, 0.6), matRed, 0, 2.15, 3.55);
  body.add(fin);
  var finTip = mesh(new THREE.BoxGeometry(0.075, 0.2, 0.62), matWhite, 0, 2.76, 3.55);
  body.add(finTip);

  var hStab = mesh(new THREE.BoxGeometry(0.85, 0.06, 0.35), matWhite, 0, 1.78, 3.2);
  body.add(hStab);

  var mast = mesh(new THREE.CylinderGeometry(0.07, 0.06, 0.5, 10), matDark, 0, 2.37, -0.35);
  body.add(mast);
  var hub = mesh(new THREE.CylinderGeometry(0.16, 0.18, 0.07, 14), matDark, 0, 2.63, -0.35);
  body.add(hub);

  /* --- cockpit glass, windows, seats, panel --- */
  var canopy = mesh(new THREE.SphereGeometry(0.95, 24, 14, 0, Math.PI * 2, 0, Math.PI * 0.64),
    matGlass, 0, 1.5, -1.15);
  canopy.scale.set(1, 0.8, 1.2);
  canopy.castShadow = false;
  body.add(canopy);

  var winR = mesh(new THREE.PlaneGeometry(0.72, 0.5), matGlass, 0.98, 1.58, -0.7);
  winR.rotation.y = Math.PI / 2; winR.castShadow = false;
  body.add(winR);
  var winL = mesh(new THREE.PlaneGeometry(0.72, 0.5), matGlass, -0.98, 1.58, -0.7);
  winL.rotation.y = -Math.PI / 2; winL.castShadow = false;
  body.add(winL);

  var seatR = mesh(new THREE.BoxGeometry(0.34, 0.5, 0.34), matBlack, 0.34, 1.02, -1.0);
  var seatL = mesh(new THREE.BoxGeometry(0.34, 0.5, 0.34), matBlack, -0.34, 1.02, -1.0);
  body.add(seatR, seatL);

  var cyclic = mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.34, 8), matDark, 0, 1.36, -1.02);
  cyclic.rotation.x = 0.45;
  body.add(cyclic);

  var panelMesh = mesh(new THREE.BoxGeometry(0.62, 0.14, 0.04), matBlack, 0, 1.5, -0.86);
  panelMesh.rotation.x = 0.3;
  body.add(panelMesh);

  function makeGauge(x) {
    var g = new THREE.Group();
    g.position.set(x, 1.5, -0.835);
    g.rotation.x = 0.3;
    var face = new THREE.Mesh(
      new THREE.CircleGeometry(0.055, 20),
      new THREE.MeshBasicMaterial({ color: 0x0e1419 })
    );
    var rim = new THREE.Mesh(
      new THREE.RingGeometry(0.051, 0.058, 24),
      new THREE.MeshBasicMaterial({ color: 0x4a5560 })
    );
    var needle = new THREE.Mesh(
      new THREE.BoxGeometry(0.012, 0.045, 0.004),
      new THREE.MeshStandardMaterial({ color: 0xff5249, emissive: 0x66110a })
    );
    needle.position.y = 0.02;
    var cap = new THREE.Mesh(
      new THREE.SphereGeometry(0.009, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0x8899aa })
    );
    g.add(face, rim, needle, cap);
    body.add(g);
    return g;
  }
  var gaugeRpm = makeGauge(0.17);
  var gaugeThr = makeGauge(-0.17);

  var beaconMat = new THREE.MeshStandardMaterial({
    color: 0x280000, emissive: 0xff2200, emissiveIntensity: 0.2, roughness: 0.5
  });
  var beacon = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 8), beaconMat);
  beacon.position.set(0, 2.08, 1.55);
  body.add(beacon);

  var navMat = new THREE.MeshStandardMaterial({
    color: 0xfff6e0, emissive: 0xfff0c0, emissiveIntensity: 1.2
  });
  var noseLamp = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), navMat);
  noseLamp.position.set(0, 1.2, -2.0);
  body.add(noseLamp);

  /* --- skids --- */
  function skid(sign) {
    var s = mesh(new THREE.CylinderGeometry(0.07, 0.07, 2.6, 10), matDark, sign * 0.6, 0.28, 0.1);
    s.rotation.x = Math.PI / 2;
    body.add(s);
    var tipF = mesh(new THREE.SphereGeometry(0.08, 10, 8), matDark, sign * 0.6, 0.28, -1.2);
    var tipR = mesh(new THREE.SphereGeometry(0.08, 10, 8), matDark, sign * 0.6, 0.28, 1.4);
    body.add(tipF, tipR);
    [-0.55, 0.75].forEach(function (z) {
      var strut = mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.55, 7), matDark,
        sign * 0.52, 0.62, z);
      strut.rotation.x = -0.22;
      body.add(strut);
    });
  }
  skid(1); skid(-1);
  var xBar = mesh(new THREE.BoxGeometry(0.85, 0.05, 0.05), matDark, 0, 0.43, -1.3);
  body.add(xBar);

  /* --- main rotor: pivot, 4 blades, blur disc --- */
  var rotorPivot = new THREE.Group();
  rotorPivot.position.set(0, 2.66, -0.35);
  body.add(rotorPivot);

  var bladeMeshes = [];
  for (var i = 0; i < 4; i++) {
    var bg = new THREE.Group();
    bg.rotation.y = i * Math.PI / 2;
    var blade = mesh(new THREE.BoxGeometry(0.42, 0.035, 3.9), matBlade, 0, 0, -2.35);
    blade.rotation.x = 0.05;
    var tip = mesh(new THREE.BoxGeometry(0.42, 0.036, 0.35), matWhite, 0, 0.001, -4.12);
    tip.rotation.x = 0.05;
    bg.add(blade, tip);
    rotorPivot.add(bg);
    bladeMeshes.push(bg);
  }

  var blurDisc = new THREE.Mesh(new THREE.CircleGeometry(4.35, 48), blurMat);
  blurDisc.rotation.x = -Math.PI / 2;
  blurDisc.position.y = 0.035;
  rotorPivot.add(blurDisc);

  /* --- tail rotor --- */
  var tailPivot = new THREE.Group();
  tailPivot.position.set(0.36, 2.34, 3.62);
  body.add(tailPivot);
  var tBlade1 = mesh(new THREE.BoxGeometry(0.06, 0.42, 0.05), matBlade, 0, 0.33, 0);
  var tBlade2 = mesh(new THREE.BoxGeometry(0.06, 0.42, 0.05), matBlade, 0, -0.33, 0);
  var tHub = mesh(new THREE.SphereGeometry(0.075, 10, 8), matDark, 0, 0, 0);
  tailPivot.add(tBlade1, tBlade2, tHub);

  var glassMats = [matGlass, blurMat];
  heli.traverse(function (o) {
    if (o.isMesh) o.castShadow = true;
  });
  glassMats.forEach(function (m) {
    heli.traverse(function (o) {
      if (o.isMesh && o.material === m) o.castShadow = false;
    });
  });
  scene.add(heli);

  /* ------------------------------------------------------------------ */
  /* Simulation state                                                    */
  /* ------------------------------------------------------------------ */
  var G = 9.81;
  var MAX_THRUST = 3.2 * G;
  var GROUND_Y = 0;
  var TAIL_TRIM = 0.55;
  var TAIL_AUTH = 2.3;
  var ROTOR_TOP_RPM = 500;
  var TAIL_GEAR_RATIO = 4.5;

  var state = {
    pos: new THREE.Vector3(0, 3.5, 0),
    vel: new THREE.Vector3(0, 0, 0),
    yaw: 0, pitch: 0, roll: 0,
    throttle: 0.55, rpmT: 0.55
  };
  var yawRate = 0, pitchTarget = 0, rollTarget = 0;
  var rotorAngle = 0, tailAngle = 0;

  function resetSim() {
    state.pos.set(0, 3.5, 0);
    state.vel.set(0, 0, 0);
    state.yaw = 0; state.pitch = 0; state.roll = 0;
    state.throttle = 0.55; state.rpmT = 0.55;
    yawRate = 0; pitchTarget = 0; rollTarget = 0;
    rotorAngle = 0; tailAngle = 0;
    camState.azim = 0; camState.elev = 0.22; camState.dist = 13.5;
  }

  /* ------------------------------------------------------------------ */
  /* Input                                                               */
  /* ------------------------------------------------------------------ */
  var keys = {};
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code.indexOf('Arrow') === 0) e.preventDefault();
    keys[e.code] = true;
    if (e.code === 'KeyR') resetSim();
  });
  window.addEventListener('keyup', function (e) { keys[e.code] = false; });

  var dragging = false, px = 0, py = 0;
  sceneEl.addEventListener('pointerdown', function (e) {
    dragging = true; px = e.clientX; py = e.clientY;
    sceneEl.classList.add('dragging');
    try { sceneEl.setPointerCapture(e.pointerId); } catch (err) {}
  });
  sceneEl.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    camState.azim += (e.clientX - px) * 0.005;
    camState.elev = clamp(camState.elev + (py - e.clientY) * 0.005, 0.06, 1.35);
    px = e.clientX; py = e.clientY;
  });
  function endDrag() { dragging = false; sceneEl.classList.remove('dragging'); }
  sceneEl.addEventListener('pointerup', endDrag);
  sceneEl.addEventListener('pointercancel', endDrag);
  sceneEl.addEventListener('wheel', function (e) {
    e.preventDefault();
    camState.dist = clamp(camState.dist + e.deltaY * 0.012, 4, 34);
  }, { passive: false });

  /* ------------------------------------------------------------------ */
  /* Camera                                                              */
  /* ------------------------------------------------------------------ */
  var camState = { azim: 0, elev: 0.22, dist: 13.5 };
  var camPos = new THREE.Vector3(0, 4.5, 13.5);

  /* ------------------------------------------------------------------ */
  /* HUD elements                                                        */
  /* ------------------------------------------------------------------ */
  var vAlt = document.getElementById('v-alt');
  var vVs = document.getElementById('v-vs');
  var vSpd = document.getElementById('v-spd');
  var vPitch = document.getElementById('v-pitch');
  var vRoll = document.getElementById('v-roll');
  var vRpm = document.getElementById('v-rpm');
  var vRpm2 = document.getElementById('v-rpm2');
  var vThr = document.getElementById('v-thr');
  var iThr = document.getElementById('i-thr');
  var iRpm = document.getElementById('i-rpm');
  var aiCanvas = document.getElementById('ai');

  function drawAI() {
    var c = aiCanvas, g = c.getContext('2d');
    var S = 66;
    g.clearRect(0, 0, 132, 132);
    var horizon = state.pitch * 150;
    g.save();
    g.translate(S, S);
    g.rotate(-state.roll);
    g.beginPath(); g.rect(-90, -130, 180, 260); g.clip();
    g.fillStyle = '#3f86c4'; g.fillRect(-90, -130, 180, 130 + horizon);
    g.fillStyle = '#8a6a45'; g.fillRect(-90, horizon, 180, 130 - horizon);
    g.strokeStyle = 'rgba(255,255,255,.92)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(-90, horizon); g.lineTo(90, horizon); g.stroke();
    g.restore();
    g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 1.5;
    g.beginPath();
    g.moveTo(S - 26, S); g.lineTo(S - 8, S);
    g.moveTo(S + 8, S); g.lineTo(S + 26, S);
    g.stroke();
    g.fillStyle = 'rgba(255,255,255,.85)';
    g.beginPath(); g.arc(S, S, 3, 0, Math.PI * 2); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.35)';
    g.beginPath(); g.arc(S, S, 44, 0, Math.PI * 2); g.stroke();
  }

  /* ------------------------------------------------------------------ */
  /* Main loop                                                           */
  /* ------------------------------------------------------------------ */
  var started = false;

  function update(dt, t) {
    var k = keys;
    var pitchIn = (k.KeyW ? 1 : 0) - (k.KeyS ? 1 : 0);
    var rollIn = ((k.KeyA || k.ArrowLeft) ? 1 : 0) - ((k.KeyD || k.ArrowRight) ? 1 : 0);
    var yawIn = (k.KeyQ ? 1 : 0) - (k.KeyE ? 1 : 0);
    var collIn = ((k.Space || k.ArrowUp) ? 1 : 0) - (k.ArrowDown ? 1 : 0);

    /* collective / engine spool */
    state.throttle = clamp(state.throttle + collIn * 0.3 * dt, 0, 1);
    state.rpmT += (state.throttle - state.rpmT) * Math.min(1, 1.1 * dt);
    var sag = Math.max(0, state.vel.y) * 0.02;
    var rpm = clamp(state.rpmT * (1 - sag), 0, 1);

    /* cyclic targets */
    pitchTarget = clamp(pitchTarget + pitchIn * 1.15 * dt, -0.42, 0.42);
    rollTarget = clamp(rollTarget + rollIn * 1.05 * dt, -0.5, 0.5);
    pitchTarget *= Math.exp(-0.6 * dt);
    rollTarget *= Math.exp(-0.6 * dt);

    /* torque vs tail rotor — yaw */
    var torque = rpm * 1.0;
    var tail = TAIL_TRIM - yawIn * TAIL_AUTH;
    yawRate += (torque - tail) * dt;
    yawRate *= Math.exp(-2.4 * dt);
    state.yaw += yawRate * dt;

    /* bank into the turn */
    var hSpd = Math.hypot(state.vel.x, state.vel.z);
    var bank = clamp(yawRate * 0.85 * Math.min(hSpd / 8, 1), -0.22, 0.22);
    state.pitch += (pitchTarget - state.pitch) * Math.min(1, 5 * dt);
    state.roll += (clamp(rollTarget + bank, -0.5, 0.5) - state.roll) * Math.min(1, 5 * dt);

    /* thrust */
    var bob = 1 + 0.014 * Math.sin(t * 2.4) + 0.009 * Math.sin(t * 3.7 + 1.4);
    var thrust = MAX_THRUST * state.throttle * rpm * bob;
    var h = state.pos.y - GROUND_Y;
    if (h < 5) thrust *= 1 + 0.18 * (1 - h / 5);
    var upX = -Math.sin(state.roll);
    var upY = Math.cos(state.roll) * Math.cos(state.pitch);
    var upZ = Math.cos(state.roll) * Math.sin(state.pitch);

    state.vel.x += thrust * upX * dt;
    state.vel.y += (thrust * upY - G) * dt;
    state.vel.z += thrust * upZ * dt;
    var damp = Math.exp(-0.3 * dt);
    state.vel.x *= damp; state.vel.z *= damp;
    state.vel.y *= Math.exp(-0.16 * dt);

    state.pos.x += state.vel.x * dt;
    state.pos.y += state.vel.y * dt;
    state.pos.z += state.vel.z * dt;

    if (state.pos.y < GROUND_Y) {
      state.pos.y = GROUND_Y;
      if (state.vel.y < 0) state.vel.y = 0;
    }
    state.pos.x = clamp(state.pos.x, -280, 280);
    state.pos.z = clamp(state.pos.z, -280, 280);

    /* visuals */
    heli.position.copy(state.pos);
    heli.rotation.y = state.yaw;
    body.rotation.x = state.pitch;
    body.rotation.z = state.roll;

    rotorAngle -= rpm * 39 * dt;
    rotorPivot.rotation.y = rotorAngle;
    tailAngle += rpm * 150 * dt;
    tailPivot.rotation.z = tailAngle;
    blurMat.opacity = clamp((rpm - 0.3) * 0.55, 0, 0.4);
    for (var bi = 0; bi < 4; bi++) bladeMeshes[bi].rotation.x = 0.05 + rpm * 0.06;
    gaugeRpm.rotation.z = -1.0 + rpm * 2.0;
    gaugeThr.rotation.z = -1.0 + state.throttle * 2.0;
    beaconMat.emissiveIntensity = 0.25 + 0.75 * Math.max(0, Math.sin(t * 3.5));

    /* shadow follows the aircraft */
    sun.position.set(state.pos.x + 45, state.pos.y + 80, state.pos.z + 25);
    sun.target.position.copy(state.pos);

    /* HUD */
    vAlt.textContent = (state.pos.y - GROUND_Y).toFixed(1);
    vVs.textContent = state.vel.y.toFixed(1);
    vSpd.textContent = (hSpd * 3.6).toFixed(0);
    vPitch.textContent = (state.pitch * 57.2958).toFixed(1);
    vRoll.textContent = (state.roll * 57.2958).toFixed(1);
    vRpm.textContent = Math.round(rpm * ROTOR_TOP_RPM);
    vRpm2.textContent = Math.round(rpm * ROTOR_TOP_RPM * TAIL_GEAR_RATIO);
    vThr.textContent = Math.round(state.throttle * 100);
    iThr.style.width = (state.throttle * 100).toFixed(1) + '%';
    iRpm.style.width = (rpm * 100).toFixed(1) + '%';

    /* camera */
    var ox = Math.sin(camState.azim) * Math.cos(camState.elev) * camState.dist;
    var oy = Math.sin(camState.elev) * camState.dist;
    var oz = Math.cos(camState.azim) * Math.cos(camState.elev) * camState.dist;
    var desired = new THREE.Vector3(
      state.pos.x + ox, state.pos.y + 1.6 + oy, state.pos.z + oz
    );
    camPos.lerp(desired, Math.min(1, 9 * dt));
    camPos.y = Math.max(camPos.y, 0.5);
    camera.position.copy(camPos);
    var look = new THREE.Vector3(state.pos.x, state.pos.y + 0.9, state.pos.z);
    var lead = Math.min(hSpd * 0.42, 14);
    var fx = -Math.sin(state.yaw) * lead;
    var fz = -Math.cos(state.yaw) * lead;
    look.x += fx; look.z += fz;
    camera.lookAt(look);
  }

  var clock = new THREE.Clock();
  var t = 0;

  function frame() {
    requestAnimationFrame(frame);
    var dt = Math.min(clock.getDelta(), 0.05);
    t += dt;
    update(dt, t);
    drawAI();
    renderer.render(scene, camera);
    if (!started) {
      started = true;
      document.body.dataset.health = 'ok';
      document.title = 'Helicopter Simulator — running';
      console.log('[heli] simulator started');
    }
  }

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  frame();
})();
</script>
</body>
