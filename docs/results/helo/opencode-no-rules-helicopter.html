<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Helicopter Simulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #87ceeb; font-family: 'Segoe UI', Arial, sans-serif; }
  canvas { display: block; }

  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    color: #eaf6ff; text-shadow: 0 1px 3px rgba(0,0,0,.75);
    font-size: 13px; line-height: 1.55; user-select: none; pointer-events: none;
    background: rgba(10,20,32,.45); padding: 10px 14px; border-radius: 8px;
    min-width: 200px; backdrop-filter: blur(2px);
  }
  #hud h1 { font-size: 13px; letter-spacing: 3px; color: #9fdcff; margin-bottom: 5px; }
  #hud .row { display: flex; justify-content: space-between; }
  #hud .bar { width: 170px; height: 7px; background: rgba(255,255,255,.16); border-radius: 4px; margin: 2px 0 5px; }
  #hud .bar > div { height: 100%; border-radius: 4px; background: linear-gradient(90deg,#3ddc84,#7ddc3d); }
  #hud .bar.rpm > div { background: linear-gradient(90deg,#3d8bff,#3ddc84); }
  #hud .lbl { color: #9fb8c8; }

  #controls {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
    color: rgba(255,255,255,.9); text-shadow: 0 1px 3px rgba(0,0,0,.75); font-size: 12px;
    background: rgba(10,20,32,.45); padding: 8px 16px; border-radius: 8px;
    user-select: none; pointer-events: none; white-space: nowrap;
  }
  #controls kbd { background: rgba(255,255,255,.16); padding: 1px 6px; border-radius: 4px; font-family: inherit; margin: 0 2px; }

  #message {
    position: fixed; top: 42%; left: 50%; transform: translate(-50%,-50%); z-index: 20;
    font-size: 24px; font-weight: 700; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.85);
    text-align: center; cursor: pointer; padding: 18px 34px; border-radius: 10px;
    background: rgba(10,25,40,.5); user-select: none;
  }
  #message small { display: block; margin-top: 6px; font-size: 13px; font-weight: 400; opacity: .85; }
</style>
</head>
<body>
<div id="message">Click to start<span class="pulse" id="submsg"></span><small>R = reset · drag mouse to orbit · scroll to zoom</small></div>

<div id="hud">
  <h1>HELICOPTER</h1>
  <div class="row"><span>Altitude</span><b id="alt">0.0</b></div>
  <div class="row"><span>Speed</span><b id="spd">0.0</b></div>
  <div class="row"><span>Vertical</span><b id="vs">0.0</b></div>
  <div class="row"><span>Rotor RPM</span><b id="rpm">0</b></div>
  <div class="bar rpm"><div id="rpmbar" style="width:0%"></div></div>
  <div class="row"><span>Throttle</span><b id="thr">0</b></div>
  <div class="bar"><div id="thrbar" style="width:0%"></div></div>
  <div class="row"><span>Heading</span><b id="hdg">0</b></div>
</div>

<div id="controls">
  <kbd>W</kbd><kbd>S</kbd> Pitch &nbsp;·&nbsp;
  <kbd>A</kbd><kbd>D</kbd> Roll &nbsp;·&nbsp;
  <kbd>Q</kbd><kbd>E</kbd> Yaw &nbsp;·&nbsp;
  <kbd>Space</kbd> Throttle &nbsp;·&nbsp;
  <kbd>&#8593;</kbd><kbd>&#8595;</kbd> Collective &nbsp;·&nbsp;
  <kbd>&#8592;</kbd><kbd>&#8594;</kbd> Cyclic
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const THREE = window.THREE;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* ================= Renderer / Scene ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 320, 1250);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 3000);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* lights */
const hemi = new THREE.HemisphereLight(0xcfefff, 0x6b8e5a, 0.95);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff1d6, 1.15);
sun.position.set(150, 260, 90);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -160;
sun.shadow.camera.right = 160;
sun.shadow.camera.top = 160;
sun.shadow.camera.bottom = -160;
sun.shadow.camera.near = 10;
sun.shadow.camera.far = 900;
sun.shadow.bias = -0.0008;
scene.add(sun);
scene.add(sun.target);

/* ground */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(1500, 64),
  new THREE.MeshStandardMaterial({ color: 0x6fa252, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(900, 45, 0x55843c, 0x5e9142);
grid.position.y = 0.02;
scene.add(grid);

/* helipad */
const pad = new THREE.Mesh(
  new THREE.CircleGeometry(9, 40),
  new THREE.MeshStandardMaterial({ color: 0xd8d8d8, roughness: 0.9 })
);
pad.rotation.x = -Math.PI / 2; pad.position.y = 0.05; pad.receiveShadow = true;
scene.add(pad);
const padRim = new THREE.Mesh(
  new THREE.RingGeometry(9, 9.6, 40),
  new THREE.MeshStandardMaterial({ color: 0xb23a2a, roughness: 0.8 })
);
padRim.rotation.x = -Math.PI / 2; padRim.position.y = 0.06;
scene.add(padRim);

/* scenery */
const rnd = (a, b) => a + Math.random() * (b - a);

function tree(x, z, s) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.14 * s, 0.2 * s, 1.6 * s, 6),
    new THREE.MeshStandardMaterial({ color: 0x6b4a2a, roughness: 1 })
  );
  trunk.position.y = 0.8 * s; g.add(trunk);
  const leaves = new THREE.Mesh(
    new THREE.ConeGeometry(1.4 * s, 3.2 * s, 7),
    new THREE.MeshStandardMaterial({ color: 0x2f6b3c, roughness: 1 })
  );
  leaves.position.y = 3.0 * s; g.add(leaves);
  const leaves2 = new THREE.Mesh(
    new THREE.ConeGeometry(1.0 * s, 2.2 * s, 7),
    new THREE.MeshStandardMaterial({ color: 0x3a7a48, roughness: 1 })
  );
  leaves2.position.y = 3.9 * s; g.add(leaves2);
  g.position.set(x, 0, z);
  g.rotation.y = Math.random() * Math.PI * 2;
  return g;
}
for (let i = 0; i < 90; i++) {
  const a = rnd(0, Math.PI * 2), r = rnd(25, 420);
  const x = Math.sin(a) * r, z = Math.cos(a) * r;
  if (Math.abs(x) < 15 && Math.abs(z) < 15) continue;
  scene.add(tree(x, z, rnd(0.8, 1.6)));
}

function house(x, z, s) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(4 * s, 2.6 * s, 4 * s),
    new THREE.MeshStandardMaterial({ color: 0xe8e0d0, roughness: 0.9 })
  );
  body.position.y = 1.3 * s; g.add(body);
  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(3.1 * s, 1.8 * s, 4),
    new THREE.MeshStandardMaterial({ color: 0x9c4a3a, roughness: 0.9 })
  );
  roof.position.y = 2.6 * s + 0.9 * s; roof.rotation.y = Math.PI / 4; g.add(roof);
  g.position.set(x, 0, z);
  g.rotation.y = Math.random() * Math.PI * 2;
  return g;
}
for (let i = 0; i < 16; i++) {
  const a = rnd(0, Math.PI * 2), r = rnd(140, 380);
  scene.add(house(Math.sin(a) * r, Math.cos(a) * r, rnd(1, 2.4)));
}

/* distant mountains */
for (let i = 0; i < 10; i++) {
  const a = (i / 10) * Math.PI * 2 + rnd(-0.12, 0.12), r = 900;
  const m = new THREE.Mesh(
    new THREE.ConeGeometry(rnd(120, 220), rnd(90, 170), 6),
    new THREE.MeshStandardMaterial({ color: 0x7d9b8f, roughness: 1 })
  );
  m.position.set(Math.sin(a) * r, 30, Math.cos(a) * r);
  scene.add(m);
}

/* clouds */
function cloudTex() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(128, 128, 10, 128, 128, 126);
  gr.addColorStop(0, 'rgba(255,255,255,0.95)');
  gr.addColorStop(0.45, 'rgba(255,255,255,0.55)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}
const cloudMat = new THREE.SpriteMaterial({ map: cloudTex(), transparent: true, depthWrite: false });
for (let i = 0; i < 16; i++) {
  const sp = new THREE.Sprite(cloudMat);
  const s = rnd(90, 220);
  sp.scale.set(s, s, 1);
  sp.position.set(rnd(-900, 900), rnd(110, 280), rnd(-900, 900));
  scene.add(sp);
}

/* blob ground shadow */
const blob = new THREE.Mesh(
  new THREE.CircleGeometry(3.4, 32),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.28, depthWrite: false })
);
blob.rotation.x = -Math.PI / 2;
blob.position.y = 0.09;
scene.add(blob);

/* ================= Helicopter model ================= */
const GROUND_Y = 0.1;

function buildHeli() {
  const heli = new THREE.Group();
  heli.position.set(0, GROUND_Y, 0);

  const vibrate = new THREE.Group();   /* engine-vibration jitter goes here */
  heli.add(vibrate);

  const mBody = new THREE.MeshStandardMaterial({ color: 0x2e6b4e, metalness: 0.25, roughness: 0.65 });
  const mDark = new THREE.MeshStandardMaterial({ color: 0x23303a, metalness: 0.35, roughness: 0.55 });
  const mGlass = new THREE.MeshStandardMaterial({ color: 0xbfeaff, metalness: 0.15, roughness: 0.06, transparent: true, opacity: 0.4 });
  const mMetal = new THREE.MeshStandardMaterial({ color: 0xaeb9c2, metalness: 0.8, roughness: 0.3 });
  const mDarkMetal = new THREE.MeshStandardMaterial({ color: 0x4c565f, metalness: 0.6, roughness: 0.4 });
  const mAccent = new THREE.MeshStandardMaterial({ color: 0xd6452c, roughness: 0.6 });
  const bladeMat = new THREE.MeshStandardMaterial({ color: 0x1c2024, side: THREE.DoubleSide, metalness: 0.45, roughness: 0.4, transparent: true, depthWrite: false });

  function add(mesh, cast) {
    mesh.castShadow = cast !== false;
    vibrate.add(mesh);
    return mesh;
  }

  /* fuselage */
  const fus = add(new THREE.Mesh(new THREE.BoxGeometry(1.7, 1.15, 3.6, 1, 1, 1), mBody));
  fus.position.set(0, 0.9, 0.2);

  const belly = add(new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.18, 2.6), mAccent));
  belly.position.set(0, 0.32, 0.2);

  const nose = add(new THREE.Mesh(new THREE.SphereGeometry(0.42, 20, 14), mBody));
  nose.scale.set(1, 0.92, 1.5);
  nose.position.set(0, 0.95, 2.42);

  /* tail boom */
  const boom = add(new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.2, 3.7, 10), mBody));
  boom.rotation.x = Math.PI / 2;
  boom.position.set(0, 1.15, -3.35);

  const fin = add(new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.15, 0.7), mBody));
  fin.position.set(0, 1.6, -5.1);
  const stab = add(new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.05, 0.6), mBody));
  stab.position.set(0, 1.32, -4.75);

  /* cockpit + windshield */
  const canopy = add(new THREE.Mesh(new THREE.SphereGeometry(0.74, 24, 16), mGlass));
  canopy.scale.set(1.05, 0.85, 1.35);
  canopy.position.set(0, 1.3, 1.9);

  const roof = add(new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.12, 1.7), mBody));
  roof.position.set(0, 1.62, 1.35);
  roof.rotation.x = 0.05;

  const divider = add(new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.38, 0.09), mDarkMetal));
  divider.position.set(0, 1.36, 2.42);

  /* instrument panel */
  const panel = add(new THREE.Mesh(new THREE.BoxGeometry(0.64, 0.26, 0.07), mDark));
  panel.position.set(0, 1.12, 2.12);
  panel.rotation.x = -0.4;
  const gaugeCols = [0x7dffb0, 0xffd27d, 0x7dd6ff];
  for (let i = -1; i <= 1; i++) {
    const g = add(new THREE.Mesh(new THREE.CircleGeometry(0.055, 16), new THREE.MeshBasicMaterial({ color: gaugeCols[i + 1] })), false);
    g.position.set(i * 0.16, 1.14, 2.16);
    g.rotation.x = -0.4;
  }

  const seat = add(new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.42, 0.5), mDark));
  seat.position.set(0, 0.82, 1.5);

  /* skids */
  for (let sx = -1; sx <= 1; sx += 2) {
    const rail = add(new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 3.0, 8), mMetal));
    rail.rotation.z = Math.PI / 2;
    rail.position.set(0.56 * sx, 0.15, 0.4);
    for (const sz of [0.0, 0.9]) {
      const strut = add(new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.5, 6), mMetal));
      strut.position.set(0.5 * sx, 0.4, sz);
      strut.rotation.z = -0.12 * sx;
    }
  }

  /* tail rotor (spins around local Z) */
  const tailRotor = new THREE.Group();
  tailRotor.position.set(0, 1.68, -5.42);
  vibrate.add(tailRotor);
  const hub = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 10), mDarkMetal);
  hub.castShadow = true; tailRotor.add(hub);
  const tailBlur = new THREE.Mesh(
    new THREE.CircleGeometry(0.62, 28),
    new THREE.MeshBasicMaterial({ color: 0xcfd6dc, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide })
  );
  tailBlur.renderOrder = 2;
  tailRotor.add(tailBlur);
  for (let i = 0; i < 2; i++) {
    const tb = new THREE.Group();
    const bl = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.8, 0.025), bladeMat);
    bl.position.y = 0.4; tb.add(bl);
    const tip = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.16, 0.03), mAccent);
    tip.position.y = 0.78; tb.add(tip);
    tb.rotation.z = i * Math.PI;
    tb.traverse(o => { if (o.isMesh) o.castShadow = true; });
    tailRotor.add(tb);
  }

  /* main mast + rotor */
  const mast = add(new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 0.85, 10), mDarkMetal));
  mast.position.set(0, 1.9, 0);

  const rotorGroup = new THREE.Group();
  rotorGroup.position.set(0, 2.25, 0);
  heli.add(rotorGroup);

  const hubMain = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.22, 0.18, 14), mDarkMetal);
  hubMain.position.y = 0; hubMain.castShadow = true;
  rotorGroup.add(hubMain);

  const mainBlur = new THREE.Mesh(
    new THREE.CircleGeometry(3.55, 44),
    new THREE.MeshBasicMaterial({ color: 0xd5dbe0, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide })
  );
  mainBlur.rotation.x = -Math.PI / 2;
  mainBlur.position.y = 0;
  mainBlur.renderOrder = 2;
  rotorGroup.add(mainBlur);

  for (let i = 0; i < 4; i++) {
    const bl = new THREE.Group();
    const b1 = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.022, 0.44), bladeMat);
    b1.position.x = 1.5; bl.add(b1);
    const bt = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.024, 0.46), mAccent);
    bt.position.x = 3.06; bl.add(bt);
    const bm = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.035, 0.55), mDarkMetal);
    bm.position.x = 0.55; bl.add(bm);
    bl.rotation.y = i * Math.PI / 2;
    bl.traverse(o => { if (o.isMesh) o.castShadow = true; });
    rotorGroup.add(bl);
  }

  return { heli, vibrate, rotorGroup, tailRotor, mainBlur, tailBlur, bladeMat };
}

const { heli, vibrate, rotorGroup, tailRotor, mainBlur, tailBlur, bladeMat } = buildHeli();
scene.add(heli);

/* ================= State & physics ================= */
const MAX_RPM = 420, GRAV = 9.8, THRUST_K = 48;
let throttle = 0, rpm = 0, heading = 0, pitchAngle = 0, rollAngle = 0, cyclic = 0;
let vel = new THREE.Vector3();
let started = false, crashed = false;

function reset() {
  heli.position.set(0, GROUND_Y, 0);
  heading = 0; pitchAngle = 0; rollAngle = 0;
  vel.set(0, 0, 0);
  throttle = 0; rpm = 0; cyclic = 0;
  crashed = false;
  camA = 0.25; camE = 0.4; camR = 24;
}

/* ================= Controls ================= */
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyR') { reset(); }
});
addEventListener('keyup', e => { keys[e.code] = false; });

let dragging = false, lastX = 0, lastY = 0;
let camA = 0.25, camE = 0.4, camR = 24;

renderer.domElement.addEventListener('pointerdown', e => {
  if (!started) startGame();
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  renderer.domElement.style.cursor = 'grabbing';
});
addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  camA += dx * 0.005;
  camE = clamp(camE + dy * 0.004, -0.1, 1.25);
});
addEventListener('pointerup', () => { dragging = false; renderer.domElement.style.cursor = ''; });
addEventListener('wheel', e => {
  e.preventDefault();
  camR = clamp(camR + Math.sign(e.deltaY) * 2.5, 6, 80);
}, { passive: false });
addEventListener('contextmenu', e => e.preventDefault());

const msg = document.getElementById('message');
const submsg = document.getElementById('submsg');

function startGame() {
  if (crashed) {
    reset();
    msg.textContent = 'Click to start';
    msg.style.background = '';
    submsg.textContent = '';
  }
  started = true;
  msg.style.display = 'none';
  if (rpm < 1) throttle = 0.26;
}

msg.addEventListener('click', startGame);

/* ================= HUD ================= */
const hud = {
  alt: document.getElementById('alt'),
  spd: document.getElementById('spd'),
  vs: document.getElementById('vs'),
  rpm: document.getElementById('rpm'),
  thr: document.getElementById('thr'),
  hdg: document.getElementById('hdg'),
  rpmbar: document.getElementById('rpmbar'),
  thrbar: document.getElementById('thrbar')
};

/* ================= Update loop ================= */
const clock = new THREE.Clock();
const camPos = new THREE.Vector3(0, 14, -24);
camera.position.copy(camPos);

function update(dt, t) {
  /* inputs */
  const thrUp = keys.Space || keys.ArrowUp;
  const thrDn = keys.ArrowDown;
  if (thrUp) throttle = Math.min(1, throttle + 0.5 * dt);
  if (thrDn) throttle = Math.max(0, throttle - 0.5 * dt);

  /* rotor spool (engine drives main rotor; idle decays) */
  const rpmTarget = throttle * MAX_RPM;
  rpm += (rpmTarget - rpm) * (1 - Math.exp(-2.2 * dt));
  const rpmNorm = rpm / MAX_RPM;

  const pitchIn = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
  const rollIn = (keys.KeyA ? 1 : 0) - (keys.KeyD ? 1 : 0);
  const yawIn = (keys.KeyE ? 1 : 0) - (keys.KeyQ ? 1 : 0);
  const cycT = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
  cyclic += (cycT - cyclic) * (1 - Math.exp(-4 * dt));

  /* attitude: cyclic feeds roll, turning banks the aircraft */
  const pitchTarget = pitchIn * 0.32;
  const rollTarget = rollIn * 0.45 - yawIn * 0.32 + cyclic * 0.18;
  pitchAngle += (pitchTarget - pitchAngle) * (1 - Math.exp(-5 * dt));
  rollAngle += (rollTarget - rollAngle) * (1 - Math.exp(-5 * dt));
  heading += yawIn * 1.15 * dt * (0.35 + 0.65 * rpmNorm);

  heli.rotation.order = 'YXZ';
  heli.rotation.y = heading;
  heli.rotation.x = pitchAngle;
  heli.rotation.z = rollAngle;

  /* forces: thrust along body-up, gravity down, cyclic lateral */
  const q = heli.quaternion;
  const upW = new THREE.Vector3(0, 1, 0).applyQuaternion(q);
  const rightW = new THREE.Vector3(1, 0, 0).applyQuaternion(q);
  const thrustAcc = THRUST_K * throttle * rpmNorm * rpmNorm;
  let ax = upW.x * thrustAcc, ay = upW.y * thrustAcc - GRAV, az = upW.z * thrustAcc;
  const cycAcc = cyclic * 13 * throttle;
  ax += rightW.x * cycAcc; ay += rightW.y * cycAcc; az += rightW.z * cycAcc;

  vel.x += ax * dt; vel.y += ay * dt; vel.z += az * dt;

  /* aerodynamic drag + speed cap */
  const hs = Math.hypot(vel.x, vel.z);
  const dn = Math.min(1, hs / 55);
  const drag = 0.16 + 0.9 * dn * dn;
  vel.x *= Math.exp(-drag * dt); vel.z *= Math.exp(-drag * dt);
  vel.y *= Math.exp(-0.12 * dt);
  if (hs > 58) { const k = 58 / hs; vel.x *= k; vel.z *= k; }

  heli.position.x += vel.x * dt;
  heli.position.y += vel.y * dt;
  heli.position.z += vel.z * dt;

  /* ground contact / crash */
  if (heli.position.y <= GROUND_Y) {
    if (vel.y < -7) {
      crashed = true; started = false;
      msg.textContent = 'CRASHED - click to restart';
      msg.style.background = 'rgba(140,20,10,.55)';
      submsg.textContent = '';
      msg.style.display = 'block';
    }
    heli.position.y = GROUND_Y;
    if (vel.y < 0) vel.y = 0;
  }

  /* hover bobbing */
  if (heli.position.y > GROUND_Y + 0.05) {
    const bf = clamp(1 - Math.abs(vel.y) / 4, 0, 1);
    heli.position.y += (Math.sin(t * 2.6) + 0.5 * Math.sin(t * 4.3)) * 0.035 * throttle * rpmNorm * bf;
  }

  /* rotor visuals: spin, blur, vibration */
  rotorGroup.rotation.y += rpmNorm * MAX_RPM * (Math.PI / 30) * dt;
  tailRotor.rotation.z -= rpmNorm * MAX_RPM * (Math.PI / 30) * 5 * dt; /* tail counter-rotates to kill torque */
  const blur = clamp((rpmNorm - 0.32) / 0.55, 0, 1);
  mainBlur.material.opacity = blur * 0.5;
  tailBlur.material.opacity = blur * 0.55;
  bladeMat.opacity = 1 - blur * 0.5;
  vibrate.rotation.x = Math.sin(t * 71) * 0.002 * rpmNorm;
  vibrate.rotation.z = Math.cos(t * 89) * 0.002 * rpmNorm;
}

function idleUpdate(dt) {
  /* spool down / settle when not started or crashed */
  throttle = Math.max(0, throttle - 0.3 * dt);
  rpm += (0 - rpm) * (1 - Math.exp(-2.2 * dt));
  const rpmNorm = rpm / MAX_RPM;
  rotorGroup.rotation.y += rpmNorm * MAX_RPM * (Math.PI / 30) * dt;
  tailRotor.rotation.z -= rpmNorm * MAX_RPM * (Math.PI / 30) * 5 * dt;
  const blur = clamp((rpmNorm - 0.32) / 0.55, 0, 1);
  mainBlur.material.opacity = blur * 0.5;
  tailBlur.material.opacity = blur * 0.55;
  bladeMat.opacity = 1 - blur * 0.5;
  vel.y = Math.max(0, vel.y - GRAV * dt);
  vel.x *= 0.98; vel.z *= 0.98;
  heli.position.y = Math.max(heli.position.y, GROUND_Y);
}

function followCamera(dt) {
  const camTarget = heli.position.clone().add(new THREE.Vector3(vel.x, 0, vel.z).multiplyScalar(0.25));
  camTarget.y += 0.9;
  const fwd = new THREE.Vector3(Math.sin(heading), 0, Math.cos(heading));
  const right = new THREE.Vector3(Math.cos(heading), 0, -Math.sin(heading));
  const up = new THREE.Vector3(0, 1, 0);
  const off = new THREE.Vector3()
    .addScaledVector(right, Math.sin(camA) * Math.cos(camE))
    .addScaledVector(up, Math.sin(camE))
    .addScaledVector(fwd, -Math.cos(camA) * Math.cos(camE))
    .multiplyScalar(camR);
  const want = camTarget.clone().add(off);
  camPos.lerp(want, 1 - Math.exp(-5 * dt));
  camera.position.copy(camPos);
  camera.lookAt(camTarget);
}

function updateHud() {
  hud.alt.textContent = Math.max(0, heli.position.y).toFixed(1);
  hud.spd.textContent = Math.hypot(vel.x, vel.z).toFixed(1);
  hud.vs.textContent = vel.y.toFixed(1);
  hud.rpm.textContent = Math.round(rpm);
  hud.thr.textContent = Math.round(throttle * 100);
  let h = heading * 180 / Math.PI;
  h = ((h % 360) + 360) % 360;
  hud.hdg.textContent = Math.round(h);
  hud.rpmbar.style.width = (rpm / MAX_RPM * 100) + '%';
  hud.thrbar.style.width = (throttle * 100) + '%';
}

function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (started) update(dt, t); else idleUpdate(dt);
  followCamera(dt);
  updateHud();

  /* shadow follows helicopter */
  sun.position.set(heli.position.x + 150, 260, heli.position.z + 90);
  sun.target.position.copy(heli.position);
  sun.target.updateMatrixWorld();

  /* blob shadow scales/fades with altitude */
  blob.position.set(heli.position.x, 0.08, heli.position.z);
  const altC = clamp(heli.position.y / 120, 0, 1);
  const bs = 1 + heli.position.y * 0.02;
  blob.scale.set(bs, bs, 1);
  blob.material.opacity = 0.28 * (1 - altC);

  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

loop();
</script>
</body>
