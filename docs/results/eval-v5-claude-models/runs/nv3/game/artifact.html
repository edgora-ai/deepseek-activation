<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Shooter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a1a; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    canvas { display: block; border: 2px solid #444; border-radius: 4px; box-shadow: 0 0 20px rgba(0, 200, 255, 0.3); }
    #ui { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #00c8ff; font-size: 24px; font-weight: bold; text-shadow: 0 0 10px #00c8ff, 0 0 20px #00c8ff; pointer-events: none; }
    #startScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 10, 26, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
    #startScreen h1 { font-size: 64px; color: #00c8ff; text-shadow: 0 0 20px #00c8ff, 0 0 40px #00c8ff; margin-bottom: 20px; letter-spacing: 4px; }
    #startScreen p { color: #88a; font-size: 18px; margin: 10px 0; }
    #startScreen .controls { margin-top: 30px; text-align: left; max-width: 400px; }
    #startScreen .controls div { margin: 8px 0; color: #aac; }
    #startScreen .controls kbd { background: #1a1a3a; border: 1px solid #335; padding: 4px 12px; border-radius: 4px; margin-right: 10px; min-width: 60px; display: inline-block; color: #00c8ff; }
    #startScreen button { margin-top: 40px; padding: 16px 48px; font-size: 22px; background: linear-gradient(135deg, #00c8ff, #007aff); border: none; border-radius: 8px; color: #0a0a1a; font-weight: bold; cursor: pointer; transition: transform 0.1s, box-shadow 0.1s; }
    #startScreen button:hover { transform: scale(1.05); box-shadow: 0 0 30px #00c8ff; }
    #startScreen button:active { transform: scale(0.98); }
    #gameOverScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 10, 26, 0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
    #gameOverScreen h1 { font-size: 56px; color: #ff4466; text-shadow: 0 0 20px #ff4466; margin-bottom: 20px; }
    #gameOverScreen #finalScore { font-size: 36px; color: #00c8ff; margin-bottom: 30px; }
    #gameOverScreen button { padding: 16px 48px; font-size: 22px; background: linear-gradient(135deg, #ff4466, #cc2244); border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
    #gameOverScreen button:hover { transform: scale(1.05); box-shadow: 0 0 30px #ff4466; }
  </style>
</head>
<body>
  <div id="ui">SCORE: <span id="score">0</span></div>
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <div id="startScreen">
    <h1>SPACE SHOOTER</h1>
    <p>Destroy enemy ships. Survive as long as you can.</p>
    <div class="controls">
      <div><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> — Move</div>
      <div><kbd>SPACE</kbd> — Shoot</div>
    </div>
    <button id="startBtn">START GAME</button>
  </div>
  <div id="gameOverScreen">
    <h1>GAME OVER</h1>
    <div id="finalScore">SCORE: 0</div>
    <button id="restartBtn">PLAY AGAIN</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    // Game state
    let gameState = 'start'; // start, playing, gameover
    let score = 0;
    let keys = {};
    let lastTime = 0;

    // Player
    const player = {
      x: W / 2,
      y: H - 80,
      w: 40,
      h: 40,
      speed: 5,
      shootCooldown: 0,
      color: '#00c8ff'
    };

    // Arrays
    const bullets = [];
    const enemies = [];
    const particles = [];
    const stars = [];

    // Initialize stars
    for (let i = 0; i < 100; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        speed: 0.5 + Math.random() * 1.5,
        size: 1 + Math.random() * 2,
        opacity: 0.3 + Math.random() * 0.7
      });
    }

    // Input
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space') e.preventDefault();
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Start button
    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);

    function startGame() {
      gameState = 'playing';
      score = 0;
      document.getElementById('score').textContent = '0';
      document.getElementById('startScreen').style.display = 'none';
      document.getElementById('gameOverScreen').style.display = 'none';
      player.x = W / 2;
      player.y = H - 80;
      player.shootCooldown = 0;
      bullets.length = 0;
      enemies.length = 0;
      particles.length = 0;
      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    }

    function gameLoop(time) {
      if (gameState !== 'playing') return;
      const dt = Math.min((time - lastTime) / 1000, 0.05);
      lastTime = time;

      update(dt);
      render();
      requestAnimationFrame(gameLoop);
    }

    function update(dt) {
      // Player movement
      if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > player.w / 2) player.x -= player.speed * 60 * dt;
      if ((keys['ArrowRight'] || keys['KeyD']) && player.x < W - player.w / 2) player.x += player.speed * 60 * dt;
      if ((keys['ArrowUp'] || keys['KeyW']) && player.y > player.h / 2) player.y -= player.speed * 60 * dt;
      if ((keys['ArrowDown'] || keys['KeyS']) && player.y < H - player.h / 2) player.y += player.speed * 60 * dt;

      // Shooting
      if (keys['Space']) {
        if (player.shootCooldown <= 0) {
          bullets.push({ x: player.x, y: player.y - player.h / 2, vx: 0, vy: -600, w: 4, h: 12, color: '#00ff88' });
          player.shootCooldown = 0.15;
        }
      }
      player.shootCooldown -= dt;

      // Update bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y += bullets[i].vy * dt;
        if (bullets[i].y < -bullets[i].h) bullets.splice(i, 1);
      }
      
      // Spawn enemies
      if (Math.random() < 0.02 + score * 0.00005) {
        const type = Math.random() < 0.7 ? 'normal' : 'fast';
        // Spawn enemies near player's x position for better gameplay
        const spawnRange = 150;
        const minX = Math.max(40, player.x - spawnRange);
        const maxX = Math.min(W - 40, player.x + spawnRange);
        enemies.push({
          x: minX + Math.random() * (maxX - minX),
          y: -40,
          w: 36,
          h: 36,
          vx: (Math.random() - 0.5) * (type === 'fast' ? 100 : 50),
          vy: type === 'fast' ? 180 + Math.random() * 80 : 100 + Math.random() * 60,
          hp: type === 'fast' ? 1 : 2,
          color: type === 'fast' ? '#ff4466' : '#ffaa00',
          type
        });
      }

      // Update enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.x += e.vx * dt;
        e.y += e.vy * dt;

        // Bounce off walls
        if (e.x < e.w / 2) { e.x = e.w / 2; e.vx = Math.abs(e.vx); }
        if (e.x > W - e.w / 2) { e.x = W - e.w / 2; e.vx = -Math.abs(e.vx); }

        // Game over if enemy reaches bottom
        if (e.y > H + e.h) {
          gameOver();
          return;
        }

        // Player collision
        if (rectsOverlap(player, e)) {
          gameOver();
          return;
        }

        // Bullet collision
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const hit = rectsOverlap(b, e);
          if (hit) console.log('HIT DETECTED! Bullet:', b.x.toFixed(1), b.y.toFixed(1), 'Enemy:', e.x.toFixed(1), e.y.toFixed(1));
                    if (hit) {
            e.hp--;
            createExplosion(e.x, e.y, e.color);
            bullets.splice(j, 1);
            if (e.hp <= 0) {
              score += e.type === 'fast' ? 15 : 10;
              document.getElementById('score').textContent = score;
              enemies.splice(i, 1);
            }
            break;
          }
        }
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 200 * dt; // gravity
        p.life -= dt;
        p.opacity = Math.max(0, p.life / p.maxLife);
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Update stars
      for (const s of stars) {
        s.y += s.speed * 60 * dt;
        if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
      }
    }

    function rectsOverlap(a, b) {
      const ax1 = a.x - a.w / 2, ax2 = a.x + a.w / 2;
      const ay1 = a.y - a.h / 2, ay2 = a.y + a.h / 2;
      const bx1 = b.x - b.w / 2, bx2 = b.x + b.w / 2;
      const by1 = b.y - b.h / 2, by2 = b.y + b.h / 2;
      return ax1 <= bx2 && ax2 >= bx1 && ay1 <= by2 && ay2 >= by1;
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 12; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 50 + Math.random() * 150;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 2 + Math.random() * 4,
          color,
          life: 0.3 + Math.random() * 0.4,
          maxLife: 0.3 + Math.random() * 0.4,
          opacity: 1
        });
      }
    }

    function gameOver() {
      gameState = 'gameover';
      document.getElementById('finalScore').textContent = 'SCORE: ' + score;
      document.getElementById('gameOverScreen').style.display = 'flex';
    }

    function render() {
      // Clear
      ctx.fillStyle = '#0a0a1a';
      ctx.fillRect(0, 0, W, H);

      // Stars
      for (const s of stars) {
        ctx.fillStyle = `rgba(255,255,255,${s.opacity})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }

      // Particles
      for (const p of particles) {
        ctx.fillStyle = p.color.replace(')', `, ${p.opacity})`).replace('rgb', 'rgba').replace('#', '');
        // Convert hex to rgba
        const r = parseInt(p.color.slice(1, 3), 16);
        const g = parseInt(p.color.slice(3, 5), 16);
        const b = parseInt(p.color.slice(5, 7), 16);
        ctx.fillStyle = `rgba(${r},${g},${b},${p.opacity})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }

      // Bullets
      for (const b of bullets) {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
        // Glow
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 10;
        ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
        ctx.shadowBlur = 0;
      }

      // Enemies
      for (const e of enemies) {
        drawEnemy(e);
      }

      // Player
      drawPlayer();

      // UI score already in DOM
    }

    function drawPlayer() {
      ctx.save();
      ctx.translate(player.x, player.y);

      // Engine glow
      const grad = ctx.createRadialGradient(0, player.h / 2, 0, 0, player.h / 2, 20);
      grad.addColorStop(0, 'rgba(0,200,255,0.8)');
      grad.addColorStop(1, 'rgba(0,200,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(0, player.h / 2, 15, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // Ship body
      ctx.fillStyle = player.color;
      ctx.beginPath();
      ctx.moveTo(0, -player.h / 2);
      ctx.lineTo(player.w / 2, player.h / 3);
      ctx.lineTo(player.w / 4, player.h / 3);
      ctx.lineTo(player.w / 4, player.h / 2);
      ctx.lineTo(-player.w / 4, player.h / 2);
      ctx.lineTo(-player.w / 4, player.h / 3);
      ctx.lineTo(-player.w / 2, player.h / 3);
      ctx.closePath();
      ctx.fill();

      // Cockpit
      ctx.fillStyle = '#fff';
      ctx.globalAlpha = 0.6;
      ctx.beginPath();
      ctx.ellipse(0, -player.h / 6, 8, 6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      // Wing lights
      ctx.fillStyle = '#00ff88';
      ctx.beginPath();
      ctx.arc(-player.w / 2, player.h / 3, 3, 0, Math.PI * 2);
      ctx.arc(player.w / 2, player.h / 3, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawEnemy(e) {
      ctx.save();
      ctx.translate(e.x, e.y);

      // Body
      ctx.fillStyle = e.color;
      ctx.beginPath();
      if (e.type === 'fast') {
        // Diamond shape for fast enemies
        ctx.moveTo(0, -e.h / 2);
        ctx.lineTo(e.w / 2, 0);
        ctx.lineTo(0, e.h / 2);
        ctx.lineTo(-e.w / 2, 0);
        ctx.closePath();
      } else {
        // Hexagon-ish for normal
        ctx.moveTo(0, -e.h / 2);
        ctx.lineTo(e.w / 2, -e.h / 4);
        ctx.lineTo(e.w / 2, e.h / 4);
        ctx.lineTo(0, e.h / 2);
        ctx.lineTo(-e.w / 2, e.h / 4);
        ctx.lineTo(-e.w / 2, -e.h / 4);
        ctx.closePath();
      }
      ctx.fill();

      // Core
      ctx.fillStyle = '#fff';
      ctx.globalAlpha = 0.4;
      ctx.beginPath();
      ctx.arc(0, 0, e.w / 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      // HP indicator for 2-hp enemies
      if (e.hp === 2) {
        ctx.strokeStyle = '#ff4466';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, e.w / 3, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();
    }

    // Start the render loop immediately for start screen
    function renderStartScreen() {
      ctx.fillStyle = '#0a0a1a';
      ctx.fillRect(0, 0, W, H);
      for (const s of stars) {
        ctx.fillStyle = `rgba(255,255,255,${s.opacity})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }
      // Update stars for animation
      for (const s of stars) {
        s.y += s.speed * 0.5;
        if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
      }
      if (gameState === 'start') requestAnimationFrame(renderStartScreen);
    }
    renderStartScreen();
  </script>
</body>
</html>
