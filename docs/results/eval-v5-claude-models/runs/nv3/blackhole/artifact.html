<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Hole - 3D Interactive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
        canvas { display: block; }
        #ui {
            position: fixed; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: none; z-index: 10;
        }
        .panel {
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 16px 24px;
            color: #fff; font-size: 14px; pointer-events: auto;
        }
        .panel h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; opacity: 0.7; }
        .stat { display: flex; gap: 24px; }
        .stat-item { display: flex; flex-direction: column; gap: 2px; }
        .stat-label { font-size: 11px; opacity: 0.5; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
        .controls { display: flex; gap: 12px; flex-wrap: wrap; }
        button {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer;
            font-size: 13px; transition: all 0.15s ease;
        }
        button:hover { background: rgba(255, 255, 255, 0.2); border-color: rgba(255, 255, 255, 0.4); }
        button.active { background: rgba(255, 165, 0, 0.3); border-color: rgba(255, 165, 0, 0.6); }
        .hint { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 100px;
            padding: 10px 24px; color: #fff; font-size: 12px; opacity: 0.7;
            pointer-events: none; white-space: nowrap; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="panel">
            <h3>Black Hole</h3>
            <div class="stat">
                <div class="stat-item">
                    <span class="stat-label">Particles</span>
                    <span class="stat-value" id="particleCount">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Stars</span>
                    <span class="stat-value" id="starCount">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">FPS</span>
                    <span class="stat-value" id="fps">0</span>
                </div>
            </div>
        </div>
        <div class="panel controls">
            <button id="btnOrbit" class="active" title="Orbit camera (default)">Orbit</button>
            <button id="btnDrag" title="Drag to rotate camera">Drag</button>
            <button id="btnPause" title="Pause animation">Pause</button>
        </div>
    </div>
    <div class="hint">Drag to rotate • Scroll to zoom • Double-click to reset</div>

    <!-- Three.js r158 (ESM) -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ── Configuration ──────────────────────────────────────────────
        const CONFIG = {
            blackHole: { radius: 2.5, mass: 1 },
            accretionDisk: {
                innerRadius: 3.0, outerRadius: 12.0,
                particleCount: 12000, thickness: 0.4,
                baseSpeed: 0.8, shearFactor: 0.35,
                temperatureGradient: true
            },
            starfield: { count: 8000, radius: 150 },
            bloom: { strength: 1.2, radius: 0.6, threshold: 0.3 },
            camera: { fov: 55, near: 0.1, far: 300, startDistance: 35 }
        };

        // ── State ──────────────────────────────────────────────────────
        let renderer, scene, camera, composer, controls;
        let diskParticles, diskGeometry, diskMaterial;
        let starfield, starGeometry, starMaterial;
        let blackHoleMesh, eventHorizonMesh;
        let clock = new THREE.Clock();
        let isPaused = false;
        let mode = 'orbit'; // 'orbit' | 'drag'
        let dragState = { isDragging: false, lastX: 0, lastY: 0, spherical: new THREE.Spherical() };
        let frameCount = 0, lastFpsTime = performance.now(), fps = 60;

        // ── Color utilities ────────────────────────────────────────────
        const tempColor = new THREE.Color();
        function hsvToRgb(h, s, v, out = new THREE.Color()) {
            const i = Math.floor(h * 6), f = h * 6 - i, p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
            switch (i % 6) {
                case 0: out.set(v, t, p); break;
                case 1: out.set(q, v, p); break;
                case 2: out.set(p, v, t); break;
                case 3: out.set(p, q, v); break;
                case 4: out.set(t, p, v); break;
                case 5: out.set(v, p, q); break;
            }
            return out;
        }

        // ── Scene Setup ────────────────────────────────────────────────
        function initRenderer() {
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.1;
            document.body.appendChild(renderer.domElement);
        }

        function initScene() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(CONFIG.camera.fov, window.innerWidth / window.innerHeight, CONFIG.camera.near, CONFIG.camera.far);
            camera.position.set(0, CONFIG.camera.startDistance * 0.3, CONFIG.camera.startDistance);
            camera.lookAt(0, 0, 0);
        }

        function initControls() {
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enablePan = false;
            controls.minDistance = 8;
            controls.maxDistance = 120;
            controls.maxPolarAngle = Math.PI - 0.02;
            controls.minPolarAngle = 0.02;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.3;

            // Drag mode handlers
            renderer.domElement.addEventListener('pointerdown', onPointerDown);
            renderer.domElement.addEventListener('pointermove', onPointerMove);
            renderer.domElement.addEventListener('pointerup', onPointerUp);
            renderer.domElement.addEventListener('pointerleave', onPointerUp);
            renderer.domElement.addEventListener('dblclick', onDoubleClick);
        }

        function onPointerDown(e) {
            if (mode !== 'drag') return;
            dragState.isDragging = true;
            dragState.lastX = e.clientX;
            dragState.lastY = e.clientY;
            dragState.spherical.setFromVector3(camera.position);
            renderer.domElement.setPointerCapture(e.pointerId);
        }

        function onPointerMove(e) {
            if (!dragState.isDragging || mode !== 'drag') return;
            const dx = e.clientX - dragState.lastX;
            const dy = e.clientY - dragState.lastY;
            dragState.spherical.theta -= dx * 0.005;
            dragState.spherical.phi = THREE.MathUtils.clamp(dragState.spherical.phi + dy * 0.005, 0.02, Math.PI - 0.02);
            camera.position.setFromSpherical(dragState.spherical);
            camera.lookAt(0, 0, 0);
            dragState.lastX = e.clientX;
            dragState.lastY = e.clientY;
        }

        function onPointerUp(e) {
            if (dragState.isDragging) renderer.domElement.releasePointerCapture(e.pointerId);
            dragState.isDragging = false;
        }

        function onDoubleClick() {
            controls.enabled = true;
            controls.reset();
            camera.position.set(0, CONFIG.camera.startDistance * 0.3, CONFIG.camera.startDistance);
            camera.lookAt(0, 0, 0);
            dragState.spherical.setFromVector3(camera.position);
        }

        function setMode(newMode) {
            mode = newMode;
            controls.enabled = (newMode === 'orbit');
            document.getElementById('btnOrbit').classList.toggle('active', newMode === 'orbit');
            document.getElementById('btnDrag').classList.toggle('active', newMode === 'drag');
        }

        document.getElementById('btnOrbit').addEventListener('click', () => setMode('orbit'));
        document.getElementById('btnDrag').addEventListener('click', () => setMode('drag'));
        document.getElementById('btnPause').addEventListener('click', (e) => {
            isPaused = !isPaused;
            e.target.classList.toggle('active', isPaused);
            e.target.textContent = isPaused ? 'Resume' : 'Pause';
        });

        // ── Black Hole ────────────────────────────────────────────────
        function createBlackHole() {
            const group = new THREE.Group();

            // Event horizon (pure black sphere)
            const horizonGeo = new THREE.SphereGeometry(CONFIG.blackHole.radius, 64, 64);
            const horizonMat = new THREE.MeshBasicMaterial({ color: 0x000000, depthWrite: true });
            eventHorizonMesh = new THREE.Mesh(horizonGeo, horizonMat);
            group.add(eventHorizonMesh);

            // Photon ring / gravitational lensing glow
            const ringGeo = new THREE.RingGeometry(CONFIG.blackHole.radius * 1.02, CONFIG.blackHole.radius * 1.35, 128);
            const ringMat = new THREE.MeshBasicMaterial({
                color: 0xff8800, side: THREE.DoubleSide, transparent: true,
                opacity: 0.15, depthWrite: false, blending: THREE.AdditiveBlending
            });
            const photonRing = new THREE.Mesh(ringGeo, ringMat);
            photonRing.rotation.x = -Math.PI / 2;
            group.add(photonRing);

            // Corona glow (additive sphere)
            const coronaGeo = new THREE.SphereGeometry(CONFIG.blackHole.radius * 1.15, 32, 32);
            const coronaMat = new THREE.MeshBasicMaterial({
                color: 0xff6600, transparent: true, opacity: 0.08,
                depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.BackSide
            });
            const corona = new THREE.Mesh(coronaGeo, coronaMat);
            group.add(corona);

            scene.add(group);
            blackHoleMesh = group;
        }

        // ── Accretion Disk ────────────────────────────────────────────
        function createAccretionDisk() {
            const { particleCount, innerRadius, outerRadius, thickness, baseSpeed, shearFactor, temperatureGradient } = CONFIG.accretionDisk;

            diskGeometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const velocities = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);
            const temps = new Float32Array(particleCount);
            const phases = new Float32Array(particleCount);

            for (let i = 0; i < particleCount; i++) {
                // Radius with density bias toward inner region
                const u = Math.random();
                const r = innerRadius + (outerRadius - innerRadius) * (1 - Math.sqrt(1 - u));
                const theta = Math.random() * Math.PI * 2;
                const h = (Math.random() - 0.5) * thickness * (1 + (r - innerRadius) / (outerRadius - innerRadius) * 2);

                positions[i * 3] = r * Math.cos(theta);
                positions[i * 3 + 1] = h;
                positions[i * 3 + 2] = r * Math.sin(theta);

                // Orbital velocity (Keplerian-ish with shear)
                const v = baseSpeed / Math.sqrt(r / innerRadius) * (1 + (Math.random() - 0.5) * shearFactor);
                velocities[i * 3] = -v * Math.sin(theta);
                velocities[i * 3 + 1] = 0;
                velocities[i * 3 + 2] = v * Math.cos(theta);

                sizes[i] = 0.03 + Math.random() * 0.07;
                temps[i] = temperatureGradient ? THREE.MathUtils.mapLinear(r, innerRadius, outerRadius, 1.0, 0.3) : 0.6 + Math.random() * 0.4;
                phases[i] = Math.random() * Math.PI * 2;
            }

            diskGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            diskGeometry.setAttribute('velocity', new THREE.BufferAttribute(velocities, 3));
            diskGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            diskGeometry.setAttribute('temp', new THREE.BufferAttribute(temps, 1));
            diskGeometry.setAttribute('phase', new THREE.BufferAttribute(phases, 1));

            // Shader material for glowing particles
            diskMaterial = new THREE.PointsMaterial({
                size: 0.08, vertexColors: true, transparent: true,
                opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending,
                sizeAttenuation: true
            });

            // Custom shader for temperature-based color & pulsing
            const vertexShader = `
                attribute float size; attribute float temp; attribute float phase;
                varying float vTemp; varying float vPhase; varying float vSize;
                void main() {
                    vTemp = temp; vPhase = phase; vSize = size;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = size * (300.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `;
            const fragmentShader = `
                varying float vTemp; varying float vPhase; varying float vSize;
                uniform float uTime;
                void main() {
                    float dist = length(gl_PointCoord - 0.5);
                    if (dist > 0.5) discard;
                    float alpha = 1.0 - smoothstep(0.0, 0.5, dist);
                    // Temperature color: hot (white/blue) -> warm (orange/red)
                    vec3 color = mix(vec3(1.0, 0.3, 0.0), vec3(1.0, 0.9, 1.0), vTemp);
                    // Subtle pulsing
                    alpha *= 0.7 + 0.3 * sin(uTime * 3.0 + vPhase * 10.0);
                    gl_FragColor = vec4(color, alpha * 0.85);
                }
            `;
            diskMaterial = new THREE.ShaderMaterial({
                uniforms: { uTime: { value: 0 } },
                vertexShader, fragmentShader,
                transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
                vertexColors: false
            });

            diskParticles = new THREE.Points(diskGeometry, diskMaterial);
            diskParticles.rotation.x = -0.15; // slight tilt
            scene.add(diskParticles);

            document.getElementById('particleCount').textContent = particleCount.toLocaleString();
        }

        // ── Starfield ─────────────────────────────────────────────────
        function createStarfield() {
            const { count, radius } = CONFIG.starfield;
            starGeometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const sizes = new Float32Array(count);

            for (let i = 0; i < count; i++) {
                const r = radius * (0.3 + Math.random() * 0.7);
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = r * Math.cos(phi);

                // Star colors: mostly white/yellow, some blue/red
                const c = Math.random();
                if (c < 0.6) tempColor.setHSL(0.1, 0.1, 0.9 + Math.random() * 0.1);
                else if (c < 0.85) tempColor.setHSL(0.6, 0.3, 0.7 + Math.random() * 0.2);
                else tempColor.setHSL(0.95, 0.4, 0.6 + Math.random() * 0.2);
                colors[i * 3] = tempColor.r;
                colors[i * 3 + 1] = tempColor.g;
                colors[i * 3 + 2] = tempColor.b;

                sizes[i] = 0.5 + Math.random() * 1.5;
            }

            starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            starGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            starGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            starMaterial = new THREE.PointsMaterial({
                size: 1, vertexColors: true, transparent: true,
                opacity: 0.8, sizeAttenuation: true, depthWrite: false
            });

            starfield = new THREE.Points(starGeometry, starMaterial);
            scene.add(starfield);
            document.getElementById('starCount').textContent = count.toLocaleString();
        }

        // ── Postprocessing ────────────────────────────────────────────
        function initPostprocessing() {
            composer = new EffectComposer(renderer);
            composer.addPass(new RenderPass(scene, camera));

            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                CONFIG.bloom.strength, CONFIG.bloom.radius, CONFIG.bloom.threshold
            );
            bloomPass.threshold = CONFIG.bloom.threshold;
            bloomPass.strength = CONFIG.bloom.strength;
            bloomPass.radius = CONFIG.bloom.radius;
            composer.addPass(bloomPass);
        }

        // ── Animation ─────────────────────────────────────────────────
        function animate() {
            requestAnimationFrame(animate);

            if (!isPaused) {
                const dt = clock.getDelta();
                const t = clock.getElapsedTime();

                // Rotate accretion disk particles
                if (diskParticles) {
                    const positions = diskGeometry.attributes.position.array;
                    const velocities = diskGeometry.attributes.velocity.array;
                    const count = positions.length / 3;

                    for (let i = 0; i < count; i++) {
                        positions[i * 3] += velocities[i * 3] * dt;
                        positions[i * 3 + 1] += velocities[i * 3 + 1] * dt;
                        positions[i * 3 + 2] += velocities[i * 3 + 2] * dt;

                        // Keep in orbit (simple constraint)
                        const x = positions[i * 3], y = positions[i * 3 + 1], z = positions[i * 3 + 2];
                        const r = Math.sqrt(x * x + z * z);
                        if (r > CONFIG.accretionDisk.outerRadius * 1.2 || r < CONFIG.accretionDisk.innerRadius * 0.8) {
                            // Respawn at inner edge
                            const theta = Math.random() * Math.PI * 2;
                            const nr = CONFIG.accretionDisk.innerRadius + Math.random() * 0.5;
                            positions[i * 3] = nr * Math.cos(theta);
                            positions[i * 3 + 1] = (Math.random() - 0.5) * CONFIG.accretionDisk.thickness;
                            positions[i * 3 + 2] = nr * Math.sin(theta);
                            const v = CONFIG.accretionDisk.baseSpeed / Math.sqrt(nr / CONFIG.accretionDisk.innerRadius);
                            velocities[i * 3] = -v * Math.sin(theta);
                            velocities[i * 3 + 2] = v * Math.cos(theta);
                        }
                    }
                    diskGeometry.attributes.position.needsUpdate = true;

                    // Update shader time uniform
                    diskMaterial.uniforms.uTime.value = t;

                    // Slow precession of disk
                    diskParticles.rotation.z += dt * 0.02;
                    diskParticles.rotation.x = -0.15 + Math.sin(t * 0.15) * 0.08;
                }

                // Subtle starfield rotation
                if (starfield) {
                    starfield.rotation.y += dt * 0.0008;
                    starfield.rotation.x += dt * 0.0003;
                }

                // Photon ring pulse
                if (blackHoleMesh) {
                    const ring = blackHoleMesh.children[1];
                    if (ring) ring.material.opacity = 0.1 + Math.sin(t * 2) * 0.05;
                }

                if (mode === 'orbit') controls.update();
            }

            composer.render();

            // FPS counter
            frameCount++;
            const now = performance.now();
            if (now - lastFpsTime >= 1000) {
                fps = Math.round(frameCount * 1000 / (now - lastFpsTime));
                document.getElementById('fps').textContent = fps;
                frameCount = 0; lastFpsTime = now;
            }
        }

        // ── Resize ────────────────────────────────────────────────────
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onResize);

        // ── Boot ──────────────────────────────────────────────────────
        function init() {
            initRenderer();
            initScene();
            initControls();
            createBlackHole();
            createAccretionDisk();
            createStarfield();
            initPostprocessing();
            animate();
        }
        init();
    </script>
</body>
</html>
