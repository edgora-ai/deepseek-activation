<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Martian Ring Road Grand Prix</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#1a0b05;color:#fff;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.header{width:100%;max-width:1080px;padding:14px 18px 8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
h1{font-size:clamp(18px,3vw,26px);letter-spacing:.06em;text-transform:uppercase;font-weight:900}
h1 span{color:#ff6b35}
.hdr-right{display:flex;gap:8px;align-items:center}
.badge{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:#ff6b35;color:#fff;padding:6px 10px;border-radius:999px}
button{appearance:none;border:0;cursor:pointer;border-radius:999px;font-weight:800;letter-spacing:.04em;padding:9px 16px;font-size:13px}
.btn-primary{background:#ff6b35;color:#fff;box-shadow:0 6px 20px rgba(255,107,53,.4)}
.btn-primary:hover{background:#ff7f50}
.btn-ghost{background:#ffffff14;color:#fff;border:1px solid #ffffff28}
.stage-wrap{width:100%;max-width:1080px;padding:8px 12px 16px}
.stage{position:relative;background:radial-gradient(1200px 600px at 50% 0%,#3a1a0e 0%,#1d0d07 55%,#0f0704 100%);border:1px solid #ffffff18;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08)}
.stage svg{display:block;width:100%;height:auto}
.overlay{position:absolute;inset:0;pointer-events:none}
.topbar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:10px;justify-content:space-between;align-items:flex-start;pointer-events:none}
.leaderboard{background:rgba(12,8,10,.82);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;min-width:210px;pointer-events:auto}
.lb-title{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;font-weight:800;margin-bottom:6px}
.lb-row{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:10px;transition:all .25s}
.lb-row.active{background:rgba(255,255,255,.08)}
.lb-pos{width:22px;height:22px;border-radius:999px;display:grid;place-items:center;font-weight:900;font-size:12px;flex:0 0 auto}
.lb-name{font-weight:800;font-size:12px;flex:1}
.lb-meta{font-size:11px;opacity:.75}
.dot{width:9px;height:9px;border-radius:999px;display:inline-block}
.timer{pointer-events:auto;background:rgba(12,8,10,.82);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;text-align:right;min-width:160px}
.timer-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.6;font-weight:800}
.timer-val{font-size:20px;font-weight:900;letter-spacing:.04em}
.timer-sub{font-size:11px;opacity:.65}
.controls{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
.hint{font-size:11px;opacity:.65;text-align:center;padding:6px 10px}
.progresses{position:absolute;left:12px;bottom:12px;right:12px;display:flex;gap:8px;pointer-events:none}
.pbar{flex:1;height:6px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden;position:relative}
.pfill{position:absolute;left:0;top:0;bottom:0;width:0%;transition:width .12s linear;border-radius:999px}
.countdown{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(600px 400px at 50% 50%,rgba(0,0,0,.55),rgba(0,0,0,.2));pointer-events:none}
.cd-num{font-size:110px;font-weight:900;letter-spacing:-.06em;text-shadow:0 10px 40px rgba(0,0,0,.6);line-height:1}
.cd-sub{font-size:14px;letter-spacing:.28em;text-transform:uppercase;opacity:.8;font-weight:800;margin-top:-8px;text-align:center}
.winner-banner{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);background:linear-gradient(135deg,#ff6b35,#ffbe0b);color:#1a0800;padding:14px 18px;border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.45);text-align:center;min-width:320px;display:none}
.winner-banner.show{display:block;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.85);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
.tag{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:900;opacity:.75}
.winner-name{font-size:22px;font-weight:900;margin:2px 0}
.w-small{font-size:12px;opacity:.8}
</style>
</head>
<body>
<div class="header">
  <h1><span>♄</span> MARTIAN RING ROAD — GRAND PRIX</h1>
  <div class="hdr-right">
    <span class="badge">SOL 412 • OLYMPUS CIRCUIT</span>
    <button class="btn-ghost" id="btnSound">🔊 Sound on</button>
  </div>
</div>
<div class="stage-wrap">
  <div class="stage" id="stage">
    <svg id="svg" viewBox="0 0 1000 620" role="img" aria-label="Martian ring road race">
      <defs>
        <radialGradient id="sky" cx="50%" cy="0%" r="100%"><stop offset="0%" stop-color="#ff9a6b"/><stop offset="35%" stop-color="#c94b2a"/><stop offset="70%" stop-color="#5a1a12"/><stop offset="100%" stop-color="#1a0805"/></radialGradient>
        <radialGradient id="marsGlow" cx="50%" cy="55%" r="55%"><stop offset="70%" stop-color="#d66a3a" stop-opacity=".0"/><stop offset="100%" stop-color="#ff6b35" stop-opacity=".18"/></radialGradient>
        <linearGradient id="dune" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e8a07a"/><stop offset="100%" stop-color="#8b3a1f"/></linearGradient>
        <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2b2e3a"/><stop offset="50%" stop-color="#3a3e4f"/><stop offset="100%" stop-color="#222533"/></linearGradient>
        <pattern id="check" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(0)"><rect width="6" height="6" fill="#fff"/><rect x="6" y="6" width="6" height="6" fill="#fff"/><rect x="6" y="0" width="6" height="6" fill="#111"/><rect x="0" y="6" width="6" height="6" fill="#111"/></pattern>
        <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity=".35"/></filter>
      </defs>

      <!-- sky -->
      <rect x="0" y="0" width="1000" height="620" fill="url(#sky)"/>
      <!-- stars -->
      <g fill="#fff" opacity=".9">
        <circle cx="82" cy="54" r="1.1"/><circle cx="140" cy="32" r=".9"/><circle cx="210" cy="72" r="1.2"/><circle cx="280" cy="28" r=".8"/><circle cx="360" cy="60" r="1"/><circle cx="430" cy="22" r=".9"/><circle cx="520" cy="48" r="1.1"/><circle cx="610" cy="30" r=".9"/><circle cx="700" cy="62" r="1"/><circle cx="760" cy="26" r=".8"/><circle cx="860" cy="48" r="1.2"/><circle cx="920" cy="34" r=".9"/><circle cx="940" cy="78" r=".8"/>
        <circle cx="180" cy="96" r=".7" opacity=".6"/><circle cx="640" cy="86" r=".7" opacity=".6"/><circle cx="330" cy="94" r=".7" opacity=".6"/>
      </g>
      <!-- distant Olympus Mons silhouette -->
      <path d="M -20 210 L 90 150 L 150 170 L 210 120 L 280 145 L 320 110 L 380 140 L 430 100 L 500 135 L 560 105 L 620 145 L 700 125 L 760 160 L 830 130 L 890 165 L 960 150 L 1020 195 L 1020 230 L -20 230 Z" fill="#3a150b" opacity=".55"/>
      <path d="M -20 235 L 170 205 L 300 195 L 470 185 L 660 200 L 820 210 L 1020 235 L 1020 270 L -20 270 Z" fill="#6b2a16" opacity=".45"/>

      <!-- martian glow -->
      <ellipse cx="500" cy="355" rx="520" ry="250" fill="url(#marsGlow)"/>

      <!-- dunes foreground -->
      <ellipse cx="500" cy="590" rx="620" ry="120" fill="#7a2e18" opacity=".9"/>
      <path d="M -10 520 Q 120 440 260 500 T 520 480 T 760 500 T 1010 470 L 1010 620 L -10 620 Z" fill="url(#dune)" opacity=".95"/>

      <!-- RING ROAD base shadow -->
      <ellipse cx="500" cy="380" rx="395" ry="200" fill="#000" opacity=".25"/>

      <!-- outer road edge -->
      <ellipse cx="500" cy="380" rx="390" ry="195" fill="#1e2230" stroke="#0f1118" stroke-width="6"/>
      <!-- road surface -->
      <ellipse cx="500" cy="380" rx="382" ry="187" fill="url(#roadGrad)"/>
      <!-- inner desert (infield) -->
      <ellipse cx="500" cy="380" rx="260" ry="125" fill="#c07a52" stroke="#a85e36" stroke-width="3"/>
      <ellipse cx="500" cy="380" rx="260" ry="125" fill="none" stroke="#ffffff18" stroke-width="2" stroke-dasharray="10 10"/>
      <!-- infield detail -->
      <g opacity=".9">
        <ellipse cx="500" cy="380" rx="175" ry="78" fill="#d89a73" stroke="#b97a52" stroke-width="1.5"/>
        <text x="500" y="376" text-anchor="middle" font-size="11" font-weight="900" letter-spacing=".22em" fill="#5a2a14" opacity=".9">OLYMPUS RING</text>
        <text x="500" y="392" text-anchor="middle" font-size="8.5" font-weight="800" letter-spacing=".18em" fill="#5a2a14" opacity=".65">MARTIAN GRAND PRIX • 1.2 KM</text>
        <!-- crater dots -->
        <circle cx="440" cy="360" r="7" fill="#b97a52" opacity=".5"/><circle cx="560" cy="395" r="5" fill="#b97a52" opacity=".5"/><circle cx="520" cy="355" r="4" fill="#a85e36" opacity=".4"/>
      </g>
      <!-- lane lines -->
      <ellipse cx="500" cy="380" rx="342" ry="168" fill="none" stroke="#ffbe0b" stroke-width="1.8" stroke-dasharray="18 14" opacity=".95"/>
      <ellipse cx="500" cy="380" rx="318" ry="154" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="9 9" opacity=".55"/>
      <!-- outer dashed -->
      <ellipse cx="500" cy="380" rx="382" ry="187" fill="none" stroke="#ffffff22" stroke-width="2" stroke-dasharray="6 10"/>

      <!-- START/FINISH line at top (north) -->
      <g id="finishLine">
        <!-- thick line across track width -->
        <path d="M 465 185 L 535 185 L 535 195 L 465 195 Z" fill="url(#check)" stroke="#fff" stroke-width="1.2"/>
        <path d="M 465 185 L 535 195 M 535 185 L 465 195" stroke="#ff2a2a" stroke-width=".6" opacity=".0"/>
        <rect x="492" y="168" width="16" height="10" rx="2" fill="#ff2a2a" stroke="#fff" stroke-width="1"/>
        <text x="500" y="176" text-anchor="middle" font-size="6.5" font-weight="900" fill="#fff">FIN</text>
        <text x="500" y="212" text-anchor="middle" font-size="8" font-weight="900" letter-spacing=".18em" fill="#fff" stroke="#000" stroke-width="3" paint-order="stroke">START / FINISH</text>
        <!-- gantry -->
        <path d="M 390 185 L 390 150 Q 390 140 400 140 L 600 140 Q 610 140 610 150 L 610 185" fill="none" stroke="#e8eaf0" stroke-width="6" stroke-linecap="round" opacity=".95"/>
        <rect x="390" y="136" width="220" height="18" rx="6" fill="#e8eaf0" stroke="#b8c0d6" stroke-width="1.2"/>
        <text x="500" y="149" text-anchor="middle" font-size="10" font-weight="900" letter-spacing=".14em" fill="#1e2230">MARS • RING ROAD</text>
        <circle cx="415" cy="145" r="5" fill="#ff2a2a"><animate attributeName="opacity" values="1;.25;1" dur="0.6s" repeatCount="indefinite"/></circle>
        <circle cx="585" cy="145" r="5" fill="#ff2a2a"><animate attributeName="opacity" values="1;.25;1" dur="0.6s" repeatCount="indefinite"/></circle>
      </g>

      <!-- roadside cacti / markers -->
      <g opacity=".9">
        <g transform="translate(120,430)"><rect x="-2" y="-18" width="4" height="18" rx="2" fill="#6b3a1f"/><circle cx="0" cy="-20" r="6" fill="#ff6b35"/></g>
        <g transform="translate(880,430)"><rect x="-2" y="-18" width="4" height="18" rx="2" fill="#6b3a1f"/><circle cx="0" cy="-20" r="6" fill="#2ec4b6"/></g>
        <g transform="translate(500,560)"><rect x="-2" y="-14" width="4" height="14" rx="2" fill="#6b3a1f"/><circle cx="0" cy="-16" r="5" fill="#ffe66d"/></g>
      </g>

      <!-- dust particles (animated via JS) -->
      <g id="dust" opacity=".9"></g>

      <!-- RACERS layer: groups positioned by JS -->
      <g id="racersLayer" filter="url(#shadow)"></g>

      <!-- vignette -->
      <rect x="0" y="0" width="1000" height="620" fill="none" stroke="#000" stroke-width="14" opacity=".14" rx="18"/>

    </svg>

    <div class="overlay">
      <div class="topbar">
        <div class="leaderboard" id="leaderboard"></div>
        <div class="timer">
          <div class="timer-label">Race Time</div>
          <div class="timer-val" id="timerVal">00.0s</div>
          <div class="timer-sub" id="timerSub">GO! • Lap 1 / 1</div>
        </div>
      </div>
      <div class="progresses" id="progressBars"></div>
      <div class="countdown" id="countdown">
        <div style="text-align:center">
          <div class="cd-num" id="cdNum">3</div>
          <div class="cd-sub">Martian Grand Prix starting</div>
        </div>
      </div>
      <div class="winner-banner" id="winnerBanner"></div>
      <div class="controls">
        <button class="btn-primary" id="btnRestart">⟳ Restart Race</button>
        <button class="btn-ghost" id="btnPause">⏸ Pause</button>
      </div>
    </div>
  </div>
  <div class="hint">Rabbit on bicycle • Turtle on motorcycle • Eagle on tricycle — one full lap around the Olympus Ring. Watch the leaderboard shuffle mid-race!</div>
</div>

<script>
const CX=500, CY=380, RX=342, RY=168; // centerline
const START_ANGLE = -Math.PI/2; // top

const racers = [
  { id:'rabbit', name:'Bunny Bolt', sub:'Rabbit • Bicycle', color:'#ff6b35', accent:'#ffe66d', laneOffset:-14, base:0.042, variance:0.025, bobAmp:1.8 },
  { id:'turtle', name:'Shelly Shift', sub:'Turtle • Motorcycle', color:'#2ec4b6', accent:'#c4fff9', laneOffset:0, base:0.038, variance:0.018, bobAmp:1.2 },
  { id:'eagle', name:'Aero Talon', sub:'Eagle • Tricycle', color:'#7b61ff', accent:'#ffd166', laneOffset:14, base:0.040, variance:0.022, bobAmp:2.1 },
];

let progress = { rabbit:0, turtle:0, eagle:0 };
let finished = {}; // id -> time
let finishedOrder = [];
let running = false, paused=false;
let startTime = 0, elapsed = 0, rafId=null;
let totalDuration = 0;
let cdInterval=null;

// build leaderboard DOM
const lbEl = document.getElementById('leaderboard');
const pBarsEl = document.getElementById('progressBars');
function buildChrome(){
  lbEl.innerHTML = '<div class="lb-title">Live Ranking</div><div id="lbRows"></div>';
  pBarsEl.innerHTML = racers.map(r=>`
    <div style="flex:1">
      <div style="display:flex;justify-content:space-between;font-size:10px;font-weight:800;letter-spacing:.06em;opacity:.85;margin-bottom:3px"><span style="color:${r.color}">${r.name}</span><span id="pct-${r.id}">0%</span></div>
      <div class="pbar"><div class="pfill" id="fill-${r.id}" style="background:${r.color};width:0%"></div></div>
    </div>
  `).join('');
}
buildChrome();

const svg = document.getElementById('svg');
const racersLayer = document.getElementById('racersLayer');

// create racer groups
function createRacerSVG(){
  racersLayer.innerHTML = '';
  racers.forEach(r=>{
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('id','g-'+r.id);
    g.innerHTML = getRacerArt(r);
    racersLayer.appendChild(g);
  });
}

function getRacerArt(r){
  if(r.id==='rabbit'){
    // Rabbit on bicycle - detailed
    return `
    <g class="racer-root" data-id="rabbit">
      <!-- shadow -->
      <ellipse class="shadow-ellipse" cx="0" cy="16" rx="18" ry="6" fill="#000" opacity=".22"/>
      <!-- bike shadow wheels -->
      <g class="bike">
        <!-- rear wheel -->
        <g class="wheel rear" transform="translate(-22,8)">
          <circle r="14" fill="none" stroke="#1a1a1f" stroke-width="3.2"/>
          <circle r="11.5" fill="none" stroke="#3a3e4f" stroke-width="1"/>
          <g class="spokes" stroke="#cbd5e1" stroke-width=".9" opacity=".95">
            <line x1="0" y1="-11" x2="0" y2="11"/><line x1="-11" y1="0" x2="11" y2="0"/><line x1="-7.8" y1="-7.8" x2="7.8" y2="7.8"/><line x1="-7.8" y1="7.8" x2="7.8" y2="-7.8"/>
            <circle r="1.6" fill="#ff6b35" stroke="none"/>
          </g>
        </g>
        <!-- front wheel -->
        <g class="wheel front" transform="translate(22,8)">
          <circle r="14" fill="none" stroke="#1a1a1f" stroke-width="3.2"/>
          <circle r="11.5" fill="none" stroke="#3a3e4f" stroke-width="1"/>
          <g class="spokes" stroke="#cbd5e1" stroke-width=".9" opacity=".95">
            <line x1="0" y1="-11" x2="0" y2="11"/><line x1="-11" y1="0" x2="11" y2="0"/><line x1="-7.8" y1="-7.8" x2="7.8" y2="7.8"/><line x1="-7.8" y1="7.8" x2="7.8" y2="-7.8"/>
            <circle r="1.6" fill="#ff6b35"/>
          </g>
        </g>
        <!-- frame -->
        <path d="M -22 8 L -2 -6 L 18 -6 L 22 8" fill="none" stroke="#ff6b35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M -2 -6 L -8 8" fill="none" stroke="#ff6b35" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M -2 -6 L 6 4" fill="none" stroke="#1a1a1f" stroke-width="2.2"/>
        <!-- seat & handle -->
        <ellipse cx="-8" cy="-8" rx="7" ry="3.2" fill="#1a1a1f"/><rect x="16" y="-10" width="8" height="3" rx="1.5" fill="#1a1a1f"/>
        <!-- pedals / crank -->
        <circle cx="0" cy="4" r="3.2" fill="#3a3e4f" stroke="#fff" stroke-width=".8"/>
        <g class="crank">
          <line x1="0" y1="4" x2="7" y2="9" stroke="#2b2e3a" stroke-width="2.2" stroke-linecap="round"/>
          <rect x="5.5" y="8" width="7" height="3.2" rx="1" fill="#ffe66d" stroke="#1a1a1f" stroke-width=".7"/>
        </g>
      </g>
      <!-- rabbit body -->
      <g class="body-bob">
        <!-- legs pedaling -->
        <ellipse cx="-2" cy="0" rx="5" ry="6" fill="#ff8a5b"/>
        <!-- torso jersey -->
        <path d="M -6 -16 Q -2 -18 4 -15 L 6 -6 L -4 -4 Z" fill="#ffe66d" stroke="#1a1a1f" stroke-width="1"/>
        <text x="0" y="-9" text-anchor="middle" font-size="5" font-weight="900" fill="#1a1a1f">7</text>
        <!-- arms -->
        <path d="M 1 -12 L 10 -9" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M -3 -12 L -9 -9" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
        <!-- gloves -->
        <circle cx="10.5" cy="-9" r="2.3" fill="#1a1a1f"/><circle cx="-9.5" cy="-9" r="2.1" fill="#1a1a1f"/>
        <!-- head -->
        <ellipse cx="0" cy="-22" rx="8.5" ry="7.5" fill="#fff" stroke="#1a1a1f" stroke-width="1.1"/>
        <!-- ears -->
        <ellipse cx="-4.5" cy="-33" rx="3.2" ry="11" fill="#fff" stroke="#1a1a1f" stroke-width="1" transform="rotate(-10 -4.5 -33)"/>
        <ellipse cx="4.5" cy="-33" rx="3.2" ry="11" fill="#fff" stroke="#1a1a1f" stroke-width="1" transform="rotate(10 4.5 -33)"/>
        <ellipse cx="-4.5" cy="-32" rx="1.4" ry="6.5" fill="#ff8fa0"/><ellipse cx="4.5" cy="-32" rx="1.4" ry="6.5" fill="#ff8fa0"/>
        <!-- face -->
        <circle cx="-2.8" cy="-22" r="1.3" fill="#1a1a1f"/><circle cx="2.8" cy="-22" r="1.3" fill="#1a1a1f"/>
        <ellipse cx="0" cy="-19.2" rx="1.1" ry=".9" fill="#ff6b9d"/>
        <path d="M -1.2 -18.2 Q 0 -17 1.2 -18.2" fill="none" stroke="#1a1a1f" stroke-width=".9" stroke-linecap="round"/>
        <!-- goggles / helmet strap -->
        <path d="M -7 -24 Q 0 -27 7 -24" fill="none" stroke="#ff6b35" stroke-width="1.6" stroke-linecap="round"/>
        <!-- wind effect -->
        <path d="M -10 -26 L -16 -27" stroke="#fff" stroke-width="1.2" opacity=".6" stroke-linecap="round"/>
      </g>
    </g>`;
  }
  if(r.id==='turtle'){
    return `
    <g class="racer-root" data-id="turtle">
      <ellipse class="shadow-ellipse" cx="0" cy="16" rx="20" ry="7" fill="#000" opacity=".22"/>
      <!-- motorcycle -->
      <g class="moto">
        <!-- wheels big -->
        <g class="wheel rear" transform="translate(-18,9)">
          <circle r="15" fill="#0f1318" stroke="#1e2430" stroke-width="2.5"/>
          <circle r="10" fill="#2ec4b6" opacity=".15"/>
          <circle r="6.5" fill="#c4fff9" stroke="#0f1318" stroke-width="1"/>
          <circle r="1.4" fill="#0f1318"/>
          <g class="spokes" stroke="#e6fffb" stroke-width="1" opacity=".9"><line x1="0" y1="-9" x2="0" y2="9"/><line x1="-9" y1="0" x2="9" y2="0"/></g>
        </g>
        <g class="wheel front" transform="translate(20,9)">
          <circle r="15" fill="#0f1318" stroke="#1e2430" stroke-width="2.5"/>
          <circle r="10" fill="#2ec4b6" opacity=".15"/>
          <circle r="6.5" fill="#c4fff9" stroke="#0f1318" stroke-width="1"/>
          <circle r="1.4" fill="#0f1318"/>
          <g class="spokes" stroke="#e6fffb" stroke-width="1" opacity=".9"><line x1="0" y1="-9" x2="0" y2="9"/><line x1="-9" y1="0" x2="9" y2="0"/></g>
        </g>
        <!-- body -->
        <path d="M -18 9 L -8 -4 L 10 -6 L 18 -1 L 15 8 L -6 8 Z" fill="#0f1318" stroke="#1e2430" stroke-width="1.2"/>
        <path d="M -8 -4 L 10 -6 L 6 2 L -6 3 Z" fill="#2ec4b6" stroke="#0f1318" stroke-width="1"/>

        <!-- feathers brow -->
        <path d="M -2 -18 L -3 -20 M 0 -19 L 0 -21 M 2 -18.5 L 3 -20.5" stroke="#c9b8ff" stroke-width=".9" stroke-linecap="round" opacity=".8"/>

}

createRacerSVG();

// dust
const dustG = document.getElementById('dust');
for(let i=0;i<18;i++){
  const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('r', (Math.random()*1.6+.4).toFixed(1));
  c.setAttribute('fill','#ffb86b');
  c.setAttribute('opacity','.55');
  dustG.appendChild(c);
}

function angleForProgress(p){
  // p 0->1 around ellipse clockwise starting at top
  return START_ANGLE + p * Math.PI*2;
}
function posOnTrack(p, laneOffset){
  const ang = angleForProgress(p);
  const rx = RX + laneOffset;
  const ry = RY + laneOffset*0.48;
  const x = CX + Math.cos(ang)*rx;
  const y = CY + Math.sin(ang)*ry;
  // tangent angle for orientation (derivative of ellipse)
  const dx = -Math.sin(ang)*rx;
  const dy = Math.cos(ang)*ry;
  const rot = Math.atan2(dy,dx)*180/Math.PI;
  return {x,y,rot,ang};
}

function rankNow(){
  const arr = racers.map(r=>({ ...r, p: progress[r.id], finished: finished[r.id]!=null }))
    .sort((a,b)=>{
      if(a.finished && b.finished) return finished[a.id]-finished[b.id];
      if(a.finished) return -1;
      if(b.finished) return 1;
      return b.p - a.p;
    });
  return arr;
}

function updateLeaderboard(){
  const rows = document.getElementById('lbRows');
  const ordered = rankNow();
  rows.innerHTML = ordered.map((r,idx)=>{
    const pct = Math.min(100, Math.round(progress[r.id]*100));
    const isLeader = idx===0 && !finished[r.id];
    const medal = idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':'';
    const status = finished[r.id] ? `FIN ${finished[r.id].toFixed(1)}s` : `${pct}%`;
    const gap = idx>0 ? Math.round((ordered[0].p - r.p)*100) : 0;
    const gapTxt = finished[r.id] ? '' : (idx===0? 'LEADER' : `-${gap}%`);
    return `<div class="lb-row ${isLeader?'active':''}" style="border-left:3px solid ${r.color}">
      <div class="lb-pos" style="background:${r.color};color:${idx===0?'#fff':'#fff'}">${idx+1}</div>
      <div style="flex:1;min-width:0">
        <div class="lb-name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${medal} ${r.name} <span style="opacity:.6;font-weight:600">• ${r.sub.split('•')[1]?.trim()||r.sub}</span></div>
        <div class="lb-meta">${gapTxt} • ${status}</div>
      </div>
      <span class="dot" style="background:${r.color}"></span>
    </div>`;
  }).join('');
  racers.forEach(r=>{
    document.getElementById('pct-'+r.id).textContent = Math.min(100,Math.round(progress[r.id]*100))+'%';
    document.getElementById('fill-'+r.id).style.width = Math.min(100, progress[r.id]*100)+'%';
  });
}

function updateTimer(){
  const t = running ? (performance.now()-startTime)/1000 : elapsed;
  document.getElementById('timerVal').textContent = t.toFixed(1)+'s';
  const notFinished = racers.filter(r=>!finished[r.id]).length;
  document.getElementById('timerSub').textContent = finishedOrder.length===racers.length ? `FINISH • ${finishedOrder[0]?.name||''} wins!` : `Lap 1 / 1 • ${notFinished} racing`;
}

function updateDust(time){
  const kids=[...dustG.children];
  kids.forEach((c,i)=>{
    const tt = time*0.001 + i*0.7;
    const x = (Math.sin(tt*0.6 + i)*420 + 500 + i*13)%1000;
    const y = 160 + Math.cos(tt*0.9+i)*10 + (i%3)*30;
    c.setAttribute('cx', x);
    c.setAttribute('cy', y);
    c.setAttribute('opacity', (0.25+Math.sin(tt*1.2)*0.15).toFixed(2));
  });
}

// animation loop
let lastT=0;
function frame(now){
  if(paused){ rafId=requestAnimationFrame(frame); return; }
  if(!running) return;
  const dt = lastT ? (now-lastT)/1000 : 0.016;
  lastT=now;
  elapsed = (now-startTime)/1000;
  updateTimer();

  // update progresses with lively variation
  const t = elapsed;
  racers.forEach(r=>{
    if(finished[r.id]!=null) return;
    // base + sinus wobble + race events
    let spd = r.base;
    // rabbit: burst every ~3s
    if(r.id==='rabbit') spd += Math.sin(t*0.9)*0.008 + Math.max(0, Math.sin(t*2.1))*0.012;
    if(r.id==='turtle') spd += Math.sin(t*0.5+1)*0.004 + 0.003*Math.sin(t*0.23);
    if(r.id==='eagle')  spd += Math.sin(t*1.1+2)*0.007 + Math.cos(t*0.7)*0.005;
    // late race drama: turtle surge at 65%, rabbit tire at 80%
    if(progress[r.id]>0.65 && r.id==='turtle') spd += 0.012;
    if(progress[r.id]>0.78 && r.id==='rabbit') spd -= 0.008;
    if(progress[r.id]>0.82 && r.id==='eagle') spd += 0.010;
    // add tiny random jitter
    spd += (Math.random()-0.5)*0.006;
    spd = Math.max(0.012, spd);
    progress[r.id] += spd * dt;
    if(progress[r.id]>=1){
      progress[r.id]=1;
      finished[r.id]=elapsed;
      finishedOrder.push(r);
      // burst effect
    }
  });

  // position racers
  racers.forEach(r=>{
    const g = document.getElementById('g-'+r.id);
    if(!g) return;
    const p = Math.min(1, progress[r.id]);
    const {x,y,rot} = posOnTrack(p, r.laneOffset);
    // bob
    const bob = Math.sin(t* (r.id==='rabbit'? 14 : r.id==='turtle'? 10 : 12) + (r.id==='rabbit'?0: r.id==='turtle'?1:2))* r.bobAmp;
    const wheelSpin = t* 800 * (0.9 + progress[r.id]*0.6); // deg per sec
    g.setAttribute('transform', `translate(${x},${y}) rotate(${rot}) translate(0,${bob*0.25})`);
    // rotate wheels
    g.querySelectorAll('.wheel .spokes').forEach(s=>{ s.setAttribute('transform', `rotate(${wheelSpin%360})`); });
    // crank rotation
    g.querySelectorAll('.crank').forEach(c=>{ c.setAttribute('transform', `rotate(${(t*260)%360} 0 5)`); });
    // turtle exhaust puff when accelerating
    const puff = g.querySelector('.exhaust-puff');
    if(puff){ puff.setAttribute('opacity', (0.35+Math.sin(t*12)*0.25).toFixed(2)); puff.setAttribute('transform', `translate(${Math.sin(t*10)*1},0)`); }
    // wing flap for eagle
    g.querySelectorAll('.wing').forEach((w,i)=>{
      const fl = Math.sin(t*14 + i)*6;
      w.setAttribute('transform', `rotate(${fl} 0 -6)`);
    });
    // scale based on y for perspective (closer = larger)
    const scale = 0.92 + (y-210)/ (620-210)*0.22;
    g.querySelector('.racer-root').setAttribute('transform', `scale(${scale})`);
    // hide shadow when far top
    const sh = g.querySelector('.shadow-ellipse');
    if(sh) sh.setAttribute('opacity', (0.12+ (y-210)/800).toFixed(2));
  });

  updateDust(now);
  updateLeaderboard();

  // order SVG so leader is on top (higher y sort)
  const sortedByY = [...racers].sort((a,b)=> posOnTrack(progress[a.id],a.laneOffset).y - posOnTrack(progress[b.id],b.laneOffset).y);
  sortedByY.forEach(r=> racersLayer.appendChild(document.getElementById('g-'+r.id)) );

  if(finishedOrder.length===racers.length){
    running=false;
    showWinner();
    return;
  }
  rafId=requestAnimationFrame(frame);
}

function showWinner(){
  const w = finishedOrder[0];
  const banner = document.getElementById('winnerBanner');
  const orderStr = finishedOrder.map((r,i)=> `${i+1}. ${r.name} — ${finished[r.id].toFixed(1)}s`).join('<br>');
  banner.innerHTML = `<div class="tag">🏁 Olympus Ring — Official Result</div><div class="winner-name" style="color:#fff">${w.name} wins!</div><div class="w-small">${w.sub} • ${finished[w.id].toFixed(1)}s<br><br>${orderStr}</div><div style="margin-top:10px"><button class="btn-primary" onclick="restart()" style="pointer-events:auto">Replay Race</button></div>`;
  banner.classList.add('show');
  banner.style.display='block';
  banner.style.pointerEvents='auto';
  document.getElementById('timerSub').textContent = `FINISH • ${w.name} wins in ${finished[w.id].toFixed(1)}s`;
}

function restart(){
  cancelAnimationFrame(rafId);
  progress={rabbit:0,turtle:0,eagle:0};
  finished={}; finishedOrder=[];
  elapsed=0; lastT=0;
  document.getElementById('winnerBanner').classList.remove('show');
  document.getElementById('winnerBanner').style.display='none';
  updateLeaderboard();
  updateTimer();
  createRacerSVG();
  startCountdown();
}
window.restart=restart;

function startCountdown(){
  const cd = document.getElementById('countdown');
  const num = document.getElementById('cdNum');
  cd.style.display='grid';
  let c=3;
  num.textContent=c;
  num.style.transform='scale(1)';
  num.style.opacity='1';
  if(cdInterval) clearInterval(cdInterval);
  running=false; paused=false;
  document.getElementById('btnPause').textContent='⏸ Pause';
  cdInterval = setInterval(()=>{
    c--;
    if(c>0){
      num.textContent=c;
      num.animate([{transform:'scale(1.4)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:300,easing:'cubic-bezier(.2,1.5,.4,1)'});
    } else if(c===0){
      num.textContent='GO!';
      num.style.color='#ffe66d';
      num.animate([{transform:'scale(1.5)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:380,easing:'cubic-bezier(.2,1.4,.4,1)'});
    } else {
      clearInterval(cdInterval);
      cd.style.display='none';
      num.style.color='';
      startTime=performance.now();
      lastT=0;
      running=true;
      rafId=requestAnimationFrame(frame);
    }
  }, 700);
}

// controls
document.getElementById('btnRestart').addEventListener('click', restart);
document.getElementById('btnPause').addEventListener('click', ()=>{
  if(!running && !paused) return;
  paused=!paused;
  document.getElementById('btnPause').textContent = paused ? '▶ Resume' : '⏸ Pause';
  if(!paused){ lastT=performance.now(); rafId=requestAnimationFrame(frame); }
});
document.getElementById('btnSound').addEventListener('click', (e)=>{
  const on = e.target.textContent.includes('on');
  e.target.textContent = on ? '🔇 Sound off' : '🔊 Sound on';
  e.target.style.opacity = on ? '.6' : '1';
});

// init
updateLeaderboard();
updateTimer();
startCountdown();

// verify load
console.log('Martian Ring Road loaded');
</script>
