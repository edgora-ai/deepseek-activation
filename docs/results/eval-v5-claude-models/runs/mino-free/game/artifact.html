<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Shooter</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = 800;
canvas.height = 600;

const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.code] = false; e.preventDefault(); });

const keysJustPressed = {};
window.addEventListener('keydown', e => { if (!keys[e.code]) keysJustPressed[e.code] = true; });

let state = 'start';
let score = 0;
let highScore = 0;
let spawnTimer = 0;
let starField = [];
for (let i = 0; i < 120; i++) starField.push({ x: Math.random() * 800, y: Math.random() * 600, s: Math.random() * 2 + 0.5, sp: Math.random() * 2 + 1 });
let particles = [];
let enemies = [];
let bullets = [];
let player = {};

function resetGame() {
  score = 0;
  spawnTimer = 0;
  enemies = [];
  bullets = [];
  particles = [];
  player = { x: 400, y: 520, w: 40, h: 40, speed: 5 };
}

resetGame();

function spawnEnemy() {
  const w = 30 + Math.random() * 20;
  enemies.push({ x: Math.random() * (800 - w - 20) + 10, y: -w, w, h: w, speed: 1.5 + Math.random() * 2, hp: 1, color: `hsl(${Math.random()*360},80%,60%)` });
}

function explode(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = Math.random() * 4 + 1;
    particles.push({ x, y, vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd, life: 1, decay: 0.02 + Math.random() * 0.03, r: Math.random() * 3 + 1, color });
  }
}

function collides(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function update() {
  if (state === 'start') {
    if (keysJustPressed['Space'] || keysJustPressed['Enter']) { resetGame(); state = 'playing'; }
    return;
  }
  if (state === 'gameover') {
    if (keysJustPressed['Space'] || keysJustPressed['Enter']) { resetGame(); state = 'playing'; }
    return;
  }

  // Player movement
  if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
  if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
  if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
  if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;
  player.x = Math.max(0, Math.min(800 - player.w, player.x));
  player.y = Math.max(0, Math.min(600 - player.h, player.y));

  // Shooting
  if (keys['Space']) {
    if (!player.shootCooldown || player.shootCooldown <= 0) {
      bullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 4, h: 12, speed: 7 });
      player.shootCooldown = 12;
    }
  }
  if (player.shootCooldown) player.shootCooldown--;

  // Bullets
  bullets.forEach(b => b.y -= b.speed);
  bullets = bullets.filter(b => b.y > -20);

  // Spawn enemies
  spawnTimer++;
  const spawnRate = Math.max(20, 60 - Math.floor(score / 5));
  if (spawnTimer >= spawnRate) { spawnEnemy(); spawnTimer = 0; }

  // Enemies
  enemies.forEach(e => e.y += e.speed);
  enemies = enemies.filter(e => e.y < 620);

  // Collision: bullets vs enemies
  for (let i = bullets.length - 1; i >= 0; i--) {
    for (let j = enemies.length - 1; j >= 0; j--) {
      if (collides(bullets[i], enemies[j])) {
        explode(enemies[j].x + enemies[j].w / 2, enemies[j].y + enemies[j].h / 2, enemies[j].color, 20);
        enemies.splice(j, 1);
        bullets.splice(i, 1);
        score += 10;
        break;
      }
    }
  }

  // Collision: enemies vs player
  for (let j = enemies.length - 1; j >= 0; j--) {
    if (collides(player, enemies[j])) {
      explode(enemies[j].x + enemies[j].w / 2, enemies[j].y + enemies[j].h / 2, '#f44', 30);
      explode(player.x + player.w / 2, player.y + player.h / 2, '#ff0', 40);
      enemies.splice(j, 1);
      if (score > highScore) highScore = score;
      state = 'gameover';
      break;
    }
  }

  // Particles
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= p.decay; });
  particles = particles.filter(p => p.life > 0);

  // Stars
  starField.forEach(s => { s.y += s.sp; if (s.y > 600) { s.y = 0; s.x = Math.random() * 800; } });
}

function draw() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, 800, 600);

  // Stars
  starField.forEach(s => { ctx.fillStyle = `rgba(255,255,255,${0.3 + s.s * 0.2})`; ctx.fillRect(s.x, s.y, s.s, s.s); });

  if (state === 'start') {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('SPACE SHOOTER', 400, 220);
    ctx.font = '20px monospace';
    ctx.fillText('Arrow Keys / WASD to move', 400, 280);
    ctx.fillText('SPACE to shoot', 400, 310);
    ctx.fillStyle = '#0f0';
    ctx.font = '24px monospace';
    ctx.fillText('Press SPACE or ENTER to start', 400, 380);
    ctx.textAlign = 'left';
    return;
  }

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Bullets
  ctx.fillStyle = '#0f0';
  bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

  // Enemies
  enemies.forEach(e => {
    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.moveTo(e.x + e.w / 2, e.y + e.h);
    ctx.lineTo(e.x, e.y);
    ctx.lineTo(e.x + e.w, e.y);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.stroke();
  });

  // Player ship
  ctx.fillStyle = '#0af';
  ctx.beginPath();
  ctx.moveTo(player.x + player.w / 2, player.y);
  ctx.lineTo(player.x, player.y + player.h);
  ctx.lineTo(player.x + player.w, player.y + player.h);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.stroke();

  // Engine glow
  ctx.fillStyle = '#ff0';
  ctx.beginPath();
  ctx.arc(player.x + player.w / 2, player.y + player.h + 4, 3 + Math.random() * 2, 0, Math.PI * 2);
  ctx.fill();

  // HUD
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`Score: ${score}`, 15, 30);
  ctx.textAlign = 'right';
  ctx.fillText(`Best: ${highScore}`, 785, 30);
  ctx.textAlign = 'left';

  if (state === 'gameover') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, 800, 600);
    ctx.fillStyle = '#f44';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', 400, 260);
    ctx.fillStyle = '#fff';
    ctx.font = '24px monospace';
    ctx.fillText(`Final Score: ${score}`, 400, 310);
    ctx.fillStyle = '#0f0';
    ctx.font = '20px monospace';
    ctx.fillText('Press SPACE or ENTER to restart', 400, 360);
    ctx.textAlign = 'left';
  }
}

function loop() {
  update();
  draw();
  for (const k in keysJustPressed) delete keysJustPressed[k];
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
