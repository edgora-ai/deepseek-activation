<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Martian Ring Road Race</title>
<style>
  :root{
    --bg:#1a0e0a; --panel:#2b1710; --panel-edge:#5a3222;
    --ink:#ffe9d6; --dim:#c9a284; --gold:#ffd166; --accent:#ff7a45;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at 50% -10%, #3a1d12 0%, var(--bg) 60%);
    color:var(--ink);
    font-family:"Segoe UI", system-ui, sans-serif;
    display:flex;flex-direction:column;height:100vh;overflow:hidden;
  }
  header{
    display:flex;align-items:center;gap:16px;
    padding:10px 20px;border-bottom:2px solid var(--panel-edge);
    background:linear-gradient(180deg,#33201a,#241209);
    flex:0 0 auto;
  }
  header h1{font-size:20px;letter-spacing:1px;text-shadow:0 2px 6px #000}
  header h1 span{color:var(--accent)}
  #raceClock{
    font-variant-numeric:tabular-nums;font-size:18px;font-weight:700;
    background:#00000055;border:1px solid var(--panel-edge);
    padding:4px 14px;border-radius:8px;color:var(--gold);
  }
  #statusMsg{font-size:14px;color:var(--dim);font-style:italic}
  main{flex:1;display:flex;min-height:0}
  #stage{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;background:#0d0705}
  svg#scene{width:100%;height:100%;display:block}
  aside#board{
    flex:0 0 300px;border-left:2px solid var(--panel-edge);
    background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:10px;
  }
  aside#board h2{font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
  .row{
    display:flex;align-items:center;gap:10px;background:#00000042;
    border:1px solid #5a322288;border-radius:10px;padding:8px 10px;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .row.leader{box-shadow:0 0 14px #ffd16644;border-color:#ffd16688}
  .rank{
    width:30px;height:30px;border-radius:50%;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:15px;color:#2b1710;background:#8a6a52;
  }
  .rank.r1{background:linear-gradient(135deg,#ffe08a,#d99a1f)}
  .rank.r2{background:linear-gradient(135deg,#e8e8ee,#9aa0ad)}
  .rank.r3{background:linear-gradient(135deg,#f0b083,#b96a35)}
  .meta{flex:1;min-width:0}
  .name{font-weight:700;font-size:14px;display:flex;justify-content:space-between}
  .name em{font-style:normal;font-size:11px;color:var(--dim);font-weight:400}
  .bar{height:8px;margin-top:5px;border-radius:4px;background:#120804;overflow:hidden;border:1px solid #00000066}
  .fill{height:100%;width:0%;border-radius:4px;transition:width .12s linear}
  .pct{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;width:44px;text-align:right}
  #banner{
    margin-top:auto;text-align:center;padding:12px;border-radius:12px;
    background:#00000059;border:1px dashed var(--panel-edge);font-size:14px;line-height:1.6;
    min-height:86px;display:flex;flex-direction:column;justify-content:center;
  }
  #banner b{color:var(--gold)}
</style>
</head>

</header>
<main>
  <div id="stage">

    <div id="banner">Race starting…</div>

/* deterministic pseudo-random scenery */
let seed = 42;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

(function decorate(){
  const stars = document.getElementById("stars");
  for (let i = 0; i < 90; i++){
    const c = document.createElementNS(SVGNS, "circle");
    c.setAttribute("cx", rnd()*1280); c.setAttribute("cy", rnd()*300);

     `<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*.38}" fill="#4a1c0d"/>

/* ============================ RACER ART ============================ */
/* Local coordinate system: origin under wheels, +x = facing direction. */

function bikeWheels(r){ return `
  <g class="wheel">
    <circle r="${r}" fill="#14100e" stroke="#3a2c24" stroke-width="4"/>
    <g class="spokes" stroke="#cbb9a4" stroke-width="1.6">
      <line x1="${-r}" y1="0" x2="${r}" y2="0"/><line x1="0" y1="${-r}" x2="0" y2="${r}"/>
      <line x1="${-r*.7}" y1="${-r*.7}" x2="${r*.7}" y2="${r*.7}"/>
      <line x1="${-r*.7}" y1="${r*.7}" x2="${r*.7}" y2="${-r*.7}"/>
    </g>
    <circle r="${r*.18}" fill="#8a7a68"/>
  </g>`; }

function limbPath(hx,hy,fx,fy,l1,l2,dir){
  /* two-bone IK: returns polyline through hip-knee-foot */
  const dx=fx-hx, dy=fy-hy; let d=Math.hypot(dx,dy);
  d = Math.min(d, l1+l2-.5);
  const a=(l1*l1-l2*l2+d*d)/(2*d);
  const h=Math.sqrt(Math.max(l1*l1-a*a,0));
  const ux=dx/(d||1), uy=dy/(d||1);
  const kx=hx+ux*a - uy*h*dir, ky=hy+uy*a + ux*h*dir;
  return `${hx},${hy} ${kx.toFixed(1)},${ky.toFixed(1)} ${fx},${fy}`;
}

/* ============================ GEOMETRY HELPERS ============================ */
function posAt(a, lane = 0){
  /* offset along the track's outward normal (+lane = outer lane) */
  const nx = Math.cos(a)/RX, ny = Math.sin(a)/RY;
  const nl = Math.hypot(nx, ny) || 1;
  return { x: CX + RX*Math.cos(a) + lane*nx/nl,
           y: CY + RY*Math.sin(a) + lane*ny/nl };
}
function headingAt(a){
  /* velocity for decreasing angle */
  const vx = RX*Math.sin(a), vy = -RY*Math.cos(a);
  return Math.atan2(vy, vx)*180/Math.PI;
}

/* ============================ FX ============================ */
function spawnPuff(r){
  const c = document.createElementNS(SVGNS, "circle");
  c.setAttribute("r", (2+Math.random()*2.5).toFixed(1));
  c.setAttribute("fill", "#d8d2cc");
  c.setAttribute("opacity", ".8");
  r.el.exhaust.appendChild(c);
  r.particles.push({ node:c, vx:-14-Math.random()*10, vy:-6-Math.random()*8, life:1, grow:9 });
}
function spawnDust(r){
  const c = document.createElementNS(SVGNS, "circle");
  c.setAttribute("r", (2+Math.random()*3).toFixed(1));
  c.setAttribute("fill", "#c98b5e");
  c.setAttribute("opacity", ".55");
  r.g.insertBefore(c, r.g.firstChild);
  c.setAttribute("cx", (-r.wheelR*1.6).toFixed(1)); c.setAttribute("cy", "-2");
  r.particles.push({ node:c, vx:-24-Math.random()*14, vy:-3-Math.random()*6, life:1, grow:5 });
}

/* ============================ MAIN LOOP ============================ */
const clockEl = document.getElementById("raceClock");
const statusEl = document.getElementById("statusMsg");
const bannerEl = document.getElementById("banner");

let startTime = performance.now();
let raceOver = false;

function speedOf(r, t){
  /* base pace + organic surges/fatigue so movement never looks robotic */
  return r.base * (1
    + r.amp * Math.sin(t*r.freq*2.1 + r.crankAngle)
    + r.amp*0.55 * Math.sin(t*r.freq*4.7)
    + r.amp*0.3  * Math.sin(t*r.freq*9.3));
}

function updateRacer(r, t, dt){
  if (!r.finished){
    const sp = speedOf(r, t);                       // rad/s
    const prev = posAt(r.angle, r.lane);
    r.angle -= sp*dt;
    const cur = posAt(r.angle, r.lane);
    r.dist += Math.hypot(cur.x-prev.x, cur.y-prev.y);
    r.wheelAngle += (Math.hypot(cur.x-prev.x, cur.y-prev.y)/r.wheelR)*57.2958;
    r.crankAngle += sp*dt*7.5;
    if (START_ANGLE - r.angle >= Math.PI*2*LAPS){
      r.finished = true;
      r.finishTime = t;
    }
  }

  const p = posAt(r.angle, r.lane);
  const hd = headingAt(p.x === undefined ? START_ANGLE : r.angle);
  const bob = r.finished ? 0 : Math.sin(t*9 + r.crankAngle)*1.6;
  const tilt = r.finished ? 0 : Math.sin(t*6.3 + r.crankAngle)*1.4;

  r.g.setAttribute("transform",
    `translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) rotate(${hd.toFixed(2)}) translate(0,${bob.toFixed(1)}) rotate(${tilt.toFixed(2)},0,-60)`);

  r.el.spokes.forEach(s => s.setAttribute("transform", `rotate(${r.wheelAngle.toFixed(1)})`));

  /* pedalling legs via 2-bone IK */
  const pedal = (side) => {
    const leg = side ? r.el.legB : r.el.legA;
    if (!leg) return;   // turtle rests feet on pegs — no articulated legs
    const phase = r.crankAngle + (side ? Math.PI : 0);
    const fx = CRANK.x + Math.cos(phase)*CRANK.r;
    const fy = CRANK.y + Math.sin(phase)*CRANK.r;
    leg.setAttribute("points", limbPath(HIP.x, HIP.y, fx, fy, THIGH, SHIN, side?-1:1));
    const shoe = side ? r.el.shoeB : r.el.shoeA;
    if (shoe){
      shoe.setAttribute("cx", fx); shoe.setAttribute("cy", fy);
    } else {
      const claw = side ? r.el.clawB : r.el.clawA;
      if (claw) claw.setAttribute("transform", `translate(${fx+3},${fy})`);
    }
  };
  const isRabbit = r.key === "rabbit";
  const HIP  = isRabbit ? {x:2,y:-84}  : {x:-4,y:-70};
  const CRANK= isRabbit ? {x:6,y:-16,r:11} : {x:40,y:0,r:12};
  const THIGH= 24, SHIN = 24;
  pedal(false); pedal(true);

  if (r.key === "eagle" && !r.finished){
    const flap = Math.sin(t*7)*6;
    r.el.wing && r.el.wing.setAttribute("d",
      `M-2 -100 Q34 ${-108-flap} 40 ${-84-flap*.4} Q22 -88 8 -80 Z`);
  }
  if (r.key === "rabbit" && r.el.ears){
    r.el.ears.setAttribute("transform", `rotate(${Math.sin(t*8)*5},24,-130)`);
  }

  /* exhaust smoke + kicked-up dust */
  if (!r.finished){
    r.puffTimer -= dt;
    if (r.puffTimer <= 0){
      if (r.key === "turtle") spawnPuff(r);
      else spawnDust(r);
      r.puffTimer = 0.09 + Math.random()*0.08;
    }
  }
  r.particles.forEach(pt => {
    pt.life -= dt*1.4;
    const x = parseFloat(pt.node.getAttribute("cx")||0) + pt.vx*dt;
    const y = (parseFloat(pt.node.getAttribute("cy")||0)) + pt.vy*dt;
    pt.node.setAttribute("cx", x.toFixed(1));
    pt.node.setAttribute("cy", (y - 8*dt).toFixed(1));
    const nr = parseFloat(pt.node.getAttribute("r")) + pt.grow*dt*0.4;
    pt.node.setAttribute("r", nr.toFixed(1));
    pt.node.setAttribute("opacity", Math.max(pt.life*0.8,0).toFixed(2));
  });
  r.particles = r.particles.filter(pt => {
    if (pt.life <= 0){ pt.node.remove(); return false; }
    return true;
  });

  /* speed lines fade in with pace */
  if (r.el.speed){
    const intensity = r.finished ? 0 : Math.min(Math.max((speedOf(r,t)/r.base-1.12)*2.2,0),0.9);
    r.el.speed.setAttribute("opacity", intensity.toFixed(2));
  }

  const prog = Math.min((START_ANGLE - r.angle)/(Math.PI*2*LAPS), 1);
  r.progress = prog;
}

function updateBoard(t){
  const order = [...racers].sort((a,b) =>
    (b.finished ? 1e9 - b.finishTime : b.progress) -
    (a.finished ? 1e9 - a.finishTime : a.progress));
  order.forEach((r,i) => {
    r.row.querySelector(".rank").textContent = i+1;
    r.row.querySelector(".rank").className = "rank" + (i<3 ? " r"+(i+1) : "");
    r.el.fill.style.width = (r.progress*100).toFixed(1)+"%";
    r.el.pct.textContent = r.finished
      ? "🏁 "+r.finishTime.toFixed(2)+"s"
      : (r.progress*100).toFixed(0)+"%";
    r.row.classList.toggle("leader", i===0 && !raceOver);
    document.getElementById("rows").appendChild(r.row);
  });
  const leader = order[0];
  if (!raceOver){
    statusEl.textContent = leader.finished
      ? `${leader.name} took the checkered flag!`
      : `${leader.name} leads with ${(leader.progress*100).toFixed(0)}% of the ring complete`;
  }
}

let bannerCountdown = null;
function updateBanner(t){
  const allDone = racers.every(r => r.finished);
  if (allDone && !raceOver){
    raceOver = true;
    const order = [...racers].sort((a,b)=>a.finishTime-b.finishTime);
    bannerEl.innerHTML =
      `🏁 <b>${order[0].name}</b> wins the Martian Grand Prix!<br>` +
      order.map((r,i)=>`${["🥇","🥈","🥉"][i]} ${r.name} — ${r.finishTime.toFixed(2)}s`).join("<br>") +
      `<br><span style="color:var(--dim)">Restarting in <b id="cd">5</b>s…</span>`;
    let n = 5;
    bannerCountdown = setInterval(()=>{
      n--; const cd = document.getElementById("cd");
      if (n <= 0){ clearInterval(bannerCountdown); resetRace(); }
      else if (cd) cd.textContent = n;
    }, 1000);
  }
}

function resetRace(){
  raceOver = false;
  startTime = performance.now();
  bannerEl.textContent = "Lap 1 — GO!";
  setTimeout(()=>{ if(!raceOver) bannerEl.textContent = "Race in progress…"; }, 2000);
  racers.forEach(r=>{
    r.angle = START_ANGLE; r.dist = 0; r.wheelAngle = 0;
    r.finished = false; r.finishTime = null;
    r.particles.forEach(p=>p.node.remove()); r.particles = [];
  });
}

let lastT = performance.now();
function frame(now){
  const dt = Math.min((now-lastT)/1000, 0.05);
  lastT = now;
  const t = (now-startTime)/1000;
  clockEl.textContent = t.toFixed(2)+" s";
  racers.forEach(r => updateRacer(r, t, dt));
  updateBoard(t);
  updateBanner(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
