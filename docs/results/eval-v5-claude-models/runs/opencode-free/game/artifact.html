<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Space Shooter</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
    overflow: hidden;
  }
  #wrap {
    position: relative;
    width: 800px;
    margin: 0 auto;
  }
  canvas {
    display: block;
    background: #000011;
  }
  #startBtn {
    position: absolute;
    left: 50%;
    top: 68%;
    transform: translateX(-50%);
    padding: 14px 44px;
    font: bold 24px monospace;
    color: #000011;
    background: #ffcc00;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    display: none;
  }
  #startBtn:hover { background: #ffe066; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="600"></canvas>
  <button id="startBtn">START</button>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var startBtn = document.getElementById('startBtn');
  var W = canvas.width;
  var H = canvas.height;

  // Game states
  var STATE_START = 'start';
  var STATE_PLAYING = 'playing';
  var state = STATE_START;

  // Input
  var keys = {};

  // Entities
  var player = null;
  var bullets = [];
  var enemyBullets = [];
  var enemies = [];
  var explosions = [];
  var powerups = [];
  var stars = [];

  var score = 0;
  var spawnTimer = 0;
  var shootCooldown = 0;
  var frameCount = 0;

  function resetGame() {
    player = {
      x: W / 2,
      y: H - 60,
      w: 36,
      h: 30,
      speed: 5,
      lives: 3,
      invuln: 90,
      weaponLevel: 1,
      shield: 0
    };
    bullets = [];
    enemyBullets = [];
    enemies = [];
    explosions = [];
    powerups = [];
    score = 0;
    spawnTimer = 0;
    shootCooldown = 0;
  }

  // Starfield background
  (function initStars() {
    var i;
    for (i = 0; i < 80; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.5 + 0.5,
        v: Math.random() * 1.5 + 0.3
      });
    }
  })();

  window.addEventListener('keydown', function (e) {
    keys[e.code] = true;
    if (e.code === 'Space') {
      e.preventDefault();
      if (state === STATE_START) startGame();
    }
    if ((e.code === 'Enter' || e.code === 'NumpadEnter') && state === STATE_START) {
      startGame();
    }
  });

  window.addEventListener('keyup', function (e) {
    keys[e.code] = false;
  });

  startBtn.addEventListener('click', startGame);

  function startGame() {
    resetGame();
    state = STATE_PLAYING;
    startBtn.style.display = 'none';
  }

  function endGame() {
    state = STATE_START;
    startBtn.style.display = 'block';
  }

  function spawnEnemy() {
    enemies.push({
      x: Math.random() * (W - 40) + 20,
      y: -20,
      w: 32,
      h: 26,
      vy: Math.random() * 1.5 + 1,
      vx: (Math.random() - 0.5) * 1.5,
      shootTimer: Math.floor(Math.random() * 120) + 60
    });
  }

  function spawnPowerup(x, y) {
    // Weighted random type: weapon / shield / life
    var roll = Math.random();
    var type;
    if (roll < 0.5) type = 'weapon';
    else if (roll < 0.85) type = 'shield';
    else type = 'life';
    powerups.push({ x: x, y: y, w: 22, h: 22, vy: 1.6, type: type });
  }

  function addExplosion(x, y, big) {
    var count = big ? 32 : 16;
    for (var i = 0; i < count; i++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = Math.random() * (big ? 5 : 3.2) + 0.8;
      var colors = ['#ffffff', '#ffaa00', '#ff5500', '#ff2222'];
      explosions.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: Math.random() * 3 + 1.5,
        life: Math.floor(Math.random() * 15) + (big ? 30 : 20),
        maxLife: big ? 45 : 35,
        drag: 0.96,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }
    // Shockwave ring
    explosions.push({
      x: x, y: y, ring: true, radius: 4, maxRadius: big ? 60 : 34,
      life: 18, maxLife: 18, color: '#aaddff'
    });
  }

  // Circle-based AABB-vs-circle collision with per-entity radii
  function hitTest(a, b) {
    var dx = a.x - b.x;
    var dy = a.y - b.y;
    var distSq = dx * dx + dy * dy;
    var rSum = (Math.min(a.w, a.h) + Math.min(b.w, b.h)) / 2;
    return distSq <= rSum * rSum;
  }

  function damagePlayer() {
    if (player.invuln > 0 || player.shield > 0) {
      if (player.shield > 0) {
        player.shield = 0;
        player.invuln = 60;
        addExplosion(player.x, player.y - 10, false);
      }
      return;
    }
    addExplosion(player.x, player.y, true);
    player.lives--;
    if (player.lives <= 0) {
      endGame();
    } else {
      player.invuln = 120;
      player.weaponLevel = Math.max(1, player.weaponLevel - 1);
      player.x = W / 2;
      player.y = H - 60;
    }
  }

  function update(dt) {
    var i, j;
    frameCount++;

    // Stars always drift
    for (i = 0; i < stars.length; i++) {
      stars[i].y += stars[i].v;
      if (stars[i].y > H) {
        stars[i].y = -2;
        stars[i].x = Math.random() * W;
      }
    }

    // Explosions always animate
    for (i = explosions.length - 1; i >= 0; i--) {
      var p = explosions[i];
      p.life--;
      if (p.ring) {
        p.radius += (p.maxRadius - p.radius) * 0.2;
      } else {
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= p.drag;
        p.vy *= p.drag;
      }
      if (p.life <= 0) explosions.splice(i, 1);
    }

    if (state !== STATE_PLAYING) return;

    // Player invulnerability timer
    if (player.invuln > 0) player.invuln -= dt;

    // Player movement
    if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
    if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
    if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
    if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;
    player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));
    player.y = Math.max(player.h / 2, Math.min(H - player.h / 2, player.y));

    // Shooting — multi-shot scales with weapon level
    if (shootCooldown > 0) shootCooldown -= dt;
    if ((keys['Space'] || keys['KeyJ']) && shootCooldown <= 0) {
      var py = player.y - player.h / 2;
      if (player.weaponLevel >= 3) {
        bullets.push({ x: player.x, y: py, vx: 0, vy: -8, w: 8, h: 12 });
        bullets.push({ x: player.x - 12, y: py + 6, vx: -1.5, vy: -7.5, w: 6, h: 10 });
        bullets.push({ x: player.x + 12, y: py + 6, vx: 1.5, vy: -7.5, w: 6, h: 10 });
      } else if (player.weaponLevel === 2) {
        bullets.push({ x: player.x - 7, y: py, vx: 0, vy: -8, w: 6, h: 12 });
        bullets.push({ x: player.x + 7, y: py, vx: 0, vy: -8, w: 6, h: 12 });
      } else {
        bullets.push({ x: player.x, y: py, vx: 0, vy: -8, w: 6, h: 12 });
      }
      shootCooldown = 11;
    }

    // Bullets
    for (i = bullets.length - 1; i >= 0; i--) {
      var b = bullets[i];
      b.x += b.vx;
      b.y += b.vy;
      if (b.y < -10 || b.x < -10 || b.x > W + 10) bullets.splice(i, 1);
    }

    // Enemy bullets
    for (i = enemyBullets.length - 1; i >= 0; i--) {
      var eb = enemyBullets[i];
      eb.x += eb.vx;
      eb.y += eb.vy;
      if (eb.y > H + 10 || eb.y < -10 || eb.x < -10 || eb.x > W + 10) {
        enemyBullets.splice(i, 1);
      }
    }

    // Enemy spawning
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnEnemy();
      spawnTimer = Math.max(25, 70 - score / 50);
    }

    // Enemies
    for (i = enemies.length - 1; i >= 0; i--) {
      var e = enemies[i];
      e.y += e.vy;
      e.x += e.vx;
      if (e.x < e.w / 2 || e.x > W - e.w / 2) e.vx = -e.vx;

      // Enemies shoot back occasionally
      e.shootTimer -= dt;
      if (e.shootTimer <= 0 && e.y > 0 && e.y < H - 100) {
        var ang = Math.atan2(player.y - e.y, player.x - e.x);
        enemyBullets.push({
          x: e.x, y: e.y, w: 6, h: 6,
          vx: Math.cos(ang) * 3.2,
          vy: Math.sin(ang) * 3.2
        });
        e.shootTimer = Math.floor(Math.random() * 150) + 90;
      }

      // Off screen bottom
      if (e.y > H + 30) {
        enemies.splice(i, 1);
        continue;
      }

      // Bullet vs enemy (fixed: bullet removed only when it hits; enemy loop safe)
      var killed = false;
      for (j = bullets.length - 1; j >= 0; j--) {
        if (hitTest(bullets[j], e)) {
          addExplosion(e.x, e.y, false);
          bullets.splice(j, 1);
          score += 10;
          killed = true;
          // ~12% chance to drop a power-up
          if (Math.random() < 0.12) spawnPowerup(e.x, e.y);
          break;
        }
      }
      if (killed) enemies.splice(i, 1);
    }

    // Player vs enemies
    for (i = enemies.length - 1; i >= 0; i--) {
      if (player.invuln <= 0 && hitTest(player, enemies[i])) {
        addExplosion(enemies[i].x, enemies[i].y, false);
        enemies.splice(i, 1);
        damagePlayer();
        if (state !== STATE_PLAYING) break;
      }
    }

    // Player vs enemy bullets
    for (i = enemyBullets.length - 1; i >= 0; i--) {
      if (hitTest(enemyBullets[i], player)) {
        enemyBullets.splice(i, 1);
        damagePlayer();
        if (state !== STATE_PLAYING) break;
      }
    }

    // Power-ups fall and are collected
    for (i = powerups.length - 1; i >= 0; i--) {
      var pu = powerups[i];
      pu.y += pu.vy;
      if (pu.y > H + 20) {
        powerups.splice(i, 1);
        continue;
      }
      if (hitTest(pu, player)) {
        if (pu.type === 'weapon') {
          player.weaponLevel = Math.min(3, player.weaponLevel + 1);
          score += 5;
        } else if (pu.type === 'shield') {
          player.shield = 1;
        } else if (pu.type === 'life') {
          player.lives = Math.min(5, player.lives + 1);
        }
        powerups.splice(i, 1);
      }
    }
  }

  function drawShip(x, y, color, blink) {
    if (blink) return;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y - 15);
    ctx.lineTo(x + 14, y + 12);
    ctx.lineTo(x, y + 6);
    ctx.lineTo(x - 14, y + 12);
    ctx.closePath();
    ctx.fill();
    if (player.shield > 0) {
      ctx.strokeStyle = '#66ffff';
      ctx.globalAlpha = 0.5 + Math.sin(frameCount * 0.15) * 0.3;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, 26, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  function drawEnemy(e) {
    ctx.fillStyle = '#ff3355';
    ctx.fillRect(e.x - e.w / 2, e.y - e.h / 2, e.w, e.h);
    ctx.fillStyle = '#ffcc00';
    ctx.fillRect(e.x - e.w / 2 + 4, e.y - 4, e.w - 8, 8);
  }

  var POWERUP_STYLE = {
    weapon: { fill: '#33ff88', label: 'W' },
    shield: { fill: '#66ffff', label: 'S' },
    life:   { fill: '#ff6699', label: '+' }
  };

  function drawPowerup(pu) {
    var s = POWERUP_STYLE[pu.type];
    ctx.save();
    ctx.translate(pu.x, pu.y);
    ctx.rotate(Math.sin(frameCount * 0.05) * 0.3);
    ctx.fillStyle = s.fill;
    ctx.fillRect(-pu.w / 2, -pu.h / 2, pu.w, pu.h);
    ctx.restore();
    ctx.fillStyle = '#000';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(s.label, pu.x, pu.y + 1);
    ctx.textBaseline = 'alphabetic';
  }

  function render() {
    var i;

    // Background
    ctx.fillStyle = '#000011';
    ctx.fillRect(0, 0, W, H);

    // Stars
    ctx.fillStyle = '#ffffff';
    for (i = 0; i < stars.length; i++) {
      ctx.globalAlpha = 0.4 + stars[i].r / 3;
      ctx.fillRect(stars[i].x, stars[i].y, stars[i].r, stars[i].r);
    }
    ctx.globalAlpha = 1;

    // Explosions
    for (i = 0; i < explosions.length; i++) {
      var p = explosions[i];
      if (p.ring) {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      }
    }
    ctx.globalAlpha = 1;

    if (state === STATE_PLAYING) {
      // Bullets
      ctx.fillStyle = '#66ffff';
      for (i = 0; i < bullets.length; i++) {
        ctx.fillRect(bullets[i].x - 2, bullets[i].y - 6, 4, 12);
      }

      // Enemy bullets
      ctx.fillStyle = '#ff8844';
      for (i = 0; i < enemyBullets.length; i++) {
        ctx.beginPath();
        ctx.arc(enemyBullets[i].x, enemyBullets[i].y, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      // Enemies
      for (i = 0; i < enemies.length; i++) {
        drawEnemy(enemies[i]);
      }

      // Power-ups
      for (i = 0; i < powerups.length; i++) {
        drawPowerup(powerups[i]);
      }

      // Player (blink while invulnerable)
      drawShip(player.x, player.y, '#33ff88',
               player.invuln > 0 && Math.floor(frameCount / 4) % 2 === 0);

      // HUD: score, lives, weapon level
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px monospace';
      ctx.textAlign = 'left';
      ctx.fillText('SCORE: ' + score, 16, 34);
      ctx.fillText('LIVES: ' + player.lives, 16, 62);
      ctx.fillStyle = '#33ff88';
      var wl = '';
      for (var k = 0; k < player.weaponLevel; k++) wl += '▲';
      ctx.fillText('POWER: ' + wl, 16, 90);
      if (player.shield > 0) {
        ctx.fillStyle = '#66ffff';
        ctx.fillText('SHIELD', 16, 118);
      }
    } else {
      // Start screen
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 48px monospace';
      ctx.fillText('SPACE SHOOTER', W / 2, H / 2 - 80);

      if (score > 0) {
        ctx.font = '24px monospace';
        ctx.fillText('Final score: ' + score, W / 2, H / 2 - 40);
      }

      ctx.font = '20px monospace';
      ctx.fillStyle = '#66ffff';
      ctx.fillText('Move: Arrow Keys / WASD', W / 2, H / 2 + 10);
      ctx.fillText('Shoot: Space', W / 2, H / 2 + 40);
      ctx.fillStyle = POWERUP_STYLE.weapon.fill;
      ctx.fillText('Green W: Weapon Up   Cyan S: Shield', W / 2, H / 2 + 75);
      ctx.fillStyle = POWERUP_STYLE.life.fill;
      ctx.fillText('Pink +: Extra Life', W / 2, H / 2 + 105);
      ctx.fillStyle = '#ffcc00';
      ctx.font = 'bold 20px monospace';
      ctx.fillText('Click START or press SPACE', W / 2, H / 2 + 160);
    }
  }

  var lastTime = 0;
  function loop(timestamp) {
    var dt = lastTime ? Math.min(50, timestamp - lastTime) : 16.7;
    lastTime = timestamp;
    // Normalize dt to ~60fps frames
    update(dt / 16.7);
    render();
    requestAnimationFrame(loop);
  }

  resetGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
