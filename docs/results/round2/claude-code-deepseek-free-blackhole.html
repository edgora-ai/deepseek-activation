<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Black Hole · Three.js</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  canvas { display: block; }
  #info {
    position: fixed;
    right: 16px;
    bottom: 12px;
    color: rgba(255,255,255,0.55);
    font: 12px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: 0.04em;
    user-select: none;
    pointer-events: none;
  }
  #fallback {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    color: #fff;
    font: 14px/1.6 ui-sans-serif, system-ui, sans-serif;
    background: #000;
    text-align: center;
    padding: 24px;
  }
  /* soft vignette */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
  }
</style>
</head>
<body>
<div id="info">Drag to orbit &nbsp;·&nbsp; Scroll to zoom</div>
<div id="fallback">This demo needs WebGL. Your browser or GPU may not support it.</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------------------
// Renderer
// ---------------------------------------------------------------------------
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (err) {
  document.getElementById('fallback').style.display = 'flex';
  throw err;
}
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

// ---------------------------------------------------------------------------
// Scene / camera / controls
// ---------------------------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000004);

const camera = new THREE.PerspectiveCamera(
  55, window.innerWidth / window.innerHeight, 0.1, 2000
);
camera.position.set(0, 5.2, 26);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 12;
controls.maxDistance = 60;
controls.enabled = false; // enabled after the intro dolly

// ---------------------------------------------------------------------------
// Soft radial glow sprite (procedural — no external assets)
// ---------------------------------------------------------------------------
function makeGlowTexture() {
  const size = 64;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(
    size / 2, size / 2, 0, size / 2, size / 2, size / 2
  );
  g.addColorStop(0.0, 'rgba(255,255,255,1)');
  g.addColorStop(0.25, 'rgba(255,255,255,0.9)');
  g.addColorStop(0.5, 'rgba(255,255,255,0.4)');
  g.addColorStop(1.0, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
const glowTex = makeGlowTexture();

// ---------------------------------------------------------------------------
// Event horizon (pure shadow)
// ---------------------------------------------------------------------------
const horizon = new THREE.Mesh(
  new THREE.SphereGeometry(2, 64, 64),
  new THREE.MeshBasicMaterial({ color: 0x000000 })
);
scene.add(horizon);

// ---------------------------------------------------------------------------
// Particle shader with fake gravitational lensing.
// The disk sits in the equatorial plane (y = 0). A vertex shader bends it:
// the half of the disk behind the black hole (relative to the camera) is
// lifted above the shadow, the near half dips below — the classic look.
// The warp keys on the camera azimuth, so it reads correctly from any orbit.
// ---------------------------------------------------------------------------
const LENS_VERT = /* glsl */`
  attribute vec3 aColor;
  attribute float aSize;
  uniform vec2  uCamDir;   // cos(azimuth), sin(azimuth) of camera direction
  uniform float uK;        // lensing strength
  uniform float uRin;      // inner radius (warp falloff reference)
  varying vec3 vColor;
  void main() {
    vColor = aColor;
    vec3 p = position;
    float r = max(length(p.xz), 1e-4);
    float t = (p.x * uCamDir.x + p.z * uCamDir.y) / r; // +1 = toward camera
    float fall = exp(-(r - uRin) * 0.42);               // strong near the hole
    p.y -= uK * fall * t;                               // far arcs up, near dips down
    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    gl_PointSize = aSize * (140.0 / -mv.z);
    gl_Position = projectionMatrix * mv;
  }
`;

const LENS_FRAG = /* glsl */`
  uniform sampler2D uTex;
  varying vec3 vColor;
  void main() {
    float a = texture2D(uTex, gl_PointCoord).a;
    gl_FragColor = vec4(vColor, a);
  }
`;

// Temperature color ramp: white-hot inner -> deep red outer
const DISK_STOPS = [
  [0.00, [255, 248, 240]],
  [0.18, [255, 210, 130]],
  [0.40, [255, 158,  64]],
  [0.62, [224,  96,  34]],
  [0.82, [150,  40,  18]],
  [1.00, [ 70,  18,  10]]
];
const RING_STOPS = [
  [0.0, [255, 244, 226]],
  [1.0, [255, 214, 150]]
];

function tempColorAt(stops, t) {
  for (let i = 0; i < stops.length - 1; i++) {
    const a = stops[i];
    const b = stops[i + 1];
    if (t <= b[0]) {
      const u = (t - a[0]) / Math.max(b[0] - a[0], 1e-6);
      const ca = a[1];
      const cb = b[1];
      return [
        (ca[0] + (cb[0] - ca[0]) * u) / 255,
        (ca[1] + (cb[1] - ca[1]) * u) / 255,
        (ca[2] + (cb[2] - ca[2]) * u) / 255
      ];
    }
  }
  const c = stops[stops.length - 1][1];
  return [c[0] / 255, c[1] / 255, c[2] / 255];
}

// Builds an equatorial particle annulus rendered with the lensing shader.
function makeDisk(points, opts) {
  const pos = new Float32Array(points * 3);
  const col = new Float32Array(points * 3);
  const siz = new Float32Array(points);
  for (let i = 0; i < points; i++) {
    const t = Math.pow(Math.random(), opts.power); // 0 = inner edge
    const r = opts.radMin + (opts.radMax - opts.radMin) * t;
    const phi = Math.random() * Math.PI * 2;
    pos[i * 3]     = Math.cos(phi) * r;
    pos[i * 3 + 1] = 0;
    pos[i * 3 + 2] = Math.sin(phi) * r;
    const c = tempColorAt(opts.stops, t);
    col[i * 3]     = c[0];
    col[i * 3 + 1] = c[1];
    col[i * 3 + 2] = c[2];
    siz[i] = opts.sizeMax - (opts.sizeMax - opts.sizeMin) * t;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aColor',   new THREE.BufferAttribute(col, 3));
  geo.setAttribute('aSize',    new THREE.BufferAttribute(siz, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTex:    { value: glowTex },
      uCamDir: { value: new THREE.Vector2(0, 1) },
      uK:      { value: opts.bend },
      uRin:    { value: opts.radMin }
    },
    vertexShader: LENS_VERT,
    fragmentShader: LENS_FRAG,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  return new THREE.Points(geo, mat);
}

// Accretion disk
const disk = makeDisk(17000, {
  radMin: 3.0, radMax: 11.0,
  sizeMin: 0.8, sizeMax: 1.7,
  stops: DISK_STOPS, power: 1.7, bend: 2.1
});
scene.add(disk);

// Bright photon ring hugging the shadow
const ring = makeDisk(3000, {
  radMin: 2.55, radMax: 2.78,
  sizeMin: 1.4, sizeMax: 1.9,
  stops: RING_STOPS, power: 1.0, bend: 2.1
});
scene.add(ring);

// ---------------------------------------------------------------------------
// Starfield
// ---------------------------------------------------------------------------
const STAR_PALETTE = [
  [255, 255, 255],
  [214, 230, 255],
  [255, 236, 214],
  [180, 205, 255]
];

function buildStars(count, size, opacity, additive) {
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const v = new THREE.Vector3();
  for (let i = 0; i < count; i++) {
    const r = 130 + Math.pow(Math.random(), 0.5) * 480;
    v.randomDirection().multiplyScalar(r);
    pos[i * 3]     = v.x;
    pos[i * 3 + 1] = v.y;
    pos[i * 3 + 2] = v.z;
    const p = STAR_PALETTE[(Math.random() * STAR_PALETTE.length) | 0];
    col[i * 3]     = p[0] / 255;
    col[i * 3 + 1] = p[1] / 255;
    col[i * 3 + 2] = p[2] / 255;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({
    size,
    map: glowTex,
    vertexColors: true,
    transparent: true,
    depthWrite: false,
    opacity,
    blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending
  });
  return new THREE.Points(geo, mat);
}

scene.add(buildStars(3400, 0.8, 0.6, false)); // faint stars
scene.add(buildStars(420, 1.6, 0.9, true));   // bright highlights

// ---------------------------------------------------------------------------
// Bloom postprocessing
// ---------------------------------------------------------------------------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  1.35,   // strength
  0.55,   // radius
  0.32    // threshold
);
composer.addPass(bloomPass);

// ---------------------------------------------------------------------------
// Animation
// ---------------------------------------------------------------------------
const FINAL = camera.position.clone();
const introDir = FINAL.clone().normalize();
const R0 = 46;                        // intro starts far out
const R1 = FINAL.length();            // ...and settles at the resting distance
const t0 = performance.now();
let introDone = false;

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();

  if (!introDone) {
    const k = Math.min(1, (now - t0) / 2600);
    const ease = 1 - Math.pow(1 - k, 3); // ease-out cubic
    camera.position.copy(introDir).multiplyScalar(R0 + (R1 - R0) * ease);
    camera.lookAt(0, 0, 0);
    if (k >= 1) {
      introDone = true;
      controls.enabled = true;
    }
  } else {
    controls.update(); // damping + autoRotate
  }

  // Rotate the lensing warp with the camera so the near/far halves stay
  // correct from every orbital position.
  const azi = Math.atan2(camera.position.z, camera.position.x);
  const cosA = Math.cos(azi);
  const sinA = Math.sin(azi);
  disk.material.uniforms.uCamDir.value.set(cosA, sinA);
  ring.material.uniforms.uCamDir.value.set(cosA, sinA);

  composer.render();
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

window.addEventListener('error', (e) => {
  const fb = document.getElementById('fallback');
  fb.style.display = 'flex';
  fb.textContent = 'Failed to load: ' + String(e.message || e.type) +
    ' — check your network (modules load from a CDN).';
});
</script>
</body>
</html>
