<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Black Hole — Three.js</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    color: #cfe0e8; opacity: 0.8;
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.2em; text-align: center; text-transform: uppercase;
    pointer-events: none; user-select: none;
    text-shadow: 0 0 8px #000, 0 0 2px #000;
  }
</style>
</head>
<body>
<div id="hud">Event horizon &middot; Sagittarius A* &middot; capture G2</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/tsl": "https://unpkg.com/three@0.170.0/build/three.tsl.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

/* ---------------- renderer / scene ---------------- */

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance",
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.0018);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 1200);
camera.position.set(9, 3.2, 0);

/* ---------------- bloom postprocessing ---------------- */

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  1.35,   // strength
  0.85,   // radius
  0.12    // threshold
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

/* ---------------- starfield ---------------- */

function makeStarfield(count = 5000) {
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const c = new THREE.Color();

  for (let i = 0; i < count; i++) {
    const r = 220 + Math.pow(Math.random(), 0.6) * 330;
    const theta = Math.acos(2 * Math.random() - 1);
    const phi = Math.random() * Math.PI * 2;

    positions[i * 3] = r * Math.sin(theta) * Math.cos(phi);
    positions[i * 3 + 1] = r * Math.cos(theta) * 0.65;
    positions[i * 3 + 2] = r * Math.sin(theta) * Math.sin(phi);

    const b = 0.25 + Math.pow(Math.random(), 1.8) * 0.75;
    c.setHSL(0.62 + Math.random() * 0.12, 0.12, b);
    colors[i * 3] = c.r;
    colors[i * 3 + 1] = c.g;
    colors[i * 3 + 2] = c.b;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));

  const mat = new THREE.PointsMaterial({
    size: 1.6,
    sizeAttenuation: true,
    vertexColors: true,
  });
  const stars = new THREE.Points(geo, mat);
  stars.frustumCulled = false;
  return stars;
}

scene.add(makeStarfield());

/* ---------------- accretion disk texture (canvas) ---------------- */

function makeAccretionTexture() {
  const w = 1024, h = 128;
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d");

  const grad = ctx.createLinearGradient(0, 0, w, 0);
  grad.addColorStop(0.00, "rgba(0, 0, 0, 0)");
  grad.addColorStop(0.015, "rgba(255, 255, 245, 0.95)");
  grad.addColorStop(0.06, "rgba(255, 214, 160, 0.9)");
  grad.addColorStop(0.16, "rgba(255, 160, 80, 0.62)");
  grad.addColorStop(0.38, "rgba(214, 100, 54, 0.34)");
  grad.addColorStop(0.7, "rgba(150, 64, 48, 0.14)");
  grad.addColorStop(1.0, "rgba(80, 30, 30, 0)");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  const vgrad = ctx.createLinearGradient(0, 0, 0, h);
  vgrad.addColorStop(0, "rgba(0, 0, 0, 1)");
  vgrad.addColorStop(0.42, "rgba(0, 0, 0, 0)");
  vgrad.addColorStop(0.58, "rgba(0, 0, 0, 0)");
  vgrad.addColorStop(1, "rgba(0, 0, 0, 1)");
  ctx.globalCompositeOperation = "destination-in";
  ctx.fillStyle = vgrad;
  ctx.fillRect(0, 0, w, h);

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ---------------- glowing particle disk ---------------- */

function makeParticleDisk(count, rInner, rOuter, size, brightness) {
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const r2i = rInner * rInner;
  const r2o = rOuter * rOuter;

  for (let i = 0; i < count; i++) {
    const r = Math.sqrt(r2i + Math.random() * (r2o - r2i));
    const a = Math.random() * Math.PI * 2;
    const t = (r - rInner) / (rOuter - rInner);
    const y = (Math.random() - 0.5) * 0.16 * (1.25 - t);

    positions[i * 3] = Math.cos(a) * r;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = Math.sin(a) * r;

    const b = brightness * (0.55 + 0.65 * Math.random());
    colors[i * 3] = 1.0 * b;
    colors[i * 3 + 1] = (0.55 + 0.45 * (1 - t)) * b;
    colors[i * 3 + 2] = 0.35 * (1 - t) * (1 - t) * b;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));

  const mat = new THREE.PointsMaterial({
    size: size,
    sizeAttenuation: true,
    vertexColors: true,
    transparent: true,
    opacity: 0.95,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  return new THREE.Points(geo, mat);
}

/* ---------------- black hole system ---------------- */

const tiltGroup = new THREE.Group();
tiltGroup.rotation.x = 1.08; // tilt the disk toward the camera
scene.add(tiltGroup);

const system = new THREE.Group();
tiltGroup.add(system);

// event horizon
const core = new THREE.Mesh(
  new THREE.SphereGeometry(0.55, 64, 64),
  new THREE.MeshBasicMaterial({ color: 0x000000 })
);
system.add(core);

// faint frame-dragging glow around the horizon
const halo = new THREE.Mesh(
  new THREE.SphereGeometry(0.74, 48, 48),
  new THREE.MeshBasicMaterial({
    color: 0x0d2233,
    transparent: true,
    opacity: 0.5,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  })
);
system.add(halo);

// photon rings
const ringMat = (color, opacity) => new THREE.MeshBasicMaterial({
  color, transparent: true, opacity,
  blending: THREE.AdditiveBlending, depthWrite: false,
});
const photonRing = new THREE.Mesh(
  new THREE.TorusGeometry(0.92, 0.028, 16, 128),
  ringMat(0xffd9a0, 0.9)
);
const outerPhotonRing = new THREE.Mesh(
  new THREE.TorusGeometry(1.07, 0.016, 16, 128),
  ringMat(0xcc8855, 0.45)
);
system.add(photonRing, outerPhotonRing);

// smooth disk body + two differentially rotating particle layers
const disk = new THREE.Mesh(
  new THREE.RingGeometry(1.3, 6.4, 180, 1),
  new THREE.MeshBasicMaterial({
    map: makeAccretionTexture(),
    transparent: true,
    opacity: 0.85,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide,
  })
);
const innerParticles = makeParticleDisk(5200, 1.55, 3.15, 0.075, 1.6);
const outerParticles = makeParticleDisk(3600, 3.0, 6.6, 0.1, 0.9);
system.add(disk, innerParticles, outerParticles);

/* ---------------- orbiting camera + pointer ---------------- */

const pointer = { x: 0, y: 0, tx: 0, ty: 0 };
addEventListener("pointermove", (e) => {
  pointer.tx = (e.clientX / innerWidth) * 2 - 1;
  pointer.ty = (e.clientY / innerHeight) * 2 - 1;
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // smooth pointer influence
  pointer.x += (pointer.tx - pointer.x) * 0.04;
  pointer.y += (pointer.ty - pointer.y) * 0.04;

  // orbit camera around the hole
  const a = t * 0.11;
  const radius = 9.4 + Math.sin(t * 0.18) * 0.9;
  const height = 3.0 * (1 + Math.sin(t * 0.11) * 0.22);
  camera.position.set(
    Math.cos(a) * radius + pointer.x * 0.6,
    height + pointer.y * 0.4,
    Math.sin(a) * radius
  );
  camera.lookAt(0, 0, 0);

  // differential rotation: inner material spins faster
  innerParticles.rotation.y += dt * 0.5;
  outerParticles.rotation.y += dt * 0.18;
  disk.rotation.y += dt * 0.22;
  system.rotation.z = Math.sin(t * 0.07) * 0.04; // slow precession

  composer.render();
}

animate();

/* ---------------- resize ---------------- */

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
