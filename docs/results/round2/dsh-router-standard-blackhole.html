<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Black Hole — Three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 24px; bottom: 20px;
    color: #cfd8ea; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.75;
    pointer-events: none; user-select: none;
  }
  #hud h1 { margin: 0 0 4px; font-size: 14px; color: #fff; letter-spacing: 0.3em; }
</style>
</head>
<body>
<div id="hud">
  <h1>Black Hole</h1>
  drag to orbit &middot; scroll to zoom
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ---------- renderer / scene / camera ---------- */

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1500);
camera.position.set(0, 12, 32);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;          // orbiting camera
controls.autoRotateSpeed = 0.8;
controls.minDistance = 6;
controls.maxDistance = 140;
controls.maxPolarAngle = Math.PI * 0.85;

/* ---------- starfield ---------- */

function makeGlowTexture() {
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0.0, 'rgba(255,255,255,1)');
  g.addColorStop(0.25, 'rgba(255,255,255,0.7)');
  g.addColorStop(0.6, 'rgba(255,255,255,0.15)');
  g.addColorStop(1.0, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(canvas);
}
const glowTex = makeGlowTexture();

function buildStars(count, size, useGlow) {
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < count; i++) {
    const u = Math.random() * 2 - 1;
    const theta = Math.random() * Math.PI * 2;
    const r = 180 + Math.random() * 420;
    const s = Math.sqrt(1 - u * u);
    pos[i * 3] = r * s * Math.cos(theta);
    pos[i * 3 + 1] = r * u;
    pos[i * 3 + 2] = r * s * Math.sin(theta);
    const roll = Math.random();
    if (roll < 0.72) c.setHSL(0.6, 0.4, 0.55 + Math.random() * 0.45);    // blue-white
    else if (roll < 0.9) c.setHSL(0.08, 0.6, 0.5 + Math.random() * 0.4); // warm
    else c.setHSL(0.0, 0.0, 0.7 + Math.random() * 0.3);                   // white
    const b = 0.5 + Math.random() * 0.5;
    col[i * 3] = c.r * b;
    col[i * 3 + 1] = c.g * b;
    col[i * 3 + 2] = c.b * b;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({
    size,
    map: useGlow ? glowTex : null,
    vertexColors: true,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true,
  });
  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  return points;
}

scene.add(buildStars(2600, 1.4, false));
scene.add(buildStars(220, 9, true));

/* ---------- black hole body ---------- */

// Event horizon: a pure black sphere that occludes disk particles behind it.
const horizon = new THREE.Mesh(
  new THREE.SphereGeometry(2.2, 64, 64),
  new THREE.MeshBasicMaterial({ color: 0x000000 })
);
scene.add(horizon);

// Disk plane is tilted slightly; horizon stays spherical so it lives outside the group.
const diskGroup = new THREE.Group();
diskGroup.rotation.x = 0.18;
scene.add(diskGroup);

// Thin bright photon ring just outside the horizon.
const ring = new THREE.Mesh(
  new THREE.RingGeometry(2.45, 2.7, 128),
  new THREE.MeshBasicMaterial({
    color: 0xffd9a0,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.85,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  })
);
ring.rotation.x = -Math.PI / 2;
diskGroup.add(ring);

/* ---------- accretion disk: glowing particles in Keplerian orbit ---------- */

const DISK_COUNT = 9000;
const INNER_R = 3.1;
const OUTER_R = 11.5;

const diskPos = new Float32Array(DISK_COUNT * 3);
const diskCol = new Float32Array(DISK_COUNT * 3);
const diskSize = new Float32Array(DISK_COUNT);
const diskPhase = new Float32Array(DISK_COUNT);
const diskAngle = new Float32Array(DISK_COUNT);
const diskRadius = new Float32Array(DISK_COUNT);
const diskOmega = new Float32Array(DISK_COUNT);
const diskY = new Float32Array(DISK_COUNT);

const cHot = new THREE.Color(1.0, 0.92, 0.78);   // white-hot inner
const cMid = new THREE.Color(1.0, 0.55, 0.18);   // orange
const cCool = new THREE.Color(0.75, 0.18, 0.08); // deep red outer
const tmpC = new THREE.Color();

for (let i = 0; i < DISK_COUNT; i++) {
  const r = INNER_R + (OUTER_R - INNER_R) * Math.pow(Math.random(), 1.8); // denser inward
  const angle = Math.random() * Math.PI * 2;
  const t = (r - INNER_R) / (OUTER_R - INNER_R);
  const thickness = 0.35 + t * 0.9; // flared disk
  const y = (Math.random() - 0.5) * thickness;
  if (t < 0.5) tmpC.copy(cHot).lerp(cMid, t * 2);
  else tmpC.copy(cMid).lerp(cCool, (t - 0.5) * 2);
  const bright = 0.7 + Math.random() * 0.6;
  diskPos[i * 3] = Math.cos(angle) * r;
  diskPos[i * 3 + 1] = y;
  diskPos[i * 3 + 2] = Math.sin(angle) * r;
  diskCol[i * 3] = tmpC.r * bright;
  diskCol[i * 3 + 1] = tmpC.g * bright;
  diskCol[i * 3 + 2] = tmpC.b * bright;
  diskSize[i] = 0.35 + Math.random() * 0.55;
  diskPhase[i] = Math.random() * Math.PI * 2;
  diskAngle[i] = angle;
  diskRadius[i] = r;
  diskOmega[i] = 10.9 * Math.pow(r, -1.5); // Keplerian: omega ~ r^(-3/2)
  diskY[i] = y;
}

const diskGeo = new THREE.BufferGeometry();
diskGeo.setAttribute('position', new THREE.BufferAttribute(diskPos, 3));
diskGeo.setAttribute('color', new THREE.BufferAttribute(diskCol, 3));
diskGeo.setAttribute('aSize', new THREE.BufferAttribute(diskSize, 1));
diskGeo.setAttribute('aPhase', new THREE.BufferAttribute(diskPhase, 1));

const diskMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    attribute float aSize;
    attribute float aPhase;
    uniform float uTime;
    void main() {
      vColor = color;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float twinkle = 0.8 + 0.25 * sin(uTime * 2.5 + aPhase);
      gl_PointSize = aSize * twinkle * (240.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    void main() {
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv);
      float alpha = smoothstep(0.5, 0.0, d);
      gl_FragColor = vec4(vColor, alpha * alpha);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexColors: true,
});

const disk = new THREE.Points(diskGeo, diskMat);
diskGroup.add(disk);

// Faint halo behind the horizon so the silhouette reads against the starfield.
const halo = new THREE.Sprite(
  new THREE.SpriteMaterial({
    map: glowTex,
    color: 0x6a7ff2,
    transparent: true,
    opacity: 0.22,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  })
);
halo.scale.setScalar(26);
diskGroup.add(halo);

/* ---------- postprocessing: bloom ---------- */

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  1.25, // strength
  0.55, // radius
  0.78  // threshold
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------- resize ---------- */

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

/* ---------- frame loop ---------- */

const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  // Keplerian differential rotation: inner particles lap outer ones.
  for (let i = 0; i < DISK_COUNT; i++) {
    diskAngle[i] += diskOmega[i] * dt;
    const r = diskRadius[i];
    const wobble = Math.sin(elapsed * 1.7 + diskPhase[i] * 3.0) * 0.06;
    diskPos[i * 3] = Math.cos(diskAngle[i]) * r;
    diskPos[i * 3 + 1] = diskY[i] + wobble;
    diskPos[i * 3 + 2] = Math.sin(diskAngle[i]) * r;
  }
  diskGeo.attributes.position.needsUpdate = true;
  diskMat.uniforms.uTime.value = elapsed;

  controls.update();
  composer.render();
}

animate();
</script>
</body>
</html>
