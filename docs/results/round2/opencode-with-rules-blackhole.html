<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Hole</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #04040a; }
  canvas { display: block; }
  #caption {
    position: fixed; left: 18px; bottom: 14px; z-index: 10;
    color: rgba(255, 240, 220, 0.45); font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: 0.35em; text-transform: uppercase; user-select: none; pointer-events: none;
  }
</style>
</head>
<body>
<div id="caption">Black Hole &mdash; Three.js</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04040a);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 700);
camera.position.set(9, 5, 15);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 4;
controls.maxDistance = 70;
controls.target.set(0, 0, 0);

function makeTexture(stops, size = 512) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const c = size / 2;
  const g = ctx.createRadialGradient(c, c, 0, c, c, c);
  for (const s of stops) g.addColorStop(s[0], s[1]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(canvas);
  tex.needsUpdate = true;
  return tex;
}

const particleGlow = makeTexture([
  [0.0, 'rgba(255,255,255,1)'],
  [0.25, 'rgba(255,230,200,0.85)'],
  [0.55, 'rgba(255,160,90,0.22)'],
  [1.0, 'rgba(0,0,0,0)']
], 128);

const diskGlowTex = makeTexture([
  [0.0, 'rgba(255,255,255,0)'],
  [0.07, 'rgba(255,235,200,1)'],
  [0.24, 'rgba(255,205,140,0.45)'],
  [0.5, 'rgba(255,170,110,0)']
]);

const bh = new THREE.Mesh(
  new THREE.SphereGeometry(1.85, 64, 64),
  new THREE.MeshBasicMaterial({ color: 0x000000 })
);
scene.add(bh);

const diskGroup = new THREE.Group();
const tilt = new THREE.Group();
tilt.rotation.x = 0.28;
const flat = new THREE.Group();
flat.rotation.x = Math.PI / 2;
tilt.add(flat);
diskGroup.add(tilt);
scene.add(diskGroup);

const photonRing = new THREE.Mesh(
  new THREE.RingGeometry(2.05, 2.62, 160),
  new THREE.MeshBasicMaterial({
    color: 0xfff4dd, side: THREE.DoubleSide, transparent: true, opacity: 1,
    blending: THREE.AdditiveBlending, depthWrite: false
  })
);
flat.add(photonRing);

const diskGlow = new THREE.Mesh(
  new THREE.RingGeometry(1.95, 9.5, 128),
  new THREE.MeshBasicMaterial({
    map: diskGlowTex, color: 0xffb46b, side: THREE.DoubleSide, transparent: true, opacity: 0.5,
    blending: THREE.AdditiveBlending, depthWrite: false
  })
);
flat.add(diskGlow);

const DISK_INNER = 2.6;
const DISK_OUTER = 8.5;
const COUNT = 6000;

const pPos = new Float32Array(COUNT * 3);
const pCol = new Float32Array(COUNT * 3);
const pData = [];

for (let i = 0; i < COUNT; i++) {
  const r = DISK_INNER + Math.pow(Math.random(), 1.6) * (DISK_OUTER - DISK_INNER);
  const angle = Math.random() * Math.PI * 2;
  const height = (Math.random() - 0.5) * 0.3 * (1 - (r - DISK_INNER) / (DISK_OUTER - DISK_INNER) * 0.6);
  const speed = 0.55 / Math.pow(r, 1.25);
  pData.push({ r, angle, height, speed, inward: (Math.random() * 0.5 + 0.15) });

  pPos[i * 3] = r * Math.cos(angle);
  pPos[i * 3 + 1] = height;
  pPos[i * 3 + 2] = r * Math.sin(angle);

  const t = (r - DISK_INNER) / (DISK_OUTER - DISK_INNER);
  pCol[i * 3] = 1.0;
  pCol[i * 3 + 1] = 0.78 - t * 0.48;
  pCol[i * 3 + 2] = 0.5 - t * 0.4;
}

const particleGeo = new THREE.BufferGeometry();
particleGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
particleGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));

const particleMat = new THREE.PointsMaterial({
  map: particleGlow, size: 0.34, vertexColors: true, transparent: true,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
});
const particles = new THREE.Points(particleGeo, particleMat);
particles.renderOrder = 5;
flat.add(particles);

function buildStars(count, size, color, opacity) {
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 180 + Math.random() * 260;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = r * Math.cos(phi) * 0.8;
    pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color, size, sizeAttenuation: true, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  return new THREE.Points(geo, mat);
}

const starsA = buildStars(5500, 0.32, 0xffffff, 0.85);
const starsB = buildStars(180, 0.75, 0xffd9b0, 0.9);
scene.add(starsA, starsB);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.25, 0.55, 0.05);
composer.addPass(bloom);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
const posAttr = particleGeo.attributes.position;
const parr = posAttr.array;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  for (let i = 0; i < COUNT; i++) {
    const d = pData[i];
    d.angle += d.speed * dt;
    d.r -= d.inward * dt * 0.25;
    if (d.r < DISK_INNER) {
      d.r = DISK_OUTER * (0.92 + Math.random() * 0.08);
      d.angle = Math.random() * Math.PI * 2;
    }
    parr[i * 3] = d.r * Math.cos(d.angle);
    parr[i * 3 + 1] = d.height;
    parr[i * 3 + 2] = d.r * Math.sin(d.angle);
  }
  posAttr.needsUpdate = true;

  photonRing.rotation.z = t * 0.18;
  diskGlow.rotation.z = t * 0.05;
  starsA.rotation.y = t * 0.004;
  starsB.rotation.y = t * 0.003;

  controls.update();
  composer.render();
}
animate();
</script>
</body>
</html>
