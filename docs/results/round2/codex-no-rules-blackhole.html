<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Hole — Three.js</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  canvas { display: block; }
  #info {
    position: fixed;
    left: 14px;
    bottom: 12px;
    color: rgba(255,255,255,0.55);
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.05em;
    pointer-events: none;
    user-select: none;
    text-shadow: 0 0 10px rgba(0,0,0,0.9);
  }
</style>
</head>
<body>
<div id="info">BLACK HOLE &middot; drag to orbit &middot; scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

  try {
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 400);
    camera.position.set(0, 5.4, 13.8);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;
    controls.minDistance = 4.5;
    controls.maxDistance = 38;
    controls.maxPolarAngle = Math.PI * 0.48;

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.3, 0.65, 0.12);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    function makeGlowTexture(size = 64) {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      gradient.addColorStop(0.0, 'rgba(255,255,255,1)');
      gradient.addColorStop(0.25, 'rgba(255,255,255,0.9)');
      gradient.addColorStop(0.6, 'rgba(255,255,255,0.35)');
      gradient.addColorStop(1.0, 'rgba(255,255,255,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(canvas);
    }

    const glowTexture = makeGlowTexture();

    function createAccretionDisk(count = 11000) {
      const inner = 2.7;
      const outer = 13.5;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const cInner = new THREE.Color(0xffe8c0);
      const cMid = new THREE.Color(0xff8a3d);
      const cOuter = new THREE.Color(0x8a2d6f);
      const tmp = new THREE.Color();

      for (let i = 0; i < count; i++) {
        const u = Math.pow(Math.random(), 2.0);
        const r = inner + u * (outer - inner);
        const theta = Math.random() * Math.PI * 2 + Math.log(r) * 0.9;
        const x = Math.cos(theta) * r;
        const z = Math.sin(theta) * r;
        const y = (Math.random() - 0.5) * (0.05 + 0.4 * u);

        if (u < 0.4) {
          tmp.lerpColors(cInner, cMid, u / 0.4);
        } else {
          tmp.lerpColors(cMid, cOuter, (u - 0.4) / 0.6);
        }
        const intensity = 1.0 + 1.5 * Math.pow(1 - u, 1.5);
        tmp.multiplyScalar(intensity * (0.7 + Math.random() * 0.4));

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;
        colors[i * 3] = tmp.r;
        colors[i * 3 + 1] = tmp.g;
        colors[i * 3 + 2] = tmp.b;
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const material = new THREE.PointsMaterial({
        map: glowTexture,
        size: 0.17,
        vertexColors: true,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        sizeAttenuation: true
      });
      const points = new THREE.Points(geometry, material);
      points.frustumCulled = false;
      return points;
    }

    function createPhotonRing(count = 850, radius = 2.32) {
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const base = new THREE.Color(1.9, 1.4, 0.9);
      const tmp = new THREE.Color();

      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const rr = radius + (Math.random() - 0.5) * 0.09;
        tmp.copy(base).multiplyScalar(0.7 + Math.random() * 0.5);
        positions[i * 3] = Math.cos(angle) * rr;
        positions[i * 3 + 1] = (Math.random() - 0.5) * 0.035;
        positions[i * 3 + 2] = Math.sin(angle) * rr;
        colors[i * 3] = tmp.r;
        colors[i * 3 + 1] = tmp.g;
        colors[i * 3 + 2] = tmp.b;
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const material = new THREE.PointsMaterial({
        map: glowTexture,
        size: 0.3,
        vertexColors: true,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        sizeAttenuation: true
      });
      const points = new THREE.Points(geometry, material);
      points.frustumCulled = false;
      return points;
    }

    function createStarfield(count = 2600) {
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const palette = [
        new THREE.Color(1.0, 1.0, 1.0),
        new THREE.Color(0.75, 0.83, 1.0),
        new THREE.Color(1.0, 0.9, 0.72),
        new THREE.Color(1.0, 0.8, 0.92)
      ];
      const tmp = new THREE.Color();

      for (let i = 0; i < count; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const r = 75 + Math.random() * 65;
        positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = r * Math.cos(phi);
        positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
        tmp.copy(palette[(Math.random() * palette.length) | 0]).multiplyScalar(0.45 + Math.random() * 0.55);
        colors[i * 3] = tmp.r;
        colors[i * 3 + 1] = tmp.g;
        colors[i * 3 + 2] = tmp.b;
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const material = new THREE.PointsMaterial({
        map: glowTexture,
        size: 2.4,
        vertexColors: true,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        sizeAttenuation: false
      });
      const stars = new THREE.Points(geometry, material);
      stars.frustumCulled = false;
      return stars;
    }

    const tiltGroup = new THREE.Group();
    tiltGroup.rotation.set(0.38, 0, 0.1);
    const spinGroup = new THREE.Group();
    spinGroup.add(createAccretionDisk());
    const ringGroup = new THREE.Group();
    ringGroup.add(createPhotonRing());
    spinGroup.add(ringGroup);
    tiltGroup.add(spinGroup);
    scene.add(tiltGroup);

    const horizon = new THREE.Mesh(
      new THREE.SphereGeometry(1.55, 48, 48),
      new THREE.MeshBasicMaterial({ color: 0x000000 })
    );
    scene.add(horizon);

    const coreGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTexture,
      color: new THREE.Color(1.7, 0.6, 0.25),
      transparent: true,
      opacity: 0.6,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    }));
    coreGlow.scale.setScalar(8);
    scene.add(coreGlow);

    const starfield = createStarfield();
    scene.add(starfield);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;

      spinGroup.rotation.y += dt * 0.06;
      ringGroup.rotation.y -= dt * 0.35;
      starfield.rotation.y += dt * 0.003;
      coreGlow.material.opacity = 0.5 + 0.12 * Math.sin(t * 2.1);

      controls.update();
      composer.render();
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });
  } catch (err) {
    const info = document.getElementById('info');
    info.textContent = 'Failed to start: ' + err.message;
    info.style.color = '#ff6b6b';
    console.error(err);
  }
</script>
</body>
</html>
