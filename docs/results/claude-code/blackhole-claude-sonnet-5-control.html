<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Hole Visualization</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="info">
        BLACK HOLE SIMULATION<br>
        Drag to rotate | Scroll to zoom
    </div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        let scene, camera, renderer, controls, composer;
        let blackHole, accretionDisk, stars;
        let diskParticles = [];

        init();
        animate();

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.001);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, 20);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;
            controls.minDistance = 10;
            controls.maxDistance = 100;

            // Create black hole
            createBlackHole();

            // Create accretion disk
            createAccretionDisk();

            // Create starfield
            createStarfield();

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x222222);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xff8844, 2, 100);
            pointLight.position.set(0, 0, 0);
            scene.add(pointLight);

            // Post-processing
            composer = new EffectComposer(renderer);
            const renderPass = new RenderPass(scene, camera);
            composer.addPass(renderPass);

            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                1.5,  // strength
                0.4,  // radius
                0.85  // threshold
            );
            composer.addPass(bloomPass);

            // Window resize
            window.addEventListener('resize', onWindowResize);
        }

        function createBlackHole() {
            // Event horizon
            const geometry = new THREE.SphereGeometry(2, 64, 64);
            const material = new THREE.MeshBasicMaterial({
                color: 0x000000,
                transparent: true,
                opacity: 1
            });
            blackHole = new THREE.Mesh(geometry, material);
            scene.add(blackHole);

            // Schwarzschild radius glow
            const glowGeometry = new THREE.SphereGeometry(2.2, 64, 64);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: 0xff4400,
                transparent: true,
                opacity: 0.3,
                side: THREE.BackSide
            });
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            blackHole.add(glow);
        }

        function createAccretionDisk() {
            const diskGroup = new THREE.Group();
            const particleCount = 8000;

            // Create multiple rings with different colors
            const rings = [
                { color: 0xff6600, innerRadius: 3, outerRadius: 8, count: 3000 },
                { color: 0xff8800, innerRadius: 8, outerRadius: 12, count: 2500 },
                { color: 0xffaa00, innerRadius: 12, outerRadius: 16, count: 2500 }
            ];

            rings.forEach(ring => {
                const geometry = new THREE.BufferGeometry();
                const positions = [];
                const colors = [];
                const sizes = [];

                for (let i = 0; i < ring.count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = ring.innerRadius + Math.random() * (ring.outerRadius - ring.innerRadius);
                    const height = (Math.random() - 0.5) * 0.5 * (1 - (radius - ring.innerRadius) / (ring.outerRadius - ring.innerRadius));

                    positions.push(
                        Math.cos(angle) * radius,
                        height,
                        Math.sin(angle) * radius
                    );

                    const color = new THREE.Color(ring.color);
                    color.multiplyScalar(0.8 + Math.random() * 0.4);
                    colors.push(color.r, color.g, color.b);

                    sizes.push(0.1 + Math.random() * 0.2);

                    // Store particle data for animation
                    diskParticles.push({
                        angle: angle,
                        radius: radius,
                        angularVelocity: 0.5 / Math.pow(radius, 1.5),
                        height: height,
                        index: positions.length / 3 - 1
                    });
                }

                geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

                const material = new THREE.PointsMaterial({
                    size: 0.15,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.9,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    sizeAttenuation: true
                });

                const points = new THREE.Points(geometry, material);
                diskGroup.add(points);
            });

            accretionDisk = diskGroup;
            scene.add(accretionDisk);
        }

        function createStarfield() {
            const starGeometry = new THREE.BufferGeometry();
            const starPositions = [];
            const starColors = [];

            for (let i = 0; i < 5000; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 100 + Math.random() * 200;

                starPositions.push(
                    r * Math.sin(phi) * Math.cos(theta),
                    r * Math.sin(phi) * Math.sin(theta),
                    r * Math.cos(phi)
                );

                const brightness = 0.5 + Math.random() * 0.5;
                starColors.push(brightness, brightness, brightness);
            }

            starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
            starGeometry.setAttribute('color', new THREE.Float32BufferAttribute(starColors, 3));

            const starMaterial = new THREE.PointsMaterial({
                size: 0.3,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                sizeAttenuation: true
            });

            stars = new THREE.Points(starGeometry, starMaterial);
            scene.add(stars);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Rotate accretion disk particles
            if (accretionDisk) {
                accretionDisk.children.forEach((points, ringIndex) => {
                    const positions = points.geometry.attributes.position.array;

                    diskParticles
                        .filter(p => Math.floor(p.index / 3000) === ringIndex)
                        .forEach(particle => {
                            particle.angle += particle.angularVelocity * 0.01;

                            const idx = (particle.index % 3000) * 3;
                            if (idx < positions.length) {
                                positions[idx] = Math.cos(particle.angle) * particle.radius;
                                positions[idx + 1] = particle.height;
                                positions[idx + 2] = Math.sin(particle.angle) * particle.radius;
                            }
                        });

                    points.geometry.attributes.position.needsUpdate = true;
                });
            }

            // Rotate black hole slowly
            if (blackHole) {
                blackHole.rotation.y += 0.001;
            }

            controls.update();
            composer.render();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
