<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saturn Ring GP — dsh-min</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(1200px 700px at 50% 40%, #0c1226 0%, #060a18 55%, #03050c 100%);
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Consolas, Menlo, monospace;
    color: #dfe7f5;
  }
  #stage { position: relative; width: min(1200px, 98vw); }
  #scene { display: block; width: 100%; height: auto; }

  /* ---- scoreboard ---- */
  #board {
    position: absolute; top: 14px; left: 14px; width: 306px; z-index: 5;
    background: linear-gradient(180deg, rgba(12,18,38,.94), rgba(6,10,22,.94));
    border: 1px solid #43537c; border-radius: 10px; padding: 8px 10px 9px;
    box-shadow: 0 8px 28px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.4);
    user-select: none;
  }
  .head {
    display: flex; justify-content: space-between; align-items: baseline;
    color: #ffd76a; font-weight: 800; letter-spacing: 2px; font-size: 12px;
  }
  .head .live {
    color: #8dffa2; font-size: 9px; letter-spacing: 1px; font-weight: 700;
    animation: blink 1.5s ease-in-out infinite;
  }
  #rows { margin-top: 4px; }
  .row {
    display: grid; grid-template-columns: 16px 10px 1fr 30px 50px 42px 58px; gap: 5px;
    align-items: center; padding: 4px 0; border-top: 1px solid rgba(255,255,255,.07);
  }
  .row:first-child { border-top: none; }
  .pos { font-weight: 800; color: #ffd76a; font-size: 11px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 6px currentColor; }
  .nm { font-weight: 700; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nm em { display: block; font-style: normal; font-weight: 400; font-size: 8.5px; color: #8fa3c8; }
  .lap { color: #ffd76a; font-weight: 700; }
  .km, .kph { font-size: 10px; color: #dfe7f5; font-variant-numeric: tabular-nums; }
  .km .u, .kph .u { color: #8fa3c8; font-size: 7.5px; }
  .kph { text-align: right; }
  .bar { height: 6px; background: rgba(255,255,255,.09); border-radius: 3px; overflow: hidden; }
  .bar b {
    display: block; height: 100%; width: 0; border-radius: 3px;
    background: linear-gradient(90deg, #ffd76a, #ff9d5c);
  }

  /* ---- in-scene naming tags ---- */
  .tag {
    fill: #f4f7ff; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-anchor: middle;
    paint-order: stroke; stroke: #0a0e1c; stroke-width: 3px; stroke-linejoin: round; opacity: .93;
  }
  #cd {
    font-size: 64px; font-weight: 800; fill: #ffd76a; stroke: #0b1026; stroke-width: 12px;
    paint-order: stroke; text-anchor: middle; letter-spacing: 8px; transition: opacity .5s linear;
  }
  #cd.go { fill: #8dffa2; }

  @keyframes tw    { 0%,100% { opacity: calc(var(--o) * .25); } 50% { opacity: var(--o); } }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .15; } }
  @keyframes puff  {
    0%   { transform: translate(0,0) scale(.5); opacity: .85; }
    100% { transform: translate(-16px,-36px) scale(1.9); opacity: 0; }
  }
</style>
</head>

        <g transform="translate(-1,-48)">
          <g class="rk" data-js="wingF">
            <path d="M0,0 C-3,-14 -15,-21 -29,-22 L-27,-16 C-17,-15 -9,-10 -5,-1 Z" fill="#4a3320"/>
            <path d="M-29,-22 L-34,-20 L-29,-17 Z" fill="#e6e6ea" opacity=".8"/>
          </g>
        </g>
        <path d="M-13,-58 L-27,-51 L-13,-48 Z" fill="#f4f4f6" stroke="#d8dce6" stroke-width="1"/>
        <path d="M-15,-63 L-25,-58 L-14,-55 Z" fill="#dcdce2"/>
        <ellipse cx="1" cy="-58" rx="15" ry="11.5" fill="#5f4526" stroke="#4a3320" stroke-width="1"/>
        <path d="M9,-64 Q15,-70 14,-76" stroke="#5f4526" stroke-width="6" fill="none" stroke-linecap="round"/>
        <circle cx="13.5" cy="-76.5" r="7.6" fill="#fafafc" stroke="#d8dce6" stroke-width="1"/>
        <path d="M20,-79.5 L26.5,-76.5 L20,-73.5 Z" fill="#f5c542"/>
        <path d="M20,-76.3 L24.5,-76.3" stroke="#8a6a1f" stroke-width="0.9"/>
        <circle cx="16" cy="-78" r="1.5" fill="#1c212c"/>
        <path d="M13.5,-81.5 L19,-80" stroke="#fafafc" stroke-width="1.6" stroke-linecap="round"/>
        <g transform="translate(1,-51)">
          <g class="rk" data-js="wingN">
            <path d="M0,0 C-4,-17 -17,-26 -32,-28 L-29,-20 C-19,-19 -9,-12 -5,-1 Z" fill="#7a5733"/>
            <path d="M-32,-28 L-37.5,-26.5 L-32,-23 Z" fill="#f0f0f4" opacity=".9"/>
            <path d="M-33,-25 L-38,-23.5 L-33,-20.5 Z" fill="#f0f0f4" opacity=".6"/>
          </g>
        </g>
      </g>
      <text class="tag" x="0" y="36">Soar</text>
    </g>

  </g>

  <text id="cd" x="600" y="585" opacity="0">3</text>
</svg>

<div id="board">
  <div class="head"><span>SATURN RING GP</span><span class="live">&#9679; LIVE</span></div>
  <div id="rows"></div>
</div>

</div>

<script>
(() => {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const CX = 600, CY = 292, RX = 505, RY = 188, K = RY / RX;
  const THA = 0.845 * Math.PI, THB = 0.155 * Math.PI;   // road bounds (left, right)
  const THS = 0.825 * Math.PI, THF = 0.175 * Math.PI;   // start line, finish line
  const LAPLEN = Math.abs(THA - THB) * RX;
  const KM_PER_PX = 12.5 / LAPLEN;

  const el = (tag, attrs) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };
  const pt = (th, r) => [CX + r * Math.cos(th), CY + r * K * Math.sin(th)];
  const norm = (x, y) => { const l = Math.hypot(x, y) || 1; return [x / l, y / l]; };
  const setR = (n, rad) => { if (n) n.setAttribute('transform', 'rotate(' + (rad * 180 / Math.PI).toFixed(1) + ')'); };

  /* ---------- star field (deterministic LCG) ---------- */
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const stars = document.getElementById('stars');
  for (let i = 0; i < 90; i++) {
    const o = (0.15 + rnd() * 0.55).toFixed(2);
    const c = el('circle', {
      cx: (rnd() * 1200).toFixed(1), cy: (rnd() * 640).toFixed(1),
      r: (0.6 + rnd() * 1.8).toFixed(2), fill: '#fff'
    });
    c.style.setProperty('--o', o);
    c.style.animation = 'tw ' + (2.2 + rnd() * 3.6).toFixed(2) + 's ease-in-out ' + (rnd() * 5).toFixed(2) + 's infinite';
    stars.appendChild(c);
  }

  /* ---------- km distance markers along the road ---------- */
  const markers = document.getElementById('markers');
  for (let i = 0; i < 7; i++) {
    const th = THA - i * (THA - THB) / 6;
    const [bx, by] = pt(th, 556);
    const [ux, uy] = norm(-0.42 * Math.cos(th), -1);
    const g = el('g', { transform: 'translate(' + bx.toFixed(1) + ' ' + by.toFixed(1) + ')' });
    g.appendChild(el('line', { x1: 0, y1: 0, x2: (ux * 30).toFixed(1), y2: (uy * 30).toFixed(1), stroke: '#b9c6dd', 'stroke-width': 2.5 }));
    g.appendChild(el('circle', { cx: (ux * 30).toFixed(1), cy: (uy * 30).toFixed(1), r: 2.2, fill: '#ffd76a' }));
    const sc = el('g', {
      transform: 'translate(' + (ux * 30).toFixed(1) + ' ' + (uy * 30).toFixed(1) + ') scale(' + (0.8 + 0.2 * Math.sin(th)).toFixed(3) + ')'
    });
    sc.appendChild(el('path', { d: 'M0,-17 L12,-10 L0,-3 Z', fill: ['#d9503f', '#57b35c', '#f5c542'][i % 3] }));
    sc.appendChild(el('circle', { cx: 0, cy: 0, r: 6.5, fill: '#1b2338', stroke: '#ffd76a', 'stroke-width': 1.4 }));
    const tx = el('text', { x: 0, y: 2.6, 'text-anchor': 'middle', 'font-size': 9, 'font-weight': 700, fill: '#ffd76a' });
    tx.textContent = (i + 1) + 'km';
    sc.appendChild(tx);
    g.appendChild(sc);
    markers.appendChild(g);
  }

  /* ---------- start / finish stripes ---------- */
  const linesG = document.getElementById('lines');
  const stripe = (th, cells) => {
    const [ax, ay] = pt(th, 466);
    const [bx, by] = pt(th, 542);
    const tang = Math.atan2(RY * Math.cos(th), -RX * Math.sin(th));
    const len = Math.hypot(bx - ax, by - ay);
    const g = el('g', {
      transform: 'translate(' + ax.toFixed(1) + ' ' + ay.toFixed(1) + ') rotate(' + (tang * 180 / Math.PI).toFixed(2) + ')'
    });
    for (let i = 0; i < cells; i++) {
      const y0 = len * i / cells, y1 = len * (i + 1) / cells;
      g.appendChild(el('rect', {
        x: -4, y: y0.toFixed(2), width: 8, height: (y1 - y0).toFixed(2),
        fill: (i % 2 ? '#10131c' : '#f4f7ff'), stroke: '#0a0e1c', 'stroke-width': 0.6
      }));
    }
    linesG.appendChild(g);
  };
  stripe(THS, 1);
  stripe(THF, 8);

  /* ---------- banners ---------- */
  const banners = document.getElementById('banners');
  const banner = (th, label) => {
    const [bx, by] = pt(th, 556);
    const [ux, uy] = norm(-0.42 * Math.cos(th), -1);
    const txp = bx + ux * 78, typ = by + uy * 78;
    const ang = Math.atan2(uy, ux) * 180 / Math.PI + 90;
    const g = el('g', {});
    g.appendChild(el('line', { x1: bx, y1: by, x2: txp.toFixed(1), y2: typ.toFixed(1), stroke: '#b9c6dd', 'stroke-width': 3 }));
    const b = el('g', { transform: 'translate(' + txp.toFixed(1) + ' ' + typ.toFixed(1) + ') rotate(' + ang.toFixed(1) + ')' });
    b.appendChild(el('rect', { x: -62, y: -14, width: 124, height: 26, rx: 6, fill: '#111731', stroke: '#d9503f', 'stroke-width': 2 }));
    const t = el('text', { x: 0, y: 5, 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 800, 'letter-spacing': '3px', fill: '#ffd76a' });
    t.textContent = label;
    b.appendChild(t);
    g.appendChild(b);
    banners.appendChild(g);
  };
  banner(THS, 'START');
  banner(THF, 'FINISH');

  /* ---------- racers ---------- */
  const rLayer = document.getElementById('racers');
  const rowsBox = document.getElementById('rows');
  const DATA = [
    { key: 'r0', name: 'Hare',  speak: 'rabbit \u00b7 bicycle',    color: '#f2f2f6', speed: 0.060, weave: 10, wf: 1.15, ph: 0.60, th0: 0.812 * Math.PI, wheel: 16 },
    { key: 'r1', name: 'Turbo', speak: 'turtle \u00b7 motorcycle', color: '#57b35c', speed: 0.066, weave: 22, wf: 0.85, ph: 2.30, th0: 0.792 * Math.PI, wheel: 17 },
    { key: 'r2', name: 'Soar',  speak: 'bald eagle \u00b7 tricycle', color: '#e0b25c', speed: 0.050, weave: 16, wf: 1.00, ph: 4.00, th0: 0.768 * Math.PI, wheel: 15 },
  ].map(d => {
    const el0 = document.getElementById(d.key);
    const parts = {};
    el0.querySelectorAll('[data-js]').forEach(n => { parts[n.dataset.js] = n; });
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<i class="pos">1</i><i class="dot"></i><span class="nm"></span>' +
      '<span class="lap">L1</span><span class="km">0.0<span class="u">km</span></span>' +
      '<span class="kph">--</span><span class="bar"><b></b></span>';
    const dot = row.querySelector('.dot');
    dot.style.background = d.color;
    dot.style.color = d.color;
    const nm = row.querySelector('.nm');
    nm.textContent = d.name;
    const em = document.createElement('em');
    em.textContent = d.speak;
    nm.appendChild(em);
    return Object.assign({}, d, {
      el: el0, flip: el0.querySelector('.flip'), parts, row,
      th: d.th0, dir: -1, dist: 0, lap: 1, wa: 0, ca: 0, vpx: 0, px: 0, py: 0
    });
  });
  DATA.forEach(r => rowsBox.appendChild(r.row));

  /* ---------- countdown + main loop ---------- */
  const cd = document.getElementById('cd');
  const cdSeq = [[0.25, '3', false], [1.10, '2', false], [2.00, '1', false], [2.65, 'GO!', true]];
  let cdIdx = 0, startedAt = 0, lastNow = 0, lastBoard = 0;

  function updateBoard() {
    const sorted = [...DATA].sort((a, b) => b.dist - a.dist);
    sorted.forEach((r, i) => {
      r.row.querySelector('.pos').textContent = i + 1;
      r.row.querySelector('.km').firstChild.textContent = (r.dist * KM_PER_PX).toFixed(1);
      const kph = startedAt ? Math.round(r.vpx * 0.0036) : '--';
      r.row.querySelector('.kph').innerHTML = kph + '<span class="u">km/h</span>';
      r.row.querySelector('.lap').textContent = 'L' + r.lap;
      const frac = Math.min(1, Math.max(0, (r.dist - (r.lap - 1) * LAPLEN) / LAPLEN));
      r.row.querySelector('.bar b').style.width = (frac * 100).toFixed(1) + '%';
      rowsBox.appendChild(r.row);
    });
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - lastNow) / 1000 || 0.016);
    lastNow = now;
    const t = now / 1000;

    if (cdIdx < cdSeq.length && t >= cdSeq[cdIdx][0]) {
      cd.textContent = cdSeq[cdIdx][1];
      cd.style.opacity = 1;
      cd.classList.toggle('go', cdSeq[cdIdx][2]);
      cdIdx++;
    }
    if (startedAt === 0 && t >= 2.65) startedAt = now;
    if (startedAt && now - startedAt > 900) cd.style.opacity = 0;

    const moving = startedAt !== 0;
    for (const r of DATA) {
      if (moving) {
        const wob = 1 + 0.10 * Math.sin(t * 1.7 + r.ph * 1.3);
        const dth = r.speed * wob * r.dir * dt;
        let nth = r.th + dth;
        if (nth > THA) { nth = 2 * THA - nth; r.dir = 1; }
        else if (nth < THB) { nth = 2 * THB - nth; r.dir = -1; }
        const arc = Math.abs(nth - r.th) * RX;
        r.dist += arc;
        r.vpx = arc / dt;
        if (r.dir === -1 && r.th > THF && nth <= THF) r.lap++;
        r.th = nth;
        r.wa += arc / r.wheel;
        r.ca += arc / (RX * 0.62);
      }
      const wav = r.weave * Math.sin(t * r.wf + r.ph);
      const [x, y] = pt(r.th, RX);
      const nx = Math.cos(r.th), ny = Math.sin(r.th);
      const mx = r.dir * (-RX * Math.sin(r.th)), my = r.dir * (RY * Math.cos(r.th));
      const tilt = Math.atan2(my, mx) * 180 / Math.PI;
      const sc = 0.8 + 0.28 * Math.sin(r.th);
      const px = x + nx * wav, py = y + ny * wav;
      r.px = px; r.py = py;
      r.el.setAttribute('transform',
        'translate(' + px.toFixed(1) + ' ' + py.toFixed(1) + ') rotate(' + tilt.toFixed(1) + ') scale(' + sc.toFixed(3) + ')');
      r.flip.setAttribute('transform', 'scale(' + (r.dir < 0 ? 1 : -1) + ' 1)');

      const P = r.parts;
      if (P.wheelA) setR(P.wheelA, r.wa);
      if (P.wheelB) setR(P.wheelB, r.wa);
      if (P.wheelC) setR(P.wheelC, r.wa);
      if (P.crankA) setR(P.crankA, r.ca);
      if (P.legA) setR(P.legA, Math.sin(r.ca) * 0.50);
      if (P.legB) setR(P.legB, Math.sin(r.ca + Math.PI) * 0.50);
      if (P.earA) setR(P.earA, Math.sin(t * 7.2 + r.ph) * 0.38);
      if (P.earB) setR(P.earB, Math.sin(t * 7.2 + r.ph + 1.4) * 0.30);
      if (P.wingN) setR(P.wingN, 0.14 + 0.52 * Math.sin(t * 7.3 + r.ph));
      if (P.wingF) setR(P.wingF, 0.10 + 0.50 * Math.sin(t * 7.3 + r.ph + 0.4));
    }

    [...DATA].sort((a, b) => a.py - b.py).forEach(r => rLayer.appendChild(r.el));

    if (now - lastBoard > 120) { lastBoard = now; updateBoard(); }
    requestAnimationFrame(frame);
  }

  updateBoard();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
