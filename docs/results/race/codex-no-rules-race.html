<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saturn Ring Grand Prix — animated SVG race</title>
<style>
  html,body{margin:0;padding:0;background:#070b1c;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  svg.race{display:block;width:min(100vw,186.7vh);height:auto;max-width:100vw;max-height:100vh;}
  .star{animation:tw 2.6s ease-in-out infinite;}
  @keyframes tw{0%,100%{opacity:.12}50%{opacity:.95}}
  .halo{animation:pulse 5.5s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:.95}}
  .shoot{animation:shoot 11s linear infinite;}
  .shoot2{animation:shoot2 15s linear infinite;}
  @keyframes shoot{
    0%{transform:translate(0,0);opacity:0}
    4%{opacity:.9}
    14%{opacity:.9}
    22%{transform:translate(-560px,320px);opacity:0}
    100%{transform:translate(-560px,320px);opacity:0}
  }
  @keyframes shoot2{
    0%,32%{transform:translate(0,0);opacity:0}
    36%{opacity:.85}
    48%{transform:translate(-680px,380px);opacity:0}
    100%{transform:translate(-680px,380px);opacity:0}
  }
  .tire{fill:none;stroke:#20242c;stroke-width:5;}
  .rim{fill:none;stroke:#7d8590;stroke-width:1.6;}
  .hub{fill:#39414d;stroke:#59636f;stroke-width:1;}
  .spoke{stroke:#aab2bd;stroke-width:1.3;}
  .hudTitle{font:700 20px/1 "Segoe UI",Arial,sans-serif;fill:#ffe9a8;letter-spacing:2px;}
  .hudSub{font:500 12px/1 "Segoe UI",Arial,sans-serif;fill:#8fa6cf;letter-spacing:3px;}
  .hudHead{font:700 11px/1 "Segoe UI",Arial,sans-serif;fill:#6f84ad;letter-spacing:1px;}
  .hudNum{font:700 15px/1 Consolas,monospace;fill:#ffe9a8;}
  .hudName{font:700 14px/1 "Segoe UI",Arial,sans-serif;letter-spacing:.5px;}
  .hudVal{font:600 13px/1 Consolas,monospace;fill:#d8e6ff;}
  .mainTitle{font:800 24px/1 "Segoe UI",Arial,sans-serif;fill:#ffe9a8;letter-spacing:2.5px;}
  .mainSub{font:500 13px/1 "Segoe UI",Arial,sans-serif;fill:#9fb3d8;letter-spacing:1.5px;}
  .clock{font:600 16px/1 Consolas,monospace;fill:#cfe0ff;}
</style>
</head>

<text x="28" y="44" class="mainTitle">RING RACERS · SATURN GRAND PRIX</text>
<text x="30" y="66" class="mainSub">three legends, one ring — who takes the crown?</text>
<text id="clk" x="30" y="92" class="clock">TIME 00:00</text>

<script>
(function(){
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var RAD = Math.PI / 180;
  function byId(id){ return document.getElementById(id); }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function pad(n){ return (n < 10 ? '0' : '') + n; }

  var trackY = function(x){ return 640 - x * (1400 - x) / 8166.6667; };
  var trackDeg = function(x){ return Math.atan2(2 * x - 1400, 8166.6667) / RAD; };

  (function makeStars(){
    var g = byId('stars');
    for (var i = 0; i < 85; i++) {
      var c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', (Math.random() * 1400).toFixed(1));
      c.setAttribute('cy', (15 + Math.random() * 400).toFixed(1));
      c.setAttribute('r', (0.7 + Math.random() * 1.9).toFixed(2));
      c.setAttribute('fill', '#ffffff');
      c.setAttribute('class', 'star');
      c.style.animationDelay = (-Math.random() * 3).toFixed(2) + 's';
      c.style.animationDuration = (2 + Math.random() * 3).toFixed(2) + 's';
      g.appendChild(c);
    }
  })();

  (function makeMarkers(){
    var g = byId('markers');
    var html = '';
    for (var i = 0; i < 11; i++) {
      var x = 110 + i * 126;
      var ty = trackY(x);
      var cone = (i % 2 === 0) ? '#ff5a4e' : '#f2f2f6';
      html += '<g>' +
        '<line x1="' + x + '" y1="' + (ty + 26).toFixed(1) + '" x2="' + x + '" y2="' + (ty + 40).toFixed(1) + '" stroke="' + cone + '" stroke-width="3"/>' +
        '<path d="M ' + (x - 7) + ' ' + (ty + 40).toFixed(1) + ' L ' + (x + 7) + ' ' + (ty + 40).toFixed(1) + ' L ' + x + ' ' + (ty + 52).toFixed(1) + ' Z" fill="' + cone + '"/>' +
        '<text x="' + x + '" y="' + (ty + 64).toFixed(1) + '" text-anchor="middle" font-size="10" font-weight="700" fill="#d8e6ff" font-family="Consolas,monospace">' + (i + 1) + '</text>' +
        '<line x1="' + x + '" y1="' + (ty - 36).toFixed(1) + '" x2="' + x + '" y2="' + (ty - 42).toFixed(1) + '" stroke="#ffffff" stroke-width="2" opacity=".7"/>' +
        '</g>';
    }
    g.innerHTML = html;
  })();

  var racers = [
    { id: 'rabbit', x: 280, odo: 0, spd: 166, cur: 166, sAm: .15, sFr: .31, sPh: 1.7,
      wAmp: 16, wFr: .85, wPh: .2, bobA: 2.2, bobFr: 3.1, pivot: 41,
      wheelR: 26, pedalC: {x: 40, y: -34}, pedalR: 12, hip: {x: 24, y: -66} },
    { id: 'turtle', x: 540, odo: 0, spd: 131, cur: 131, sAm: .12, sFr: .20, sPh: 4.2,
      wAmp: 10, wFr: .5, wPh: 2.1, bobA: 1.3, bobFr: 1.9, pivot: 39,
      wheelR: 24, pedalC: {x: 78, y: -24}, pedalR: 0 },
    { id: 'eagle', x: 780, odo: 0, spd: 116, cur: 116, sAm: .20, sFr: .27, sPh: 3.1,
      wAmp: 22, wFr: .62, wPh: 4.4, bobA: 2.6, bobFr: 3.6, pivot: 40,
      wheelR: 26, pedalC: {x: 38, y: -32}, pedalR: 11, hip: {x: 24, y: -70} }
  ];

  racers.forEach(function(r){
    var p = r.parts = {};
    p.pos = byId('racer-' + r.id);
    p.lean = byId(r.id + '-lean');
    p.streak = byId(r.id + '-streak');
    if (r.id === 'rabbit') {
      p.spR = byId('rr-spokes'); p.spF = byId('rf-spokes'); p.crank = byId('rr-crank');
      p.l1 = byId('rr-leg1'); p.l2 = byId('rr-leg2');
      p.earL = byId('rr-earL'); p.earR = byId('rr-earR'); p.tail = byId('rr-tail');
      p.head = byId('rabbit-head');
    } else if (r.id === 'turtle') {
      p.spR = byId('tr-spokes'); p.spF = byId('tf-spokes'); p.head = byId('turtle-head');
    } else {
      p.spR = byId('er-spokes'); p.spF = byId('ef-spokes'); p.spRF = byId('er-spokes2');
      p.crank = byId('ec-crank'); p.l1 = byId('eg-leg1'); p.l2 = byId('eg-leg2');
      p.wN = byId('eg-wingN'); p.wF = byId('eg-wingF'); p.pen = byId('eg-pennant');
      p.head = byId('eagle-head');
    }
  });

  function legPath(hip, foot, sign, scale){
    var mx = (hip.x + foot.x) / 2, my = (hip.y + foot.y) / 2;
    var dx = foot.x - hip.x, dy = foot.y - hip.y;
    var len = Math.hypot(dx, dy) || 1;
    var kx = mx + (-dy / len) * scale * sign;
    var ky = my + (dx / len) * scale * sign;
    return 'M ' + hip.x.toFixed(1) + ' ' + hip.y.toFixed(1) +
           ' L ' + kx.toFixed(1) + ' ' + ky.toFixed(1) +
           ' L ' + foot.x.toFixed(1) + ' ' + foot.y.toFixed(1);
  }

  function updateLegs(r){
    var p = r.parts;
    if (!p.crank) return;
    var a = r.pedA || 0;
    var c = r.pedalC, R = r.pedalR;
    var f1 = {x: c.x + Math.cos(a) * R, y: c.y + Math.sin(a) * R};
    var f2 = {x: c.x - Math.cos(a) * R, y: c.y - Math.sin(a) * R};
    p.l1.setAttribute('d', legPath(r.hip, f1, 1, 9));
    p.l2.setAttribute('d', legPath(r.hip, f2, -1, 9));
  }

  function updateHUD(){
    var order = racers.slice().sort(function(a, b){ return b.odo - a.odo; });
    var names = {rabbit: 'RABBIT', turtle: 'TURTLE', eagle: 'EAGLE'};
    var fills = {rabbit: '#e8e8ee', turtle: '#8fc98a', eagle: '#e6b06a'};
    for (var i = 0; i < 3; i++) {
      var r = order[i], n = i + 1;
      byId('rk' + n).textContent = '#' + n;
      byId('nm' + n).textContent = names[r.id];
      byId('nm' + n).setAttribute('fill', fills[r.id]);
      byId('sw' + n).setAttribute('fill', fills[r.id]);
      byId('sw' + n).setAttribute('stroke', n === 1 ? '#ffd166' : 'none');
      byId('ds' + n).textContent = Math.round(r.odo / 62) + ' km';
      byId('sp' + n).textContent = Math.round(r.cur / 2.2) + ' km/h';
    }
    var m = Math.floor(elapsed / 60), s = Math.floor(elapsed % 60);
    byId('clk').textContent = 'TIME ' + pad(m) + ':' + pad(s);
  }

  var last = performance.now(), elapsed = 0, hudAt = 0;

  function frame(now){
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    elapsed += dt;
    var t = elapsed;

    racers.forEach(function(r){
      var p = r.parts;
      var spd = r.cur = r.spd * (1 + r.sAm * Math.sin(t * 2 * Math.PI * r.sFr + r.sPh));
      r.x += spd * dt;
      r.odo += spd * dt;
      if (r.x > 1480) { r.x -= 1560; r.odo += 1560; }

      var weave = r.wAmp * Math.sin(t * 2 * Math.PI * r.wFr + r.wPh);
      var weaveV = r.wAmp * 2 * Math.PI * r.wFr * Math.cos(t * 2 * Math.PI * r.wFr + r.wPh) / Math.max(spd, 1);
      var lean = clamp(trackDeg(r.x) * 0.55 + (Math.atan(weaveV) / RAD) * 0.85, -13, 13);
      var bob = Math.sin(t * 2 * Math.PI * r.bobFr + r.sPh) * r.bobA;
      var ty = trackY(r.x);

      r.wA = (r.wA || 0) + spd * dt / r.wheelR;
      var wDeg = (r.wA * 180 / Math.PI) % 360;
      var rot = 'rotate(' + wDeg.toFixed(2) + ')';
      p.spR.setAttribute('transform', rot);
      p.spF.setAttribute('transform', rot);
      if (p.spRF) p.spRF.setAttribute('transform', rot);

      if (p.crank) {
        r.pedA = (r.pedA || 0) + spd * dt / 22;
        var c = r.pedalC;
        p.crank.setAttribute('transform', 'rotate(' + ((r.pedA * 180 / Math.PI) % 360).toFixed(2) + ' ' + c.x + ' ' + c.y + ')');
        updateLegs(r);
      }

      p.pos.setAttribute('transform', 'translate(' + r.x.toFixed(1) + ' ' + (ty + bob + weave * 0.4).toFixed(1) + ')');
      p.lean.setAttribute('transform', 'rotate(' + lean.toFixed(2) + ' ' + r.pivot + ' 2)');
      p.streak.setAttribute('opacity', clamp((spd / 166) * 0.55, 0, 0.6).toFixed(2));

      if (r.id === 'rabbit') {
        var flap = Math.sin(t * 2 * Math.PI * 2.3) * 17;
        p.earL.setAttribute('transform', 'rotate(' + (10 + flap).toFixed(1) + ')');
        p.earR.setAttribute('transform', 'rotate(' + (-12 - flap).toFixed(1) + ')');
        p.tail.setAttribute('transform', 'rotate(' + (Math.sin(t * 20) * 7).toFixed(1) + ')');
        p.head.setAttribute('transform', 'rotate(' + (Math.sin(t * 9) * 3).toFixed(1) + ' 56 -98)');
      } else if (r.id === 'turtle') {
        p.head.setAttribute('transform', 'rotate(' + (-Math.sin(t * 9) * 3.5).toFixed(1) + ' 71 -68)');
      } else {
        var wA = Math.sin(t * 2 * Math.PI * 2.0) * 30;
        p.wN.setAttribute('transform', 'rotate(' + wA.toFixed(1) + ' 30 -86)');
        p.wF.setAttribute('transform', 'rotate(' + (-wA * 0.75).toFixed(1) + ' 30 -86)');
        p.pen.setAttribute('transform', 'rotate(' + (Math.sin(t * 14) * 7).toFixed(1) + ')');
        p.head.setAttribute('transform', 'rotate(' + (Math.sin(t * 8) * 3).toFixed(1) + ' 53 -92)');
      }
    });

    if (now - hudAt > 150) { hudAt = now; updateHUD(); }
    requestAnimationFrame(frame);
  }

  updateHUD();
  requestAnimationFrame(frame);
})();
</script>
