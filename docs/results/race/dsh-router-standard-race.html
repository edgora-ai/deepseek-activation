<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saturn Ring Grand Prix — dsh-rs</title>
<style>
  html, body { margin: 0; padding: 0; background: #070818; }
  body { display: grid; place-items: center; min-height: 100vh; overflow: hidden; }
  svg { width: min(1200px, 100vw); height: min(560px, 100vh); display: block; }

  /* twinkling stars */
  .tw { animation: twinkle 2.8s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: .12; } 50% { opacity: 1; } }

  /* drifting ring debris */
  .fl { animation: floaty 5s ease-in-out infinite; }
  @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  /* countdown */
  .count {
    font-size: 64px; font-weight: 900; fill: #ffe9a8;
    text-anchor: middle; letter-spacing: 8px;
    paint-order: stroke; stroke: rgba(10,10,30,.85); stroke-width: 8px;
    transform-box: fill-box; transform-origin: center;
  }
  #count.pop { animation: pop .45s ease-out; }
  @keyframes pop {
    0%   { transform: scale(1.8); opacity: 0; }
    55%  { transform: scale(.94); opacity: 1; }
    100% { transform: scale(1);   opacity: 1; }
  }

  /* racer name tags */
  .tag-txt {
    fill: #ffffff; font-size: 10px; font-weight: 700; letter-spacing: .5px;
    text-anchor: middle; paint-order: stroke; stroke: rgba(8,10,26,.9); stroke-width: 2.5px;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  /* scoreboard typography */
  .sb-title { font-size: 13px; font-weight: 800; fill: #ffe9a8; letter-spacing: 1.5px; font-family: 'Segoe UI', system-ui, sans-serif; }
  .sb-clock { font-size: 11px; font-weight: 700; fill: #bcd2ff; text-anchor: end; font-family: 'Segoe UI', system-ui, sans-serif; }
  .sb-sub   { font-size: 9.5px; fill: #9fb4e8; font-family: 'Segoe UI', system-ui, sans-serif; }
  .sb-h     { font-size: 9px; fill: #8fa3d0; font-weight: 600; letter-spacing: 1px; font-family: 'Segoe UI', system-ui, sans-serif; }
  .sb-rank  { font-size: 11.5px; font-weight: 800; font-family: 'Segoe UI', system-ui, sans-serif; }
  .sb-name  { font-size: 10.5px; fill: #f2f0ff; font-weight: 600; font-family: 'Segoe UI', system-ui, sans-serif; }
  .sb-num   { font-size: 10.5px; fill: #f2f0ff; font-weight: 600; text-anchor: end; font-family: 'Segoe UI', system-ui, sans-serif; }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated SVG race on Saturn's rings: rabbit on a bicycle, turtle on a motorcycle, bald eagle on a tricycle">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#151238"/>
      <stop offset="55%" stop-color="#231a4e"/>
      <stop offset="100%" stop-color="#2e2158"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0%"  stop-color="#ffd9a0" stop-opacity=".85"/>
      <stop offset="30%" stop-color="#ffd9a0" stop-opacity=".18"/>
      <stop offset="70%" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="satG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#eed3a0"/>
      <stop offset="55%" stop-color="#c9975a"/>
      <stop offset="100%" stop-color="#a06f35"/>
    </linearGradient>
    <linearGradient id="ib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#343a5e"/><stop offset="100%" stop-color="#262b48"/>
    </linearGradient>
    <linearGradient id="im" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b4170"/><stop offset="100%" stop-color="#2d3356"/>
    </linearGradient>
    <linearGradient id="if" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#454c80"/><stop offset="100%" stop-color="#363c68"/>
    </linearGradient>
    <linearGradient id="ringL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232043"/><stop offset="100%" stop-color="#141230"/>
    </linearGradient>
    <pattern id="checker" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#f4f1e8"/>
      <rect x="7" width="7" height="7" fill="#14141c"/>
      <rect y="7" width="7" height="7" fill="#14141c"/>
      <rect x="7" y="7" width="7" height="7" fill="#f4f1e8"/>
    </pattern>
    <clipPath id="planetClip"><circle cx="0" cy="0" r="95"/></clipPath>
    <radialGradient id="vig" cx=".5" cy=".44" r=".78">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="72%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050312" stop-opacity=".6"/>
    </radialGradient>
  </defs>

  <!-- deep space -->
  <rect id="bg" width="1200" height="560" fill="url(#sky)"/>
  <circle cx="880" cy="150" r="215" fill="url(#glow)"/>
  <g id="stars"></g>
  <g id="debris"></g>

  <!-- moon -->
  <g>
    <circle cx="1070" cy="130" r="14" fill="#d9ccae"/>
    <circle cx="1066" cy="126" r="3"  fill="#b8a888"/>
    <circle cx="1074" cy="134" r="2.2" fill="#b8a888"/>
    <circle cx="1064" cy="138" r="1.6" fill="#b8a888"/>
  </g>

  <!-- Saturn: rings behind, planet, rings in front -->
  <g id="saturn">
    <g transform="rotate(-16 880 150)">
      <!-- rings behind the planet -->
      <ellipse cx="880" cy="150" rx="226" ry="62" fill="none" stroke="#e8cc98" stroke-width="10" opacity=".95"/>
      <ellipse cx="880" cy="150" rx="204" ry="56" fill="none" stroke="#c9a86a" stroke-width="5"/>
      <ellipse cx="880" cy="150" rx="184" ry="50" fill="none" stroke="#b08d55" stroke-width="13" opacity=".85"/>
      <ellipse cx="880" cy="150" rx="150" ry="41" fill="none" stroke="#8a6d42" stroke-width="4" opacity=".8"/>
      <ellipse cx="880" cy="150" rx="196" ry="53" fill="none" stroke="#fff2cf" stroke-width="1.6" stroke-dasharray="7 6" opacity=".5"/>
      <!-- planet -->
      <g>
        <circle cx="880" cy="150" r="95" fill="url(#satG)"/>
        <g clip-path="url(#planetClip)">
          <rect x="785" y="106" width="190" height="13" fill="rgba(122,84,40,.22)"/>
          <rect x="785" y="126" width="190" height="9"  fill="rgba(122,84,40,.22)"/>
          <rect x="785" y="154" width="190" height="12" fill="rgba(122,84,40,.22)"/>
          <rect x="785" y="178" width="190" height="8"  fill="rgba(122,84,40,.22)"/>
          <ellipse cx="888" cy="156" rx="170" ry="30" fill="rgba(16,8,28,.38)" transform="rotate(-16 888 156)"/>
        </g>
      </g>
      <!-- rings in front of the planet -->
      <path d="M654,150 A226,62 0 0 0 1106,150" fill="none" stroke="#e8cc98" stroke-width="10" opacity=".95"/>
      <path d="M676,150 A204,56 0 0 0 1084,150" fill="none" stroke="#c9a86a" stroke-width="5"/>
      <path d="M696,150 A184,50 0 0 0 1064,150" fill="none" stroke="#b08d55" stroke-width="13" opacity=".85"/>
      <path d="M730,150 A150,41 0 0 0 1030,150" fill="none" stroke="#8a6d42" stroke-width="4" opacity=".8"/>
      <path d="M684,150 A196,53 0 0 0 1076,150" fill="none" stroke="#fff2cf" stroke-width="1.6" stroke-dasharray="7 6" opacity=".5"/>
    </g>
  </g>

  <!-- race track on the rings -->
  <g id="track">
    <rect x="0" y="458" width="1200" height="102" fill="url(#ringL)"/>
    <polygon points="90,316 1110,316 1170,354 30,354" fill="url(#ib)" stroke="rgba(255,255,255,.08)"/>
    <polygon points="40,366 1160,366 1200,406 0,406" fill="url(#im)" stroke="rgba(255,255,255,.08)"/>
    <polygon points="20,416 1180,416 1200,458 0,458" fill="url(#if)" stroke="rgba(255,255,255,.08)"/>
    <line x1="140" y1="316" x2="1060" y2="316" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/>
    <line x1="100" y1="366" x2="1100" y2="366" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/>
    <line x1="80" y1="416" x2="1120" y2="416" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/>
    <line x1="140" y1="335" x2="1060" y2="335" stroke="rgba(220,228,255,.35)" stroke-width="2" stroke-dasharray="24 16"/>
    <line x1="100" y1="386" x2="1100" y2="386" stroke="rgba(220,228,255,.35)" stroke-width="2" stroke-dasharray="24 16"/>
    <line x1="80" y1="437" x2="1120" y2="437" stroke="rgba(220,228,255,.35)" stroke-width="2" stroke-dasharray="24 16"/>
  </g>

  <!-- start / finish line -->
  <g id="startline">
    <polygon points="118,316 146,316 152,458 124,458" fill="url(#checker)" stroke="#10101c" stroke-width="2"/>
    <rect x="119" y="300" width="3.5" height="158" fill="#14141c"/>
    <rect x="145.5" y="300" width="3.5" height="158" fill="#14141c"/>
    <rect x="108" y="306" width="50" height="5" rx="2.5" fill="#14141c" stroke="#ffe9a8" stroke-width="1"/>
    <rect x="114" y="296" width="9" height="7" fill="url(#checker)" stroke="#10101c" stroke-width="1"/>
    <rect x="145" y="296" width="9" height="7" fill="url(#checker)" stroke="#10101c" stroke-width="1"/>
    <rect x="104" y="312" width="58" height="14" rx="4" fill="#14141c" stroke="#ffe9a8" stroke-width="1"/>
    <text x="133" y="322" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffe9a8" font-family="'Segoe UI', system-ui, sans-serif">START · FINISH</text>
  </g>

  <g id="markers"></g>

  <!-- ============ RACER: RABBIT ON BICYCLE ============ -->
  <g id="rz-rabbit">
    <g id="streak-rabbit" opacity="0">
      <line x1="-92" y1="-4" x2="-64" y2="-4" stroke="#dbe6ff" stroke-width="2" stroke-linecap="round"/>
      <line x1="-86" y1="6"  x2="-66" y2="6"  stroke="#dbe6ff" stroke-width="2" stroke-linecap="round"/>
      <line x1="-90" y1="-12" x2="-70" y2="-12" stroke="#dbe6ff" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="lean-rabbit">
      <ellipse cx="0" cy="1" rx="50" ry="5" fill="rgba(6,4,20,.4)"/>
      <!-- rear wheel -->
      <g transform="translate(-44 -20)">
        <circle r="20" fill="none" stroke="#23232e" stroke-width="5"/>
        <circle r="15" fill="none" stroke="#98a0b8" stroke-width="2"/>
        <g id="spoker-rabbit">
          <line x1="0" y1="-14" x2="0" y2="14" stroke="#98a0b8" stroke-width="1.6"/>
          <line x1="-14" y1="0" x2="14" y2="0" stroke="#98a0b8" stroke-width="1.6"/>
          <line x1="-10" y1="-10" x2="10" y2="10" stroke="#98a0b8" stroke-width="1.2" opacity=".7"/>
          <line x1="-10" y1="10" x2="10" y2="-10" stroke="#98a0b8" stroke-width="1.2" opacity=".7"/>
        </g>
        <circle r="2.6" fill="#98a0b8"/>
      </g>
      <!-- front wheel -->
      <g transform="translate(46 -20)">
        <circle r="20" fill="none" stroke="#23232e" stroke-width="5"/>
        <circle r="15" fill="none" stroke="#98a0b8" stroke-width="2"/>
        <g id="spokef-rabbit">
          <line x1="0" y1="-14" x2="0" y2="14" stroke="#98a0b8" stroke-width="1.6"/>
          <line x1="-14" y1="0" x2="14" y2="0" stroke="#98a0b8" stroke-width="1.6"/>
          <line x1="-10" y1="-10" x2="10" y2="10" stroke="#98a0b8" stroke-width="1.2" opacity=".7"/>
          <line x1="-10" y1="10" x2="10" y2="-10" stroke="#98a0b8" stroke-width="1.2" opacity=".7"/>
        </g>
        <circle r="2.6" fill="#98a0b8"/>
      </g>
      <!-- frame -->
      <g fill="none" stroke="#ff5d8f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-44,-20 L2,-13 M-44,-20 L-8,-33 M-8,-33 L26,-24 M2,-13 L26,-24 M26,-24 L46,-20"/>
        <path d="M26,-24 L28,-32 L38,-31"/>
      </g>
      <ellipse cx="-8" cy="-35" rx="5" ry="2.6" fill="#3a2030"/>
      <!-- crank + pedals + shoes -->
      <g transform="translate(2 -13)">
        <g id="crank-rabbit">
          <line x1="0" y1="0" x2="8" y2="0" stroke="#23232e" stroke-width="3" stroke-linecap="round"/>
          <line x1="0" y1="0" x2="-8" y2="0" stroke="#23232e" stroke-width="3" stroke-linecap="round"/>
          <circle cx="8" cy="0" r="3.4" fill="#f7f2e8" stroke="#d8cdb8" stroke-width=".8"/>
          <circle cx="-8" cy="0" r="3.4" fill="#f7f2e8" stroke="#d8cdb8" stroke-width=".8"/>
        </g>
      </g>
      <!-- legs (JS-driven) -->
      <path id="leg-rabbit-0" fill="none" stroke="#f7f2e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="leg-rabbit-1" fill="none" stroke="#f7f2e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- tail -->
      <circle cx="-12" cy="-41" r="3.5" fill="#f7f2e8" stroke="#cfc4b0" stroke-width=".8"/>
      <!-- torso -->
      <ellipse cx="11" cy="-47" rx="12.5" ry="9.5" fill="#f7f2e8" stroke="#cfc4b0" stroke-width="1" transform="rotate(24 11 -47)"/>
      <!-- arm -->
      <path d="M20,-49 Q30,-43 38,-31" fill="none" stroke="#f7f2e8" stroke-width="3" stroke-linecap="round"/>
      <circle cx="38" cy="-31" r="3" fill="#f7f2e8"/>
      <!-- head -->
      <circle cx="26" cy="-59" r="11" fill="#f7f2e8" stroke="#cfc4b0" stroke-width="1"/>
      <circle cx="30" cy="-61" r="2" fill="#1c1c26"/>
      <circle cx="30.7" cy="-61.7" r=".6" fill="#fff"/>
      <circle cx="32" cy="-57" r="2.2" fill="#ff9bb8" opacity=".7"/>
      <circle cx="36" cy="-58" r="1.7" fill="#f26d9d"/>
      <path d="M34,-56 q2,1.5 4,0" fill="none" stroke="#cfc4b0" stroke-width="1"/>
      <path d="M30,-56 L35,-57 M30,-55.5 L34.5,-54.5" fill="none" stroke="#cfc4b0" stroke-width=".8"/>
      <!-- ears (flap via JS) -->
      <g transform="translate(20 -67)"><g id="ear-rabbit-l">
        <path d="M-3,0 C-6,-12 -6,-24 0,-28 C6,-24 3,-12 1.5,0 Z" fill="#f7f2e8" stroke="#cfc4b0" stroke-width="1"/>
        <path d="M-1.5,-3 C-3.4,-11 -3,-20 0,-23 C3,-20 2,-11 1,-3 Z" fill="#ffb3cd"/>
      </g></g>
      <g transform="translate(27 -66)"><g id="ear-rabbit-r">
        <path d="M-3,0 C-6,-12 -6,-24 0,-28 C6,-24 3,-12 1.5,0 Z" fill="#f7f2e8" stroke="#cfc4b0" stroke-width="1"/>
        <path d="M-1.5,-3 C-3.4,-11 -3,-20 0,-23 C3,-20 2,-11 1,-3 Z" fill="#ffb3cd"/>
      </g></g>
    </g>
  </g>

  <!-- ============ RACER: TURTLE ON MOTORCYCLE ============ -->
  <g id="rz-turtle">
    <g id="streak-turtle" opacity="0">
      <line x1="-76" y1="-1" x2="-52" y2="-1" stroke="#dbe6ff" stroke-width="2" stroke-linecap="round"/>
      <line x1="-70" y1="7"  x2="-54" y2="7"  stroke="#dbe6ff" stroke-width="2" stroke-linecap="round"/>
      <line x1="-74" y1="-9" x2="-58" y2="-9" stroke="#dbe6ff" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="lean-turtle">
      <ellipse cx="2" cy="1" rx="42" ry="4.5" fill="rgba(6,4,20,.4)"/>
      <!-- rear wheel -->
      <g transform="translate(-28 -12)">
        <circle r="12" fill="none" stroke="#1c1c26" stroke-width="4.5"/>
        <circle r="8" fill="none" stroke="#7d8aa8" stroke-width="1.5"/>
        <g id="spoker-turtle">
          <line x1="0" y1="-8.5" x2="0" y2="8.5" stroke="#7d8aa8" stroke-width="1.8"/>
          <line x1="-7.4" y1="-4.2" x2="7.4" y2="4.2" stroke="#7d8aa8" stroke-width="1.8"/>
          <line x1="-7.4" y1="4.2" x2="7.4" y2="-4.2" stroke="#7d8aa8" stroke-width="1.8"/>
        </g>
        <circle r="2" fill="#7d8aa8"/>
      </g>
      <!-- front wheel -->
      <g transform="translate(36 -12)">
        <circle r="12" fill="none" stroke="#1c1c26" stroke-width="4.5"/>
        <circle r="8" fill="none" stroke="#7d8aa8" stroke-width="1.5"/>
        <g id="spokef-turtle">
          <line x1="0" y1="-8.5" x2="0" y2="8.5" stroke="#7d8aa8" stroke-width="1.8"/>
          <line x1="-7.4" y1="-4.2" x2="7.4" y2="4.2" stroke="#7d8aa8" stroke-width="1.8"/>
          <line x1="-7.4" y1="4.2" x2="7.4" y2="-4.2" stroke="#7d8aa8" stroke-width="1.8"/>
        </g>
        <circle r="2" fill="#7d8aa8"/>
      </g>
      <!-- frame -->
      <g fill="none" stroke="#3f6fd8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-28,-12 L2,-16 L0,-22 M0,-22 L12,-24 L24,-24 M24,-24 L36,-12 M24,-24 L26,-31 L33,-29"/>
      </g>
      <rect x="8" y="-18" width="10" height="8" rx="2" fill="#3a3f4d" stroke="#262a33" stroke-width="1"/>
      <path d="M12,-16 L8,-6 L-6,-6" fill="none" stroke="#7a808c" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="-9" y="-7" width="3" height="3" rx="1" fill="#5a5f6b"/>
      <path d="M-40,-17 A15,15 0 0 1 -16,-17" fill="none" stroke="#262a33" stroke-width="3"/>
      <path d="M24,-17 A15,15 0 0 1 48,-17" fill="none" stroke="#262a33" stroke-width="3"/>
      <circle cx="38" cy="-20" r="3" fill="#ffe9a8" stroke="#888888" stroke-width="1"/>
      <circle cx="33" cy="-29" r="2.6" fill="#cfe8b8"/>
      <!-- tail -->
      <path id="tail-turtle" d="M-11,-31 L-15,-29 L-12,-28 Z" fill="#2c6638"/>
      <!-- shell -->
      <path d="M-11,-29 C-9,-47 5,-48 11,-30 Z" fill="#3d8b4e" stroke="#2c6638" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M-6,-34 Q-1,-41 4,-34 M-2,-36 Q2,-42 7,-36 M-9,-32 Q-4,-38 1,-32" fill="none" stroke="#2c6638" stroke-width="1" opacity=".8"/>
      <path d="M-2,-30 L10,-30 L9,-26 L-1,-26 Z" fill="#a8c98a" stroke="#2c6638" stroke-width="1"/>
      <!-- leg to peg + foot -->
      <path d="M2,-28 Q7,-22 12,-14" fill="none" stroke="#79b06a" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="12" cy="-14" r="2.5" fill="#79b06a"/>
      <!-- arm -->
      <path d="M8,-32 Q20,-35 33,-29" fill="none" stroke="#79b06a" stroke-width="3.5" stroke-linecap="round"/>
      <!-- head + helmet -->
      <g id="head-turtle">
        <path d="M9,-31 Q13,-33 16,-38" fill="none" stroke="#79b06a" stroke-width="5" stroke-linecap="round"/>
        <circle cx="15" cy="-38" r="6" fill="#79b06a" stroke="#57924a" stroke-width="1"/>
        <circle cx="17.5" cy="-40" r="1.6" fill="#1c1c26"/>
        <path d="M18,-35.5 q2.5,1 4.5,-.5" fill="none" stroke="#57924a" stroke-width="1"/>
        <path d="M9,-41 A7,7 0 0 1 23,-41 L23,-38.5 L9,-38.5 Z" fill="#e74c3c" stroke="#a8231f" stroke-width="1"/>
        <rect x="16.5" y="-41" width="5.5" height="3.5" rx="1.7" fill="#1f2a3e" transform="rotate(-12 19.2 -39.2)"/>
        <path d="M13,-45.5 A5.5,5.5 0 0 1 19,-45" fill="none" stroke="#ffd9a8" stroke-width="1.4" opacity=".8"/>
      </g>
    </g>
  </g>

  <!-- ============ RACER: BALD EAGLE ON TRICYCLE ============ -->
  <g id="rz-eagle">
    <g id="streak-eagle" opacity="0">
      <line x1="-84" y1="-4" x2="-56" y2="-4" stroke="#dbe6ff" stroke-width="2" stroke-linecap="round"/>
      <line x1="-79" y1="5"  x2="-58" y2="5"  stroke="#dbe6ff" stroke-width="2" stroke-linecap="round"/>
      <line x1="-82" y1="-11" x2="-62" y2="-11" stroke="#dbe6ff" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="lean-eagle">
      <ellipse cx="2" cy="1" rx="52" ry="4.5" fill="rgba(6,4,20,.4)"/>
      <!-- far rear wheel -->
      <g transform="translate(-47 -16)">
        <circle r="16" fill="none" stroke="#181824" stroke-width="4.5"/>
        <g id="spokefar-eagle">
          <line x1="0" y1="-11" x2="0" y2="11" stroke="#5d6a88" stroke-width="1.5"/>
          <line x1="-11" y1="0" x2="11" y2="0" stroke="#5d6a88" stroke-width="1.5"/>
        </g>
        <circle r="2.2" fill="#5d6a88"/>
      </g>
      <!-- near rear wheel -->
      <g transform="translate(-37 -16)">
        <circle r="16" fill="none" stroke="#23232e" stroke-width="5"/>
        <circle r="11.5" fill="none" stroke="#98a0b8" stroke-width="2"/>
        <g id="spoker-eagle">
          <line x1="0" y1="-11" x2="0" y2="11" stroke="#98a0b8" stroke-width="1.6"/>
          <line x1="-11" y1="0" x2="11" y2="0" stroke="#98a0b8" stroke-width="1.6"/>

<script>
(() => {
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const f = n => n.toFixed(1);

/* ---------------- scenery generation ---------------- */
const starsG = $('stars');
for (let i = 0; i < 48; i++) {
  const y = Math.random() < 0.82 ? rand(0, 296) : rand(474, 560);
  const x = rand(8, 1192);
  const big = i % 6 === 0;
  const c = document.createElementNS(NS, 'circle');
  c.setAttribute('cx', x); c.setAttribute('cy', y);
  c.setAttribute('r', big ? rand(1.6, 2.4) : rand(0.7, 1.6));
  c.setAttribute('fill', big ? '#ffe9a8' : '#ffffff');
  c.setAttribute('class', 'tw');
  c.style.animationDelay = rand(0, 3) + 's';
  c.style.animationDuration = rand(1.8, 3.6) + 's';
  starsG.appendChild(c);
}
for (let i = 0; i < 8; i++) {
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', 'M0,-4 L1.1,-1.1 L4,0 L1.1,1.1 L0,4 L-1.1,1.1 L-4,0 L-1.1,-1.1 Z');
  p.setAttribute('transform', 'translate(' + rand(8, 1192) + ' ' + rand(0, 296) + ') scale(' + rand(2.2, 4.6).toFixed(1) + ')');
  p.setAttribute('fill', '#fff4d8');
  p.setAttribute('class', 'tw');
  p.style.animationDelay = rand(0, 2.5) + 's';
  p.style.animationDuration = rand(2, 3.2) + 's';
  starsG.appendChild(p);
}

const debG = $('debris');
const deb = [[1010,262,26,5,-18],[150,240,14,4,10],[1120,190,20,4,-24],[60,180,12,3,16],[420,120,16,4,-8],[1150,430,18,4,-14]];
for (const [x, y, rx, ry, rot] of deb) {
  const e = document.createElementNS(NS, 'ellipse');
  e.setAttribute('cx', x); e.setAttribute('cy', y);
  e.setAttribute('rx', rx); e.setAttribute('ry', ry);
  e.setAttribute('transform', 'rotate(' + rot + ' ' + x + ' ' + y + ')');
  e.setAttribute('fill', 'rgba(216,190,140,.5)');
  e.setAttribute('class', 'fl');
  e.style.animationDuration = rand(4, 7) + 's';
  debG.appendChild(e);
}

const mkG = $('markers');
for (let i = 0; i < 7; i++) {
  const x = 200 + i * 140;
  const post = document.createElementNS(NS, 'line');
  post.setAttribute('x1', x); post.setAttribute('y1', 316);
  post.setAttribute('x2', x); post.setAttribute('y2', 298);
  post.setAttribute('stroke', '#efe9da'); post.setAttribute('stroke-width', 2);
  const flag = document.createElementNS(NS, 'path');
  flag.setAttribute('d', 'M' + x + ',298 L' + (x + 11) + ',298 L' + x + ',304 Z');
  flag.setAttribute('fill', '#e8c98a'); flag.setAttribute('stroke', '#b08d55'); flag.setAttribute('stroke-width', 0.8);
  const num = document.createElementNS(NS, 'text');
  num.textContent = String(i);
  num.setAttribute('x', x + 5.5); num.setAttribute('y', 302.5);
  num.setAttribute('font-size', 6.5); num.setAttribute('fill', '#4a3a20');
  num.setAttribute('font-weight', 700); num.setAttribute('text-anchor', 'middle');
  const lab = document.createElementNS(NS, 'text');
  lab.textContent = 'KM ' + i;
  lab.setAttribute('x', x + 2); lab.setAttribute('y', 328);
  lab.setAttribute('font-size', 8); lab.setAttribute('fill', 'rgba(240,244,255,.75)');
  lab.setAttribute('font-weight', 600);
  mkG.appendChild(post); mkG.appendChild(flag); mkG.appendChild(num); mkG.appendChild(lab);
}

/* ---------------- racers ---------------- */
const RACERS = [
  {
    id: 'rabbit', name: 'BUNNY BLAZE', color: '#ff7ac2',
    base: 160, weaveA: 32, weaveF: 0.85, ph: 0, dir: 1, x: 300,
    ground: 458, scale: 1.08, topY: -97,
    crankSel: 'crank-rabbit', crankR: 8, crankC: { x: 2, y: -13 },
    wheelR: 20, wheelSels: ['spoker-rabbit', 'spokef-rabbit'],
    hip: { x: -1, y: -30 }, knee: 9,
    legs: ['leg-rabbit-0', 'leg-rabbit-1'],
    ears: [{ s: 'ear-rabbit-l', base: 6, amp: 17, fr: 2.6, ph: 0 },
           { s: 'ear-rabbit-r', base: -8, amp: 13, fr: 2.6, ph: 1.15 }],
    leanSel: 'lean-rabbit', leanMax: 4, leanK: 0.12,
    bobAmp: 1.6, streak: 'streak-rabbit', tag: 'tag-rabbit'
  },
  {
    id: 'turtle', name: 'SHELL SHOCK', color: '#7ee081',
    base: 205, weaveA: 24, weaveF: 1.15, ph: 2.1, dir: 1, x: 470,
    ground: 406, scale: 0.95, topY: -50,
    crankSel: null, crankR: 8, crankC: { x: 2, y: -13 },
    wheelR: 12, wheelSels: ['spoker-turtle', 'spokef-turtle'],
    leanSel: 'lean-turtle', leanMax: 9, leanK: 0.34,
    bobAmp: 0.7, vibrate: 34, streak: 'streak-turtle', tag: 'tag-turtle',
    head: 'head-turtle', tail: 'tail-turtle', exhaust: true, puffTimer: 0
  },
  {
    id: 'eagle', name: 'EAGLE RUSH', color: '#ffd97a',
    base: 132, weaveA: 18, weaveF: 0.62, ph: 4, dir: 1, x: 200,
    ground: 354, scale: 0.88, topY: -55,
    crankSel: 'crank-eagle', crankR: 9, crankC: { x: 14, y: -12 },
    wheelR: 16, wheelSels: ['spoker-eagle', 'spokef-eagle', 'spokefar-eagle'],
    hip: { x: 7, y: -31 }, knee: 10,
    legs: ['leg-eagle-0', 'leg-eagle-1'],
    wings: [{ s: 'wing-eagle-n', base: -42, amp: 26, fr: 2.2, ph: 0 },
            { s: 'wing-eagle-f', base: -45, amp: 22, fr: 2.2, ph: 0.85 }],
    leanSel: 'lean-eagle', leanMax: 2.5, leanK: 0.08,
    bobAmp: 1.4, streak: 'streak-eagle', tag: 'tag-eagle'
  }
];

RACERS.forEach(r => {
  r.prog = 0; r.a = 0; r.wa = 0; r.speed = 0; r.crankA = 0;
  r.legEls = (r.legs || []).map($);
  r.wingEls = (r.wings || []).map(w => $(w.s));
  r.earEls = (r.ears || []).map(e => $(e.s));
});

/* ---------------- animation loop ---------------- */
const puffs = [];
let last = performance.now(), t = 0, raceStart = -1, boardTimer = 0;
const MEDALS = ['#ffd75e', '#d7dee8', '#e0a06a'];

function setLegs(r) {
  if (!r.legEls.length) return;
  const a = r.crankA;
  for (let i = 0; i < 2; i++) {
    const ph = i * Math.PI;
    const px = r.crankC.x + r.crankR * Math.cos(a + ph);
    const py = r.crankC.y + r.crankR * Math.sin(a + ph);
    const dx = px - r.hip.x, dy = py - r.hip.y;
    const len = Math.hypot(dx, dy) || 1;
    const kx = r.hip.x + dx / 2 + (dy / len) * r.knee;
    const ky = r.hip.y + dy / 2 - (dx / len) * r.knee;
    r.legEls[i].setAttribute('d',
      'M' + f(r.hip.x) + ',' + f(r.hip.y) + ' L' + f(kx) + ',' + f(ky) + ' L' + f(px) + ',' + f(py));
  }
}

function spawnPuff(r, px, racerX, dt) {
  r.puffTimer -= dt;
  if (r.puffTimer > 0) return;
  r.puffTimer = 0.22;
  if (puffs.length > 14) return;
  const c = document.createElementNS(NS, 'circle');
  c.setAttribute('r', rand(1.8, 3));
  c.setAttribute('fill', '#c7d2e8');
  document.getElementById('scene').appendChild(c);
  puffs.push({ el: c, x: px, y: r.ground + (-6 * r.scale), vx: -r.dir * rand(25, 45), vy: rand(-18, -8), life: 0.9 });
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  t += dt;
  const racing = raceStart >= 0 && t >= raceStart;

  for (const r of RACERS) {
    const s = racing ? r.base * (1 + 0.08 * Math.sin(0.7 * t + r.ph) + 0.05 * Math.sin(0.23 * t + r.ph * 1.7)) : 0;
    r.speed = s;
    if (racing) { r.prog += s * dt; r.x += r.dir * s * dt; }

    const wx = r.weaveA * Math.sin(r.weaveF * t + r.ph);
    if (r.x + wx < 70) { r.dir = 1; r.x = 70 - wx; }
    if (r.x + wx > 1130) { r.dir = -1; r.x = 1130 - wx; }
    const px = r.x + wx;

    /* crank / wheel rotation: mirrored by the direction flip, so angles stay positive */
    if (racing) {
      r.crankA += (s / r.crankR) * dt;
      r.wa += (s / r.wheelR) * dt;
      r.a = r.crankA;
    }

    /* natural bob: pedaling cadence, or idle revving before the start */
    let bob = 0;
    if (racing) {
      bob = r.bobAmp * Math.sin(2 * r.crankA);
      if (r.vibrate) bob += 0.35 * Math.sin(r.vibrate * t);
    } else {
      bob = 1.2 * Math.sin(3.2 * t + r.ph);
    }

    const gy = r.ground + bob;
    const sx = r.dir * r.scale, sy = r.scale;
    $('rz-' + r.id).setAttribute('transform', 'translate(' + f(px) + ' ' + f(gy) + ') scale(' + f(sx) + ' ' + f(sy) + ')');

    /* lean into the weave (turtle leans hardest) */
    const latVel = r.weaveA * r.weaveF * Math.cos(r.weaveF * t + r.ph);
    const lean = clamp(-latVel * r.leanK, -r.leanMax, r.leanMax);
    $(r.leanSel).setAttribute('transform', 'rotate(' + f(lean) + ' 2 0)');

    /* character parts */
    if (r.crankSel) $(r.crankSel).setAttribute('transform', 'rotate(' + f(r.a) + ')');
    for (const w of r.wheelSels) $(w).setAttribute('transform', 'rotate(' + f(r.wa) + ')');
    setLegs(r);
    if (r.earEls.length) {
      r.earEls.forEach((el, i) => {
        const e = r.ears[i];
        el.setAttribute('transform', 'rotate(' + f(e.base + e.amp * Math.sin(2 * Math.PI * e.fr * t + e.ph)) + ')');
      });
    }
    if (r.wingEls.length) {
      r.wingEls.forEach((el, i) => {
        const w = r.wings[i];
        el.setAttribute('transform', 'rotate(' + f(w.base + w.amp * Math.sin(2 * Math.PI * w.fr * t + w.ph)) + ')');
      });
    }
    if (r.head) {
      $(r.head).setAttribute('transform', 'rotate(' + f(2.6 * Math.sin(2 * Math.PI * 1.9 * t + 0.5)) + ' 9 -31)');
    }
    if (r.tail) {
      $(r.tail).setAttribute('transform', 'rotate(' + f(7 * Math.sin(2 * Math.PI * 3.1 * t)) + ' -11 -31)');
    }

    /* speed streaks + exhaust puffs + name tag */
    $(r.streak).setAttribute('opacity', racing ? f(clamp((s - 90) / 160, 0, 0.5)) : '0');
    if (r.exhaust && racing) spawnPuff(r, px, r.x, dt);
    $(r.tag).setAttribute('transform', 'translate(' + f(px) + ' ' + f(r.ground + r.topY * r.scale - 16) + ')');
  }

  /* exhaust puffs drift, fade, and die */
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i];
    p.life -= dt;
    if (p.life <= 0) { p.el.remove(); puffs.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.el.setAttribute('cx', f(p.x)); p.el.setAttribute('cy', f(p.y));
    p.el.setAttribute('r', f(2.4 + (0.9 - p.life) * 3));
    p.el.setAttribute('opacity', f(0.5 * (p.life / 0.9)));
  }

  /* scoreboard */
  boardTimer += dt;
  if (boardTimer >= 0.15) {
    boardTimer = 0;
    const ranked = RACERS.slice().sort((a, b) => b.prog - a.prog);
    const lead = Math.max(ranked[0].prog, 1);
    ranked.forEach((r, i) => {
      $('row-' + r.id).setAttribute('transform', 'translate(0 ' + (84 + i * 20) + ')');
      const rank = $('rank-' + r.id);
      rank.textContent = String(i + 1);
      rank.setAttribute('fill', MEDALS[i]);
      $('spd-' + r.id).textContent = String(Math.round(r.speed * 0.792));
      $('dst-' + r.id).textContent = String(Math.round(r.prog * 0.22));
      $('lap-' + r.id).textContent = String(1 + Math.floor(r.prog / 2800));
      $('pbar-' + r.id).setAttribute('width', f(120 * (r.prog / lead)));
    });
    if (raceStart >= 0) {
      const rt = Math.max(0, t - raceStart);
      const mm = String(Math.floor(rt / 60)).padStart(2, '0');
      const ss = String(Math.floor(rt % 60)).padStart(2, '0');
      $('clock').textContent = 'T+ ' + mm + ':' + ss;
    }
  }

  requestAnimationFrame(frame);
}

/* ---------------- countdown ---------------- */
const countEl = $('count');
let cd = 3;
function tick() {
  countEl.textContent = cd <= 0 ? 'GO!' : String(cd);
  countEl.classList.remove('pop');
  void countEl.getBoundingClientRect();
  countEl.classList.add('pop');
  if (cd > 0) {
    cd--;
    setTimeout(tick, 800);
  } else {
    raceStart = t + 0.35;
    setTimeout(() => { countEl.style.transition = 'opacity .6s'; countEl.style.opacity = 0; }, 900);
  }
}
setTimeout(tick, 350);
requestAnimationFrame(frame);
})();
</script>
