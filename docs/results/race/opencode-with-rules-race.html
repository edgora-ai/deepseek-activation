<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saturn Ring Racers</title>
<style>
  html,body{margin:0;padding:0;background:#05071c;height:100%;overflow:hidden}
  #scene{display:block;width:100vw;height:100vh}
  .star{animation:tw var(--dur,3s) ease-in-out var(--del,0s) infinite}
  @keyframes tw{0%,100%{opacity:.12}50%{opacity:1}}
</style>
</head>
<body>

<svg id="scene" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b20"/>
      <stop offset="0.55" stop-color="#131a3c"/>
      <stop offset="1" stop-color="#232a56"/>
    </linearGradient>
    <radialGradient id="nebulaA" cx="0.22" cy="0.12" r="0.55">
      <stop offset="0" stop-color="#5c2f86" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5c2f86" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="0.85" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#7a3b6f" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7a3b6f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dbe9ff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#8fb4ff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8fb4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="saturnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7cf94"/>
      <stop offset="0.25" stop-color="#f4e4b2"/>
      <stop offset="0.45" stop-color="#d9bd7e"/>
      <stop offset="0.7" stop-color="#efe0ab"/>
      <stop offset="1" stop-color="#c9a75f"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b98d4e"/>
      <stop offset="0.25" stop-color="#ecd9a3"/>
      <stop offset="0.5" stop-color="#caa15f"/>
      <stop offset="0.75" stop-color="#f6e7b8"/>
      <stop offset="1" stop-color="#a97b3c"/>
    </linearGradient>
    <linearGradient id="roadGrad" gradientUnits="userSpaceOnUse" x1="0" y1="380" x2="0" y2="640">
      <stop offset="0" stop-color="#2c3562"/>
      <stop offset="0.5" stop-color="#171e40"/>
      <stop offset="1" stop-color="#0b1026"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd54f"/>
      <stop offset="0.5" stop-color="#fff6c0"/>
      <stop offset="1" stop-color="#ffb300"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.46" r="0.72">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#04061a" stop-opacity="0.4"/>
    </radialGradient>
    <pattern id="checker" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#f6f7fb"/>
      <rect width="8" height="8" fill="#16181f"/>
      <rect x="8" y="8" width="8" height="8" fill="#16181f"/>
    </pattern>
  </defs>

  <!-- ===================== SKY ===================== -->
  <rect width="1200" height="700" fill="url(#skyGrad)"/>
  <rect width="1200" height="700" fill="url(#nebulaA)"/>
  <rect width="1200" height="700" fill="url(#nebulaB)"/>
  <g id="stars"></g>

  <!-- ===================== SATURN ===================== -->
  <g id="saturn">
    <circle cx="160" cy="150" r="7" fill="#e0c9a0" opacity="0.9"/>
    <circle cx="158" cy="149" r="2.4" fill="#b99a6a" opacity="0.8"/>
    <!-- rings behind -->
    <g transform="rotate(-18 255 215)">
      <path d="M55 215 A200 64 0 0 0 455 215" fill="none" stroke="url(#ringGrad)" stroke-width="26" opacity="0.95"/>
      <path d="M55 215 A200 64 0 0 0 455 215" fill="none" stroke="#f6e7b8" stroke-width="7" opacity="0.55"/>
      <path d="M70 215 A185 58 0 0 0 440 215" fill="none" stroke="#b98d4e" stroke-width="6" opacity="0.7"/>
    </g>
    <!-- planet -->
    <circle cx="255" cy="215" r="95" fill="url(#saturnGrad)"/>
    <path d="M168 225 A95 95 0 0 0 342 225" fill="none" stroke="#c9a75f" stroke-width="5" opacity="0.5"/>
    <path d="M170 246 A95 95 0 0 0 340 246" fill="none" stroke="#b98d4e" stroke-width="4" opacity="0.35"/>
    <path d="M178 195 A95 95 0 0 0 330 195" fill="none" stroke="#f4e4b2" stroke-width="4" opacity="0.5"/>
    <circle cx="255" cy="215" r="95" fill="url(#vig)" opacity="0.55"/>
    <path d="M300 150 A95 95 0 0 1 350 215 A95 95 0 0 1 348 230" fill="none" stroke="#6b5326" stroke-width="6" opacity="0.35"/>
    <!-- rings in front -->
    <g transform="rotate(-18 255 215)">
      <path d="M55 215 A200 64 0 0 1 455 215" fill="none" stroke="url(#ringGrad)" stroke-width="26" opacity="0.95"/>
      <path d="M55 215 A200 64 0 0 1 455 215" fill="none" stroke="#f6e7b8" stroke-width="7" opacity="0.55"/>
      <path d="M70 215 A185 58 0 0 1 440 215" fill="none" stroke="#b98d4e" stroke-width="6" opacity="0.7"/>
    </g>
  </g>

  <!-- ===================== ROAD / RING TRACK ===================== -->
  <g id="road">
    <g id="finBand" transform="translate(0 -80)">
      <rect x="-8" y="0" width="16" height="160" fill="url(#checker)" opacity="0.92"/>
      <line x1="-9" y1="0" x2="-9" y2="160" stroke="#ffd54f" stroke-width="2"/>
      <line x1="9" y1="0" x2="9" y2="160" stroke="#ffd54f" stroke-width="2"/>
    </g>
  </g>

  <!-- ===================== SHADOWS ===================== -->
  <g id="shadows">
    <ellipse id="shadow-rabbit" cx="0" cy="0" rx="58" ry="10" fill="#000" opacity="0.32"/>
    <ellipse id="shadow-eagle"  cx="0" cy="0" rx="60" ry="10" fill="#000" opacity="0.32"/>
    <ellipse id="shadow-turtle" cx="0" cy="0" rx="66" ry="11" fill="#000" opacity="0.32"/>
  </g>

  <!-- ===================== RACERS ===================== -->
  <g id="racers">

    <!-- ============ RABBIT ON BICYCLE ============ -->
    <g id="racer-rabbit" class="racer" transform="translate(40 523) scale(1.09)">
      <g transform="translate(0 -30)"><g class="wheel">
        <circle r="30" fill="none" stroke="#b03a2e" stroke-width="5"/>
        <circle r="26" fill="none" stroke="#1c1c1c" stroke-width="2" opacity="0.6"/>
        <circle r="20" fill="none" stroke="#eceff1" stroke-width="1.6" opacity="0.9"/>

        <line x1="-14" y1="-14" x2="14" y2="14" stroke="#cfd8dc" stroke-width="1.6"/>
        <line x1="14" y1="-14" x2="-14" y2="14" stroke="#cfd8dc" stroke-width="1.6"/>
        <circle r="3" fill="#fafafa"/>
        <circle r="2" cx="22" cy="0" fill="#b03a2e"/>
      </g></g>
      <g transform="translate(82 -30)"><g class="wheel">
        <circle r="30" fill="none" stroke="#b03a2e" stroke-width="5"/>
        <circle r="26" fill="none" stroke="#1c1c1c" stroke-width="2" opacity="0.6"/>
        <circle r="20" fill="none" stroke="#eceff1" stroke-width="1.6" opacity="0.9"/>
        <line x1="0" y1="-20" x2="0" y2="20" stroke="#cfd8dc" stroke-width="1.6"/>
        <line x1="-20" y1="0" x2="20" y2="0" stroke="#cfd8dc" stroke-width="1.6"/>
        <line x1="-14" y1="-14" x2="14" y2="14" stroke="#cfd8dc" stroke-width="1.6"/>
        <line x1="14" y1="-14" x2="-14" y2="14" stroke="#cfd8dc" stroke-width="1.6"/>
        <circle r="3" fill="#fafafa"/>
        <circle r="2" cx="22" cy="0" fill="#b03a2e"/>
      </g></g>
      <!-- frame -->
      <g stroke="#e53935" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M0 -30 L42 -20 L82 -30"/>
        <path d="M0 -30 L38 -60"/>
        <path d="M42 -20 L36 -64"/>
        <path d="M36 -64 L76 -66"/>
        <path d="M76 -66 L82 -30"/>
      </g>
      <g stroke="#37474f" stroke-width="4" stroke-linecap="round" fill="none">
        <path d="M76 -66 L86 -60 L94 -55"/>
      </g>
      <circle cx="95" cy="-55" r="4" fill="#37474f"/>
      <circle cx="89" cy="-58" r="2.4" fill="#ffe082"/>

      <g transform="rotate(-6 37 -66)"><rect x="28" y="-72" width="20" height="7" rx="3.5" fill="#455a64"/></g>
      <!-- number plate -->
      <g transform="translate(20 -44) rotate(-12)">
        <rect x="-7" y="-10" width="14" height="13" rx="3" fill="#fff" stroke="#c62828" stroke-width="2"/>
        <text x="0" y="0" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828" font-family="Verdana, sans-serif">7</text>
      </g>
      <!-- wind streak -->
      <path d="M-6 -44 L-38 -44 M-10 -30 L-34 -30 M-4 -16 L-24 -16" stroke="#cfe0ff" stroke-width="2" opacity="0.35" stroke-linecap="round" fill="none"/>
      <!-- tail -->
      <circle cx="16" cy="-78" r="5.5" fill="#fff" stroke="#ddd6c8" stroke-width="1.5"/>
      <!-- body -->
      <ellipse cx="36" cy="-86" rx="13" ry="17" fill="#f7f1e4" stroke="#ddd2bf" stroke-width="1.5" transform="rotate(-12 36 -86)"/>
      <path d="M42 -94 L70 -68 L78 -64" fill="none" stroke="#f7f1e4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="79" cy="-64" r="3.5" fill="#f7f1e4"/>

      </g></g>
      <g transform="translate(59 -115)"><g class="ear">

      </g></g>

        <line x1="0" y1="-17" x2="0" y2="17" stroke="#37474f" stroke-width="4"/>

        <path d="M0 -2 L0 -17 L8 -18" fill="none" stroke="#f7f1e4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M0 2 L0 17 L8 18" fill="none" stroke="#e3dccb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </g></g>
    </g>

    <!-- ============ BALD EAGLE ON TRICYCLE ============ -->
    <g id="racer-eagle" class="racer" transform="translate(420 563) scale(1.07)">
      <g transform="translate(-2 -26)"><g class="wheel">

        <line x1="-12.5" y1="-12.5" x2="12.5" y2="12.5" stroke="#d7ccc8" stroke-width="1.5"/>

        <circle r="2.6" fill="#fafafa"/>
        <circle r="1.8" cx="18" cy="0" fill="#f9a825"/>
      </g></g>
      <g transform="translate(70 -26)"><g class="wheel">
        <circle r="26" fill="none" stroke="#5d4037" stroke-width="4"/>
        <circle r="22" fill="none" stroke="#1c1c1c" stroke-width="1.6" opacity="0.5"/>
        <line x1="0" y1="-18" x2="0" y2="18" stroke="#d7ccc8" stroke-width="1.5"/>
        <line x1="-18" y1="0" x2="18" y2="0" stroke="#d7ccc8" stroke-width="1.5"/>
        <line x1="-12.5" y1="-12.5" x2="12.5" y2="12.5" stroke="#d7ccc8" stroke-width="1.5"/>
        <line x1="12.5" y1="-12.5" x2="-12.5" y2="12.5" stroke="#d7ccc8" stroke-width="1.5"/>
        <circle r="2.6" fill="#fafafa"/>
        <circle r="1.8" cx="18" cy="0" fill="#f9a825"/>
      </g></g>
      <!-- frame -->
      <path d="M14 -50 L4 -26 L34 -20 L22 -52 Z" fill="#ffca28" stroke="#f9a825" stroke-width="2.5" stroke-linejoin="round"/>

        <path d="M34 -20 L68 -26"/>
        <path d="M60 -52 L70 -26"/>
        <path d="M52 -56 L64 -50"/>

      <g transform="rotate(-4 14 -55)"><rect x="6" y="-57" width="18" height="6" rx="3" fill="#4e342e"/></g>
      <circle cx="66" cy="-50" r="4" fill="#4e342e"/>
      <!-- wind streak -->
      <path d="M-6 -44 L-36 -44 M-8 -30 L-30 -30" stroke="#cfe0ff" stroke-width="2" opacity="0.3" stroke-linecap="round" fill="none"/>
      <!-- tail feathers -->
      <g fill="#3e2723" stroke="#2a1a16" stroke-width="1">
        <path d="M16 -66 L2 -70 L8 -60 Z"/>
        <path d="M18 -70 L0 -80 L10 -66 Z"/>
        <path d="M20 -64 L8 -58 L18 -58 Z"/>
      </g>
      <!-- far wing -->
      <g transform="translate(32 -82)"><g class="wing" data-side="far">
        <path d="M0 0 C -14 -22 -38 -38 -60 -40 C -48 -30 -44 -18 -34 -8 C -24 -10 -12 -6 -6 -2 Z" fill="#4e342e" stroke="#2a1a16" stroke-width="1.5"/>

      <!-- head -->

      <path d="M64 -92 Q74 -93 76 -88 Q69 -84 65 -87 Z" fill="#f9a825" stroke="#f57f17" stroke-width="1"/>

    <!-- ============ TURTLE ON MOTORCYCLE ============ -->

      <g transform="translate(86 -32)"><g class="wheel">
        <circle r="32" fill="none" stroke="#212121" stroke-width="7"/>
        <circle r="26" fill="none" stroke="#37474f" stroke-width="2"/>
        <circle r="20" fill="none" stroke="#90a4ae" stroke-width="1.4"/>
        <line x1="0" y1="-20" x2="0" y2="20" stroke="#b0bec5" stroke-width="2"/>
        <line x1="-20" y1="0" x2="20" y2="0" stroke="#b0bec5" stroke-width="2"/>
        <line x1="-14" y1="-14" x2="14" y2="14" stroke="#b0bec5" stroke-width="2"/>
        <line x1="14" y1="-14" x2="-14" y2="14" stroke="#b0bec5" stroke-width="2"/>
        <circle r="3.5" fill="#e0e0e0"/>

      </g></g>
      <!-- body -->
      <path d="M4 -26 L18 -56 Q22 -62 30 -64 L46 -60 Q58 -52 62 -42 L58 -30 Q56 -26 50 -26 Z" fill="#1e88e5" stroke="#0d47a1" stroke-width="2" stroke-linejoin="round"/>
      <rect x="10" y="-60" width="20" height="7" rx="3.5" fill="#263238"/>

      <rect x="48" y="-38" width="22" height="14" rx="4" fill="#37474f"/>

      <line x1="52" y1="-30" x2="68" y2="-30" stroke="#546e7a" stroke-width="1.4"/>
      <rect x="40" y="-22" width="24" height="5" rx="2.5" fill="#90a4ae"/>
      <circle cx="38" cy="-19.5" r="3.5" fill="#ffd54f"/>
      <g stroke="#263238" stroke-width="5" stroke-linecap="round" fill="none">
        <path d="M74 -44 L84 -32"/>
        <path d="M72 -60 L84 -56"/>
      </g>
      <circle cx="86" cy="-56" r="3.5" fill="#263238"/>
      <circle cx="90" cy="-46" r="9" fill="#fff59d" opacity="0.28"/>
      <circle cx="90" cy="-46" r="6" fill="#fff59d"/>
      <path d="M90 -40 L122 -28 L122 -16 L90 -44 Z" fill="#fff59d" opacity="0.12"/>
      <path d="M68 -50 Q80 -60 94 -56" fill="none" stroke="#0d47a1" stroke-width="5" stroke-linecap="round"/>
      <!-- wind streak -->
      <path d="M-8 -40 L-40 -40 M-12 -26 L-34 -26" stroke="#cfe0ff" stroke-width="2" opacity="0.35" stroke-linecap="round" fill="none"/>
      <!-- number plate -->
      <g transform="translate(34 -44) rotate(-6)">
        <rect x="-9" y="-12" width="18" height="16" rx="3" fill="#fff" stroke="#0d47a1" stroke-width="2"/>
        <text x="0" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1" font-family="Verdana, sans-serif">13</text>
      </g>
      <!-- far leg -->
      <path d="M20 -50 Q12 -40 12 -28 L20 -28 Q22 -40 28 -46 Z" fill="#689f38" stroke="#33691e" stroke-width="1.5"/>
      <!-- shell -->
      <path d="M6 -62 Q24 -98 46 -62 Z" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
      <path d="M16 -72 L24 -80 L30 -74 L26 -68 L20 -68 Z" fill="#388e3c"/>
      <path d="M28 -74 L34 -80 L40 -72 L36 -66 L30 -66 Z" fill="#43a047" opacity="0.85"/>
      <path d="M10 -66 L16 -62 M42 -68 L48 -62" stroke="#1b5e20" stroke-width="1.5"/>
      <ellipse cx="36" cy="-60" rx="13" ry="8" fill="#81c784"/>
      <!-- head + helmet -->
      <circle cx="54" cy="-84" r="11" fill="#aed581" stroke="#689f38" stroke-width="1.5"/>
      <path d="M43 -84 Q54 -108 65 -84 L61 -80 Q54 -90 47 -80 Z" fill="#ff7043" stroke="#e64a19" stroke-width="1.5"/>
      <rect x="48" y="-86" width="9" height="4.5" rx="2" fill="#b0bec5" opacity="0.9"/>
      <circle cx="57" cy="-87" r="2.2" fill="#263238"/>
      <path d="M46 -80 L52 -76" stroke="#e64a19" stroke-width="2"/>
      <path d="M34 -70 L64 -58 L72 -56" fill="none" stroke="#aed581" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="73" cy="-56" r="3" fill="#8bc34a"/>
      <path d="M28 -54 Q20 -46 18 -32 L26 -32 Q28 -44 34 -50 Z" fill="#aed581" stroke="#689f38" stroke-width="1.5"/>
      <ellipse cx="20" cy="-29" rx="7" ry="3.5" fill="#689f38"/>
      <ellipse cx="12" cy="-26" rx="6" ry="3" fill="#33691e"/>
    </g>

  </g>

  <!-- ===================== FRONT GATE ===================== -->
  <g id="front">
    <g id="gate" transform="translate(0 480)">
      <path d="M-84 -112 Q0 -138 84 -112" fill="none" stroke="#e3c97a" stroke-width="6" stroke-linecap="round"/>
      <line x1="-84" y1="-112" x2="-84" y2="86" stroke="#e3c97a" stroke-width="7"/>
      <line x1="84" y1="-112" x2="84" y2="86" stroke="#e3c97a" stroke-width="7"/>
      <rect x="-90" y="-112" width="12" height="198" fill="url(#checker)" opacity="0.9"/>
      <path d="M84 -112 L110 -120 L110 -113 L84 -106 Z" fill="#ff7043" opacity="0.95"/>
      <path d="M-84 -112 L-110 -120 L-110 -113 L-84 -106 Z" fill="#4fc3f7" opacity="0.95"/>
      <rect x="-46" y="-122" width="92" height="22" rx="6" fill="#10142e" stroke="#e3c97a" stroke-width="2"/>
      <text x="0" y="-106" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffe082" letter-spacing="2" font-family="Verdana, sans-serif">START / FINISH</text>
    </g>
  </g>

  <!-- ===================== HUD ===================== -->
  <g id="hud">
    <text x="600" y="44" text-anchor="middle" font-size="30" font-weight="bold" fill="url(#titleGrad)" letter-spacing="6" font-family="Verdana, sans-serif">SATURN RING RACERS</text>
    <text x="600" y="66" text-anchor="middle" font-size="13" fill="#cdd6f4" letter-spacing="4" font-family="Verdana, sans-serif">THE GREAT RING DERBY</text>

    <g transform="translate(918 34)">
      <rect width="268" height="170" rx="12" fill="#0d1230" opacity="0.85" stroke="#3a4a8f" stroke-width="2"/>
      <text x="134" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffe082" letter-spacing="2" font-family="Verdana, sans-serif">LEADERBOARD</text>
      <text id="lapEl" x="250" y="30" text-anchor="end" font-size="11" fill="#90caf9" font-family="Verdana, sans-serif">LAP 1</text>
      <line x1="14" y1="40" x2="254" y2="40" stroke="#3a4a8f"/>

      <g transform="translate(0 56)">
        <circle id="rk1" cx="13" cy="0" r="11" fill="#ffd54f"/>
        <text x="13" y="4" text-anchor="middle" font-size="11" font-weight="bold" fill="#263238" font-family="Verdana, sans-serif">1</text>
        <circle id="dot1" cx="30" cy="-1" r="4"/>
        <text id="nm1" x="40" y="1" font-size="13" fill="#e8eaf6" font-family="Verdana, sans-serif">Speedy Hare</text>
        <text id="km1" x="252" y="-2" text-anchor="end" font-size="11" fill="#b0bec5" font-family="Verdana, sans-serif">0.0 km</text>
        <rect x="30" y="8" width="222" height="6" rx="3" fill="#263238" opacity="0.8"/>
        <rect id="bar1" x="30" y="8" width="0" height="6" rx="3" fill="#43a047"/>
      </g>
      <g transform="translate(0 100)">
        <circle id="rk2" cx="13" cy="0" r="11" fill="#cfd8dc"/>
        <text x="13" y="4" text-anchor="middle" font-size="11" font-weight="bold" fill="#263238" font-family="Verdana, sans-serif">2</text>
        <circle id="dot2" cx="30" cy="-1" r="4"/>
        <text id="nm2" x="40" y="1" font-size="13" fill="#e8eaf6" font-family="Verdana, sans-serif">Aero Feathers</text>
        <text id="km2" x="252" y="-2" text-anchor="end" font-size="11" fill="#b0bec5" font-family="Verdana, sans-serif">0.0 km</text>
        <rect x="30" y="8" width="222" height="6" rx="3" fill="#263238" opacity="0.8"/>
        <rect id="bar2" x="30" y="8" width="0" height="6" rx="3" fill="#43a047"/>
      </g>
      <g transform="translate(0 144)">
        <circle id="rk3" cx="13" cy="0" r="11" fill="#b8860b"/>
        <text x="13" y="4" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff" font-family="Verdana, sans-serif">3</text>
        <circle id="dot3" cx="30" cy="-1" r="4"/>
        <text id="nm3" x="40" y="1" font-size="13" fill="#e8eaf6" font-family="Verdana, sans-serif">Bolt Shell</text>
        <text id="km3" x="252" y="-2" text-anchor="end" font-size="11" fill="#b0bec5" font-family="Verdana, sans-serif">0.0 km</text>
        <rect x="30" y="8" width="222" height="6" rx="3" fill="#263238" opacity="0.8"/>
        <rect id="bar3" x="30" y="8" width="0" height="6" rx="3" fill="#43a047"/>
      </g>
    </g>

    <text x="16" y="688" font-size="11" fill="#7c88b8" font-family="Verdana, sans-serif">The track loops Saturn's rings — racers wrap around. No cheating.</text>
  </g>

  <rect id="shoot" width="1200" height="700" fill="url(#vig)" pointer-events="none"/>
</svg>

<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var W = 1200;
  var BASE = 45;
  var yc = function (x) { return 520 - 30 * Math.cos(2 * Math.PI * x / W); };
  var slope = function (x) { return (Math.PI * 60 / W) * Math.sin(2 * Math.PI * x / W); };
  var mod = function (n, m) { return ((n % m) + m) % m; };

  var stars = document.getElementById('stars');
  var pal = ['#ffffff', '#cfe3ff', '#ffeccf', '#b7c9ff'];
  var i;
  for (i = 0; i < 130; i++) {
    var c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', (Math.random() * W).toFixed(1));
    c.setAttribute('cy', (Math.random() * 700).toFixed(1));
    c.setAttribute('r', (0.5 + Math.random() * 1.6).toFixed(2));
    c.setAttribute('fill', pal[Math.floor(Math.random() * pal.length)]);
    c.setAttribute('style', '--dur:' + (1.5 + Math.random() * 3).toFixed(2) + 's;--del:' + (Math.random() * 4).toFixed(2) + 's');
    stars.appendChild(c);
  }
  for (i = 0; i < 4; i++) {
    var gl = document.createElementNS(NS, 'circle');
    gl.setAttribute('cx', (40 + Math.random() * 1000).toFixed(1));
    gl.setAttribute('cy', (30 + Math.random() * 330).toFixed(1));
    gl.setAttribute('r', (6 + Math.random() * 9).toFixed(1));
    gl.setAttribute('fill', 'url(#glowGrad)');
    stars.appendChild(gl);
  }

  // ---- road ----
  var road = document.getElementById('road');
  var bandPath = function (o1, o2) {
    var d = '';
    var x;
    for (x = 0; x <= W; x += 50) d += (d ? 'L' : 'M') + x + ' ' + (yc(x) + o1).toFixed(1) + ' ';
    for (x = W; x >= 0; x -= 50) d += 'L' + x + ' ' + (yc(x) + o2).toFixed(1) + ' ';
    return d + 'Z';
  };
  var band = document.createElementNS(NS, 'path');
  band.setAttribute('d', bandPath(-80, 80));
  band.setAttribute('fill', 'url(#roadGrad)');
  road.appendChild(band);

  var curvePath = function (off) {
    var d = '', x;
    for (x = 0; x <= W; x += 50) d += (d ? 'L' : 'M') + x + ' ' + (yc(x) + off).toFixed(1) + ' ';
    return d;
  };
  [-80, 80].forEach(function (off) {
    var p = document.createElementNS(NS, 'path');
    p.setAttribute('d', curvePath(off));
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', '#93a7dd');
    p.setAttribute('stroke-width', '3');
    p.setAttribute('opacity', '0.85');
    road.appendChild(p);
  });

  var dashEls = [];
  [-28, 28].forEach(function (off) {
    var k;
    for (k = 0; k < 12; k++) {
      var r = document.createElementNS(NS, 'rect');
      r.setAttribute('width', '42');
      r.setAttribute('height', '5');
      r.setAttribute('rx', '2.5');
      r.setAttribute('fill', '#dfe8ff');
      r.setAttribute('opacity', '0.5');
      dashEls.push({ el: r, off: off, k: k });
      road.appendChild(r);
    }
  });

  var posts = [];
  [1, 2, 3].forEach(function (n) {
    var g = document.createElementNS(NS, 'g');
    var ln = document.createElementNS(NS, 'line');
    ln.setAttribute('x1', '0'); ln.setAttribute('y1', '0'); ln.setAttribute('x2', '0'); ln.setAttribute('y2', '-30');
    ln.setAttribute('stroke', '#dfe8ff'); ln.setAttribute('stroke-width', '3'); ln.setAttribute('opacity', '0.75');
    var bx = document.createElementNS(NS, 'rect');
    bx.setAttribute('x', '-15'); bx.setAttribute('y', '-48'); bx.setAttribute('width', '30'); bx.setAttribute('height', '18'); bx.setAttribute('rx', '4');
    bx.setAttribute('fill', '#eef2ff'); bx.setAttribute('stroke', '#5c6bc0'); bx.setAttribute('stroke-width', '2');
    var tx = document.createElementNS(NS, 'text');
    tx.setAttribute('x', '0'); tx.setAttribute('y', '-34.5'); tx.setAttribute('text-anchor', 'middle');
    tx.setAttribute('font-size', '10'); tx.setAttribute('font-weight', 'bold'); tx.setAttribute('fill', '#283593');
    tx.setAttribute('font-family', 'Verdana, sans-serif');
    tx.textContent = (n * 300 / 1000).toFixed(1) + ' km';
    g.appendChild(ln); g.appendChild(bx); g.appendChild(tx);
    posts.push({ el: g, p: n * 300 });
    road.appendChild(g);
  });

  // ---- finish line / gate handles ----
  var finBand = document.getElementById('finBand');
  var gate = document.getElementById('gate');
  var shoot = document.getElementById('shoot');

  // ---- racers ----
  var RACERS = [
    { id: 'racer-rabbit', name: 'Speedy Hare', dot: '#e53935', speed: 195, startX: 40, lane: 8, amp: 34, freq: 1.15, ph: 0.6, wheelR: 30, crankR: 1.0, lean: 6, earF: 5.2, wingF: 0, bank: 0.55 },
    { id: 'racer-eagle', name: 'Aero Feathers', dot: '#f9a825', speed: 165, startX: 420, lane: -4, amp: 40, freq: 0.85, ph: 2.4, wheelR: 26, crankR: 1.1, lean: 3, earF: 0, wingF: 6.5, bank: 0.45 },
    { id: 'racer-turtle', name: 'Bolt Shell', dot: '#43a047', speed: 130, startX: 800, lane: 18, amp: 46, freq: 0.55, ph: 4.0, wheelR: 32, crankR: 0, lean: 11, earF: 0, wingF: 0, bank: 0.9 }
  ].map(function (r) {
    var el = document.getElementById(r.id);
    return {
      cfg: r,
      el: el,
      wheels: Array.prototype.slice.call(el.querySelectorAll('.wheel')),
      crank: el.querySelector('.crank'),
      ears: Array.prototype.slice.call(el.querySelectorAll('.ear')),
      wings: Array.prototype.slice.call(el.querySelectorAll('.wing')),
      shadow: document.getElementById('shadow-' + r.id.split('-')[1])
    };
  });

  // ---- leaderboard DOM ----
  var rkEls = [1, 2, 3].map(function (n) { return document.getElementById('rk' + n); });
  var dotEls = [1, 2, 3].map(function (n) { return document.getElementById('dot' + n); });
  var nmEls = [1, 2, 3].map(function (n) { return document.getElementById('nm' + n); });
  var kmEls = [1, 2, 3].map(function (n) { return document.getElementById('km' + n); });
  var barEls = [1, 2, 3].map(function (n) { return document.getElementById('bar' + n); });
  var lapEl = document.getElementById('lapEl');

  var t0 = performance.now();

  function frame(now) {
    var t = (now - t0) / 1000;
    var scroll = BASE * t;
    var sx, i, d;

    for (i = 0; i < dashEls.length; i++) {
      d = dashEls[i];
      sx = mod(d.k * 100 - scroll, W);
      d.el.setAttribute('transform', 'translate(' + sx.toFixed(1) + ' ' + (yc(sx) + d.off).toFixed(1) + ')');
    }
    for (i = 0; i < posts.length; i++) {
      d = posts[i];
      sx = mod(d.p - scroll, W);
      d.el.setAttribute('transform', 'translate(' + sx.toFixed(1) + ' ' + (yc(sx) + 62).toFixed(1) + ')');
    }

    var fx = mod(-scroll, W);
    finBand.setAttribute('transform', 'translate(' + fx.toFixed(1) + ' ' + (yc(fx) - 80).toFixed(1) + ')');
    gate.setAttribute('transform', 'translate(' + fx.toFixed(1) + ' ' + yc(fx).toFixed(1) + ')');

    var maxD = 0;
    for (i = 0; i < RACERS.length; i++) {
      var R = RACERS[i];
      var cfg = R.cfg;
      var dist = cfg.startX + cfg.speed * t;
      if (dist > maxD) maxD = dist;
      sx = mod(dist - scroll, W);
      var l = Math.max(-34, Math.min(52, cfg.lane + cfg.amp * Math.sin(cfg.freq * t + cfg.ph)));
      var y = yc(sx) + l;
      var sc = 0.87 + 0.28 * (l + 34) / 86;
      var bank = Math.atan(slope(sx)) * 57.2958;
      var lean = bank * cfg.bank + cfg.lean * Math.cos(cfg.freq * t + cfg.ph);
      if (cfg.id === 'racer-rabbit') lean += 2.2 * Math.sin(5 * t);

      R.el.setAttribute('transform',
        'translate(' + sx.toFixed(1) + ' ' + y.toFixed(1) + ') scale(' + sc.toFixed(3) + ') rotate(' + lean.toFixed(2) + ' 40 -40)');
      R.shadow.setAttribute('transform', 'translate(' + sx.toFixed(1) + ' ' + (y + 4).toFixed(1) + ') scale(' + sc.toFixed(3) + ')');

      var wAng = dist / cfg.wheelR * 57.2958;
      for (var w = 0; w < R.wheels.length; w++) {
        R.wheels[w].setAttribute('transform', 'rotate(' + wAng.toFixed(1) + ')');
      }
      if (R.crank) {
        R.crank.setAttribute('transform', 'rotate(' + (wAng * cfg.crankR).toFixed(1) + ')');
      }
      var e = 0;
      for (e = 0; e < R.ears.length; e++) {
        R.ears[e].setAttribute('transform', 'rotate(' + (16 * Math.sin(cfg.earF * t + e * 2.3)).toFixed(1) + ')');
      }
      var wi = 0;
      for (wi = 0; wi < R.wings.length; wi++) {
        var a = R.wings[wi].getAttribute('data-side') === 'near' ? 30 : 24;
        R.wings[wi].setAttribute('transform', 'rotate(' + (a * Math.sin(cfg.wingF * t + wi * 0.7)).toFixed(1) + ')');
      }
      R.lastD = dist;
    }

    // shooting star
    var sp = mod(t * 0.13, 1);
    shoot.setAttribute('transform', 'translate(' + (1000 - sp * 520).toFixed(1) + ' ' + (90 + sp * 340).toFixed(1) + ')');
    shoot.setAttribute('opacity', (sp < 0.08 ? sp / 0.08 : sp > 0.9 ? (1 - sp) / 0.1 : 1).toFixed(2));

    // leaderboard
    var order = RACERS.slice().sort(function (a, b) { return b.lastD - a.lastD; });
    for (i = 0; i < order.length; i++) {
      rkEls[i].textContent = String(i + 1);
      dotEls[i].setAttribute('fill', order[i].cfg.dot);
      nmEls[i].textContent = order[i].cfg.name;
      kmEls[i].textContent = (order[i].lastD / 100).toFixed(1) + ' km';
      barEls[i].setAttribute('width', (222 * order[i].lastD / maxD).toFixed(1));
    }
    lapEl.textContent = 'LAP ' + Math.floor(maxD / 1600 + 1);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
