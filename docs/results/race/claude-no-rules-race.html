<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saturn Ring Grand Prix — Rabbit · Turtle · Eagle</title>
<style>
  :root{
    --ring1:#d9c38a; --ring2:#f3e3b0; --ring3:#b9a470;
    --ink:#1c1206; --glass:rgba(255,255,255,.06);
  }
  html,body{margin:0;padding:0;background:#070510;overflow:hidden}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:'Trebuchet MS','Segoe UI',Verdana,sans-serif}
  .wrap{width:100%;max-width:1500px;padding:10px}
  #scene{width:100%;height:auto;display:block;
         background:radial-gradient(120% 120% at 68% 30%, #241a4d 0%, #0d0a28 45%, #05030f 100%);
         border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
  .twinkle{animation:tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .twinkle:nth-child(3n){animation-duration:4.7s;animation-delay:.9s}
  .twinkle:nth-child(2n){animation-duration:2.6s;animation-delay:1.6s}
  @keyframes tw{0%,100%{opacity:.18}50%{opacity:1}}
  .race{animation:race 24s linear infinite}
  @keyframes race{from{transform:translateX(0)}to{transform:translateX(-2460px)}}
  .loop-cover{display:none}
  .mp-label{font-family:'Palatino Linotype',Georgia,serif;font-style:italic}
  .leader{filter:drop-shadow(0 0 2px rgba(255,215,120,.65))}
  @media (prefers-reduced-motion:reduce){
    .race,.twinkle,#r1,#r2,#r3,#speed1,#speed2,#speed3{animation:none !important}
  }
</style>
</head>
<body>
<div class="wrap">
<svg id="scene" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Three racers — a rabbit on a bicycle, a turtle on a motorcycle, and a bald eagle on a tricycle — racing on the rings of Saturn.">
  <defs>
    <radialGradient id="saturnBody" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#f0d49a"/>
      <stop offset="55%" stop-color="#d8b36b"/>
      <stop offset="100%" stop-color="#a97f45"/>
    </radialGradient>
    <radialGradient id="saturnShade" cx="50%" cy="50%" r="80%">
      <stop offset="70%" stop-color="rgba(0,0,0,0)" stop-opacity="0"/>
      <stop offset="100%" stop-color="rgba(40,20,0,.5)"/>
    </radialGradient>
    <linearGradient id="roadBed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9b184"/>
      <stop offset="45%" stop-color="#a68d5f"/>
      <stop offset="100%" stop-color="#7d6a44"/>
    </linearGradient>
    <linearGradient id="roadLane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf6e6" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#cfc49c" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="helmetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fe3ff"/>
      <stop offset="100%" stop-color="#0e7a9c"/>
    </linearGradient>
    <linearGradient id="wingsGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff6db"/>
      <stop offset="45%" stop-color="#3a2a14"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-20%" width="130%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.4" flood-color="#000" flood-opacity=".55"/>
    </filter>

    <!-- ============ [R1] RABBIT ON BICYCLE ============ -->
    <g id="rabbit">
      <!-- rear wheel -->
      <g class="wheel">
        <circle cx="0" cy="0" r="21" fill="none" stroke="#26201a" stroke-width="6"/>
        <circle cx="0" cy="0" r="21" fill="none" stroke="#5f564c" stroke-width="1.5"/>
        <g class="spokes" stroke="#3a342c" stroke-width="1.5">
          <line x1="0" y1="-21" x2="0" y2="21"/>
          <line x1="-21" y1="0" x2="21" y2="0"/>
          <line x1="-15" y1="-15" x2="15" y2="15"/>
          <line x1="15" y1="-15" x2="-15" y2="15"/>
        </g>
        <circle cx="0" cy="0" r="3.4" fill="#a08a6a"/>
      </g>
      <!-- front wheel -->
      <g class="wheel">
        <circle cx="0" cy="0" r="21" fill="none" stroke="#26201a" stroke-width="6"/>
        <circle cx="0" cy="0" r="21" fill="none" stroke="#5f564c" stroke-width="1.5"/>
        <g class="spokes" stroke="#3a342c" stroke-width="1.5">
          <line x1="0" y1="-21" x2="0" y2="21"/>
          <line x1="-21" y1="0" x2="21" y2="0"/>
          <line x1="-15" y1="-15" x2="15" y2="15"/>
          <line x1="15" y1="-15" x2="-15" y2="15"/>
        </g>
        <circle cx="0" cy="0" r="3.4" fill="#a08a6a"/>
      </g>
      <!-- frame -->
      <path d="M-27,4 L0,11 L29,2 L0,11 L-8,26"
            fill="none" stroke="#c8442e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M29,2 L43,-17" fill="none" stroke="#c8442e" stroke-width="3" stroke-linecap="round"/>
      <path d="M0,11 L43,11" fill="none" stroke="#c8442e" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="47" cy="11" r="3" fill="#2b241c"/>
      <path d="M28,5 L47,-5" fill="none" stroke="#2b241c" stroke-width="2" stroke-linecap="round"/> <!-- bars -->
      <circle cx="46" cy="-5" r="1.6" fill="#2b241c"/>
      <!-- saddle -->
      <ellipse cx="-9" cy="7" rx="6" ry="2.6" fill="#2b241c"/>
      <!-- feet -->
      <g class="feet">
        <!-- left leg -->
        <g class="pedal" transform="translate(0,6)">
          <line x1="0" y1="0" x2="20" y2="0" stroke="#333" stroke-width="3"/>
          <circle cx="20" cy="0" r="3" fill="#444"/>
        </g>
      </g>
      <!-- tail -->
      <circle cx="-25" cy="-16" r="6" fill="#f6efe0" stroke="#d8cdb8" stroke-width="1"/>
      <!-- body -->
      <path d="M2,6 C2,-8 -16,-22 -32,-20 C-42,-18 -45,-9 -42,-2 C-38,7 -20,10 2,6 Z"
            fill="#efe6d2"/>
      <!-- head -->
      <circle cx="26" cy="-33" r="15" fill="#f7f2e4" stroke="#d8cdb8" stroke-width="1"/>
      <!-- ear back -->
      <g class="ear">
        <path d="M22,-45 C18,-62 22,-72 26,-70 C30,-68 30,-56 30,-45 Z" fill="#e6dcc6" stroke="#d8cdb8" stroke-width="1"/>
      </g>
      <!-- ear front -->
      <g class="ear">
        <path d="M28,-46 C18,-63 13,-73 19,-72 C26,-71 33,-58 34,-45 Z" fill="#f7f2e4" stroke="#d8cdb8" stroke-width="1"/>
      </g>
      <!-- inner ear -->
      <path d="M25,-48 C20,-61 18,-68 21,-67 C25,-66 29,-57 30,-48 Z" fill="#e79a8f"/>
      <!-- eye, nose -->
      <circle cx="32" cy="-36" r="2.6" fill="#1c1408"/>
      <circle cx="33.2" cy="-37" r=".9" fill="#fff"/>
      <circle cx="38" cy="-31" r="2" fill="#e28b7e"/>
      <!-- smile + whiskers -->
      <path d="M35,-28 q3,2 6,1" fill="none" stroke="#3a2a14" stroke-width=".8"/>
      <path d="M34,-33 l6,-2 M35,-31 l6,-1 M35,-29 l6,1"
            fill="none" stroke="#cfc3a8" stroke-width=".6"/>
      <!-- arms -->
      <path d="M4,-8 C12,-10 20,-14 24,-10" fill="none" stroke="#efe6d2" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M2,-4 C10,-4 17,-2 22,0" fill="none" stroke="#efe6d2" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- ============ [R2] TURTLE ON MOTORCYCLE ============ -->
    <g id="turtle">
      <!-- rear wheel -->
      <g class="wheel">
        <circle cx="0" cy="0" r="23" fill="none" stroke="#171310" stroke-width="7"/>
        <circle cx="0" cy="0" r="23" fill="none" stroke="#4b443c" stroke-width="1.5"/>
        <g class="spokes" stroke="#2f2a22" stroke-width="2">
          <line x1="0" y1="-23" x2="0" y2="23"/>
          <line x1="-23" y1="0" x2="23" y2="0"/>
          <line x1="-16" y1="-16" x2="16" y2="16"/>
          <line x1="16" y1="-16" x2="-16" y2="16"/>
        </g>
        <circle cx="0" cy="0" r="4" fill="#8a7a5e"/>
      </g>
      <!-- front wheel -->
      <g class="wheel">
        <circle cx="0" cy="0" r="23" fill="none" stroke="#171310" stroke-width="7"/>
        <circle cx="0" cy="0" r="23" fill="none" stroke="#4b443c" stroke-width="1.5"/>
        <g class="spokes" stroke="#2f2a22" stroke-width="2">
          <line x1="0" y1="-23" x2="0" y2="23"/>
          <line x1="-23" y1="0" x2="23" y2="0"/>
          <line x1="-16" y1="-16" x2="16" y2="16"/>
          <line x1="16" y1="-16" x2="-16" y2="16"/>
        </g>
        <circle cx="0" cy="0" r="4" fill="#8a7a5e"/>
      </g>
      <!-- foot pegs -->
      <line x1="-8" y1="6" x2="-6" y2="14" stroke="#3a342c" stroke-width="2.4"/>
      <line x1="20" y1="-2" x2="22" y2="-8" stroke="#3a342c" stroke-width="2.4"/>
      <!-- engine -->
      <path d="M-4,6 L16,6 L14,12 L-2,12 Z" fill="#3d3d46" stroke="#221f28" stroke-width="1.2"/>
      <circle cx="8" cy="9" r="1.8" fill="#7ea8c4"/>
      <!-- frame -->
      <path d="M0,-6 L-14,0 L-26,20 L2,14 L20,2 L32,-4" fill="none"
            stroke="#2b6cb0" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M2,14 L38,10" fill="none" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/>
      <path d="M14,-4 L36,-2 L34,-12 L18,-10 Z" fill="#2b6cb0" stroke="#1c4a80" stroke-width="1.2"/>
      <circle cx="36" cy="-7" r="1.6" fill="#e8e2d4"/>
      <!-- exhaust + flame -->
      <path d="M-2,12 L-12,30 L-9,31" fill="none" stroke="#5a554e" stroke-width="3" stroke-linecap="round"/>
      <g class="flame">
        <path d="M-9,33 C-13,37 -7,42 -4,46 C-2,42 -6,38 -5,33 Z" fill="#ff9036" opacity=".95"/>
        <path d="M-7,35 C-9,38 -6,41 -4.5,43.5 C-3.5,41 -5.5,38 -5.5,35 Z" fill="#ffd23e"/>
      </g>
      <!-- shell -->
      <g class="shell">
        <path d="M-26,-12 C-20,-34 18,-36 26,-14 C30,-4 26,4 18,8 C4,14 -14,13 -22,8 Z"
              fill="#4f8a3a" stroke="#2f551f" stroke-width="1.6"/>
        <path d="M-10,-30 C-6,-18 -6,-4 -10,7" fill="none" stroke="#3c6b2c" stroke-width="1.6"/>
        <path d="M6,-32 C9,-19 10,-4 7,8" fill="none" stroke="#3c6b2c" stroke-width="1.6"/>
        <path d="M0,-33 C1,-18 1,-4 0,10" fill="none" stroke="#3c6b2c" stroke-width="1.6"/>
        <path d="M20,-26 C20,-16 20,-6 19,3" fill="none" stroke="#3c6b2c" stroke-width="1.4"/>
      </g>
      <!-- head + helmet -->
      <g class="helmet">
        <path d="M-16,-8 C-22,-8 -28,-4 -31,0 C-34,4 -30,7 -25,6 C-21,5 -18,4 -16,3 Z" fill="#4a6a4a"/>
        <g class="cap">
          <path d="M2,-24 C8,-36 24,-36 30,-26 C34,-19 31,-10 24,-9 C18,-8 6,-9 0,-13 Z"
                fill="url(#helmetGrad)"/>
          <rect x="10" y="-23" width="7" height="15" rx="3.5" fill="#cfeef7" stroke="#8fd8ea" stroke-width="1"/>
          <path d="M26,-6 l6,-8" stroke="#123" stroke-width="2.4" fill="none"/>
        </g>
        <g class="visor">
          <path d="M12,-15 C18,-17 23,-18 27,-18 C29,-14 29,-10 27,-8 C23,-9 18,-10 12,-11 Z"
                fill="#bfeaf5" stroke="#0a3240" stroke-width="1"
                opacity=".95"/>
        </g>
      </g>
      <!-- neck -->
      <path d="M-16,-4 C-18,2 -20,6 -17,8" fill="none" stroke="#5a7a54" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- ============ [R3] BALD EAGLE ON TRICYCLE ============ -->
    <g id="eagle">
      <!-- rear wheel -->
      <g class="wheel">
        <circle cx="0" cy="0" r="19" fill="none" stroke="#26201a" stroke-width="6"/>
        <circle cx="0" cy="0" r="19" fill="none" stroke="#5f564c" stroke-width="1.5"/>
        <g class="spokes" stroke="#3a342c" stroke-width="1.5">
          <line x1="0" y1="-19" x2="0" y2="19"/>
          <line x1="-19" y1="0" x2="19" y2="0"/>
          <line x1="-13.5" y1="-13.5" x2="13.5" y2="13.5"/>
          <line x1="13.5" y1="-13.5" x2="-13.5" y2="13.5"/>
        </g>
        <circle cx="0" cy="0" r="3.2" fill="#a08a6a"/>
      </g>
      <!-- front wheels -->
      <g class="wheel">
        <circle cx="0" cy="0" r="19" fill="none" stroke="#26201a" stroke-width="6"/>
        <circle cx="0" cy="0" r="19" fill="none" stroke="#5f564c" stroke-width="1.5"/>
        <g class="spokes" stroke="#3a342c" stroke-width="1.5">
          <line x1="0" y1="-19" x2="0" y2="19"/>
          <line x1="-19" y1="0" x2="19" y2="0"/>
          <line x1="-13.5" y1="-13.5" x2="13.5" y2="13.5"/>
          <line x1="13.5" y1="-13.5" x2="-13.5" y2="13.5"/>
        </g>
        <circle cx="0" cy="0" r="3.2" fill="#a08a6a"/>
      </g>
      <g class="wheel" transform="translate(12,0)">
        <circle cx="0" cy="0" r="19" fill="none" stroke="#26201a" stroke-width="6"/>
        <circle cx="0" cy="0" r="19" fill="none" stroke="#5f564c" stroke-width="1.5"/>
        <g class="spokes" stroke="#3a342c" stroke-width="1.5">
          <line x1="0" y1="-19" x2="0" y2="19"/>
          <line x1="-19" y1="0" x2="19" y2="0"/>
          <line x1="-13.5" y1="-13.5" x2="13.5" y2="13.5"/>
          <line x1="13.5" y1="-13.5" x2="-13.5" y2="13.5"/>
        </g>
        <circle cx="0" cy="0" r="3.2" fill="#a08a6a"/>
      </g>
      <!-- frame -->
      <path d="M-6,3 L6,3 L18,3 M-6,3 L0,-10 L14,-12 L18,3 M6,3 L12,-4 L14,-10"
            fill="none" stroke="#c0392b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-6,3 L-20,3" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M6,3 L-16,14 M18,3 L10,16" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="14" cy="-16" r="2.6" fill="#2b241c"/>
      <!-- fork -->
      <path d="M14,-12 L13,3" fill="none" stroke="#2f4b6e" stroke-width="2.2"/>
      <path d="M13,3 L-4,18 M13,3 L26,6" fill="none" stroke="#2b241c" stroke-width="2" stroke-linecap="round"/>
      <!-- handlebar grips -->
      <circle cx="-5" cy="18" r="2" fill="#8a6a3a"/>
      <circle cx="27" cy="6" r="2" fill="#8a6a3a"/>
      <!-- pedals -->
      <path d="M8,-8 l12,-3" stroke="#333" stroke-width="2.6"/>
      <circle cx="21" cy="-10.5" r="2.4" fill="#444"/>
      <!-- saddle -->
      <path d="M-16,1 q8,-5 14,-1 q-6,4 -14,1 Z" fill="#543a1e"/>
      <!-- tail feathers -->
      <g class="tail">
        <path d="M-20,2 C-28,4 -34,8 -36,12 C-32,10 -28,9 -24,9 Z" fill="#3a2a14"/>
        <path d="M-20,3 C-29,7 -36,13 -39,18 C-34,15 -29,13 -24,12 Z" fill="#2c2010"/>
        <path d="M-20,4 C-27,10 -32,17 -33,23 C-29,19 -25,16 -21,14 Z" fill="#3a2a14"/>
      </g>
      <!-- body -->
      <path d="M-16,2 C-12,-12 -2,-19 8,-16 C16,-13 19,-5 15,2 C10,9 0,12 -10,9 Z"
            fill="#46361f"/>
      <path d="M-12,-1 C-8,-9 0,-14 7,-13 C12,-11 14,-6 11,-1 C7,4 -2,7 -8,4 Z" fill="#6b542f"/>
      <path d="M-4,-6 C-2,-9 2,-11 5,-11" fill="none" stroke="#8a6f3d" stroke-width="1.5"/>
      <!-- wing back -->
      <g class="wing">
        <path d="M2,-9 C14,-13 34,-12 48,-2 C44,0 36,1 28,2 C20,3 12,0 4,-2 Z"
              fill="url(#wingsGrad)"/>
        <path d="M48,-2 C40,-5 30,-6 22,-4 C28,-7 36,-8 42,-7 Z" fill="#201408"/>
      </g>
      <!-- wing front -->
      <g class="wing">
        <path d="M6,-7 C18,-11 40,-13 54,-8 C50,-4 40,0 32,2 C22,4 14,2 8,-1 Z"
              fill="#fff6db" stroke="#c9b184" stroke-width="1"/>
        <path d="M54,-8 C46,-9 36,-8 28,-5 C35,-9 44,-10 50,-9 Z" fill="#35240f"/>
      </g>
      <!-- head -->
      <circle cx="13" cy="-22" r="10.5" fill="#fffaf0" stroke="#dcd2b8" stroke-width="1"/>
      <!-- hooked beak -->
      <path d="M21,-22 C26,-22 28,-19 27,-16 C27,-14 25,-13 23,-14 C24,-16 24,-19 21,-20 Z"
            fill="#e8a33a" stroke="#b97c18" stroke-width=".8"/>
      <!-- eye -->
      <circle cx="18" cy="-24.5" r="2.2" fill="#1c1408"/>
      <circle cx="19" cy="-25.2" r=".8" fill="#fff"/>
      <!-- brow -->
      <path d="M15,-27.5 q3,-2 6,-.5" fill="none" stroke="#8a6f3d" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- ===================== BACKGROUND ===================== -->
  <g id="stars">
    <g class="twinkle"><circle cx="70"  cy="60"  r="1.7" fill="#fff"/></g>
    <g class="twinkle"><circle cx="180" cy="130" r="1.2" fill="#ffd9a0"/></g>
    <g class="twinkle"><circle cx="300" cy="45"  r="2"   fill="#fff"/></g>
    <g class="twinkle"><circle cx="420" cy="120" r="1.1" fill="#aac8ff"/></g>
    <g class="twinkle"><circle cx="540" cy="70"  r="1.8" fill="#fff"/></g>
    <g class="twinkle"><circle cx="650" cy="140" r="1.3" fill="#ffd9a0"/></g>
    <g class="twinkle"><circle cx="760" cy="40"  r="2.2" fill="#fff"/></g>
    <g class="twinkle"><circle cx="880" cy="110" r="1.2" fill="#aac8ff"/></g>
    <g class="twinkle"><circle cx="995" cy="55"  r="1.6" fill="#fff"/></g>
    <g class="twinkle"><circle cx="1100"cy="125" r="2"   fill="#fff"/></g>
    <g class="twinkle"><circle cx="1150"cy="60"  r="1.2" fill="#ffd9a0"/></g>
    <g class="twinkle"><circle cx="380" cy="180" r="1"   fill="#fff"/></g>
    <g class="twinkle"><circle cx="850" cy="190" r="1.1" fill="#fff"/></g>
  </g>

  <!-- Saturn -->
  <g transform="translate(880,230)">
    <ellipse cx="0" cy="0" rx="330" ry="24" fill="#d9c38a"/>
    <ellipse cx="0" cy="0" rx="330" ry="24" fill="none" stroke="#b79d66" stroke-width="1.4"/>
    <ellipse cx="0" cy="0" rx="288" ry="21" fill="#f3e3b0"/>
    <ellipse cx="0" cy="0" rx="362" ry="27" fill="none" stroke="#c2a76d" stroke-width="1.4"/>
    <ellipse cx="0" cy="0" rx="250" ry="17" fill="#b9a470" opacity=".55"/>
    <ellipse cx="0" cy="0" rx="250" ry="17" fill="none" stroke="#8d7base64" stroke-width="0"/>
    <circle cx="0" cy="0" r="95" fill="url(#saturnBody)"/>
    <circle cx="0" cy="0" r="95" fill="url(#saturnShade)"/>
    <ellipse cx="2" cy="-4" rx="62" ry="10" fill="#f6eccc" opacity=".55"/>
    <!-- oblateness shading -->
    <ellipse cx="0" cy="30" rx="95" ry="34" fill="rgba(30,15,0,.18)"/>
  </g>

  <!-- ===================== TRACK ===================== -->
  <g transform="translate(0,236)">
    <!-- crushed-ice road bed -->
    <g class="race">
      <rect x="0" y="198" width="820" height="92" fill="url(#roadBed)"/>
      <rect x="0" y="198" width="820" height="92" fill="none" stroke="#6b5c3d" stroke-width="1"/>
      <!-- spray-on snow texture -->
      <circle cx="20"  cy="212" r="1.6" fill="#efe7cf" opacity=".4"/>
      <circle cx="64"  cy="246" r="1.3" fill="#efe7cf" opacity=".35"/>
      <circle cx="110" cy="222" r="1.8" fill="#efe7cf" opacity=".3"/>
      <circle cx="158" cy="252" r="1.2" fill="#efe7cf" opacity=".4"/>
      <circle cx="205" cy="214" r="1.5" fill="#efe7cf" opacity=".3"/>
      <circle cx="260" cy="248" r="1.7" fill="#efe7cf" opacity=".35"/>
      <circle cx="315" cy="210" r="1.2" fill="#efe7cf" opacity=".4"/>
      <circle cx="368" cy="245" r="1.6" fill="#efe7cf" opacity=".3"/>
      <circle cx="420" cy="216" r="1.4" fill="#efe7cf" opacity=".35"/>
      <circle cx="480" cy="250" r="1.8" fill="#efe7cf" opacity=".3"/>
      <circle cx="536" cy="208" r="1.3" fill="#efe7cf" opacity=".4"/>
      <circle cx="590" cy="244" r="1.6" fill="#efe7cf" opacity=".35"/>

</p>
</div>

<script>
(() => {
  "use strict";
  const svg = document.getElementById("scene");
  if (!svg) return;
  const NS = "http://www.w3.org/2000/svg";
  const dur = {
    r1: 30,  // rabbit (bike) — slowest
    r2: 15,  // turtle (motorcycle) — fastest
    r3: 21   // eagle (tricycle) — mid
  };
  // track: distance from wall-to-wall edge = 2460px, circuit 820m
  const PXM = 2460 / 820;

  const setTxt = (id, v) => {
    const el = document.getElementById(id);
    if (el) el.textContent = v;
  };

  const racers = Object.keys(dur);
  const queue = [...racers].sort(() => Math.random() - 0.5);
  const rev = {};
  queue.forEach((r, i) => { rev[r] = i; });

  // place each racer a quarter-lap behind the next on the standing grid,
  // so the whole grid wraps as a unit (no teleport gaps).
  const gridRank = { r1: 2, r2: 0, r3: 1 }; // standing order on the grid
  let prev = null;
  for (const r of ["r2", "r3", "r1"]) {
    const x = prev === null ? 0 : ((prev + 205) % 2460);
    document.getElementById(r).querySelector("animateTransform").beginList()
      .appendItem(x > gotoPx(r, x) ? gotoPx(r, x) : x); // single synthetic jump, no loop
    prev = x;
    break;
  }
  // gate unused; the single synthetic begin above keeps SVG SMIL spec-safe.

  function gotoPx(id, px) {
    return px;
  }

  const W = () => parseInt(getComputedStyle(document.documentElement).getPropertyValue("--w") || "820", 10) || 820;
  // (kept for future tweaks; not used today)

  function update(t) {
    const pos = {};
    const lapNow = {};
    let maxd = 0, laps = 0;

    for (const r of racers) {
      const T = dur[r] * 1000;
      const p = (t / T) % 1;
      const d = p * 820;
      if (d > maxd) maxd = d;
      laps = Math.max(laps, p);
      let m = 0.05, k = 0.2;
      if (r === "r1") { m = 0.09; k = 0.3; }
      if (r === "r2") { m = 0.10; k = 0.22; }
      if (r === "r3") { m = 0.03; k = 0.18; }
      const half = Math.sin(Math.PI * p);
      const weave = Math.sin(t / 800 + (r.charCodeAt(1) * 17)) * half * 11;
      const bob = Math.abs(Math.cos(t / 320 + (r.charCodeAt(1) * 3))) * -2.2;
      const trot = Math.sin(t / 130) * 2.6;

      const g = document.getElementById(r);
      if (g) {
        g.setAttribute("transform", `translate(0,206) translate(${weave | 0},${bob | 0})`); // overwritten per-frame (no SMIL conflict)
        const loops = g.querySelectorAll(".wrap-loop");
        for (const lp of loops) {
          lp.setAttribute("transform", `translate(${(-(t / T) % 1) * -820 * PXM * 5 | 0},0)`);
        }
      }
      const bikes = document.querySelectorAll(`#${r} .wrap-loop .wheel`);
      for (const wh of bikes) wh.setAttribute("transform", `rotate(${(t / 70) * 200 | 0})`);
      const flames = document.querySelectorAll(`#${r} .flame`);
      for (const fl of flames) {
        const sx = 1 + Math.sin(t / 90) * 0.18;
        fl.setAttribute("transform", `scale(${sx.toFixed(3)})`);
      }

      pos[r] = { d, p };
    }

    // correlated speed wobble so the scoreboard readings look alive
    const factor = 1 + Math.sin(t / 3000) * 0.12;
    const speeds = { r1: 105, r2: 190, r3: 135 };
    // order by distance (wrap-aware: leader is the one furthest along current lap; ties broken by total laps)
    const order = [...racers].sort((a, b) => {
      const la = Math.floor(lapNow[a] || 0), lb = Math.floor(lapNow[b] || 0);
      const da = la * 820 + pos[a].d, db = lb * 820 + pos[b].d;
      return db - da;
    });

    for (const r of racers) {
      const p = pos[r].p;
      lapNow[r] = Math.floor(p);
    }
    const ranks = {};
    // totals (approx — full-lap counts differ by duration)
    order.forEach((r, i) => { ranks[r] = i + 1; });

    for (let i = 0; i < racers.length; i++) {
      const r = order[i];
      const sp = Math.round(speeds[r] * factor * (0.9 + Math.random() * 0.2));
      setTxt("speed" + r[1], sp + "");
    }

    for (const r of racers) {
      const pr = 100 - (pos[r].p * 100);
      const pc = pr.toFixed(1).padStart(5, " ") + "%";
      setTxt("speed" + r[1], (Math.round(speeds[r] * factor)) + " km/h");
      const spot = document.getElementById("pos" + r[1]);
      if (spot) spot.textContent = ranks[r];
    }

    // lap counter for the "camera" (roughly the current leader's lap)
    const lead = order[0];
    const lp = Math.floor(pos[lead].p) + 1;
    setTxt("lapCount", Math.min(lp, 99).toString().padStart(2, "0"));
    const frac = pos[lead].p - Math.floor(pos[lead].p);
    setTxt("fracWarn", frac > 0.93 ? "■" : "");
  }

  // mute engine toggle
  const muted = { on: false };
  window.addEventListener("keydown", (e) => {
    if (e.key === "m" || e.key === "M") {
      muted.on = !muted.on;
      const blips = document.querySelectorAll(".flame .blip");
      for (const b of blips) b.style.opacity = muted.on ? "0" : "";
    }
  });

  function frame(ts) {
    update(ts || 0);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
