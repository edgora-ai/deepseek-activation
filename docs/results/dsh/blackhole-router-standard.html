<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Hole — Three.js</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
  }
  #info {
    position: fixed; left: 0; right: 0; bottom: 14px; text-align: center;
    color: rgba(255,255,255,.5); font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    text-shadow: 0 1px 3px #000; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="vignette"></div>
<div id="info">black hole · accretion disk · bloom — drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const SHADOW_RADIUS = 2.2;   // black hole shadow (event-horizon visual)
const DISK_INNER = 2.6;      // accretion disk inner edge
const DISK_OUTER = 9.0;
const DISK_TILT = 0.2;       // radians, about the X axis

// --- renderer ---------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

// --- scene & camera ---------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 3000);
camera.position.set(17, 8, 17);

// --- black hole shadow ------------------------------------------------------
const shadow = new THREE.Mesh(
  new THREE.SphereGeometry(SHADOW_RADIUS, 96, 96),
  new THREE.MeshBasicMaterial({ color: 0x000000 })
);
scene.add(shadow);

// --- accretion disk group (tilted plane) ------------------------------------
const diskGroup = new THREE.Group();
diskGroup.rotation.x = DISK_TILT;
scene.add(diskGroup);

// photon ring — a thin, white-hot ring hugging the shadow edge
const photonRing = new THREE.Mesh(
  new THREE.RingGeometry(2.48, 2.62, 192),
  new THREE.MeshBasicMaterial({
    color: 0xfff2d9, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false,
  })
);
photonRing.rotation.x = -Math.PI / 2;   // RingGeometry lies in XY; disk plane is XZ
diskGroup.add(photonRing);

// lens glow — faint warm halo just outside the photon ring
const lensGlow = new THREE.Mesh(
  new THREE.RingGeometry(2.8, 3.9, 192),
  new THREE.MeshBasicMaterial({
    color: 0xff8c3a, transparent: true, opacity: 0.14,
    blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false,
  })
);
lensGlow.rotation.x = -Math.PI / 2;
diskGroup.add(lensGlow);

// disk glow — smooth radial-gradient light for the disk body
function makeDiskGlowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0.0, 'rgba(255, 246, 235, 1)');
  g.addColorStop(0.29, 'rgba(255, 244, 226, 0.95)');
  g.addColorStop(0.45, 'rgba(255, 190, 110, 0.72)');
  g.addColorStop(0.62, 'rgba(255, 130, 55, 0.38)');
  g.addColorStop(0.8, 'rgba(220, 80, 30, 0.15)');
  g.addColorStop(1.0, 'rgba(60, 20, 10, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const diskGlow = new THREE.Mesh(
  new THREE.RingGeometry(DISK_INNER, DISK_OUTER, 160),
  new THREE.MeshBasicMaterial({
    map: makeDiskGlowTexture(), transparent: true, opacity: 0.5,
    blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false,
  })
);
diskGlow.rotation.x = -Math.PI / 2;
diskGroup.add(diskGlow);

// --- accretion disk particles ------------------------------------------------
const PARTICLE_COUNT = 1100;
const positions = new Float32Array(PARTICLE_COUNT * 3);
const colors = new Float32Array(PARTICLE_COUNT * 3);
const aAngle = new Float32Array(PARTICLE_COUNT);
const aRadius = new Float32Array(PARTICLE_COUNT);
const aSpeed = new Float32Array(PARTICLE_COUNT);
const aBob = new Float32Array(PARTICLE_COUNT);
const aPhase = new Float32Array(PARTICLE_COUNT);
const aScale = new Float32Array(PARTICLE_COUNT);
const aAlpha = new Float32Array(PARTICLE_COUNT);

const colorHot = new THREE.Color(0xfff6e6);
const colorMid = new THREE.Color(0xffa45c);
const colorCool = new THREE.Color(0xff5a26);

for (let i = 0; i < PARTICLE_COUNT; i++) {
  // density falls off with radius; inner particles crowd the photon ring
  const u = Math.pow(Math.random(), 1.5);
  const r = DISK_INNER + u * (DISK_OUTER - DISK_INNER);
  const ang = Math.random() * Math.PI * 2;

  positions[i * 3] = Math.cos(ang) * r;
  positions[i * 3 + 1] = 0;
  positions[i * 3 + 2] = Math.sin(ang) * r;

  aAngle[i] = ang;
  aRadius[i] = r;
  aSpeed[i] = 0.9 * Math.pow(DISK_INNER / r, 1.5) * (0.85 + Math.random() * 0.3); // Keplerian
  aBob[i] = (0.03 + Math.random() * 0.15) * (r / DISK_OUTER);                     // turbulence
  aPhase[i] = Math.random() * Math.PI * 2;
  aScale[i] = 0.4 + Math.random() * 0.9;
  aAlpha[i] = 0.10 + Math.random() * 0.20;

  // hot white inner edge → amber → deep orange rim
  const t = Math.min(1, (r - DISK_INNER) / (DISK_OUTER - DISK_INNER));
  const c = colorHot.clone().lerp(colorMid, Math.min(1, t * 1.5)).lerp(colorCool, Math.max(0, (t - 0.55) / 0.45));
  const bright = 0.55 + Math.random() * 0.5;
  colors[i * 3] = c.r * bright;
  colors[i * 3 + 1] = c.g * bright;
  colors[i * 3 + 2] = c.b * bright;
}

const diskGeo = new THREE.BufferGeometry();
diskGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
diskGeo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
diskGeo.setAttribute('aAngle', new THREE.BufferAttribute(aAngle, 1));
diskGeo.setAttribute('aRadius', new THREE.BufferAttribute(aRadius, 1));
diskGeo.setAttribute('aSpeed', new THREE.BufferAttribute(aSpeed, 1));
diskGeo.setAttribute('aBob', new THREE.BufferAttribute(aBob, 1));
diskGeo.setAttribute('aPhase', new THREE.BufferAttribute(aPhase, 1));
diskGeo.setAttribute('aScale', new THREE.BufferAttribute(aScale, 1));
diskGeo.setAttribute('aAlpha', new THREE.BufferAttribute(aAlpha, 1));

const diskUniforms = {
  uTime: { value: 0 },
  uPixelRatio: { value: Math.min(devicePixelRatio, 2) },
};

const diskMaterial = new THREE.ShaderMaterial({
  uniforms: diskUniforms,
  vertexShader: `
    uniform float uTime;
    uniform float uPixelRatio;
    attribute vec3 aColor;
    attribute float aAngle;
    attribute float aRadius;
    attribute float aSpeed;
    attribute float aBob;
    attribute float aPhase;
    attribute float aScale;
    attribute float aAlpha;
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      vColor = aColor;
      vAlpha = aAlpha;
      float ang = aAngle + uTime * aSpeed;
      vec3 p = vec3(cos(ang) * aRadius, sin(uTime * 2.4 + aPhase) * aBob, sin(ang) * aRadius);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = clamp(aScale * uPixelRatio * (140.0 / -mv.z), 1.0, 36.0);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv);
      if (d > 0.5) discard;
      float core = pow(smoothstep(0.5, 0.0, d), 2.0);
      gl_FragColor = vec4(vColor, core * vAlpha);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});

const diskParticles = new THREE.Points(diskGeo, diskMaterial);
diskParticles.frustumCulled = false;
diskGroup.add(diskParticles);

// --- starfield ---------------------------------------------------------------
function makeStars(count, size) {
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const white = new THREE.Color(0xffffff);
  const blue = new THREE.Color(0xa9c6ff);
  const warm = new THREE.Color(0xffe2b0);
  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 900 + Math.random() * 500;
    pos[i * 3] = Math.sin(phi) * Math.cos(theta) * r;
    pos[i * 3 + 1] = Math.cos(phi) * r;
    pos[i * 3 + 2] = Math.sin(phi) * Math.sin(theta) * r;
    const roll = Math.random();
    const c = roll < 0.72 ? white : (roll < 0.9 ? blue : warm);
    const bright = 0.25 + Math.random() * 0.55;
    col[i * 3] = c.r * bright;
    col[i * 3 + 1] = c.g * bright;
    col[i * 3 + 2] = c.b * bright;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return new THREE.Points(geo, new THREE.PointsMaterial({
    size, sizeAttenuation: false, vertexColors: true,
    transparent: true, opacity: 0.9, depthWrite: false,
  }));
}

const stars = makeStars(2600, 1.4);
const brightStars = makeStars(120, 2.4);
scene.add(stars, brightStars);

// --- controls (orbiting camera) ---------------------------------------------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 4.5;
controls.maxDistance = 70;
controls.maxPolarAngle = Math.PI * 0.62;
controls.target.set(0, 0, 0);

// --- post-processing (bloom) --------------------------------------------------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.2, 0.6, 0.7));
composer.addPass(new OutputPass());

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

// --- animation loop ------------------------------------------------------------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  diskUniforms.uTime.value = clock.elapsedTime;
  stars.rotation.y += dt * 0.004;
  brightStars.rotation.y += dt * 0.004;
  controls.update();
  composer.render();
}
animate();
</script>
</body>
</html>
