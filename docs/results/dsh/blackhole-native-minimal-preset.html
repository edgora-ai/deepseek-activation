<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Black Hole — Three.js</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #020208;
  }
  canvas { display: block; }
  #ui {
    position: fixed;
    top: 18px;
    left: 22px;
    color: #e8e4da;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    pointer-events: none;
    user-select: none;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.85);
    z-index: 1;
  }
  #ui h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.42em;
    color: #fff7e8;
  }
  #ui p {
    margin: 6px 0 0;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.75;
  }
  #fatal {
    display: none;
    position: fixed;
    inset: 0;
    align-items: center;
    justify-content: center;
    color: #ffb0a0;
    font-family: monospace;
    font-size: 14px;
    text-align: center;
    padding: 24px;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="ui">
  <h1>BLACK HOLE</h1>
  <p>accretion disk &middot; bloom &middot; starfield &middot; orbiting camera</p>
</div>
<div id="fatal"></div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Pass } from 'three/addons/postprocessing/Pass.js';

// ---------- renderer / scene / camera ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020208);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(52, 8, 0);

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  const fatal = document.getElementById('fatal');
  fatal.style.display = 'flex';
  fatal.textContent = 'WebGL is not available in this browser: ' + err.message;
  throw err;
}
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

// ---------- postprocessing: bloom ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.2, 0.6, 0.12);
composer.addPass(bloomPass);

// The silhouette pass paints a soft black disc over the horizon AFTER bloom,
// so the bloom blur can never wash the shadow out (standard technique for
// keeping dark holes dark under heavy postprocessing).
function makeShadowTexture() {
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grad.addColorStop(0.0, 'rgba(0,0,0,1)');
  grad.addColorStop(0.9, 'rgba(0,0,0,1)');
  grad.addColorStop(1.0, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(canvas);
}

class SpriteOverlayPass extends Pass {
  constructor(scene, camera) {
    super();
    this.scene = scene;
    this.camera = camera;
  }
  render(renderer, writeBuffer) {
    const prevAutoClear = renderer.autoClear;
    renderer.autoClear = false;
    renderer.setRenderTarget(writeBuffer);
    renderer.render(this.scene, this.camera);
    renderer.autoClear = prevAutoClear;
  }
}

const silhouetteScene = new THREE.Scene();
const silhouette = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeShadowTexture(),
  color: 0x000000,
  depthTest: false,
  depthWrite: false,
  transparent: true
}));
silhouette.scale.setScalar(6.0); // solid to r=2.7, fades out by r=3.0 — just past the horizon
silhouetteScene.add(silhouette);

// Rendered after bloom: the scene's own sphere keeps the disk occluded, this
// pass keeps the bloom from re-filling the shadow.
composer.addPass(new SpriteOverlayPass(silhouetteScene, camera));
composer.addPass(new OutputPass());

// ---------- soft radial glow texture (canvas-generated) ----------
function makeGlowTexture() {
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grad.addColorStop(0.0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.25, 'rgba(255,255,255,0.8)');
  grad.addColorStop(0.55, 'rgba(255,255,255,0.3)');
  grad.addColorStop(1.0, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(canvas);
}
const glowTex = makeGlowTexture();

// ---------- event horizon ----------
const horizon = new THREE.Mesh(
  new THREE.SphereGeometry(2.6, 48, 32),
  new THREE.MeshBasicMaterial({ color: 0x000000 })
);
scene.add(horizon);

// Wide halo: a sprite centered on the horizon is occluded by the sphere in
// the middle, leaving a glowing ring around the shadow — cheap lensing vibe.
const halo = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex,
  color: 0xffc37a,
  blending: THREE.AdditiveBlending,
  transparent: true,
  opacity: 0.7,
  depthWrite: false
}));
halo.scale.setScalar(30);
scene.add(halo);

const coreGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex,
  color: 0xfff1d6,
  blending: THREE.AdditiveBlending,
  transparent: true,
  opacity: 0.65,
  depthWrite: false
}));
coreGlow.scale.setScalar(6.2);
scene.add(coreGlow);

// ---------- accretion disk (glowing particles) ----------
const DISK_INNER = 3.8;
const DISK_OUTER = 30;
const DISK_COUNT = 24000;

const diskGroup = new THREE.Group();
diskGroup.rotation.x = 0.32;
diskGroup.rotation.z = -0.14;

const positions = new Float32Array(DISK_COUNT * 3);
const colors = new Float32Array(DISK_COUNT * 3);

const colInner = new THREE.Color(1.0, 0.94, 0.8);   // white-hot
const colMid = new THREE.Color(1.0, 0.6, 0.22);     // orange
const colOuter = new THREE.Color(0.55, 0.12, 0.05); // deep red
const tmpColor = new THREE.Color();

for (let i = 0; i < DISK_COUNT; i++) {
  // Slight bias toward the inner disk (pow > 1 pushes the distribution inward).
  const r = DISK_INNER + Math.pow(Math.random(), 0.85) * (DISK_OUTER - DISK_INNER);
  // Radius-dependent angular offset hints at spiral structure.
  const angle = Math.random() * Math.PI * 2 + (r - DISK_INNER) * 0.25;
  const halfThick = 0.06 + (r - DISK_INNER) * 0.02;
  const y = (Math.random() - 0.5) * 2 * halfThick;

  positions[i * 3] = r * Math.cos(angle);
  positions[i * 3 + 1] = y;
  positions[i * 3 + 2] = r * Math.sin(angle);

  const t = (r - DISK_INNER) / (DISK_OUTER - DISK_INNER);
  if (t < 0.45) tmpColor.lerpColors(colInner, colMid, t / 0.45);
  else tmpColor.lerpColors(colMid, colOuter, (t - 0.45) / 0.55);
  const brightness = 0.7 + Math.random() * 0.5;
  colors[i * 3] = tmpColor.r * brightness;
  colors[i * 3 + 1] = tmpColor.g * brightness;
  colors[i * 3 + 2] = tmpColor.b * brightness;
}

const diskGeometry = new THREE.BufferGeometry();
diskGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
diskGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const diskMaterial = new THREE.PointsMaterial({
  size: 0.42,
  map: glowTex,
  vertexColors: true,
  blending: THREE.AdditiveBlending,
  transparent: true,
  depthWrite: false,
  sizeAttenuation: true
});
diskGroup.add(new THREE.Points(diskGeometry, diskMaterial));

// Photon ring just outside the horizon, in the disk plane.
const photonRing = new THREE.Mesh(
  new THREE.TorusGeometry(3.3, 0.09, 20, 160),
  new THREE.MeshBasicMaterial({
    color: 0xffe9c8,
    transparent: true,
    opacity: 0.9,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
photonRing.rotation.x = Math.PI / 2;
diskGroup.add(photonRing);

scene.add(diskGroup);

// ---------- starfield ----------
const STAR_COUNT = 2600;
const starPositions = new Float32Array(STAR_COUNT * 3);
const starColors = new Float32Array(STAR_COUNT * 3);
const starTints = [
  new THREE.Color(1.0, 1.0, 1.0),      // white
  new THREE.Color(1.0, 0.9, 0.75),     // warm
  new THREE.Color(0.78, 0.84, 1.0)     // blue
];

for (let i = 0; i < STAR_COUNT; i++) {
  // Random direction on a sphere, random shell distance.
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const dist = 260 + Math.random() * 500;
  starPositions[i * 3] = dist * Math.sin(phi) * Math.cos(theta);
  starPositions[i * 3 + 1] = dist * Math.cos(phi);
  starPositions[i * 3 + 2] = dist * Math.sin(phi) * Math.sin(theta);

  const tint = starTints[Math.random() < 0.7 ? 0 : (Math.random() < 0.5 ? 1 : 2)];
  const b = 0.55 + Math.random() * 0.55;
  starColors[i * 3] = tint.r * b;
  starColors[i * 3 + 1] = tint.g * b;
  starColors[i * 3 + 2] = tint.b * b;
}

const starGeometry = new THREE.BufferGeometry();
starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
starGeometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
const starMaterial = new THREE.PointsMaterial({
  size: 1.7,
  sizeAttenuation: false,
  vertexColors: true,
  transparent: true,
  opacity: 0.95,
  depthWrite: false
});
scene.add(new THREE.Points(starGeometry, starMaterial));

// ---------- resize ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

// ---------- animation: orbiting camera ----------
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // Slow prograde spin of the disk.
  diskGroup.rotation.y += dt * 0.14;

  // Elliptical, gently bobbing orbit around the black hole.
  const angle = t * 0.08;
  const radius = 50 + Math.sin(t * 0.045) * 7;
  const height = 7 + Math.sin(t * 0.065) * 11;
  camera.position.set(radius * Math.cos(angle), height, radius * Math.sin(angle));
  camera.lookAt(0, 0, 0);

  composer.render();
}
animate();
</script>
</body>
</html>
