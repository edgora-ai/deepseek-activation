<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Visualizer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #eee; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
  #controls { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: rgba(10,10,15,.85); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(255,255,255,.08); flex-wrap: wrap; }
  #controls button, #controls label { padding: 6px 14px; border: 1px solid rgba(255,255,255,.15); border-radius: 6px; background: rgba(255,255,255,.06); color: #ccc; font-size: 13px; cursor: pointer; transition: .2s; }
  #controls button:hover, #controls label:hover { background: rgba(255,255,255,.12); color: #fff; }
  #controls button.active { background: rgba(99,140,255,.3); border-color: rgba(99,140,255,.5); color: #fff; }
  #fileInput { display: none; }
  #info { font-size: 12px; color: #666; margin-left: auto; }
  canvas { display: block; width: 100%; height: 100%; }
  #startOverlay { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,.92); gap: 16px; }
  #startOverlay button { padding: 16px 40px; font-size: 18px; border: 1px solid rgba(255,255,255,.2); border-radius: 10px; background: rgba(99,140,255,.25); color: #fff; cursor: pointer; transition: .25s; }
  #startOverlay button:hover { background: rgba(99,140,255,.45); transform: scale(1.04); }
  #startOverlay p { color: #666; font-size: 13px; }
</style>
</head>
<body>
<div id="startOverlay">
  <button id="startBtn">🎤 Start Audio Context</button>
  <p>Click to enable audio (browser requirement)</p>
</div>
<div id="controls" style="display:none">
  <label id="fileLabel">📂 Load File<input type="file" id="fileInput" accept="audio/*"></label>
  <button id="micBtn">🎤 Microphone</button>
  <button id="playBtn" disabled>▶ Play</button>
  <button id="stopBtn" disabled>⏹ Stop</button>
  <button id="mode1" class="active">Bars</button>
  <button id="mode2">Rings</button>
  <button id="mode3">Particles</button>
  <button id="mode4">Wave</button>
  <button id="mode5">Spiral</button>
  <span id="info"></span>
</div>
<canvas id="cv"></canvas>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const BINS = 128;
  let audioCtx, analyser, sourceNode, micStream;
  let freqData, timeData;
  let mode = 'bars';
  let particles = [];
  let raf;
  let isPlaying = false;
  let isMic = false;
  let fileReady = false;
  let audioEl;

  function resize() { cv.width = window.innerWidth; cv.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();

  // Particle class
  class Particle {
    constructor(x, y, vx, vy, life, color) {
      this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.life = life; this.maxLife = life; this.color = color; this.size = 2 + Math.random() * 3;
    }
    update() { this.x += this.vx; this.y += this.vy; this.vy += 0.02; this.life--; }
    draw() {
      const a = this.life / this.maxLife;
      ctx.globalAlpha = a;
      ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.size * a, 0, Math.PI * 2); ctx.fill();
    }
  }

  function hsl(h, s, l) { return `hsl(${h},${s}%,${l}%)`; }

  function drawBars(data) {
    const w = cv.width, h = cv.height;
    const barW = w / BINS;
    for (let i = 0; i < BINS; i++) {
      const v = data[i] / 255;
      const barH = v * h * 0.85;
      const hue = (i / BINS) * 280;
      ctx.fillStyle = hsl(hue, 80, 40 + v * 30);
      ctx.fillRect(i * barW, h - barH, barW - 1, barH);
      // Glow top
      ctx.fillStyle = hsl(hue, 90, 70 + v * 20);
      ctx.fillRect(i * barW, h - barH, barW - 1, 3);
    }
  }

  function drawRings(data) {
    const cx = cv.width / 2, cy = cv.height / 2;
    const maxR = Math.min(cx, cy) * 0.85;
    // Background pulse
    let avg = 0; for (let i = 0; i < BINS; i++) avg += data[i]; avg /= BINS;
    const pulse = avg / 255;
    ctx.fillStyle = `rgba(0,0,0,${0.15 + pulse * 0.1})`;
    ctx.fillRect(0, 0, cv.width, cv.height);

    for (let i = 0; i < BINS; i++) {
      const v = data[i] / 255;
      const r = (i / BINS) * maxR + v * 30;
      const angle = (i / BINS) * Math.PI * 2 + Date.now() * 0.0003;
      const hue = (i / BINS) * 360;
      ctx.beginPath();
      ctx.arc(cx, cy, r, angle, angle + 0.08 + v * 0.15);
      ctx.strokeStyle = hsl(hue, 85, 45 + v * 30);
      ctx.lineWidth = 2 + v * 4;
      ctx.stroke();
    }
  }

  function drawParticles(data) {
    let avg = 0, low = 0, mid = 0;
    for (let i = 0; i < BINS; i++) {
      avg += data[i];
      if (i < 20) low += data[i]; else if (i < 60) mid += data[i];
    }
    avg /= BINS; low /= 20; mid /= 40;
    const v = avg / 255;
    const lv = low / 255;
    const mv = mid / 255;
    // Spawn particles
    if (lv > 0.3) {
      for (let i = 0; i < lv * 8; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + lv * 4;
        particles.push(new Particle(
          cv.width / 2 + Math.cos(angle) * 50,
          cv.height / 2 + Math.sin(angle) * 50,
          Math.cos(angle) * speed, Math.sin(angle) * speed,
          60 + Math.random() * 80,
          hsl(Math.random() * 360, 90, 60)
        ));
      }
    }
    // Beat burst
    if (mv > 180) {
      for (let i = 0; i < 20; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 3 + mv / 30;
        particles.push(new Particle(cv.width / 2, cv.height / 2, Math.cos(angle) * speed, Math.sin(angle) * speed, 80 + Math.random() * 60, hsl(200 + Math.random() * 80, 100, 70)));
      }
    }
    // Center orb
    ctx.beginPath();
    ctx.arc(cv.width / 2, cv.height / 2, 20 + v * 40, 0, Math.PI * 2);
    const grad = ctx.createRadialGradient(cv.width / 2, cv.height / 2, 0, cv.width / 2, cv.height / 2, 20 + v * 40);
    grad.addColorStop(0, `rgba(150,200,255,${0.5 + v * 0.5})`);
    grad.addColorStop(1, 'rgba(50,100,200,0)');
    ctx.fillStyle = grad;
    ctx.fill();

    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update();
      particles[i].draw();
      if (particles[i].life <= 0) particles.splice(i, 1);
    }
    ctx.globalAlpha = 1;
  }

  function drawWave(data) {
    const w = cv.width, h = cv.height;
    ctx.beginPath();
    const sliceW = w / data.length;
    for (let i = 0; i < data.length; i++) {
      const v = data[i] / 255;
      const y = v * h;
      if (i === 0) ctx.moveTo(0, y); else ctx.lineTo(i * sliceW, y);
    }
    ctx.strokeStyle = 'rgba(99,180,255,0.8)';
    ctx.lineWidth = 2;
    ctx.stroke();
    // Mirror
    ctx.beginPath();
    for (let i = 0; i < data.length; i++) {
      const v = data[i] / 255;
      const y = h - v * h;
      if (i === 0) ctx.moveTo(0, y); else ctx.lineTo(i * sliceW, y);
    }
    ctx.strokeStyle = 'rgba(255,99,150,0.5)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function drawSpiral(data) {
    const cx = cv.width / 2, cy = cv.height / 2;
    const t = Date.now() * 0.001;
    for (let i = 0; i < BINS; i++) {
      const v = data[i] / 255;
      const angle = (i / BINS) * Math.PI * 6 + t;
      const r = 30 + (i / BINS) * Math.min(cx, cy) * 0.8 + v * 40;
      const x = cx + Math.cos(angle) * r;
      const y = cy + Math.sin(angle) * r;
      const hue = (i / BINS) * 360;
      ctx.beginPath();
      ctx.arc(x, y, 2 + v * 6, 0, Math.PI * 2);
      ctx.fillStyle = hsl(hue, 90, 40 + v * 35);
      ctx.fill();
    }
  }

  function render() {
    if (!analyser) { raf = requestAnimationFrame(render); return; }
    analyser.getByteFrequencyData(freqData);
    analyser.getByteTimeDomainData(timeData);
    // Fade effect
    if (mode === 'bars') { ctx.fillStyle = 'rgba(10,10,15,0.92)'; ctx.fillRect(0, 0, cv.width, cv.height); drawBars(freqData); }
    else if (mode === 'rings') { drawRings(freqData); }
    else if (mode === 'particles') { ctx.fillStyle = 'rgba(10,10,15,0.18)'; ctx.fillRect(0, 0, cv.width, cv.height); drawParticles(freqData); }
    else if (mode === 'wave') { ctx.fillStyle = 'rgba(10,10,15,0.85)'; ctx.fillRect(0, 0, cv.width, cv.height); drawWave(timeData); }
    else if (mode === 'spiral') { ctx.fillStyle = 'rgba(10,10,15,0.15)'; ctx.fillRect(0, 0, cv.width, cv.height); drawSpiral(freqData); }
    raf = requestAnimationFrame(render);
  }

  function initAnalyser() {
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256; // gives 128 bins
    analyser.smoothingTimeConstant = 0.8;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    timeData = new Uint8Array(analyser.frequencyBinCount);
    document.getElementById('info').textContent = `Bins: ${analyser.frequencyBinCount}`;
  }

  function stopCurrent() {
    if (sourceNode) { try { sourceNode.disconnect(); } catch(e){} sourceNode = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    isMic = false; isPlaying = false;
    document.getElementById('micBtn').classList.remove('active');
    if (audioEl) { audioEl.pause(); audioEl = null; }
  }

  function loadFile(file) {
    stopCurrent();
    initAnalyser();
    audioEl = new Audio();
    audioEl.crossOrigin = 'anonymous';
    audioEl.src = URL.createObjectURL(file);
    sourceNode = audioCtx.createMediaElementSource(audioEl);
    sourceNode.connect(analyser);
    analyser.connect(audioCtx.destination);
    fileReady = true;
    document.getElementById('playBtn').disabled = false;
    document.getElementById('stopBtn').disabled = false;
    document.getElementById('info').textContent = file.name;
  }

  async function useMic() {
    stopCurrent();
    initAnalyser();
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    sourceNode = audioCtx.createMediaStreamSource(micStream);
    sourceNode.connect(analyser);
    isMic = true; isPlaying = true;
    document.getElementById('micBtn').classList.add('active');
    document.getElementById('playBtn').disabled = true;
    document.getElementById('stopBtn').disabled = false;
    document.getElementById('info').textContent = '🎤 Microphone';
  }

  document.getElementById('startBtn').addEventListener('click', async () => {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.resume();
    document.getElementById('startOverlay').style.display = 'none';
    document.getElementById('controls').style.display = 'flex';
    // Start render loop with default bars
    raf = requestAnimationFrame(render);
  });

  document.getElementById('fileInput').addEventListener('change', e => {
    if (e.target.files[0]) loadFile(e.target.files[0]);
  });
  document.getElementById('micBtn').addEventListener('click', useMic);
  document.getElementById('playBtn').addEventListener('click', () => {
    if (audioEl && !isMic) { audioEl.play(); isPlaying = true; document.getElementById('playBtn').textContent = '⏸ Pause'; }
    else if (audioEl && isPlaying) { audioEl.pause(); isPlaying = false; document.getElementById('playBtn').textContent = '▶ Play'; }
  });
  document.getElementById('stopBtn').addEventListener('click', () => {
    stopCurrent();
    document.getElementById('playBtn').disabled = true;
    document.getElementById('playBtn').textContent = '▶ Play';
    document.getElementById('stopBtn').disabled = true;
    document.getElementById('info').textContent = '';
  });

  // Mode buttons
  ['mode1','mode2','mode3','mode4','mode5'].forEach(id => {
    document.getElementById(id).addEventListener('click', function() {
      document.querySelectorAll('#controls button').forEach(b => {
        if (b.id.startsWith('mode')) b.classList.remove('active');
      });
      this.classList.add('active');
      mode = { mode1:'bars', mode2:'rings', mode3:'particles', mode4:'wave', mode5:'spiral' }[id];
      particles = [];
    });
  });
})();
</script>
</body>
</html>
