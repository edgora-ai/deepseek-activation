<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Hole</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; }
canvas { display: block; }
#info {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.45); font: 13px/1 sans-serif; pointer-events: none;
  text-align: center; user-select: none;
}
</style>
</head>
<body>
<div id="info">Drag to orbit · Scroll to zoom</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }   from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }       from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }  from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ── renderer ── */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

/* ── scene, camera ── */
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(0, 6, 14);

/* ── controls ── */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 3;
controls.maxDistance = 80;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;
controls.target.set(0, 0, 0);

/* ── starfield ── */
const starCount = 6000;
const starPos   = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  const r = 200 + Math.random() * 800;
  const theta = Math.random() * Math.PI * 2;
  const phi   = Math.acos(2 * Math.random() - 1);
  starPos[i*3]     = r * Math.sin(phi) * Math.cos(theta);
  starPos[i*3 + 1] = r * Math.sin(phi) * Math.sin(theta);
  starPos[i*3 + 2] = r * Math.cos(phi);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({
  color: 0xffffff, size: 0.6, sizeAttenuation: true
})));

/* ── black hole sphere ── */
const bhGeo = new THREE.SphereGeometry(1.2, 64, 64);
const bhMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
const blackHole = new THREE.Mesh(bhGeo, bhMat);
scene.add(blackHole);

/* glow rim (additive sprite behind sphere) */
const rimSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: generateGlowTexture(), transparent: true, blending: THREE.AdditiveBlending,
  depthWrite: false, color: 0x4488ff
}));
rimSprite.scale.set(8, 8, 1);
scene.add(rimSprite);

function generateGlowTexture() {
  const s = 256, c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.15, 'rgba(150,180,255,0.35)');
  g.addColorStop(0.5, 'rgba(80,120,255,0.08)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,s,s);
  const tex = new THREE.CanvasTexture(c);
  return tex;
}

/* ── accretion disk particles ── */
const DISK_COUNT = 12000;
const diskPos    = new Float32Array(DISK_COUNT * 3);
const diskColors = new Float32Array(DISK_COUNT * 3);
const diskSizes  = new Float32Array(DISK_COUNT);

for (let i = 0; i < DISK_COUNT; i++) {
  const r     = 1.8 + Math.random() * 5.5;        // distance from center
  const theta = Math.random() * Math.PI * 2;
  const drift = (Math.random() - 0.5) * 0.12;     // vertical thickness

  diskPos[i*3]     = r * Math.cos(theta);
  diskPos[i*3 + 1] = drift;
  diskPos[i*3 + 2] = r * Math.sin(theta);

  // temperature colour: inner = hot white/blue, outer = warm orange/red
  const t = (r - 1.8) / 5.5;
  const cr = 1.0;
  const cg = THREE.MathUtils.lerp(0.85, 0.35, t);
  const cb = THREE.MathUtils.lerp(1.0, 0.05, t);
  diskColors[i*3] = cr; diskColors[i*3+1] = cg; diskColors[i*3+2] = cb;

  diskSizes[i] = THREE.MathUtils.lerp(0.28, 0.12, t) + Math.random() * 0.08;
}

const diskGeo = new THREE.BufferGeometry();
diskGeo.setAttribute('position', new THREE.BufferAttribute(diskPos, 3));
diskGeo.setAttribute('color',    new THREE.BufferAttribute(diskColors, 3));
diskGeo.setAttribute('size',     new THREE.BufferAttribute(diskSizes, 1));

/* custom point shader for soft glowing dots */
const diskMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    attribute float size;
    varying vec3 vColor;
    void main() {
      vColor = color;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * (200.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying vec3 vColor;
    void main() {
      float d = length(gl_PointCoord - 0.5) * 2.0;
      float alpha = 1.0 - d * d;
      if (alpha <= 0.0) discard;
      gl_FragColor = vec4(vColor * alpha, alpha);
    }`,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  vertexColors: true,
});

const diskPoints = new THREE.Points(diskGeo, diskMat);
scene.add(diskPoints);

/* ── Einstein ring glow (inner rim) ── */
const ringGeo = new THREE.RingGeometry(1.15, 1.85, 128);
const ringMat = new THREE.MeshBasicMaterial({
  color: 0x88bbff, side: THREE.DoubleSide,
  transparent: true, opacity: 0.18,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = Math.PI / 2;
scene.add(ring);

/* ── postprocessing (bloom) ── */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight), 1.8, 0.5, 0.15
));

/* ── resize ── */
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

/* ── animate ── */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // rotate disk
  diskPoints.rotation.y = t * 0.08;
  ring.rotation.z = t * 0.08;

  // pulse rim
  const pulse = 1 + 0.06 * Math.sin(t * 1.5);
  rimSprite.scale.setScalar(8 * pulse);

  // shader time
  diskMat.uniforms.uTime.value = t;

  // subtle black-hole wobble
  blackHole.position.y = Math.sin(t * 0.3) * 0.05;
  rimSprite.position.y = blackHole.position.y;

  controls.update();
  composer.render();
}
animate();
</script>
</body>
</html>
