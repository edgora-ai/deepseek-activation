<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Black Hole</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  body { font-family: "Helvetica Neue", Arial, sans-serif; color: #dfe7f2; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #c.dragging { cursor: grabbing; }
  .overlay { position: fixed; pointer-events: none; user-select: none; }
  .title { top: 28px; left: 32px; z-index: 10; }
  .title h1 {
    font-size: 26px; font-weight: 700; letter-spacing: 0.55em;
    background: linear-gradient(90deg, #ffd9a0, #ff7a3d 45%, #a06bff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 24px rgba(255, 140, 60, 0.25);
  }
  .title p { margin-top: 6px; font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase; color: #7f8da3; }
  .hint {
    left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 10;
    font-size: 11px; letter-spacing: 0.18em; color: #6f7d95; text-align: center; line-height: 1.8;
  }
  .vignette { inset: 0; z-index: 5; background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,0.62) 100%); }
  .fallback { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 20; color: #999; font-size: 14px; padding: 20px; text-align: center; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay title"><h1>BLACK&nbsp;HOLE</h1><p>accretion disk &middot; bloom &middot; glsl</p></div>
<div class="overlay vignette"></div>
<div class="overlay hint">drag to orbit &nbsp;&middot;&nbsp; scroll to zoom &nbsp;&middot;&nbsp; double-click to reset</div>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
  if (!gl) {
    var fb = document.createElement('div');
    fb.className = 'fallback';
    fb.innerHTML = 'WebGL 2 is required to render the black hole.';
    document.body.appendChild(fb);
    return;
  }
  var hdr = !!gl.getExtension('EXT_color_buffer_float');

  /* ---------- compile helpers ---------- */
  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function program(vs, fs) {
    var p = gl.createProgram();
    var v = compile(gl.VERTEX_SHADER, vs), f = compile(gl.FRAGMENT_SHADER, fs);
    gl.attachShader(p, v); gl.attachShader(p, f);
    gl.bindAttribLocation(p, 0, 'aPos');
    gl.bindAttribLocation(p, 1, 'aCol');
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    var cache = {};
    return { p: p, uni: function (n) { if (!(n in cache)) cache[n] = gl.getUniformLocation(p, n); return cache[n]; } };
  }

  /* ---------- shaders ---------- */
  var VS_PARTICLE = '#version 300 es\n' +
    'precision highp float;\n' +
    'uniform mat4 uMVP;\n' +
    'uniform float uSizeScale;\n' +
    'in vec3 aPos;\n' +
    'in vec4 aCol;\n' +
    'out vec4 vCol;\n' +
    'void main() {\n' +
    '  vec4 clip = uMVP * vec4(aPos, 1.0);\n' +
    '  gl_Position = clip;\n' +
    '  gl_PointSize = clamp(aCol.a * uSizeScale / max(-clip.w, 0.001), 1.0, 300.0);\n' +
    '  vCol = aCol;\n' +
    '}\n';
  var FS_PARTICLE = '#version 300 es\n' +
    'precision highp float;\n' +
    'in vec4 vCol;\n' +
    'out vec4 o;\n' +
    'void main() {\n' +
    '  vec2 uv = gl_PointCoord * 2.0 - 1.0;\n' +
    '  float d = dot(uv, uv);\n' +
    '  if (d > 1.0) discard;\n' +
    '  float glow = exp(-6.0 * d);\n' +
    '  o = vec4(vCol.rgb * glow, glow);\n' +
    '}\n';
  var VS_BH = '#version 300 es\n' +
    'precision highp float;\n' +
    'uniform mat4 uMVP;\n' +
    'in vec3 aPos;\n' +
    'out vec3 vN;\n' +
    'void main() { gl_Position = uMVP * vec4(aPos, 1.0); vN = aPos; }\n';
  var FS_BH = '#version 300 es\n' +
    'precision highp float;\n' +
    'in vec3 vN;\n' +
    'uniform vec3 uCamPos;\n' +
    'out vec4 o;\n' +
    'void main() {\n' +
    '  vec3 n = normalize(vN);\n' +
    '  vec3 vd = normalize(uCamPos);\n' +
    '  float rim = pow(1.0 - max(dot(n, vd), 0.0), 2.6);\n' +
    '  vec3 col = vec3(0.012, 0.012, 0.02) + vec3(1.0, 0.55, 0.22) * rim * 0.6;\n' +
    '  o = vec4(col, 1.0);\n' +
    '}\n';
  var VS_FSQ = '#version 300 es\n' +
    'precision highp float;\n' +
    'in vec2 aPos;\n' +
    'out vec2 vUV;\n' +
    'void main() { vUV = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }\n';
  var FS_BRIGHT = '#version 300 es\n' +
    'precision mediump float;\n' +
    'uniform sampler2D uTex;\n' +
    'uniform float uTh;\n' +
    'in vec2 vUV;\n' +
    'out vec4 o;\n' +
    'void main() {\n' +
    '  vec3 c = texture(uTex, vUV).rgb;\n' +
    '  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));\n' +
    '  o = vec4(c * smoothstep(uTh, uTh * 1.6, l), 1.0);\n' +
    '}\n';
  var FS_BLUR = '#version 300 es\n' +
    'precision mediump float;\n' +
    'uniform sampler2D uTex;\n' +
    'uniform vec2 uDir;\n' +
    'uniform vec2 uTexel;\n' +
    'in vec2 vUV;\n' +
    'out vec4 o;\n' +
    'void main() {\n' +
    '  vec2 off = uDir * uTexel * 1.6;\n' +
    '  float w[5] = float[](0.227027, 0.1945946, 0.1216216, 0.054054, 0.016216);\n' +
    '  vec3 c = texture(uTex, vUV).rgb * w[0];\n' +
    '  for (int i = 1; i < 5; i++) {\n' +
    '    c += texture(uTex, vUV + off * float(i)).rgb * w[i];\n' +
    '    c += texture(uTex, vUV - off * float(i)).rgb * w[i];\n' +
    '  }\n' +
    '  o = vec4(c, 1.0);\n' +
    '}\n';
  var FS_COMP = '#version 300 es\n' +
    'precision mediump float;\n' +
    'uniform sampler2D uScene;\n' +
    'uniform sampler2D uBloom;\n' +
    'uniform float uExposure;\n' +
    'in vec2 vUV;\n' +
    'out vec4 o;\n' +
    'void main() {\n' +
    '  vec3 c = texture(uScene, vUV).rgb;\n' +
    '  vec3 b = texture(uBloom, vUV).rgb;\n' +
    '  vec3 col = c + b * 0.85;\n' +
    '  col = 1.0 - exp(-col * uExposure);\n' +
    '  col = pow(clamp(col, 0.0, 1.0), vec3(1.4));\n' +
    '  o = vec4(col, 1.0);\n' +
    '}\n';

  /* ---------- matrix math (column-major) ---------- */
  function perspective(fov, aspect, near, far) {
    var f = 1 / Math.tan(fov / 2), nf = 1 / (near - far);
    return new Float32Array([f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0]);
  }
  function lookAt(eye, target, up) {
    var zx = eye[0] - target[0], zy = eye[1] - target[1], zz = eye[2] - target[2];
    var l = Math.hypot(zx, zy, zz);
    var z = [zx / l, zy / l, zz / l];
    var x = [up[1] * z[2] - up[2] * z[1], up[2] * z[0] - up[0] * z[2], up[0] * z[1] - up[1] * z[0]];
    l = Math.hypot(x[0], x[1], x[2]);
    x = [x[0] / l, x[1] / l, x[2] / l];
    var y = [z[1] * x[2] - z[2] * x[1], z[2] * x[0] - z[0] * x[2], z[0] * x[1] - z[1] * x[0]];
    return new Float32Array([
      x[0], y[0], z[0], 0,
      x[1], y[1], z[1], 0,
      x[2], y[2], z[2], 0,
      -(x[0] * eye[0] + x[1] * eye[1] + x[2] * eye[2]),
      -(y[0] * eye[0] + y[1] * eye[1] + y[2] * eye[2]),
      -(z[0] * eye[0] + z[1] * eye[1] + z[2] * eye[2]), 1
    ]);
  }
  function mul4(a, b) {
    var o = new Float32Array(16);
    for (var c = 0; c < 4; c++)
      for (var r = 0; r < 4; r++) {
        var s = 0;
        for (var k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
        o[c * 4 + r] = s;
      }
    return o;
  }

  /* ---------- buffer / vao helpers ---------- */
  function staticVAO(pos, cols, colSize) {
    var vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    var b = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, pos, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
    if (cols) {
      var bc = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, bc);
      gl.bufferData(gl.ARRAY_BUFFER, cols, gl.STATIC_DRAW);
      gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, colSize || 4, gl.FLOAT, false, 0, 0);
    }
    gl.bindVertexArray(null);
    return vao;
  }
  function dynamicVAO(n) {
    var vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    var b = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, n * 3 * 4, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
    var bc = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, bc);
    gl.bufferData(gl.ARRAY_BUFFER, n * 4 * 4, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);
    return { vao: vao, posBuf: b, colBuf: bc };
  }

  /* ---------- geometry generation ---------- */
  function hotColor(u) {
    u = Math.max(0, Math.min(1, u));
    var r, g, b, k;
    if (u < 0.33) { k = u / 0.33; r = 1.0; g = 0.95 - 0.45 * k; b = 0.85 - 0.72 * k; }
    else if (u < 0.7) { k = (u - 0.33) / 0.37; r = 1.0 - 0.2 * k; g = 0.5 - 0.28 * k; b = 0.13 - 0.05 * k; }
    else { k = (u - 0.7) / 0.3; r = 0.8 - 0.25 * k; g = 0.22 - 0.1 * k; b = 0.08 - 0.03 * k; }
    return [r, g, b];
  }

  var SN = 6000;
  var starPos = new Float32Array(SN * 3), starCol = new Float32Array(SN * 4);
  (function () {
    for (var i = 0; i < SN; i++) {
      var u = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2;
      var rr = Math.sqrt(1 - u * u), R = 58;
      starPos[i * 3] = rr * Math.cos(a) * R;
      starPos[i * 3 + 1] = u * R;
      starPos[i * 3 + 2] = rr * Math.sin(a) * R;
      var kind = Math.random(), br = 0.3 + 0.35 * Math.random();
      var r, g, bg;
      if (kind < 0.6) { r = 1.0; g = 1.0; bg = 1.0; }
      else if (kind < 0.85) { r = 0.72; g = 0.85; bg = 1.0; }
      else { r = 1.0; g = 0.8; bg = 0.6; }
      starCol[i * 4] = r * br; starCol[i * 4 + 1] = g * br;
      starCol[i * 4 + 2] = bg * br; starCol[i * 4 + 3] = 0.04 + 0.05 * Math.random();
    }
  })();

  var tilt = 0.19, cosT = Math.cos(tilt), sinT = Math.sin(tilt);
  var DN = 16000, dRMin = 0.55, dRMax = 2.7;
  var dR = new Float32Array(DN), dTh = new Float32Array(DN), dY = new Float32Array(DN), dSpd = new Float32Array(DN);
  var dPos = new Float32Array(DN * 3), dCol = new Float32Array(DN * 4);
  (function () {
    for (var i = 0; i < DN; i++) {
      var u = Math.random();
      var r = dRMin + (dRMax - dRMin) * Math.pow(u, 0.8);
      dR[i] = r;
      dTh[i] = Math.random() * Math.PI * 2;
      dY[i] = (Math.random() * 2 - 1) * (0.012 + (r - dRMin) / (dRMax - dRMin) * 0.05);
      dSpd[i] = 1.1 * Math.pow(r, -1.55);
      var ui = (r - dRMin) / (dRMax - dRMin);
      var hc = hotColor(ui), bright = 0.28 + 0.4 * Math.random();
      dCol[i * 4] = hc[0] * bright; dCol[i * 4 + 1] = hc[1] * bright;
      dCol[i * 4 + 2] = hc[2] * bright; dCol[i * 4 + 3] = 0.014 + ui * 0.03;
    }
  })();

  var RN = 1600, rBase = 0.5;
  var rR = new Float32Array(RN), rTh = new Float32Array(RN), rY = new Float32Array(RN), rSpd = new Float32Array(RN);
  var rPos = new Float32Array(RN * 3), rCol = new Float32Array(RN * 4);
  (function () {
    for (var i = 0; i < RN; i++) {
      var rad = rBase + Math.random() * 0.05;
      rR[i] = rad; rTh[i] = Math.random() * Math.PI * 2;
      rY[i] = (Math.random() * 2 - 1) * 0.002;
      rSpd[i] = 2.2 * Math.pow(rad, -1.5);
      var b = 0.5 + 0.35 * Math.random();
      rCol[i * 4] = 1.0 * b; rCol[i * 4 + 1] = 0.62 * b; rCol[i * 4 + 2] = 0.32 * b;
      rCol[i * 4 + 3] = 0.02;
    }
  })();

  function makeSphere(R, slices, stacks) {
    var pos = [], idx = [];
    for (var i = 0; i <= stacks; i++) {
      var phi = i / stacks * Math.PI;
      for (var j = 0; j <= slices; j++) {
        var th = j / slices * Math.PI * 2;
        pos.push(R * Math.sin(phi) * Math.cos(th), R * Math.cos(phi), R * Math.sin(phi) * Math.sin(th));
      }
    }
    for (i = 0; i < stacks; i++)
      for (j = 0; j < slices; j++) {
        var a = i * (slices + 1) + j, b = a + slices + 1;
        idx.push(a, b, a + 1, b, b + 1, a + 1);
      }
    return { pos: new Float32Array(pos), idx: new Uint16Array(idx) };
  }
  var BH_R = 0.36;
  var sphere = makeSphere(BH_R, 48, 32);

  /* ---------- programs ---------- */
  var pParticle = program(VS_PARTICLE, FS_PARTICLE);
  var pBH = program(VS_BH, FS_BH);
  var pBright = program(VS_FSQ, FS_BRIGHT);
  var pBlur = program(VS_FSQ, FS_BLUR);
  var pComp = program(VS_FSQ, FS_COMP);

  /* ---------- vaos ---------- */
  var starVAO = staticVAO(starPos, starCol);
  var diskVAO = dynamicVAO(DN);
  var ringVAO = dynamicVAO(RN);
  gl.bindBuffer(gl.ARRAY_BUFFER, diskVAO.colBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, dCol);
  gl.bindBuffer(gl.ARRAY_BUFFER, ringVAO.colBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, rCol);

  var sphereVAO = gl.createVertexArray();
  gl.bindVertexArray(sphereVAO);
  var sb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, sb);
  gl.bufferData(gl.ARRAY_BUFFER, sphere.pos, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  var si = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, si);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, sphere.idx, gl.STATIC_DRAW);
  gl.bindVertexArray(null);

  var fsqVAO = gl.createVertexArray();
  gl.bindVertexArray(fsqVAO);
  var fb2 = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, fb2);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);

  /* ---------- framebuffers ---------- */
  function genTex(w, h) {
    var t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, hdr ? gl.RGBA16F : gl.RGBA8, w, h, 0, gl.RGBA, hdr ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
    return t;
  }
  function makeFBO(w, h, depth) {
    var fbo = gl.createFramebuffer(), tex = genTex(w, h);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    if (depth) {
      var rb = gl.createRenderbuffer();
      gl.bindRenderbuffer(gl.RENDERBUFFER, rb);
      gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
      gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, rb);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { fbo: fbo, tex: tex };
  }

  var W = 1, H = 1, scene, bright, blurH, blurV;
  function buildFBOs() {
    scene = makeFBO(W, H, true);
    bright = makeFBO(W, H, false);
    blurH = makeFBO(W, H, false);
    blurV = makeFBO(W, H, false);
  }
  buildFBOs();

  /* ---------- camera / interaction ---------- */
  var az = 0.7, el = 1.1, dist = 4.6;
  var dragging = false, lastInteract = performance.now();

  function onDown(e) {
    dragging = true; lastInteract = performance.now();
    canvas.classList.add('dragging');
    if (canvas.setPointerCapture) try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    lastInteract = performance.now();
    az -= e.movementX * 0.005;
    el = Math.max(0.15, Math.min(Math.PI - 0.15, el - e.movementY * 0.005));
    e.preventDefault();
  }
  function onUp(e) { dragging = false; canvas.classList.remove('dragging'); }
  function onWheel(e) {
    e.preventDefault();
    lastInteract = performance.now();
    dist = Math.max(1.6, Math.min(16, dist * Math.pow(1.0015, e.deltaY)));
  }
  function onDbl() { az = 0.7; el = 1.1; dist = 4.6; lastInteract = performance.now(); }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('wheel', onWheel, { passive: false });
  canvas.addEventListener('dblclick', onDbl);
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* ---------- resize ---------- */
  function resize() {
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth || window.innerWidth;
    var h = canvas.clientHeight || window.innerHeight;
    var pw = Math.max(1, Math.round(w * dpr)), ph = Math.max(1, Math.round(h * dpr));
    if (canvas.width !== pw || canvas.height !== ph) {
      canvas.width = pw; canvas.height = ph;
      W = pw; H = ph;
      buildFBOs();
    }
  }
  window.addEventListener('resize', resize);
  resize();

  /* ---------- per-frame updates ---------- */
  function updateDisk() {
    for (var i = 0; i < DN; i++) {
      var ang = dTh[i] + t * dSpd[i];
      var r = dR[i], cx = Math.cos(ang), sn = Math.sin(ang);
      var x = r * cx, z = r * sn, y = dY[i];
      var j = i * 3;
      dPos[j] = x;
      dPos[j + 1] = y * cosT - z * sinT;
      dPos[j + 2] = y * sinT + z * cosT;
    }
  }
  function updateRing() {
    for (var i = 0; i < RN; i++) {
      var ang = rTh[i] + t * rSpd[i];
      var r = rR[i], cx = Math.cos(ang), sn = Math.sin(ang);
      var x = r * cx, z = r * sn, y = rY[i];
      var j = i * 3;
      rPos[j] = x;
      rPos[j + 1] = y * cosT - z * sinT;
      rPos[j + 2] = y * sinT + z * cosT;
    }
  }

  /* ---------- render ---------- */
  var fov = 1.05, near = 0.1, far = 200;
  var t = 0, last = performance.now();

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000 || 0.016);
    last = now; t += dt;
    if (performance.now() - lastInteract > 2500) az += dt * 0.08;

    resize();

    var aspect = W / Math.max(1, H);
    var P = perspective(fov, aspect, near, far);
    var eye = [dist * Math.sin(el) * Math.cos(az), dist * Math.cos(el), dist * Math.sin(el) * Math.sin(az)];
    var V = lookAt(eye, [0, 0, 0], [0, 1, 0]);
    var MVP = mul4(P, V);
    var sizeScale = H / (2 * Math.tan(fov / 2));

    gl.viewport(0, 0, W, H);
    gl.bindFramebuffer(gl.FRAMEBUFFER, scene.fbo);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.enable(gl.BLEND);

    pParticle.p && null;
    gl.useProgram(pParticle.p);
    gl.uniformMatrix4fv(pParticle.uni('uMVP'), false, MVP);
    gl.uniform1f(pParticle.uni('uSizeScale'), sizeScale);

    gl.depthMask(false);
    gl.bindVertexArray(starVAO);
    gl.drawArrays(gl.POINTS, 0, SN);

    updateDisk();
    gl.bindVertexArray(diskVAO.vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, diskVAO.posBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, dPos);
    gl.drawArrays(gl.POINTS, 0, DN);

    updateRing();
    gl.bindVertexArray(ringVAO.vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, ringVAO.posBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, rPos);
    gl.drawArrays(gl.POINTS, 0, RN);

    gl.depthMask(true);
    gl.disable(gl.BLEND);
    gl.useProgram(pBH.p);
    gl.uniformMatrix4fv(pBH.uni('uMVP'), false, MVP);
    gl.uniform3fv(pBH.uni('uCamPos'), eye);
    gl.bindVertexArray(sphereVAO);
    gl.drawElements(gl.TRIANGLES, sphere.idx.length, gl.UNSIGNED_SHORT, 0);

    gl.disable(gl.DEPTH_TEST);

    gl.useProgram(pBright.p);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, scene.tex);
    gl.uniform1i(pBright.uni('uTex'), 0);
    gl.uniform1f(pBright.uni('uTh'), 0.5);
    gl.bindFramebuffer(gl.FRAMEBUFFER, bright.fbo);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.bindVertexArray(fsqVAO);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.useProgram(pBlur.p);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, bright.tex);
    gl.uniform1i(pBlur.uni('uTex'), 0);
    gl.uniform2f(pBlur.uni('uTexel'), 1 / W, 1 / H);
    gl.uniform2f(pBlur.uni('uDir'), 1, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, blurH.fbo);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindTexture(gl.TEXTURE_2D, blurH.tex);
    gl.uniform2f(pBlur.uni('uDir'), 0, 1);
    gl.bindFramebuffer(gl.FRAMEBUFFER, blurV.fbo);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.useProgram(pComp.p);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, scene.tex);
    gl.uniform1i(pComp.uni('uScene'), 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, blurV.tex);
    gl.uniform1i(pComp.uni('uBloom'), 1);
    gl.uniform1f(pComp.uni('uExposure'), 0.55);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.bindVertexArray(null);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
