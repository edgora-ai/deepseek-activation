<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Martian Ring Road Grand Prix</title>
<style>
  :root{
    --ink:#f5e6cf;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #3a1410, #150604 70%);
    color:var(--ink);
    font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    min-height:100%;overflow:hidden;
  }
  header{
    width:100%;text-align:center;padding:10px 12px 6px;
    background:linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,0));
  }
  header h1{
    font-size:clamp(16px,2.4vw,26px);
    letter-spacing:.28em;text-transform:uppercase;
    color:#ffd9a0;text-shadow:0 2px 10px #000, 0 0 22px rgba(255,120,60,.5);
  }
  header p{font-size:clamp(10px,1.1vw,13px);color:#e8b98a;letter-spacing:.08em;margin-top:2px}
  .stage{flex:1;width:100%;max-width:1700px;padding:0 6px 10px;display:flex;justify-content:center}
  svg{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6));border-radius:12px}
  .lbl{font:600 13px/1.1 'Trebuchet MS',sans-serif}

  /* decorative CSS animations inside SVG */
  .tw{animation:tw 3.4s ease-in-out infinite}
  .tw2{animation:tw 2.9s ease-in-out infinite .7s}
  .sunp{animation:sunp 5s ease-in-out infinite}
  .flut{transform-box:fill-box;transform-origin:left center;animation:flut 0.45s ease-in-out infinite alternate}
  .cd{animation:cd 0.62s ease-out both}
  .annp{animation:annp 2.6s ease-in-out both}
  .annq{animation:annp 0.18s ease-in-out both}
  .flash{animation:flash 0.32s steps(2,jump-none) infinite}
  .wbr{transform-box:fill-box;transform-origin:50% 8%;animation:wbr 0.5s ease-in-out infinite alternate}
  .thr{transform-box:fill-box;transform-origin:50% 20%;animation:thr 0.55s ease-in-out infinite alternate}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes sunp{0%,100%{opacity:.75}50%{opacity:1}}
  @keyframes flut{from{transform:skewY(-7deg)}to{transform:skewY(7deg)}}
  @keyframes cd{0%{transform:scale(2.4);opacity:0}15%{opacity:1}70%{opacity:1}100%{transform:scale(.85);opacity:0}}
  @keyframes annp{0%{opacity:0;transform:scale(.7) translateY(18px)}18%{opacity:1;transform:scale(1.05) translateY(0)}30%{transform:scale(1)}88%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
  @keyframes flash{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
  @keyframes wbr{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
  @keyframes thr{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
</style>
</head>
<body>
<header>
  <h1>Martian Ring Road Grand Prix</h1>
  <p>Buster the Rabbit (Bicycle) &nbsp;&bull;&nbsp; Shelly the Tortoise (Motorcycle) &nbsp;&bull;&nbsp; Aquila the Bald Eagle (Tricycle)</p>
</header>

<div class="stage">
<svg id="scene" viewBox="0 0 1600 860" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax meet" aria-label="Martian ring road race animation">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c0705"/>
      <stop offset="0.28" stop-color="#3d1208"/>
      <stop offset="0.6" stop-color="#87341a"/>
      <stop offset="0.86" stop-color="#e2703a"/>
      <stop offset="1" stop-color="#f59d55"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8492a"/>
      <stop offset="0.35" stop-color="#7d3a1f"/>
      <stop offset="1" stop-color="#4d2413"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b3f2a"/>
      <stop offset="0.5" stop-color="#4c2a1a"/>
      <stop offset="1" stop-color="#6b3f2a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.4" stop-color="#ffe49a"/>
      <stop offset="1" stop-color="#ff9a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crat" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#31130a"/>
      <stop offset="0.55" stop-color="#552310"/>
      <stop offset="1" stop-color="#31130a"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- SKY -->
  <rect width="1600" height="860" fill="url(#sky)"/>

  <!-- distant pale sun -->
  <circle cx="1320" cy="330" r="150" fill="url(#sun)" class="sunp"/>
  <circle cx="1320" cy="330" r="46" fill="#fff6d8" opacity="0.95" class="sunp"/>

  <!-- stars -->
  <g fill="#ffe7bd">
    <circle cx="90" cy="60" r="1.6" class="tw"/><circle cx="220" cy="110" r="1.1" class="tw2"/>
    <circle cx="340" cy="40" r="1.4" class="tw"/><circle cx="470" cy="90" r="1.2" class="tw2"/>
    <circle cx="600" cy="50" r="1.7" class="tw"/><circle cx="740" cy="120" r="1.1" class="tw2"/>
    <circle cx="860" cy="34" r="1.5" class="tw"/><circle cx="980" cy="100" r="1.2" class="tw2"/>
    <circle cx="1120" cy="56" r="1.6" class="tw"/><circle cx="1260" cy="130" r="1.1" class="tw2"/>
    <circle cx="1420" cy="70" r="1.5" class="tw"/><circle cx="150" cy="160" r="1.2" class="tw2"/>
    <circle cx="520" cy="170" r="1.1" class="tw"/><circle cx="960" cy="160" r="1.5" class="tw2"/>
  </g>
  <!-- moons: Phobos & Deimos -->
  <g fill="#c9a98f">
    <ellipse cx="190" cy="130" rx="15" ry="12" opacity="0.9"/>
    <ellipse cx="176" cy="121" rx="6" ry="5" opacity="0.35"/>
    <ellipse cx="1560" cy="160" rx="8" ry="7" opacity="0.7"/>
    <ellipse cx="1555" cy="156" rx="3" ry="2.6" opacity="0.4"/>
  </g>

  <!-- PARALLAX mountain range (drifts to convey speed) -->
  <g id="mounts">
    <g fill="#521f10">
      <path d="M0,430 L70,330 L150,420 L230,300 L330,430 L420,340 L520,430 L600,320 L700,430 L790,350 L900,430 L1010,310 L1120,430 L1200,355 L1320,430 L1420,325 L1530,430 L1600,390 L1600,520 L0,520 Z"/>
    </g>
    <g fill="#692714" opacity="0.9">
      <path d="M-40,470 L60,370 L170,470 L280,385 L390,470 L500,360 L620,470 L730,400 L850,470 L960,365 L1080,470 L1200,375 L1330,470 L1460,360 L1600,440 L1600,540 L-40,540 Z"/>
    </g>
    <g fill="#7c2f18">
      <ellipse cx="220" cy="505" rx="55" ry="10" fill="url(#crat)"/>
      <ellipse cx="980" cy="500" rx="90" ry="16" fill="url(#crat)"/>
      <ellipse cx="1380" cy="495" rx="70" ry="12" fill="url(#crat)"/>
      <ellipse cx="640" cy="490" rx="60" ry="11" fill="url(#crat)"/>
    </g>
  </g>

  <!-- middle dusty plain -->
  <rect x="0" y="470" width="1600" height="390" fill="url(#ground)"/>
  <g opacity="0.5" fill="#9c4526">
    <circle cx="120" cy="540" r="26"/><circle cx="150" cy="528" r="18"/>
    <circle cx="420" cy="600" r="20"/><circle cx="447" cy="590" r="14"/>
    <circle cx="760" cy="645" r="30"/><circle cx="800" cy="630" r="20"/>
    <circle cx="1180" cy="580" r="18"/><circle cx="1210" cy="570" r="12"/>
    <circle cx="1520" cy="620" r="22"/><circle cx="1550" cy="608" r="15"/>
  </g>
  <!-- rock spires (Martian hoodoos) -->
  <g fill="#5f2413">
    <path d="M330,470 L348,400 L358,470 Z"/>
    <path d="M362,470 L395,352 L400,470 Z" opacity="0.85"/>
    <path d="M1280,470 L1295,420 L1315,470 Z"/>
    <path d="M1305,470 L1332,380 L1338,470 Z" opacity="0.8"/>
    <path d="M152,560 L164,505 L176,560 Z"/>
  </g>

  <!-- RING ROAD (built by JS to match the race path) -->
  <g id="roadLayer"></g>

  <!-- particle FX layer -->
  <g id="fx"></g>

  <!-- racers -->
  <g id="racerLayer"></g>

  <g id="hudLayer"></g>
</svg>
</div>

<script>
(function(){
  "use strict";
  var NS="http://www.w3.org/2000/svg";
  var svg=document.getElementById("scene");
  function el(name,attr,parent){
    var e=document.createElementNS(NS,name);
    if(attr) for(var k in attr) e.setAttribute(k,attr[k]);
    if(parent) parent.appendChild(e);
    return e;
  }
  function pathGen(d,parent,extra){
    var a={d:d};
    if(extra) for(var k in extra)a[k]=extra[k];
    return el("path",a,parent);
  }

  /* ============ BEZIER RACE PATH ============ */
  var P0={x:150,y:755}, P1={x:600,y:610}, P2={x:1150,y:505}, P3={x:1500,y:345};
  function bez(t){
    var u=1-t;
    var x=u*u*u*P0.x+3*u*u*t*P1.x+3*u*t*t*P2.x+t*t*t*P3.x;
    var y=u*u*u*P0.y+3*u*u*t*P1.y+3*u*t*t*P2.y+t*t*t*P3.y;
    return {x:x,y:y};
  }
  function bezDeriv(t){
    var u=1-t;
    var x=3*u*u*(P1.x-P0.x)+6*u*t*(P2.x-P1.x)+3*t*t*(P3.x-P2.x);
    var y=3*u*u*(P1.y-P0.y)+6*u*t*(P2.y-P1.y)+3*t*t*(P3.y-P2.y);
    return {x:x,y:y};
  }
  // pre-sample cumulative length
  var SAMPLE=140, samples=[], Ltot=0;
  (function(){
    var prev=bez(0), i;
    for(i=0;i<=SAMPLE;i++){
      var p=bez(i/SAMPLE);
      var seg=Math.hypot(p.x-prev.x,p.y-prev.y);
      Ltot+=seg; samples.push(Ltot); prev=p;
    }
  })();
  function pointAtDist(d){
    // d in px along path (0..Ltot)
    for(var i=1;i<=SAMPLE;i++){
      if(samples[i]>=d){
        var t0=(i-1)/SAMPLE, t1=i/SAMPLE;
        var f=(d-samples[i-1])/(samples[i]-samples[i-1]);
        var t=t0+(t1-t0)*f;
        var p=bez(t), v=bezDeriv(t);
        var ang=Math.atan2(v.y,v.x)*180/Math.PI;
        var scale=1-(1-0.44)*(t);
        return {x:p.x,y:p.y,t:t,ang:ang,scale:scale,lx:v.y/Math.hypot(v.x,v.y),ly:-v.x/Math.hypot(v.x,v.y)};
      }
    }
    var p=bez(1),v=bezDeriv(1);
    return {x:p.x,y:p.y,t:1,ang:Math.atan2(v.y,v.x)*180/Math.PI,scale:0.44,lx:v.y/Math.hypot(v.x,v.y),ly:-v.x/Math.hypot(v.x,v.y)};
  }

  /* ============ BUILD ROAD ============ */
  (function buildRoad(){
    var road=document.getElementById("roadLayer");
    var n=70, left=[], right=[], center=[], i;
    var half0=185, half1=78;
    for(i=0;i<=n;i++){
      var t=i/n, p=bez(t), v=bezDeriv(t), L=Math.hypot(v.x,v.y);
      var nx=-v.y/L, ny=v.x/L, w=half0+(half1-half0)*t;
      left.push([(p.x+nx*w).toFixed(1),(p.y+ny*w).toFixed(1)]);
      right.push([(p.x-nx*w).toFixed(1),(p.y-ny*w).toFixed(1)]);
      center.push([p.x.toFixed(1),p.y.toFixed(1)]);
    }
    var d="M"+left.map(function(q){return q[0]+" "+q[1]}).join(" L");
    for(i=n;i>=0;i--) d+=" L"+right[i][0]+" "+right[i][1];
    d+=" Z";
    pathGen(d,road,{fill:"url(#road)"});
    // center dashed line
    pathGen("M"+center.map(function(q){return q[0]+" "+q[1]}).join(" L"),road,
      {fill:"none",stroke:"#f4e6c8",strokeWidth:5,strokeLinecap:"round","stroke-dasharray":"58 34",opacity:0.92});
    // sand kerbs (edges)
    var lPath="M"+left.map(function(q){return q[0]+" "+q[1]}).join(" L");
    var rPath="M"+right.map(function(q){return q[0]+" "+q[1]}).join(" L");
    pathGen(lPath+" L"+center[0][0]+" "+center[0][1]+" Z",road,{fill:"#e2b877",opacity:0.85});
    pathGen(rPath+" L"+center[0][0]+" "+center[0][1]+" Z",road,{fill:"#e2b877",opacity:0.45});
    // Start line (t=0.015) & Finish gantry (t=0.985)
    function line(tt,label,hi){
      var p=bez(tt), v=bezDeriv(tt), L=Math.hypot(v.x,v.y);
      var nx=-v.y/L, ny=v.x/L, w=half0+(half1-half0)*tt;
      var a1=[p.x+nx*w,p.y+ny*w], a0=[p.x-nx*w,p.y-ny*w];
      var band=el("line",{x1:a0[0],y1:a0[1],x2:a1[0],y2:a1[1],stroke:"#fff",strokeWidth:Math.max(10,w*2-8),strokeLinecap:"butt",opacity:0.92},road);
      var chk=el("line",{x1:a0[0],y1:a0[1],x2:a1[0],y2:a1[1],stroke:"#1c1c1c",strokeWidth:Math.max(10,w*2-8),"stroke-dasharray":"26 26",strokeLinecap:"butt",opacity:0.92},road);
      var tx=el("text",{x:p.x+nx*(w+16),y:p.y+ny*(w+6),"text-anchor":"middle",fill:"#ffe9c9","font-size":hi?34:26,"font-weight":900,"letter-spacing":2,transform:"rotate("+(-Math.atan2(v.y,v.x)*180/Math.PI+180)+" "+p.x+" "+p.y+")"},road);
      tx.textContent=label;
      void band; void chk;
    }
    line(0.012,"START",false);
    // finish gantry
    (function(){
      var tt=0.985, p=bez(tt), v=bezDeriv(tt), L=Math.hypot(v.x,v.y);
      var nx=-v.y/L, ny=v.x/L, w=half0+(half1-half0)*tt;
      var tan=Math.atan2(v.y,v.x)*180/Math.PI;
      var g=el("g",{transform:"translate("+p.x+" "+(p.y-8)+") rotate("+(tan+90)+")"},road);
      el("line",{x1:-w,y1:0,x2:w,y2:0,stroke:"#8a5a30",strokeWidth:10,strokeLinecap:"round"},g);
      var pole=el("g",{transform:"translate("+(w-6)+" 0)"},g);
      el("line",{x1:0,y1:0,x2:0,y2:-120,stroke:"#d8d8d8",strokeWidth:7},pole);
      // checkered flag on pole
      var fl=el("g",{transform:"translate(4 -120)"},pole);
      var fw=72,fh=44;
      for(var r=0;r<3;r++){
        for(var c=0;c<5;c++){
          el("rect",{x:c*fw/5,y:r*fh/3,width:fw/5,height:fh/3,fill:(r+c)%2? "#151515":"#ffffff"},fl);
        }
      }
      fl.classList.add("flut");
      el("text",{x:0,y:-134,fill:"#ffe9c9","font-size":40,"font-weight":900,"letter-spacing":4},pole).textContent="FINISH";
      el("text",{x:0,y:-142,fill:"#ff9a5a","font-size":16,"text-anchor":"middle","letter-spacing":6},g).textContent="";
    })();
  })();

  /* ============ RACER VEHICLE GEOMETRY ============ */
  // wheel builder: centered at 0,0 draws a detailed wheel of radius r, returns {wrap,spin}
  function wheel(r,parent,tyre,tread,hub){
    tyre=tyre||"#2b1a12"; tread=tread||"#4a2c1a"; hub=hub||"#cfd4d8";
    var wrap=el("g",null,parent);
    var spin=el("g",null,wrap);
    el("circle",{r:r,fill:tyre},spin);
    el("circle",{r:r-4,fill:"none",stroke:tread,strokeWidth:3},spin);
    // tread blocks
    for(var i=0;i<12;i++){
      var a=i/12*Math.PI*2;
      el("path",{d:"M"+(Math.cos(a)*(r-2))+" "+(Math.sin(a)*(r-2))+" l"+(-Math.sin(a)*6)+" "+(Math.cos(a)*6),
        stroke:tread,strokeWidth:3,strokeLinecap:"round",fill:"none"},spin);
    }
    el("circle",{r:r-8,fill:"none",stroke:"#6a6f74",strokeWidth:3},spin);
    el("circle",{r:r-10,fill:"#2e3135"},spin);
    // spokes
    for(var s=0;s<6;s++){
      var sa=s/6*Math.PI*2;
      el("line",{x1:Math.cos(sa)*6,y1:Math.sin(sa)*6,x2:Math.cos(sa)*(r-8),y2:Math.sin(sa)*(r-8),stroke:hub,strokeWidth:2.4},spin);
    }
    el("circle",{r:6,fill:hub},spin);
    el("circle",{r:2.4,fill:"#222"},spin);
    // hot rim mark for motion visibility
    el("circle",{r:r-1,fill:"none",stroke:"#ffd76a",strokeWidth:4,"stroke-dasharray":"10 0 0 130",opacity:0.9},spin);
    return {wrap:wrap,spin:spin};
  }

  var racerLayer=document.getElementById("racerLayer");
  var racers=[];

  // ---------- RABBIT ON BICYCLE ----------
  (function(){
    var g=el("g",null,racerLayer);
    var root=el("g",null,g);          // translate/scale/rotate
    var bob=el("g",null,root);        // vertical bob
    var body=el("g",null,bob);
    // shadow
    el("ellipse",{cx:5,cy:4,rx:78,ry:9,fill:"#1a0a04",opacity:0.45,filter:"url(#soft)"},body);

    // wheels
    var rw=wheel(38,body,"#2c1c11","#563421","#c9cdd1"); rw.wrap.setAttribute("transform","translate(-48 -38)");
    var fw=wheel(38,body,"#2c1c11","#563421","#c9cdd1"); fw.wrap.setAttribute("transform","translate(58 -38)");

    // frame
    var fr=el("g",{fill:"none",stroke:"#e8663a",strokeWidth:5,strokeLinecap:"round",strokeLinejoin:"round"},body);
    pathGen("M-48 -38 L0 -26 L-48 -38",fr);
    pathGen("M0 -26 L-4 -96",fr);
    pathGen("M-4 -96 L58 -82",fr);
    pathGen("M0 -26 L58 -68",fr);
    pathGen("M58 -82 L58 -66",fr);
    // fork + handlebar
    pathGen("M58 -66 C54 -56 60 -46 58 -38",fr);
    pathGen("M58 -82 C54 -92 46 -96 42 -94",fr,{stroke:"#e8663a"});
    el("line",{x1:38,y1:-96,x2:52,y2:-98,stroke:"#3a1710",strokeWidth:6,strokeLinecap:"round"},body);
    // saddle
    pathGen("M-14 -98 C-16 -106 -6 -106 -2 -98 L6 -98 C10 -92 -10 -92 -14 -98 Z",body,{fill:"#3a1710"});
    // chain ring + crank (rotating group)
    var crank=el("g",{transform:"translate(0 -26)"},body);
    el("circle",{r:13,fill:"#3c4146",stroke:"#666",strokeWidth:2},crank);
    el("circle",{r:6,fill:"#8a8f94"},crank);
    // pedal arms
    var pa=el("g",null,crank);
    el("line",{x1:0,y1:0,x2:0,y2:-11,stroke:"#444",strokeWidth:5,strokeLinecap:"round"},pa);
    el("line",{x1:0,y1:0,x2:0,y2:11,stroke:"#444",strokeWidth:5,strokeLinecap:"round"},pa);
    el("rect",{x:-8,y:-15,width:16,height:7,rx:3,fill:"#6b7075"},pa);
    el("rect",{x:-8,y:8,width:16,height:7,rx:3,fill:"#6b7075"},pa);
    // legs (dynamic: foot follows spinning pedal, updated each frame)
    var leg1=el("line",{x1:-12,y1:-92,x2:-4,y2:-24,stroke:"#c48a52",strokeWidth:7,strokeLinecap:"round"},body);
    var leg2=el("line",{x1:-16,y1:-92,x2:3,y2:-25,stroke:"#b57a46",strokeWidth:7,strokeLinecap:"round"},body);
    el("circle",{cx:-14,cy:-91,r:6,fill:"#c48a52"},body);

    // RABBIT
    // tail
    el("circle",{cx:-22,cy:-96,r:8,fill:"#f4f1e8"},body);
    // body (leaning forward)
    pathGen("M-6 -92 C-22 -122 2 -128 20 -126 C42 -124 46 -106 40 -96 C28 -88 -2 -84 -6 -92 Z",body,{fill:"#c88f52"});
    pathGen("M-4 -100 C6 -116 26 -116 36 -106",body,{fill:"none",stroke:"#e7b27c",strokeWidth:4,strokeLinecap:"round"});
    // belly
    pathGen("M0 -96 C10 -102 30 -102 36 -100 C26 -92 4 -90 0 -96 Z",body,{fill:"#f3e2c8"});
    // front arm to bar
    pathGen("M28 -110 C34 -112 36 -106 40 -98",body,{fill:"none",stroke:"#c88f52",strokeWidth:7,strokeLinecap:"round"});
    pathGen("M26 -108 C30 -110 32 -104 36 -98",body,{fill:"none",stroke:"#b57a46",strokeWidth:6,strokeLinecap:"round"});
    // head
    var head=el("g",null,body);
    el("circle",{cx:46,cy:-124,r:15,fill:"#c88f52"},head);
    // ears (wiggle via JS)
    var earL=el("g",null,head);
    el("ellipse",{cx:44,cy:-146,rx:5,ry:17,fill:"#c88f52"},earL);
    el("ellipse",{cx:44,cy:-145,rx:2.6,ry:12,fill:"#f2b3c2"},earL);
    var earR=el("g",null,head);
    el("ellipse",{cx:52,cy:-147,rx:5.5,ry:18,fill:"#c88f52",transform:"rotate(14 52 -147)"},earR);

  function addParticle(x,y,r,type,vx,vy,life){

  function renderParticles(){
    // clear old children (rebuild cheaply)
    while(fx.firstChild) fx.removeChild(fx.firstChild);
    var i;
    for(i=0;i<particles.length;i++){
      var p=particles[i];
      var f=1-p.age/p.l;

  /* ============ MAIN LOOP ============ */
  var startT=performance.now(), last=startT;
  var state="count"; // count -> race
  var countPhase=0, cdLast=-1;
  var annQueue=[], annShow=false, annUntil=0;
  var lbOrder=[0,1,2], lbHighlight=0;

  function announce(sub, main, dur){
    annQueue.push({sub:sub,main:main,dur:dur||2600});
  }

  function speedFor(r, t){
    if(t<=1.8) return 8;
    var s=r.base + Math.sin(t*r.freq+r.phase)*r.amp + Math.sin(t*1.7+r.phase*2)*r.amp*0.35;
    if(r.key==="rabbit"){ s+=Math.sin(t*0.33)*26 + (Math.sin(t*2.9)>0.85 ? 40:0); }
    if(r.key==="eagle"){ s+=Math.sin(t*0.22+1)*18; }
    if(r.key==="turtle"){
      if(t<1.8){ s=0; }
      if(r.boost>0){ s=r.base+150; r.boost-=0; }
    }
    return s;
  }

  function frame(now){
    var dt=Math.min((now-last)/1000, 0.05);
    last=now;
    var t=(now-startT)/1000;

    // ---- countdown
    if(state==="count"){
      countPhase+=dt;
      var n=Math.ceil(1.8-countPhase);
      n=Math.max(n,0);
      if(n!==cdLast){
        cdLast=n;
        var cd=window.__cd;
        cd.n.setAttribute("opacity",1);
        cd.n.textContent = n>0 ? String(n) : "GO!";
        cd.n.classList.remove("cd"); void cd.n.offsetWidth; cd.n.classList.add("cd");
        cd.sub.setAttribute("opacity",1);
        cd.sub.textContent = n>0 ? "MARTIAN RING ROAD GRAND PRIX" : "";
      }
      if(countPhase>=1.8){ state="race"; announce("", "GO!",1200); }
    }

    // ---- update racers
    var i,r,pos,sp;
    for(i=0;i<racers.length;i++){
      r=racers[i];
      sp=speedFor(r,t);
      r.spd=sp;
      r.cum+=sp*dt;

      // finish-line crossing (lap boundary)
      var lap=Math.floor(r.cum/Ltot);
      if(lap>r.lap){
        if(lap-r.lap>0){
          r.lap=lap;
          annQueue.push({sub:r.vehicle+" crosses the line first!", main:r.short+" TAKES LAP "+lap+"!",dur:2400});
        } else r.lap=lap;
      }

      var d=((r.cum%Ltot)+Ltot)%Ltot;
      pos=pointAtDist(d);
      var sc=pos.scale;
      // bob
      var crank=0, want=lspd2=0;
      // wheel sync
      r.wA=(r.wA+sp/(r.r)*dt*57.2958)%(360*3);
      // bob with pedal cadence + per-character
      var bobY=0;
      if(r.key==="rabbit"){
        bobY=Math.abs(Math.sin(r.wA*0.11))*7 - 3.5 + Math.sin(t*6+r.phase)*1.5;
      } else if(r.key==="turtle"){
        bobY=Math.abs(Math.sin(r.wA*0.10))*4 - 2 + Math.sin(t*4+r.phase)*1.2;
      } else {
        bobY=Math.abs(Math.sin(r.wA*0.13))*5 - 2.5 + Math.sin(t*4.3+r.phase)*1.2;
      }
      // rabbit hops
      if(r.key==="rabbit" && t>1.8 && Math.sin(t*1.25+r.phase)>0.94){ r.hop=50; }
      if(r.hop>0){ r.hop-=dt*120; bobY-=r.hop*0.5*sc; }

      // translate/scale/rotate root
      var lean=Math.sin(t*(r.key==="eagle"?1.1:0.6)+r.phase)*1.4 + (r.key==="rabbit"? (r.hop*0.2):0);
      var ang=pos.ang+lean;
      r.root.setAttribute("transform",
        "translate("+pos.x.toFixed(1)+" "+pos.y.toFixed(1)+") rotate("+ang.toFixed(2)+") scale("+(sc).toFixed(3)+")");
      r.bob.setAttribute("transform","translate(0 "+bobY.toFixed(1)+")");

      // wheels spin
      var wdeg=(r.wA%(360)).toFixed(1);
      r.rw.spin.setAttribute("transform","rotate("+wdeg+")");
      r.fw.spin.setAttribute("transform","rotate("+wdeg+")");

      // crank (sync with wheels: crankR ~ spokes)
      if(r.crank){
        var ca=(-r.wA* (r.r/ (r.r*0.32)) )%360;
        r.crank.setAttribute("transform","rotate("+ca.toFixed(1)+")");
      }
      // decorations
      if(r.earL){ 
        var ea=Math.sin(t*9+r.phase)*8; 
        r.earL.setAttribute("transform","rotate("+ea.toFixed(1)+" 44 -146)");
      }
      if(r.earR){ r.earR.setAttribute("transform","rotate("+(-Math.sin(t*9+r.phase)*10+14).toFixed(1)+" 52 -147)"); }
      if(r.scarf){ r.scarf.setAttribute("transform","rotate("+(Math.sin(t*13+r.phase)*9).toFixed(1)+" 40 -120)"); }
      if(r.wing){ r.wing.setAttribute("transform","rotate("+(Math.sin(t*3.5+r.phase)*20).toFixed(1)+" 0 -118)"); }
      if(r.wing2){ r.wing2.setAttribute("transform","rotate("+(Math.sin(t*3.5+r.phase+Math.PI)*26).toFixed(1)+" 0 -108)"); }
      if(r.shell){ r.shell.setAttribute("transform","rotate("+(Math.sin(t*2.6+r.phase)*3).toFixed(1)+" 0 -104)"); }
      if(r.head && r.key==="turtle"){ r.head.setAttribute("transform","translate("+(Math.sin(t*2.2)*2).toFixed(1)+" 0)"); }
      if(r.tag){ r.tag.setAttribute("transform","translate("+(5).toFixed(0)+" "+(r.off&&r.off.y?r.off.y:-150)+")"); }

      // ---- particles: exhaust + dust
      var speedx=sp;
      if(t>1.8){
        // dust puffs behind rear wheel
        var wx=pos.x - Math.cos(pos.ang*Math.PI/180)*(r.r*1.4)*sc;
        var wy=pos.y - Math.sin(pos.ang*Math.PI/180)*(r.r*1.4)*sc - r.r*1.05*sc + bobY*sc;
        if(Math.random()<0.35) addParticle(wx+(Math.random()-0.5)*10*sc, wy+(Math.random()-0.5)*4*sc, (6+Math.random()*6)*sc,"dust",0,0,420);
        if(r.key==="rabbit" && Math.random()<0.5) addParticle(wx,wy,5*sc,"dust",0,0,300);
        // turtle exhaust smokes
        if(r.key==="turtle"){
          var ex=pos.x - Math.cos(pos.ang*Math.PI/180)*(70*sc);
          var ey=pos.y - Math.sin(pos.ang*Math.PI/180)*(70*sc) - 19*sc;
          if(Math.random()<0.5) addParticle(ex,ey,(7+Math.random()*7)*sc,"smoke",0,-6*sc,620);
          if(r.boost>0 && Math.random()<0.7) addParticle(ex,ey,(8+Math.random()*4)*sc,"spark",0,-10*sc,300);
        }
      }
      r.dist=d; r.scale=sc; r.bobY=bobY; r.ang=pos.ang; r.pos=pos;
    }

    // ---- turtle boost timer
    var tr=racers[1];
    if(state==="race" && t>2){
      var cycle=Math.sin(t*0.14);
      if(cycle>0.72) tr.boost=1; else if(cycle<-0.5) tr.boost=0;
    }

    // ---- leaderboard + crossing order (by cumulative distance)
    var order=racers.slice().sort(function(a,b){ return b.cum-a.cum; });
    for(i=0;i<order.length;i++){
      var rr=order[i]; rr.rank=i+1;
    }
    // reverse mapping into lb rows (row 0 = rank 1)
    for(i=0;i<3;i++){
      var rc=window.__lb.rank[i], r2=order[i];
      rc.nm.textContent=r2.short+"  ·  "+r2.vehicle;
      rc.vh.textContent=r2.name;
      var pct=((r2.cum%Ltot)/Ltot)*100;
      rc.bf.setAttribute("width",(90*pct/100).toFixed(1));
      rc.lbl.textContent=(pct).toFixed(0)+"%";
      // medal colors
      rc.row.firstChild.setAttribute("fill", i===0?"rgba(255,215,0,.28)": i===1?"rgba(200,200,210,.22)": i===2?"rgba(205,127,50,.22)":"rgba(255,255,255,.05)");
    }

    // ---- announcement queue
    if(!annShow && annQueue.length){
      var a=annQueue.shift();
      window.__ann.txt.textContent=a.main;
      window.__ann.sub.textContent=a.sub;
      var d1=document.createElement("div"); void(d1);
      window.__ann.txt.setAttribute("opacity",1);
      window.__ann.sub.setAttribute("opacity",1);
      window.__ann.txt.style.transform="none";
      window.__ann.txt.classList.remove("annq"); void(window.__ann.txt.getBoundingClientRect());
      window.__ann.txt.classList.add("annp");
      window.__ann.sub.classList.remove("annq");
      window.__ann.sub.classList.add("annp");
      annShow=true; annUntil=now+(a.dur||2600);
    } else if(annShow && now>annUntil){
      window.__ann.txt.setAttribute("opacity",0);
      window.__ann.sub.setAttribute("opacity",0);
      window.__ann.txt.classList.remove("annp");
      window.__ann.sub.classList.remove("annp");
      annShow=false;
    }

    // ---- lap counts in leaderboard
    window.__lb.lapT.textContent = "LAP  "+(order[0].lap+1);
    if(state==="race" && t>2.2){
      var lbi=order.indexOf? order2=0:0;
    }

    renderParticles();
    particles.forEach(function(p){ p.age+=dt*1000; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.age>p.l) p.dead=true; });
    particles=particles.filter(function(p){ return !p.dead; });

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
