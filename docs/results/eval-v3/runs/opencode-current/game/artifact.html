<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Shooter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #05070f;
    color: #cfe0ff;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: #000;
    background-image:
      radial-gradient(ellipse at 30% 20%, rgba(40, 60, 140, 0.35), transparent 60%),
      radial-gradient(ellipse at 75% 80%, rgba(90, 30, 120, 0.30), transparent 60%);
    border: 1px solid #223;
    box-shadow: 0 0 40px rgba(60, 90, 220, 0.25);
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');

  var W = 900, H = 600;
  canvas.width = W;
  canvas.height = H;

  function fitCanvas() {
    var k = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.width = Math.floor(W * k) + 'px';
    canvas.style.height = Math.floor(H * k) + 'px';
  }
  fitCanvas();
  window.addEventListener('resize', fitCanvas);

  var STATE = { START: 0, PLAYING: 1, GAMEOVER: 2 };
  var state = STATE.START;

  var score = 0;
  var best = 0;
  try { best = parseInt(localStorage.getItem('spaceshooter_best'), 10) || 0; } catch (e) {}

  var keys = {};
  var lastTime = 0;

  var player = {
    x: W / 2,
    y: H - 70,
    w: 34,
    h: 34,
    speed: 320,
    fireCooldown: 0,
    fireRate: 0.22,
    invuln: 0,
    alive: true
  };

  var bullets = [];
  var enemies = [];
  var explosions = [];
  var stars = [];

  var enemySpawnTimer = 1.2;
  var enemySpeed = 120;
  var runningTime = 0;

  function makeStars() {
    stars = [];
    for (var i = 0; i < 110; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.6 + 0.3,
        s: Math.random() * 60 + 20,
        t: Math.random() * Math.PI * 2
      });
    }
  }
  makeStars();

  function reset() {
    player.x = W / 2;
    player.y = H - 70;
    player.fireCooldown = 0;
    player.invuln = 1.5;
    player.alive = true;
    bullets = [];
    enemies = [];
    score = 0;
    enemySpawnTimer = 1.2;
    enemySpeed = 120;
    runningTime = 0;
  }

  function spawnEnemy() {
    var size = 10 + Math.random() * 14;
    var type = Math.random();
    var hp;
    var speed;
    var color;
    if (type < 0.2) {
      hp = 3; speed = 60 + runningTime * 4; color = '#ff6a6a';
    } else if (type < 0.55) {
      hp = 2; speed = 90 + runningTime * 5; color = '#ffb84d';
    } else {
      hp = 1; speed = 130 + runningTime * 6; color = '#9bf';
    }
    enemies.push({
      x: Math.random() * (W - 40) + 20,
      y: -30,
      w: size * 2,
      h: size * 2,
      speed: Math.min(speed, 240),
      hp: hp,
      color: color,
      phase: Math.random() * Math.PI * 2,
      drift: Math.random() * 60 + 20
    });
  }

  function fireBullet() {
    bullets.push({
      x: player.x,
      y: player.y - 20,
      w: 4,
      h: 14,
      speed: 480,
      power: 1
    });
  }

  function spawnExplosion(x, y, color, big) {
    var n = big ? 26 : 14;
    var c = color || '#fff';
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = Math.random() * (big ? 260 : 180) + 40;
      explosions.push({
        x: x,
        y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 0.6 + Math.random() * 0.5,
        maxLife: 1.1,
        r: Math.random() * 3 + 1,
        color: Math.random() < 0.5 ? color : '#fff'
      });
    }
    flash = Math.min(1, flash + (big ? 0.5 : 0.25));
  }

  var flash = 0;

  function update(dt) {
    runningTime += dt;
    flash = Math.max(0, flash - dt * 2.5);

    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.y += s.s * dt;
      s.t += dt * 3;
      if (s.y > H + 5) {
        s.y = -5;
        s.x = Math.random() * W;
      }
    }

    var dirX = 0, dirY = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) dirX -= 1;
    if (keys['ArrowRight'] || keys['KeyD']) dirX += 1;
    if (keys['ArrowUp'] || keys['KeyW']) dirY -= 1;
    if (keys['ArrowDown'] || keys['KeyS']) dirY += 1;

    if (dirX !== 0 && dirY !== 0) {
      dirX *= 0.7071;
      dirY *= 0.7071;
    }

    if (player.alive) {
      player.x += dirX * player.speed * dt;
      player.y += dirY * player.speed * dt;
      player.x = Math.max(20, Math.min(W - 20, player.x));
      player.y = Math.max(20, Math.min(H - 20, player.y));

      player.invuln = Math.max(0, player.invuln - dt);
      player.fireCooldown -= dt;
      if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.fireCooldown <= 0) {
        fireBullet();
        player.fireCooldown = player.fireRate;
      }
    }

    for (i = bullets.length - 1; i >= 0; i--) {
      var b = bullets[i];
      b.y -= b.speed * dt;
      if (b.y < -20) bullets.splice(i, 1);
    }

    if (state === STATE.PLAYING && player.alive) {
      enemySpawnTimer -= dt;
      if (enemySpawnTimer <= 0) {
        spawnEnemy();
        enemySpawnTimer = Math.max(0.25, 1.2 - runningTime * 0.012);
      }
    }

    for (i = enemies.length - 1; i >= 0; i--) {
      var e = enemies[i];
      e.y += e.speed * dt;
      e.x += Math.sin(e.phase + runningTime * 2) * e.drift * dt;
      e.x = Math.max(20, Math.min(W - 20, e.x));
    }

    for (i = enemies.length - 1; i >= 0; i--) {
      var en = enemies[i];
      if (en.y - en.h / 2 > H + 20) {
        enemies.splice(i, 1);
        continue;
      }
      for (var j = bullets.length - 1; j >= 0; j--) {
        var bl = bullets[j];
        if (rectsOverlap(bl, en)) {
          en.hp -= bl.power;
          bullets.splice(j, 1);
          spawnExplosion(bl.x, bl.y, '#8cf', false);
          if (en.hp <= 0) {
            score += 10;
            spawnExplosion(en.x, en.y, en.color, true);
            enemies.splice(i, 1);
          }
          break;
        }
      }
    }

    if (player.alive && state === STATE.PLAYING) {
      for (i = enemies.length - 1; i >= 0; i--) {
        var ce = enemies[i];
        if (player.invuln <= 0 && rectsOverlap(player, { x: ce.x, y: ce.y, w: ce.w * 0.7, h: ce.h * 0.7 })) {
          player.alive = false;
          spawnExplosion(player.x, player.y, '#5cf', true);
          if (score > best) {
            best = score;
            try { localStorage.setItem('spaceshooter_best', String(best)); } catch (err) {}
          }
          state = STATE.GAMEOVER;
          break;
        }
      }
    }

    for (i = explosions.length - 1; i >= 0; i--) {
      var p = explosions[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= (1 - dt * 3);
      p.vy *= (1 - dt * 3);
      p.life -= dt;
      if (p.life <= 0) explosions.splice(i, 1);
    }
  }

  function rectsOverlap(a, b) {
    return Math.abs(a.x - b.x) < (a.w + b.w) / 2 &&
           Math.abs(a.y - b.y) < (a.h + b.h) / 2;
  }

  function drawShip(x, y, flame) {
    ctx.save();
    ctx.translate(x, y);
    var th = 30, tw = 30;
    ctx.beginPath();
    ctx.moveTo(0, -th / 2);
    ctx.lineTo(tw / 2, th / 2);
    ctx.lineTo(0, th / 2 - 4);
    ctx.lineTo(-tw / 2, th / 2);
    ctx.closePath();
    ctx.fillStyle = '#7ec8ff';
    ctx.fill();
    ctx.strokeStyle = '#dff3ff';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = '#2a3f6b';
    ctx.beginPath();
    ctx.arc(0, 4, 5, 0, Math.PI * 2);
    ctx.fill();

    if (flame) {
      var fl = 8 + Math.random() * 8;
      ctx.fillStyle = 'rgba(255,160,60,0.9)';
      ctx.beginPath();
      ctx.moveTo(-4, th / 2 - 3);
      ctx.lineTo(0, th / 2 + fl);
      ctx.lineTo(4, th / 2 - 3);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,220,120,0.9)';
      ctx.beginPath();
      ctx.moveTo(-2, th / 2 - 2);
      ctx.lineTo(0, th / 2 + fl * 0.5);
      ctx.lineTo(2, th / 2 - 2);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawEnemy(e) {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(Math.sin(e.phase + runningTime * 2) * 0.15);
    ctx.beginPath();
    ctx.moveTo(0, e.h / 2);
    ctx.lineTo(e.w / 2, -e.h / 2);
    ctx.lineTo(0, -e.h / 2 + 4);
    ctx.lineTo(-e.w / 2, -e.h / 2);
    ctx.closePath();
    ctx.fillStyle = e.color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(-3, -e.h / 2 + 3, 6, 4);
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var tw = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(s.t));
      ctx.fillStyle = 'rgba(200,215,255,' + tw.toFixed(2) + ')';
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }

    for (i = 0; i < bullets.length; i++) {
      var b = bullets[i];
      var g = ctx.createLinearGradient(0, b.y - b.h / 2, 0, b.y + b.h / 2);
      g.addColorStop(0, '#fff');
      g.addColorStop(1, '#39f');
      ctx.fillStyle = g;
      ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    }

    for (i = 0; i < enemies.length; i++) {
      drawEnemy(enemies[i]);
    }

    if (player.alive) {
      if (player.invuln > 0 && Math.floor(player.invuln * 10) % 2 === 0) {
        ctx.globalAlpha = 0.4;
      }
      drawShip(player.x, player.y, true);
      ctx.globalAlpha = 1;
    }

    for (i = 0; i < explosions.length; i++) {
      var p = explosions[i];
      var a = Math.max(0, p.life / p.maxLife);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.5).toFixed(2) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    drawHUD();
  }

  function drawHUD() {
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.font = 'bold 18px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE ' + score, 14, 28);
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText('BEST ' + best, W - 14, 28);
    ctx.textAlign = 'left';

    if (state === STATE.START) {
      ctx.fillStyle = 'rgba(5,8,18,0.72)';
      ctx.fillRect(0, H / 2 - 140, W, 280);
      ctx.fillStyle = '#7ec8ff';
      ctx.font = 'bold 46px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('SPACE SHOOTER', W / 2, H / 2 - 60);

      ctx.fillStyle = '#cfe0ff';
      ctx.font = '18px "Courier New", monospace';
      ctx.fillText('MOVE: Arrow Keys / WASD', W / 2, H / 2 - 18);
      ctx.fillText('SHOOT: Space', W / 2, H / 2 + 8);

      ctx.fillStyle = '#8ef';
      ctx.font = 'bold 20px "Courier New", monospace';
      ctx.fillText('PRESS SPACE TO START', W / 2, H / 2 + 64);
      ctx.textAlign = 'left';
    }

    if (state === STATE.GAMEOVER) {
      ctx.fillStyle = 'rgba(20,4,12,0.75)';
      ctx.fillRect(0, H / 2 - 110, W, 220);
      ctx.fillStyle = '#ff6a6a';
      ctx.font = 'bold 40px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', W / 2, H / 2 - 45);
      ctx.fillStyle = '#cfe0ff';
      ctx.font = '20px "Courier New", monospace';
      ctx.fillText('Score: ' + score + '   Best: ' + best, W / 2, H / 2);
      if (score >= best && score > 0) {
        ctx.fillStyle = '#ffd24d';
        ctx.fillText('NEW BEST!', W / 2, H / 2 + 32);
      }
      ctx.fillStyle = '#8ef';
      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.fillText('PRESS SPACE TO RESTART', W / 2, H / 2 + 72);
      ctx.textAlign = 'left';
    }
  }

  function loop(ts) {
    var dt = Math.min(0.05, (ts - lastTime) / 1000 || 0.016);
    lastTime = ts;

    if (state !== STATE.START) {
      update(dt);
    } else {
      for (var i = 0; i < stars.length; i++) {
        stars[i].y += stars[i].s * dt;
        if (stars[i].y > H + 5) { stars[i].y = -5; stars[i].x = Math.random() * W; }
      }
    }

    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener('keydown', function (ev) {
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].indexOf(ev.code) !== -1) {
      ev.preventDefault();
    }
    keys[ev.code] = true;

    if (ev.code === 'Space' && state === STATE.START) {
      state = STATE.PLAYING;
      reset();
    } else if (ev.code === 'Space' && state === STATE.GAMEOVER) {
      state = STATE.PLAYING;
      reset();
    }
  });

  window.addEventListener('keyup', function (ev) {
    keys[ev.code] = false;
  });

  window.addEventListener('blur', function () {
    keys = {};
  });

  canvas.addEventListener('click', function () {
    if (state === STATE.START || state === STATE.GAMEOVER) {
      state = STATE.PLAYING;
      reset();
    }
  });

  lastTime = performance.now();
  requestAnimationFrame(loop);

  window.__spaceShooterTest = {
    getState: function () { return state; },
    getScore: function () { return score; },
    getEnemyCount: function () { return enemies.length; },
    getPlayer: function () { return { x: player.x, y: player.y, alive: player.alive }; },
    getCanvas: function () { return canvas; }
  };
})();
</script>
</body>
</html>
