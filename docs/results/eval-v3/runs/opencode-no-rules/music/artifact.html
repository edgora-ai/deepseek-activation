<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebAudio Music Visualizer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05060f; color: #e8e8f0; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; padding: 10px 14px; background: rgba(10,12,24,0.72); border: 1px solid rgba(120,130,255,0.25); border-radius: 14px; backdrop-filter: blur(10px); box-shadow: 0 8px 30px rgba(0,0,0,0.45); z-index: 10; max-width: calc(100vw - 24px); }
  .btn { border: 1px solid rgba(140,150,255,0.35); background: rgba(30,34,60,0.85); color: #dfe3ff; font-size: 13px; padding: 7px 13px; border-radius: 9px; cursor: pointer; transition: all .15s ease; user-select: none; white-space: nowrap; }
  .btn:hover { border-color: rgba(170,180,255,0.8); background: rgba(50,56,100,0.9); }
  .btn.active { background: linear-gradient(135deg, #5a6bff, #8a4dff); border-color: rgba(180,170,255,0.9); color: #fff; box-shadow: 0 0 14px rgba(110,100,255,0.55); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.play { min-width: 84px; }
  #fileLabel { position: relative; overflow: hidden; display: inline-block; }
  #file { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  #status { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); font-size: 12.5px; color: #aeb4e0; background: rgba(10,12,24,0.6); border: 1px solid rgba(120,130,255,0.18); padding: 6px 14px; border-radius: 20px; z-index: 10; max-width: calc(100vw - 24px); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hint { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 14px; color: rgba(200,208,255,0.75); background: rgba(10,12,24,0.55); padding: 10px 18px; border-radius: 12px; border: 1px solid rgba(120,130,255,0.16); text-align: center; z-index: 5; pointer-events: none; transition: opacity .4s ease; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas"></canvas>
</div>
<div id="status">No audio loaded</div>
<div id="hint">Load a file or start the microphone to react to sound</div>
<div id="ui">
  <label class="btn" id="fileLabel">Open Audio<input type="file" id="file" accept="audio/*" multiple="false"></label>
  <button class="btn" id="micBtn">Mic</button>
  <button class="btn play" id="playBtn">Play</button>
  <button class="btn" id="stopBtn">Stop</button>
  <span style="width:1px;height:22px;background:rgba(140,150,255,0.2)"></span>
  <button class="btn mode active" data-mode="bars">Bars</button>
  <button class="btn mode" data-mode="rings">Rings</button>
  <button class="btn mode" data-mode="particles">Particles</button>
</div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var statusEl = document.getElementById('status');
  var hintEl = document.getElementById('hint');
  var playBtn = document.getElementById('playBtn');
  var stopBtn = document.getElementById('stopBtn');
  var micBtn = document.getElementById('micBtn');
  var fileInput = document.getElementById('file');
  var modeBtns = Array.prototype.slice.call(document.querySelectorAll('.mode'));

  var W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  var FFT_SIZE = 512;
  var BINS = FFT_SIZE / 2;

  var audioCtx = null;
  var analyser = null;
  var freqData = null;
  var timeData = null;
  var freqFloat = null;

  var audioEl = new Audio();
  audioEl.preload = 'auto';
  var audioURL = null;
  var sourceNode = null;
  var micStream = null;
  var micActive = false;
  var isPlaying = false;

  var mode = 'bars';
  var hueBase = 210;

  function ensureAudio(createNew) {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) {
        statusEl.textContent = 'WebAudio not supported in this browser';
        return false;
      }
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = FFT_SIZE;
      analyser.smoothingTimeConstant = 0.82;
      analyser.connect(audioCtx.destination);
      freqData = new Uint8Array(analyser.frequencyBinCount);
      timeData = new Uint8Array(analyser.frequencyBinCount);
      freqFloat = new Float32Array(analyser.frequencyBinCount);
    }
    if (createNew && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return true;
  }

  function detachSource() {
    if (sourceNode) {
      try { sourceNode.disconnect(); } catch (e) {}
      sourceNode = null;
    }
    if (audioEl.src) {
      try { audioEl.pause(); } catch (e) {}
      audioEl.removeAttribute('src');
      audioEl.load();
      if (audioURL) { URL.revokeObjectURL(audioURL); audioURL = null; }
    }
    if (micStream) {
      micStream.getTracks().forEach(function (t) { t.stop(); });
      micStream = null;
    }
    micActive = false;
    micBtn.classList.remove('active');
    micBtn.textContent = 'Mic';
    isPlaying = false;
    updatePlayBtn();
  }

  function connectToAnalyser(node) {
    if (!ensureAudio()) return;
    if (sourceNode) { try { sourceNode.disconnect(); } catch (e) {} }
    sourceNode = node;
    sourceNode.connect(analyser);
  }

  function loadFile(file) {
    if (!ensureAudio()) return;
    detachSource();
    if (audioURL) { URL.revokeObjectURL(audioURL); audioURL = null; }
    audioURL = URL.createObjectURL(file);
    audioEl.src = audioURL;
    audioEl.addEventListener('loadedmetadata', function () {
      statusEl.textContent = file.name + ' loaded (' + fmtTime(audioEl.duration) + ')';
    }, { once: true });
    audioEl.addEventListener('ended', function () {
      isPlaying = false;
      updatePlayBtn();
      statusEl.textContent = file.name + ' - ended';
    });
    if (!sourceNode) connectToAnalyser(audioCtx.createMediaElementSource(audioEl));
    playAudio();
  }

  function playAudio() {
    if (!ensureAudio(true)) return;
    if (!audioEl.src && !micActive) return;
    if (micActive) {
      audioCtx.resume();
      isPlaying = true;
    } else {
      audioCtx.resume();
      audioEl.play().then(function () {
        isPlaying = true;
        updatePlayBtn();
        if (audioEl.duration) statusEl.textContent = 'Playing: ' + (audioEl._name || 'audio') + ' ' + fmtTime(audioEl.currentTime) + ' / ' + fmtTime(audioEl.duration);
      }).catch(function () { isPlaying = false; updatePlayBtn(); });
    }
  }

  function pauseAudio() {
    if (micActive) {
      isPlaying = false;
    } else if (audioEl.src) {
      audioEl.pause();
      isPlaying = false;
    }
    updatePlayBtn();
  }

  function updatePlayBtn() {
    if (isPlaying) {
      playBtn.textContent = 'Pause';
      playBtn.classList.add('active');
    } else {
      playBtn.textContent = 'Play';
      playBtn.classList.remove('active');
    }
    var hasSource = !!audioEl.src || micActive;
    playBtn.disabled = !hasSource;
    stopBtn.disabled = !hasSource;
  }

  function fmtTime(s) {
    if (!isFinite(s) || s < 0) return '0:00';
    var m = Math.floor(s / 60);
    var sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  playBtn.addEventListener('click', function () {
    if (isPlaying) pauseAudio(); else playAudio();
  });

  stopBtn.addEventListener('click', function () {
    if (micActive) {
      stopMic();
      return;
    }
    if (audioEl) { audioEl.pause(); audioEl.currentTime = 0; }
    isPlaying = false;
    updatePlayBtn();
    var n = audioEl._name || 'audio';
    statusEl.textContent = n + ' stopped';
  });

  fileInput.addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    audioEl._name = f.name;
    loadFile(f);
    this.value = '';
  });

  function stopMic() {
    if (micStream) {
      micStream.getTracks().forEach(function (t) { t.stop(); });
      micStream = null;
    }
    micActive = false;
    micBtn.classList.remove('active');
    micBtn.textContent = 'Mic';
    isPlaying = false;
    updatePlayBtn();
    statusEl.textContent = 'Microphone off';
  }

  micBtn.addEventListener('click', function () {
    if (micActive) { stopMic(); return; }
    if (!ensureAudio(true)) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      statusEl.textContent = 'Microphone not available';
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      if (!ensureAudio()) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
      detachSource();
      micStream = stream;
      micActive = true;
      micBtn.classList.add('active');
      micBtn.textContent = 'Mic On';
      connectToAnalyser(audioCtx.createMediaStreamSource(stream));
      audioCtx.resume();
      isPlaying = true;
      updatePlayBtn();
      statusEl.textContent = 'Microphone: listening...';
      hintEl.style.opacity = '0';
    }).catch(function (err) {
      statusEl.textContent = 'Mic error: ' + (err && err.name ? err.name : 'denied');
    });
  });

  modeBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      mode = b.getAttribute('data-mode');
      modeBtns.forEach(function (x) { x.classList.toggle('active', x === b); });
    });
  });

  window.addEventListener('beforeunload', detachSource);

  var particles = [];
  var PART_MAX = 320;

  function normFreq() {
    var hasAnalyser = analyser && freqData;
    if (!hasAnalyser) {
      var t = performance.now() / 1000;
      var idle = new Array(64);
      for (var i = 0; i < 64; i++) {
        var ph = t * (0.6 + (i % 7) * 0.13) + i * 0.55;
        idle[i] = Math.max(0, Math.min(1, (Math.sin(ph) * 0.5 + 0.5) * (0.35 + 0.3 * Math.sin(t * 0.9 + i))));
      }
      return idle;
    }
    analyser.getByteFrequencyData(freqData);
    var out = new Array(BINS);
    for (var j = 0; j < BINS; j++) out[j] = freqData[j] / 255;
    return out;
  }

  function getWave() {
    if (!analyser || !timeData) return null;
    analyser.getByteTimeDomainData(timeData);
    return timeData;
  }

  function lerp(a, b, t) { return a + (b - a) * t; }

  function hsv(h, s, v) {
    s = s / 100; v = v / 100;
    var c = v * s;
    var x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    var m = v - c;
    var r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; }
    else if (h < 120) { r = x; g = c; }
    else if (h < 180) { g = c; b = x; }
    else if (h < 240) { g = x; b = c; }
    else if (h < 300) { r = x; b = c; }
    else { r = c; b = x; }
    return 'rgb(' + Math.round((r + m) * 255) + ',' + Math.round((g + m) * 255) + ',' + Math.round((b + m) * 255) + ')';
  }

  function drawBars(freq, t, dt) {
    var n = 96;
    var gap = 2;
    var bw = (W - (n - 1) * gap) / n;
    var cx = W / 2;
    var cy = H / 2;
    var baseH = (H * 0.96) / 2;
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < n; i++) {
      var idx = Math.floor(i * (freq.length / n));
      var v = freq[idx] || 0;
      var v2 = Math.pow(v, 1.6) * 1.1;
      var bh = Math.max(2, v2 * baseH);
      var h = (hueBase + i * 1.4 + t * 8) % 360;
      ctx.fillStyle = hsv(h, 90, 60 + v2 * 40);
      var x = (i < n / 2) ? (cx - gap / 2 - (Math.floor(n / 2) - i) * (bw + gap)) : (cx + gap / 2 + (i - Math.floor(n / 2)) * (bw + gap));
      ctx.fillRect(x, cy - bh, bw, bh * 2);
      if (v2 > 0.15) {
        ctx.fillStyle = 'rgba(255,255,255,' + (v2 * 0.35) + ')';
        ctx.fillRect(x, cy - bh - 3, bw, 3);
        ctx.fillRect(x, cy + bh, bw, 3);
      }
    }
  }

  function drawRings(freq, t, dt) {
    var layers = 40;
    var cx = W / 2, cy = H / 2;
    var maxR = Math.min(W, H) * 0.46;
    ctx.clearRect(0, 0, W, H);
    var rGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR);
    rGrad.addColorStop(0, 'rgba(10,12,30,0.25)');
    rGrad.addColorStop(1, 'rgba(5,6,15,0)');
    ctx.fillStyle = rGrad;
    ctx.fillRect(0, 0, W, H);

    for (var i = 0; i < layers; i++) {
      var idx = Math.floor(i * (freq.length / layers));
      var v = freq[idx] || 0;
      var v2 = Math.pow(v, 1.4) * 1.15;
      var r = (i / layers) * maxR + v2 * (maxR / layers) * 2.4;
      var h = (hueBase + i * 4.5 + t * 12) % 360;
      var alpha = 0.2 + v2 * 0.6;
      ctx.strokeStyle = hsv(h, 85, 65 + v2 * 35).replace('rgb(', 'rgba(').replace(')', ',' + alpha.toFixed(3) + ')');
      ctx.lineWidth = 1 + v2 * 2.2;
      ctx.beginPath();
      if (i % 2 === 0) {
        ctx.arc(cx, cy, Math.max(1, r), 0, Math.PI * 2);
        ctx.stroke();
      } else {
        var rot = t * 0.35 + i * 0.6;
        for (var s = 0; s < 6; s++) {
          var a0 = s * (Math.PI / 3) + rot;
          ctx.arc(cx, cy, Math.max(1, r), a0, a0 + Math.PI / 3);
          ctx.stroke();
        }
      }
    }
    var pulse = 18 + 6 * Math.sin(t * 2.2) + (freq[0] || 0) * 20;
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, pulse);
    g.addColorStop(0, 'rgba(255,255,255,0.9)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, pulse, 0, Math.PI * 2);
    ctx.fill();
  }

  function spawnParticles(freq, t, dt, cx, cy) {
    var energy = 0;
    var bandLen = Math.min(freq.length, 64);
    for (var i = 0; i < bandLen; i++) energy += freq[i];
    energy /= bandLen;
    var hasLive = analyser && (isPlaying || micActive);
    var target = hasLive ? Math.floor(energy * 14) + 2 : 1;
    if (hasLive && Math.random() < energy * 2.2) target += 1;
    for (var s = 0; s < target && particles.length < PART_MAX; s++) {
      var ang = Math.random() * Math.PI * 2;
      var sp = 40 + Math.random() * (60 + energy * 380);
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        life: 1,
        decay: 0.35 + Math.random() * 1.3 + energy * 1.5,
        size: 1 + Math.random() * (2 + energy * 6),
        hue: (hueBase + Math.random() * 90 + t * 20) % 360
      });
    }
  }

  function drawParticles(freq, t, dt) {
    var cx = W / 2, cy = H / 2;
    ctx.clearRect(0, 0, W, H);
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(W, H) * 0.5);
    g.addColorStop(0, 'rgba(12,14,34,0.6)');
    g.addColorStop(1, 'rgba(5,6,15,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    spawnParticles(freq, t, dt, cx, cy);

    var keep = [];
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= Math.pow(0.95, dt * 60);
      p.vy *= Math.pow(0.97, dt * 60);
      p.life -= p.decay * dt;
      var swirl = 40 * dt * Math.sin(t * 0.8 + p.y * 0.01);
      p.x += Math.sin(t * 2 + p.life * 6) * swirl * 0.2;
      p.y += Math.cos(t * 2 + p.life * 6) * swirl * 0.2;
      if (p.life > 0 && p.x > -20 && p.x < W + 20 && p.y > -20 && p.y < H + 20) {
        keep.push(p);
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
        ctx.fillStyle = hsv(p.hue, 85, 80);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (0.4 + p.life * 0.6), 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    particles = keep;
  }

  var last = performance.now();
  var tGlobal = 0;

  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    tGlobal += dt;
    var t = tGlobal;
    var freq = normFreq();

    if (mode === 'bars') drawBars(freq, t, dt);
    else if (mode === 'rings') drawRings(freq, t, dt);
    else drawParticles(freq, t, dt);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
  updatePlayBtn();
})();
</script>
</body>
</html>
