<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Shooter</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #game {
    display: block;
    margin: 0 auto;
    background:
      radial-gradient(ellipse at 50% 120%, #101a3a 0%, #05070f 60%, #000 100%);
    outline: none;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600" tabindex="0"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = canvas.width;
  var H = canvas.height;

  // ---------- State ----------
  var STATE_START = 'start';
  var STATE_PLAYING = 'playing';
  var STATE_GAME_OVER = 'gameover';
  var state = STATE_START;

  var keys = {};
  var score = 0;
  var lives = 3;
  var frame = 0;

  var player = null;
  var bullets = [];
  var enemyBullets = [];
  var enemies = [];
  var explosions = [];
  var stars = [];

  var ENEMY_SPAWN_INTERVAL = 70;   // frames between spawns
  var spawnTimer = 0;
  var difficulty = 1;              // grows over time

  // ---------- Helpers ----------
  function rand(min, max) {
    return min + Math.random() * (max - min);
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w &&
           a.x + a.w > b.x &&
           a.y < b.y + b.h &&
           a.y + a.h > b.y;
  }

  // ---------- Stars background ----------
  function initStars() {
    stars = [];
    for (var i = 0; i < 90; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        size: rand(0.5, 2),
        speed: rand(0.4, 2)
      });
    }
  }

  function updateStars() {
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.y += s.speed;
      if (s.y > H) {
        s.y = -2;
        s.x = Math.random() * W;
      }
    }
  }

  function drawStars() {
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.fillStyle = 'rgba(255,255,255,' + (0.3 + s.speed / 3) + ')';
      ctx.fillRect(s.x, s.y, s.size, s.size);
    }
  }

  // ---------- Player ----------
  function makePlayer() {
    return {
      w: 36,
      h: 30,
      x: W / 2 - 18,
      y: H - 60,
      speed: 5,
      cooldown: 0,
      invincible: 0
    };
  }

  function updatePlayer() {
    var p = player;
    var dx = 0, dy = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
    if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
    if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
    if (keys['ArrowDown'] || keys['KeyS']) dy += 1;
    if (dx !== 0 && dy !== 0) {
      dx *= 0.7071;
      dy *= 0.7071;
    }
    p.x += dx * p.speed;
    p.y += dy * p.speed;
    p.x = Math.max(0, Math.min(W - p.w, p.x));
    p.y = Math.max(0, Math.min(H - p.h - 10, p.y));

    if (p.cooldown > 0) p.cooldown--;
    if ((keys['Space']) && p.cooldown <= 0) {
      bullets.push({ x: p.x + p.w / 2 - 2, y: p.y - 10, w: 4, h: 12, vy: -9 });
      p.cooldown = 12;
    }
    if (p.invincible > 0) p.invincible--;
  }

  function drawPlayer() {
    var p = player;
    if (p.invincible > 0 && Math.floor(frame / 4) % 2 === 0) return; // blink

    ctx.save();
    var cx = p.x + p.w / 2;
    var cy = p.y + p.h / 2;

    // engine flame
    var flameLen = 8 + Math.sin(frame * 0.5) * 3;
    var grad = ctx.createLinearGradient(cx, cy + p.h / 2, cx, cy + p.h / 2 + flameLen + 6);
    grad.addColorStop(0, '#ffd24a');
    grad.addColorStop(1, 'rgba(255,80,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(cx - 5, cy + p.h / 2);
    ctx.lineTo(cx + 5, cy + p.h / 2);
    ctx.lineTo(cx, cy + p.h / 2 + flameLen + 6);
    ctx.closePath();
    ctx.fill();

    // ship body
    ctx.fillStyle = '#4fc3f7';
    ctx.beginPath();
    ctx.moveTo(cx, cy - p.h / 2);          // nose
    ctx.lineTo(cx + p.w / 2, cy + p.h / 2); // right wing
    ctx.lineTo(cx + p.w / 6, cy + p.h / 3);
    ctx.lineTo(cx - p.w / 6, cy + p.h / 3);
    ctx.lineTo(cx - p.w / 2, cy + p.h / 2); // left wing
    ctx.closePath();
    ctx.fill();

    // cockpit
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(cx, cy, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ---------- Bullets ----------
  function updateBullets() {
    var i;
    for (i = bullets.length - 1; i >= 0; i--) {
      bullets[i].y += bullets[i].vy;
      if (bullets[i].y + bullets[i].h < 0) bullets.splice(i, 1);
    }
    for (i = enemyBullets.length - 1; i >= 0; i--) {
      enemyBullets[i].y += enemyBullets[i].vy;
      if (enemyBullets[i].y > H) enemyBullets.splice(i, 1);
    }
  }

  function drawBullets() {
    var i;
    ctx.fillStyle = '#ffe066';
    for (i = 0; i < bullets.length; i++) {
      ctx.fillRect(bullets[i].x, bullets[i].y, bullets[i].w, bullets[i].h);
    }
    ctx.fillStyle = '#ff5c7a';
    for (i = 0; i < enemyBullets.length; i++) {
      ctx.fillRect(enemyBullets[i].x, enemyBullets[i].y, enemyBullets[i].w, enemyBullets[i].h);
    }
  }

  // ---------- Enemies ----------
  function spawnEnemy() {
    var roll = Math.random();
    var type;
    if (roll < 0.15 && difficulty > 1.4) type = 'zigzag';
    else if (roll < 0.3 && difficulty > 1.8) type = 'shooter';
    else type = 'drifter';

    var w, h, hp, color, speed, vx;
    switch (type) {
      case 'zigzag':
        w = 34; h = 26; hp = 1; color = '#b388ff';
        speed = rand(1.6, 2.4) * Math.sqrt(difficulty);
        vx = rand(1.5, 2.5) * (Math.random() < 0.5 ? -1 : 1);
        break;
      case 'shooter':
        w = 40; h = 32; hp = 2; color = '#ff8a65';
        speed = rand(0.9, 1.4) * Math.sqrt(difficulty);
        vx = 0;
        break;
      default:
        w = 34; h = 28; hp = 1; color = '#ef5350';
        speed = rand(1.2, 2.2) * Math.sqrt(difficulty);
        vx = rand(-0.6, 0.6);
    }
    enemies.push({
      type: type,
      x: rand(10, W - w - 10),
      y: -h,
      w: w,
      h: h,
      hp: hp,
      color: color,
      vy: speed,
      vx: vx,
      fireTimer: rand(40, 100),
      t: 0
    });
  }

  function updateEnemies() {
    var i, e;
    spawnTimer--;
    if (spawnTimer <= 0) {
      spawnEnemy();
      spawnTimer = Math.max(20, ENEMY_SPAWN_INTERVAL / difficulty);
    }
    if (frame % 300 === 0) difficulty += 0.08;

    for (i = enemies.length - 1; i >= 0; i--) {
      e = enemies[i];
      e.t++;
      e.y += e.vy;
      if (e.type === 'zigzag') {
        e.x += e.vx;
        if (e.x < 0 || e.x + e.w > W) e.vx *= -1;
      } else {
        e.x += e.vx;
        if (e.x < 0 || e.x + e.w > W) { e.vx *= -1; e.x = Math.max(0, Math.min(W - e.w, e.x)); }
      }

      // shooters fire
      if (e.type === 'shooter' && state === STATE_PLAYING) {
        e.fireTimer--;
        if (e.fireTimer <= 0 && e.y > 0) {
          enemyBullets.push({ x: e.x + e.w / 2 - 2, y: e.y + e.h, w: 4, h: 10, vy: 4 + difficulty });
          e.fireTimer = rand(60, 130);
        }
      }

      // reached the bottom
      if (e.y > H) {
        enemies.splice(i, 1);
        continue;
      }

      // collide with player
      if (player.invincible <= 0 && rectsOverlap(e, player)) {
        explode(e.x + e.w / 2, e.y + e.h / 2, e.color);
        enemies.splice(i, 1);
        hitPlayer();
        continue;
      }

      // collide with player bullets
      var j;
      for (j = bullets.length - 1; j >= 0; j--) {
        if (rectsOverlap(e, bullets[j])) {
          bullets.splice(j, 1);
          e.hp--;
          if (e.hp <= 0) {
            explode(e.x + e.w / 2, e.y + e.h / 2, e.color);
            enemies.splice(i, 1);
            score += e.type === 'shooter' ? 250 : (e.type === 'zigzag' ? 150 : 100);
          } else {
            explode(e.x + bullets[j].w, e.y + e.h / 2, '#ffffff', true); // small hit flash
            score += 10;
          }
          break;
        }
      }
    }
  }

  function drawEnemy(e) {
    ctx.save();
    var cx = e.x + e.w / 2;
    var cy = e.y + e.h / 2;
    ctx.fillStyle = e.color;
    if (e.type === 'shooter') {
      // wide saucer
      ctx.beginPath();
      ctx.moveTo(cx - e.w / 2, cy);
      ctx.lineTo(cx - e.w / 4, cy - e.h / 2);
      ctx.lineTo(cx + e.w / 4, cy - e.h / 2);
      ctx.lineTo(cx + e.w / 2, cy);
      ctx.lineTo(cx + e.w / 4, cy + e.h / 2);
      ctx.lineTo(cx - e.w / 4, cy + e.h / 2);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ffe082';
      ctx.fillRect(cx - 4, cy - 3, 8, 6);
    } else {
      // inverted triangle
      ctx.beginPath();
      ctx.moveTo(cx, cy + e.h / 2);          // nose points down
      ctx.lineTo(cx + e.w / 2, cy - e.h / 2);
      ctx.lineTo(cx - e.w / 2, cy - e.h / 2);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(cx - 5, cy - e.h / 2 + 4, 10, 5);
    }
    ctx.restore();
  }

  // ---------- Explosions ----------
  function explode(x, y, color, small) {
    var count = small ? 6 : 22;
    var speedMax = small ? 3 : 6;
    for (var i = 0; i < count; i++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = rand(0.5, speedMax);
      explosions.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: small ? 12 : rand(20, 40),
        maxLife: small ? 12 : 40,
        size: small ? rand(1, 2.5) : rand(2, 5),
        color: Math.random() < 0.35 ? '#ffcc00' : color
      });
    }
    if (!small) shockwaves.push({ x: x, y: y, r: 4, life: 18 });
  }

  var shockwaves = [];

  function updateEffects() {
    var i;
    for (i = explosions.length - 1; i >= 0; i--) {
      var p = explosions[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.96;
      p.vy *= 0.96;
      p.life--;
      if (p.life <= 0) explosions.splice(i, 1);
    }
    for (i = shockwaves.length - 1; i >= 0; i--) {
      var s = shockwaves[i];
      s.r += 3.5;
      s.life--;
      if (s.life <= 0) shockwaves.splice(i, 1);
    }
  }

  function drawEffects() {
    var i;
    for (i = 0; i < explosions.length; i++) {
      var p = explosions[i];
      var alpha = p.life / p.maxLife;
      ctx.globalAlpha = Math.max(0, alpha);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    for (i = 0; i < shockwaves.length; i++) {
      var s = shockwaves[i];
      ctx.strokeStyle = 'rgba(255,220,120,' + (s.life / 18 * 0.8) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.lineWidth = 1;
  }

  // ---------- Player hit / game over ----------
  function hitPlayer() {
    lives--;
    explode(player.x + player.w / 2, player.y + player.h / 2, '#4fc3f7');
    if (lives <= 0) {
      state = STATE_GAME_OVER;
    } else {
      player.invincible = 120;
      player.x = W / 2 - player.w / 2;
      player.y = H - 60;
    }
  }

  function updateEnemyBulletsVsPlayer() {
    for (var i = enemyBullets.length - 1; i >= 0; i--) {
      if (player.invincible <= 0 && rectsOverlap(enemyBullets[i], player)) {
        enemyBullets.splice(i, 1);
        hitPlayer();
      }
    }
  }

  // ---------- Drawing overlays ----------
  function drawHUD() {
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE ' + score, 16, 32);

    // lives as small ship glyphs
    for (var i = 0; i < lives; i++) {
      var lx = W - 30 - i * 26;
      var ly = 24;
      ctx.fillStyle = '#4fc3f7';
      ctx.beginPath();
      ctx.moveTo(lx, ly - 10);
      ctx.lineTo(lx + 9, ly + 8);
      ctx.lineTo(lx - 9, ly + 8);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawCenterText(lines) {
    ctx.textAlign = 'center';
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i];
      ctx.font = l.font;
      ctx.fillStyle = l.color;
      if (l.pulse) {
        var a = 0.55 + 0.45 * Math.abs(Math.sin(frame * 0.05));
        ctx.globalAlpha = a;
      }
      ctx.fillText(l.text, W / 2, l.y);
      ctx.globalAlpha = 1;
    }
    ctx.textAlign = 'left';
  }

  function drawStartScreen() {
    ctx.fillStyle = 'rgba(0,0,10,0.55)';
    ctx.fillRect(0, 0, W, H);
    drawCenterText([
      { text: 'SPACE SHOOTER', font: 'bold 52px monospace', color: '#4fc3f7', y: H / 2 - 70 },
      { text: 'Arrow Keys or WASD to move', font: '20px monospace', color: '#cfd8dc', y: H / 2 },
      { text: 'Space to shoot', font: '20px monospace', color: '#cfd8dc', y: H / 2 + 34 },
      { text: 'PRESS ENTER OR SPACE TO START', font: 'bold 24px monospace', color: '#ffe066', y: H / 2 + 110, pulse: true }
    ]);
  }

  function drawGameOverScreen() {
    ctx.fillStyle = 'rgba(0,0,10,0.6)';
    ctx.fillRect(0, 0, W, H);
    drawCenterText([
      { text: 'GAME OVER', font: 'bold 56px monospace', color: '#ef5350', y: H / 2 - 50 },
      { text: 'Final Score: ' + score, font: 'bold 28px monospace', color: '#ffffff', y: H / 2 + 10 },
      { text: 'PRESS ENTER TO PLAY AGAIN', font: 'bold 22px monospace', color: '#ffe066', y: H / 2 + 80, pulse: true }
    ]);
  }

  // ---------- Input ----------
  window.addEventListener('keydown', function (ev) {
    keys[ev.code] = true;
    if (ev.code === 'Space' || ev.code.indexOf('Arrow') === 0) ev.preventDefault();

    if (state === STATE_START && (ev.code === 'Enter' || ev.code === 'Space')) {
      startGame();
    } else if (state === STATE_GAME_OVER && ev.code === 'Enter') {
      startGame();
    }
  });

  window.addEventListener('keyup', function (ev) {
    keys[ev.code] = false;
  });

  function startGame() {
    score = 0;
    lives = 3;
    difficulty = 1;
    spawnTimer = ENEMY_SPAWN_INTERVAL;
    bullets = [];
    enemyBullets = [];
    enemies = [];
    explosions = [];
    shockwaves = [];
    player = makePlayer();
    state = STATE_PLAYING;
  }

  // ---------- Main loop ----------
  function update() {
    frame++;
    updateStars();
    updateEffects();
    if (state === STATE_PLAYING) {
      updatePlayer();
      updateBullets();
      updateEnemies();
      updateEnemyBulletsVsPlayer();
    }
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawStars();
    if (state === STATE_PLAYING) {
      drawBullets();
      for (var i = 0; i < enemies.length; i++) drawEnemy(enemies[i]);
      drawPlayer();
    }
    drawEffects();
    if (state === STATE_PLAYING) {
      drawHUD();
    } else if (state === STATE_START) {
      drawStartScreen();
    } else if (state === STATE_GAME_OVER) {
      drawHUD();
      drawGameOverScreen();
    }
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  // ---------- Boot ----------
  initStars();
  player = makePlayer(); // exists so rendering never touches an undefined object
  loop();
})();
</script>
</body>
</html>
