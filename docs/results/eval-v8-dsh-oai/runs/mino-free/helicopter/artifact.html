<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Helicopter Simulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 0; left: 0; width: 100%; pointer-events: none; z-index: 10;
    display: flex; justify-content: space-between; padding: 15px 25px;
  }
  .hud-panel {
    background: rgba(0, 15, 0, 0.75); border: 1px solid rgba(0, 255, 0, 0.4);
    border-radius: 4px; padding: 12px 18px; color: #0f0; font-size: 13px;
    line-height: 1.7; min-width: 160px; text-shadow: 0 0 4px rgba(0,255,0,0.3);
  }
  .hud-panel h3 {
    font-size: 11px; color: #0a0; border-bottom: 1px solid rgba(0,255,0,0.3);
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 2px;
  }
  .hud-val { color: #0ff; }
  .hud-warn { color: #ff0; }
  .hud-danger { color: #f44; }
  #controls-help {
    position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
    background: rgba(0, 15, 0, 0.7); border: 1px solid rgba(0, 255, 0, 0.3);
    border-radius: 4px; padding: 8px 16px; color: #0c0; font-size: 11px;
    pointer-events: none; z-index: 10; text-align: center; line-height: 1.5;
    letter-spacing: 1px;
  }
  #throttle-bar {
    position: fixed; right: 30px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 200px; background: rgba(0,0,0,0.6);
    border: 1px solid rgba(0,255,0,0.3); border-radius: 3px;
    pointer-events: none; z-index: 10;
  }
  #throttle-fill {
    position: absolute; bottom: 0; width: 100%; background: linear-gradient(to top, #0a0, #0f0);
    border-radius: 0 0 2px 2px; transition: height 0.1s;
  }
  #throttle-label {
    position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
    color: #0f0; font-size: 9px; font-family: 'Courier New', monospace;
  }
  #crosshair {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    pointer-events: none; z-index: 5;
  }
</style>
</head>
<body>
<div id="hud">
  <div class="hud-panel" id="hud-left">
    <h3>Flight Data</h3>
    <div>ALT: <span class="hud-val" id="hud-alt">0</span> m</div>
    <div>SPD: <span class="hud-val" id="hud-spd">0</span> m/s</div>
    <div>HDG: <span class="hud-val" id="hud-hdg">0</span>°</div>
    <div>V/S: <span class="hud-val" id="hud-vs">0</span> m/s</div>
  </div>
  <div class="hud-panel" id="hud-right">
    <h3>Systems</h3>
    <div>RPM: <span class="hud-val" id="hud-rpm">0</span></div>
    <div>THR: <span class="hud-val" id="hud-thr">0</span>%</div>
    <div>COL: <span class="hud-val" id="hud-col">0</span>%</div>
    <div>ENG: <span class="hud-val" id="hud-eng">IDLE</span></div>
  </div>
</div>
<div id="throttle-bar">
  <div id="throttle-fill" style="height:20%"></div>
  <div id="throttle-label">THR</div>
</div>
<svg id="crosshair" width="40" height="40" viewBox="0 0 40 40">
  <line x1="20" y1="5" x2="20" y2="15" stroke="#0f0" stroke-width="1" opacity="0.5"/>
  <line x1="20" y1="25" x2="20" y2="35" stroke="#0f0" stroke-width="1" opacity="0.5"/>
  <line x1="5" y1="20" x2="15" y2="20" stroke="#0f0" stroke-width="1" opacity="0.5"/>
  <line x1="25" y1="20" x2="35" y2="20" stroke="#0f0" stroke-width="1" opacity="0.5"/>
  <circle cx="20" cy="20" r="3" fill="none" stroke="#0f0" stroke-width="0.8" opacity="0.4"/>
</svg>
<div id="controls-help">
  W/S PITCH &nbsp;|&nbsp; A/D ROLL &nbsp;|&nbsp; Q/E YAW &nbsp;|&nbsp;
  SPACE COLLECTIVE UP &nbsp;|&nbsp; SHIFT COLLECTIVE DOWN &nbsp;|&nbsp;
  ↑↓ THROTTLE &nbsp;|&nbsp; R ENGINE START/STOP
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── Scene Setup ───────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.FogExp2(0x87CEEB, 0.0015);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 8, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.85;
controls.minDistance = 5;
controls.maxDistance = 80;
controls.target.set(0, 3, 0);

// ─── Lighting ──────────────────────────────────────────────────────
const ambientLight = new THREE.AmbientLight(0x6688aa, 0.6);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffeedd, 1.8);
sunLight.position.set(50, 80, 30);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far = 300;
sunLight.shadow.camera.left = -60;
sunLight.shadow.camera.right = 60;
sunLight.shadow.camera.top = 60;
sunLight.shadow.camera.bottom = -60;
scene.add(sunLight);

const hemiLight = new THREE.HemisphereLight(0x88bbff, 0x445522, 0.5);
scene.add(hemiLight);

// ─── Ground / Terrain ─────────────────────────────────────────────
const groundGeo = new THREE.PlaneGeometry(800, 800, 200, 200);
const posAttr = groundGeo.getAttribute('position');
for (let i = 0; i < posAttr.count; i++) {
  const x = posAttr.getX(i);
  const y = posAttr.getY(i);
  let h = 0;
  h += Math.sin(x * 0.012) * 3 + Math.cos(y * 0.015) * 2.5;
  h += Math.sin(x * 0.03 + y * 0.02) * 1.5;
  h += Math.cos(x * 0.06) * Math.sin(y * 0.05) * 0.8;
  posAttr.setZ(i, h);
}
groundGeo.computeVertexNormals();
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x3a7a3a, roughness: 0.9, metalness: 0.0,
  flatShading: true
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Helipad
const padGeo = new THREE.CylinderGeometry(4, 4, 0.08, 32);
const padMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.7 });
const helipad = new THREE.Mesh(padGeo, padMat);
helipad.position.set(0, 0.04, 0);
helipad.receiveShadow = true;
scene.add(helipad);

const hGeo = new THREE.RingGeometry(1.2, 1.8, 32);
const hMat = new THREE.MeshStandardMaterial({ color: 0xffdd00, roughness: 0.5 });
const hMark = new THREE.Mesh(hGeo, hMat);
hMark.rotation.x = -Math.PI / 2;
hMark.position.set(0, 0.1, 0);
scene.add(hMark);

// H letter on pad
const hShape = new THREE.Shape();
hShape.moveTo(-0.6, -1); hShape.lineTo(-0.6, 1);
hShape.lineTo(-0.3, 1); hShape.lineTo(-0.3, 0.1);
hShape.lineTo(0.3, 0.1); hShape.lineTo(0.3, 1);
hShape.lineTo(0.6, 1); hShape.lineTo(0.6, -1);
hShape.lineTo(0.3, -1); hShape.lineTo(0.3, -0.1);
hShape.lineTo(-0.3, -0.1); hShape.lineTo(-0.3, -1);
const hTextGeo = new THREE.ExtrudeGeometry(hShape, { depth: 0.05, bevelEnabled: false });
const hTextMat = new THREE.MeshStandardMaterial({ color: 0xffdd00 });
const hText = new THREE.Mesh(hTextGeo, hTextMat);
hText.rotation.x = -Math.PI / 2;
hText.position.set(0, 0.12, 0);
scene.add(hText);

// Some trees
function createTree(x, z) {
  const trunkH = 3 + Math.random() * 3;
  const trunkGeo = new THREE.CylinderGeometry(0.2, 0.35, trunkH, 6);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c3a1e, roughness: 0.9 });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  const ty = getTerrainHeight(x, z) + trunkH / 2;
  trunk.position.set(x, ty, z);
  trunk.castShadow = true;
  scene.add(trunk);

  const crownR = 1.5 + Math.random() * 2;
  const crownGeo = new THREE.SphereGeometry(crownR, 8, 6);
  const crownMat = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(0.28 + Math.random() * 0.08, 0.6, 0.25 + Math.random() * 0.1),
    roughness: 0.85, flatShading: true
  });
  const crown = new THREE.Mesh(crownGeo, crownMat);
  crown.position.set(x, ty + trunkH / 2 + crownR * 0.5, z);
  crown.castShadow = true;
  scene.add(crown);
}

function getTerrainHeight(x, z) {
  let h = 0;
  h += Math.sin(x * 0.012) * 3 + Math.cos(z * 0.015) * 2.5;
  h += Math.sin(x * 0.03 + z * 0.02) * 1.5;
  h += Math.cos(x * 0.06) * Math.sin(z * 0.05) * 0.8;
  return h;
}

for (let i = 0; i < 80; i++) {
  const angle = Math.random() * Math.PI * 2;
  const dist = 30 + Math.random() * 250;
  createTree(Math.cos(angle) * dist, Math.sin(angle) * dist);
}

// ─── Helicopter Model ──────────────────────────────────────────────
const helicopter = new THREE.Group();

// Materials
const bodyMat = new THREE.MeshStandardMaterial({ color: 0xcc2222, roughness: 0.35, metalness: 0.3 });
const bodyDarkMat = new THREE.MeshStandardMaterial({ color: 0x991111, roughness: 0.4, metalness: 0.2 });
const glassMat = new THREE.MeshStandardMaterial({
  color: 0x88ccff, roughness: 0.05, metalness: 0.3, transparent: true, opacity: 0.5
});
const metalMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.2, metalness: 0.7 });
const darkMetalMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.3, metalness: 0.6 });
const skidMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.4, metalness: 0.5 });
const bladeMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.3, metalness: 0.5 });
const whiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });

// Fuselage - main body
const fuselageGeo = new THREE.CylinderGeometry(0.9, 1.0, 4.5, 16);
fuselageGeo.rotateZ(Math.PI / 2);
const fuselage = new THREE.Mesh(fuselageGeo, bodyMat);
fuselage.castShadow = true;
helicopter.add(fuselage);

// Nose cone
const noseGeo = new THREE.SphereGeometry(0.95, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2);
const nose = new THREE.Mesh(noseGeo, bodyMat);
nose.rotation.z = -Math.PI / 2;
nose.position.set(2.5, 0, 0);
nose.castShadow = true;
helicopter.add(nose);

// Top dome
const domeGeo = new THREE.SphereGeometry(0.65, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2);
const dome = new THREE.Mesh(domeGeo, bodyDarkMat);
dome.position.set(0, 0.85, 0);
dome.castShadow = true;
helicopter.add(dome);

// Cockpit glass
const cockpitGeo = new THREE.SphereGeometry(0.88, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.55);
const cockpit = new THREE.Mesh(cockpitGeo, glassMat);
cockpit.position.set(1.5, 0.35, 0);
cockpit.rotation.z = -0.2;
helicopter.add(cockpit);

// Cockpit frame lines
for (let i = 0; i < 4; i++) {
  const frameGeo = new THREE.TorusGeometry(0.89, 0.02, 4, 16);
  const frame = new THREE.Mesh(frameGeo, darkMetalMat);
  frame.position.set(1.5, 0.35, 0);
  frame.rotation.y = (i / 4) * Math.PI;
  frame.rotation.z = -0.2;
  helicopter.add(frame);
}

// Tail boom
const boomGeo = new THREE.CylinderGeometry(0.15, 0.25, 4.5, 8);
boomGeo.rotateZ(Math.PI / 2);
const boom = new THREE.Mesh(boomGeo, bodyMat);
boom.position.set(-4.5, 0.3, 0);
boom.castShadow = true;
helicopter.add(boom);

// Tail fin vertical
const tailFinGeo = new THREE.BoxGeometry(0.08, 1.4, 0.5);
const tailFin = new THREE.Mesh(tailFinGeo, bodyDarkMat);
tailFin.position.set(-6.7, 1.0, 0);
tailFin.castShadow = true;
helicopter.add(tailFin);

// Tail fin horizontal
const tailHFinGeo = new THREE.BoxGeometry(0.08, 0.4, 1.2);
const tailHFin = new THREE.Mesh(tailHFinGeo, bodyDarkMat);
tailHFin.position.set(-6.7, 0.4, 0);
tailHFin.castShadow = true;
helicopter.add(tailHFin);

// Tail rotor housing
const tailRotorMountGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.15, 8);
tailRotorMountGeo.rotateX(Math.PI / 2);
const tailRotorMount = new THREE.Mesh(tailRotorMountGeo, metalMat);
tailRotorMount.position.set(-6.7, 0.9, 0.35);
helicopter.add(tailRotorMount);

// Tail rotor (2-blade)
const tailRotorGroup = new THREE.Group();
tailRotorGroup.position.set(-6.7, 0.9, 0.42);
helicopter.add(tailRotorGroup);

for (let i = 0; i < 2; i++) {
  const tBladeGeo = new THREE.BoxGeometry(0.04, 0.65, 0.12);
  const tBlade = new THREE.Mesh(tBladeGeo, bladeMat);
  tBlade.rotation.x = (i / 2) * Math.PI;
  tBlade.castShadow = true;
  tailRotorGroup.add(tBlade);
}
// Tail rotor hub
const tHubGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.1, 8);
tHubGeo.rotateX(Math.PI / 2);
const tHub = new THREE.Mesh(tHubGeo, darkMetalMat);
tailRotorGroup.add(tHub);

// Engine exhaust
const exhaustGeo = new THREE.CylinderGeometry(0.12, 0.15, 0.6, 8);
const exhaust = new THREE.Mesh(exhaustGeo, darkMetalMat);
exhaust.position.set(0.5, 1.1, 0.3);
exhaust.rotation.z = 0.3;
helicopter.add(exhaust);

const exhaustGeo2 = new THREE.CylinderGeometry(0.12, 0.15, 0.6, 8);
const exhaust2 = new THREE.Mesh(exhaustGeo2, darkMetalMat);
exhaust2.position.set(0.5, 1.1, -0.3);
exhaust2.rotation.z = 0.3;
helicopter.add(exhaust2);

// Main rotor mast
const mastGeo = new THREE.CylinderGeometry(0.1, 0.12, 0.5, 8);
const mast = new THREE.Mesh(mastGeo, metalMat);
mast.position.set(0, 1.35, 0);
helicopter.add(mast);

// Main rotor hub
const mainHubGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.15, 12);
const mainHub = new THREE.Mesh(mainHubGeo, darkMetalMat);
mainHub.position.set(0, 1.65, 0);
helicopter.add(mainHub);

// Main rotor group (4 blades)
const mainRotorGroup = new THREE.Group();
mainRotorGroup.position.set(0, 1.72, 0);
helicopter.add(mainRotorGroup);

for (let i = 0; i < 4; i++) {
  const bladeGroup = new THREE.Group();
  bladeGroup.rotation.y = (i / 4) * Math.PI * 2;

  const bladeGeo = new THREE.BoxGeometry(0.18, 0.03, 5.5);
  const blade = new THREE.Mesh(bladeGeo, bladeMat);
  blade.position.set(0, 0, 2.8);
  blade.castShadow = true;
  bladeGroup.add(blade);

  // Blade tip
  const tipGeo = new THREE.BoxGeometry(0.12, 0.02, 0.4);
  const tip = new THREE.Mesh(tipGeo, whiteMat);
  tip.position.set(0, 0, 5.55);
  bladeGroup.add(tip);

  // Blade root fairing
  const rootGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.3, 6);
  const root = new THREE.Mesh(rootGeo, metalMat);
  root.position.set(0, 0, 0.2);
  root.rotation.x = Math.PI / 2;
  bladeGroup.add(root);

  mainRotorGroup.add(bladeGroup);
}

// Landing skids
function createSkid(zOff) {
  const skidGroup = new THREE.Group();

  // Horizontal skid tube
  const skidGeo = new THREE.CylinderGeometry(0.05, 0.05, 4.2, 8);
  skidGeo.rotateZ(Math.PI / 2);
  const skid = new THREE.Mesh(skidGeo, skidMat);
  skid.position.set(-0.2, -1.35, zOff);
  skid.castShadow = true;
  skidGroup.add(skid);

  // Skid tips (curved up)
  const tipGeo = new THREE.TorusGeometry(0.2, 0.04, 6, 8, Math.PI / 2);
  const tipF = new THREE.Mesh(tipGeo, skidMat);
  tipF.rotation.y = Math.PI;
  tipF.rotation.x = Math.PI / 2;
  tipF.position.set(1.9, -1.25, zOff);
  skidGroup.add(tipF);

  const tipB = new THREE.Mesh(tipGeo, skidMat);
  tipB.rotation.x = Math.PI / 2;
  tipB.position.set(-2.3, -1.25, zOff);
  skidGroup.add(tipB);

  // Struts
  for (let sx = -1; sx <= 1; sx += 2) {
    const strutGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.65, 6);
    const strut = new THREE.Mesh(strutGeo, metalMat);
    strut.position.set(sx * 1.0, -1.0, zOff);
    strut.rotation.z = sx * 0.15;
    skidGroup.add(strut);

    // Cross brace
    const braceGeo = new THREE.CylinderGeometry(0.025, 0.025, 0.5, 6);
    const brace = new THREE.Mesh(braceGeo, metalMat);
    brace.position.set(sx * 0.7, -1.05, zOff);
    brace.rotation.z = sx * 0.5;
    skidGroup.add(brace);
  }

  return skidGroup;
}

helicopter.add(createSkid(0.85));
helicopter.add(createSkid(-0.85));

// Belly plate
const bellyGeo = new THREE.BoxGeometry(2.5, 0.08, 1.4);
const belly = new THREE.Mesh(bellyGeo, darkMetalMat);
belly.position.set(0, -0.88, 0);
helicopter.add(belly);

// Navigation lights
const navLightRed = new THREE.PointLight(0xff0000, 0.5, 5);
navLightRed.position.set(-0.5, 0, 1.0);
helicopter.add(navLightRed);
const navRedBulb = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 6),
  new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 0.8 }));
navRedBulb.position.copy(navLightRed.position);
helicopter.add(navRedBulb);

const navLightGreen = new THREE.PointLight(0x00ff00, 0.5, 5);
navLightGreen.position.set(-0.5, 0, -1.0);
helicopter.add(navLightGreen);
const navGreenBulb = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 6),
  new THREE.MeshStandardMaterial({ color: 0x00ff00, emissive: 0x00ff00, emissiveIntensity: 0.8 }));
navGreenBulb.position.copy(navLightGreen.position);
helicopter.add(navGreenBulb);

// Position helicopter
helicopter.position.set(0, 4, 0);
scene.add(helicopter);

// ─── Particle exhaust effect ──────────────────────────────────────
const exhaustParticles = [];
function createExhaustParticle() {
  if (!state.engineRunning || state.throttle < 0.1) return;
  const geo = new THREE.SphereGeometry(0.05 + Math.random() * 0.05, 4, 4);
  const mat = new THREE.MeshBasicMaterial({ color: 0x999999, transparent: true, opacity: 0.3 });
  const p = new THREE.Mesh(geo, mat);
  const wPos = new THREE.Vector3();
  exhaust.getWorldPosition(wPos);
  p.position.copy(wPos);
  p.userData.vel = new THREE.Vector3(
    (Math.random() - 0.5) * 0.3,
    0.5 + Math.random() * 0.3,
    (Math.random() - 0.5) * 0.3
  );
  p.userData.life = 1.0;
  scene.add(p);
  exhaustParticles.push(p);
}

// ─── Physics State ─────────────────────────────────────────────────
const state = {
  position: new THREE.Vector3(0, 4, 0),
  velocity: new THREE.Vector3(0, 0, 0),
  rotation: new THREE.Euler(0, 0, 0, 'YXZ'),
  angularVelocity: new THREE.Vector3(0, 0, 0),

  // Engine
  engineRunning: false,
  throttle: 0.2,
  collective: 0.0,
  targetRPM: 0,
  rpm: 0,
  maxRPM: 600,

  // Controls
  pitch: 0,
  roll: 0,
  yaw: 0,
  collectiveInput: 0,

  // Hover bob
  bobPhase: 0,
  bobAmount: 0,

  // Camera
  camDistance: 18,
  camAngle: 0,
  camHeight: 6,
};

const HELI_MASS = 1200;
const MAIN_ROTOR_AREA = Math.PI * 5.5 * 5.5;
const MAX_LIFT = HELI_MASS * 9.81 * 1.3;
const GRAVITY = 9.81;
const DRAG_COEFF = 0.5;
const PITCH_RATE = 1.2;
const ROLL_RATE = 1.5;
const YAW_RATE = 0.8;
const TORQUE_FACTOR = 0.03;

// ─── Input ─────────────────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'KeyR') {
    state.engineRunning = !state.engineRunning;
    if (!state.engineRunning) {
      state.throttle = 0;
      state.collective = 0;
    }
  }
  e.preventDefault();
});
window.addEventListener('keyup', (e) => {
  keys[e.code] = false;
  e.preventDefault();
});

// ─── HUD Elements ──────────────────────────────────────────────────
const hudAlt = document.getElementById('hud-alt');
const hudSpd = document.getElementById('hud-spd');
const hudHdg = document.getElementById('hud-hdg');
const hudVs = document.getElementById('hud-vs');
const hudRpm = document.getElementById('hud-rpm');
const hudThr = document.getElementById('hud-thr');
const hudCol = document.getElementById('hud-col');
const hudEng = document.getElementById('hud-eng');
const throttleFill = document.getElementById('throttle-fill');

// ─── Update Function ──────────────────────────────────────────────
const clock = new THREE.Clock();
let exhaustTimer = 0;

function update() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.getElapsedTime();

  // ── Engine RPM ──
  if (state.engineRunning) {
    state.targetRPM = state.throttle * state.maxRPM;
  } else {
    state.targetRPM = 0;
  }
  const rpmLag = state.engineRunning ? 2.0 : 1.5;
  state.rpm += (state.targetRPM - state.rpm) * dt * rpmLag;
  if (state.rpm < 0.5) state.rpm = 0;

  // ── Throttle input ──
  if (keys['ArrowUp']) state.throttle = Math.min(1, state.throttle + dt * 0.5);
  if (keys['ArrowDown']) state.throttle = Math.max(0, state.throttle - dt * 0.5);

  // ── Collective input ──
  if (keys['Space']) state.collective = Math.min(1, state.collective + dt * 0.8);
  if (keys['ShiftLeft'] || keys['ShiftRight']) state.collective = Math.max(0, state.collective - dt * 0.8);

  // ── Flight controls ──
  const controlAuth = Math.min(state.rpm / (state.maxRPM * 0.7), 1.0);

  if (keys['KeyW']) state.pitch = Math.min(1, state.pitch + dt * 2.5 * controlAuth);
  else if (keys['KeyS']) state.pitch = Math.max(-1, state.pitch - dt * 2.5 * controlAuth);
  else state.pitch *= (1 - dt * 2.0);

  if (keys['KeyA']) state.roll = Math.min(1, state.roll + dt * 2.5 * controlAuth);
  else if (keys['KeyD']) state.roll = Math.max(-1, state.roll - dt * 2.5 * controlAuth);
  else state.roll *= (1 - dt * 2.0);

  if (keys['KeyQ']) state.yaw = Math.min(1, state.yaw + dt * 2.0 * controlAuth);
  else if (keys['KeyE']) state.yaw = Math.max(-1, state.yaw - dt * 2.0 * controlAuth);
  else state.yaw *= (1 - dt * 2.5);

  // ── Physics ──
  const rpmFrac = state.rpm / state.maxRPM;

  // Lift
  const liftForce = state.collective * MAX_LIFT * rpmFrac;
  const weight = HELI_MASS * GRAVITY;

  // Hover bobbing
  state.bobPhase += dt * 3.5;
  state.bobAmount = Math.sin(state.bobPhase) * 0.04 * rpmFrac * state.collective;

  const netVertical = liftForce - weight + HELI_MASS * state.bobAmount;

  // Banking angles from controls
  const targetPitch = state.pitch * 0.35 * controlAuth;
  const targetRoll = -state.roll * 0.35 * controlAuth;

  state.angularVelocity.x += (targetPitch - state.rotation.x) * dt * 3.0;
  state.angularVelocity.y += (state.yaw * YAW_RATE * controlAuth - state.angularVelocity.y * 0.5) * dt * 3.0;
  state.angularVelocity.z += (targetRoll - state.rotation.z) * dt * 3.0;

  // Damping
  state.angularVelocity.x *= (1 - dt * 4);
  state.angularVelocity.z *= (1 - dt * 4);
  state.angularVelocity.y *= (1 - dt * 3);

  state.rotation.x += state.angularVelocity.x * dt;
  state.rotation.y += state.angularVelocity.y * dt;
  state.rotation.z += state.angularVelocity.z * dt;

  // Clamp angles
  state.rotation.x = THREE.MathUtils.clamp(state.rotation.x, -0.6, 0.6);
  state.rotation.z = THREE.MathUtils.clamp(state.rotation.z, -0.6, 0.6);

  // Forward/thrust from pitch and roll
  const forward = new THREE.Vector3(0, 0, -1);
  forward.applyEuler(new THREE.Euler(0, state.rotation.y, 0, 'YXZ'));

  const thrustMag = state.collective * rpmFrac * 12;
  const pitchForce = state.pitch * controlAuth * thrustMag * 0.8;
  const rollForce = state.roll * controlAuth * thrustMag * 0.8;

  // Torque reaction (yaw from main rotor torque)
  const torqueYaw = -state.collective * rpmFrac * TORQUE_FACTOR;
  state.angularVelocity.y += torqueYaw * dt * controlAuth;

  // Apply forces
  state.velocity.x += (forward.x * pitchForce + forward.z * rollForce) * dt;
  state.velocity.y += (netVertical / HELI_MASS) * dt;
  state.velocity.z += (forward.z * pitchForce - forward.x * rollForce) * dt;

  // Drag
  const speed = state.velocity.length();
  const drag = state.velocity.clone().multiplyScalar(-DRAG_COEFF * speed * dt);
  state.velocity.add(drag);

  // Update position
  state.position.add(state.velocity.clone().multiplyScalar(dt));

  // Ground collision
  const groundH = getTerrainHeight(state.position.x, state.position.z) + 0.1;
  if (state.position.y < groundH) {
    state.position.y = groundH;
    state.velocity.y = Math.max(state.velocity.y, 0);
    if (state.velocity.y < 0.5) state.velocity.y *= -0.2;
  }

  // Apply to helicopter
  helicopter.position.copy(state.position);
  helicopter.rotation.set(state.rotation.x, state.rotation.y, state.rotation.z, 'YXZ');

  // ── Rotor spin ──
  const rotorSpeed = rpmFrac * 35;
  mainRotorGroup.rotation.y += rotorSpeed * dt;
  tailRotorGroup.rotation.x += rotorSpeed * 3 * dt;

  // Rotor disk tilt (visual cyclic)
  mainRotorGroup.rotation.x = state.pitch * 0.1 * controlAuth;
  mainRotorGroup.rotation.z = -state.roll * 0.1 * controlAuth;

  // ── Exhaust particles ──
  exhaustTimer += dt;
  if (exhaustTimer > 0.05) {
    exhaustTimer = 0;
    createExhaustParticle();
  }

  for (let i = exhaustParticles.length - 1; i >= 0; i--) {
    const p = exhaustParticles[i];
    p.position.add(p.userData.vel.clone().multiplyScalar(dt));
    p.userData.life -= dt * 1.5;
    p.material.opacity = p.userData.life * 0.3;
    p.scale.setScalar(1 + (1 - p.userData.life) * 2);
    if (p.userData.life <= 0) {
      scene.remove(p);
      p.geometry.dispose();
      p.material.dispose();
      exhaustParticles.splice(i, 1);
    }
  }

  // ── Camera follow ──
  const camTargetPos = new THREE.Vector3(
    state.position.x + Math.sin(state.rotation.y) * state.camDistance,
    state.position.y + state.camHeight,
    state.position.z + Math.cos(state.rotation.y) * state.camDistance
  );

  // Smooth camera follow unless orbit controls are active
  if (!controls.enabled || controls._isOrbiting) {
    // let orbit controls handle it
  } else {
    camera.position.lerp(camTargetPos, dt * 3);
    controls.target.lerp(state.position, dt * 5);
  }

  // ── Update HUD ──
  const alt = state.position.y - groundH;
  const spd = speed;
  const hdg = ((THREE.MathUtils.radToDeg(state.rotation.y) % 360) + 360) % 360;
  const vs = state.velocity.y;

  hudAlt.textContent = alt.toFixed(1);
  hudAlt.className = alt < 2 ? 'hud-danger' : alt < 5 ? 'hud-warn' : 'hud-val';
  hudSpd.textContent = spd.toFixed(1);
  hudHdg.textContent = hdg.toFixed(0);
  hudVs.textContent = (vs > 0 ? '+' : '') + vs.toFixed(1);
  hudVs.className = Math.abs(vs) > 5 ? 'hud-warn' : 'hud-val';
  hudRpm.textContent = state.rpm.toFixed(0);
  hudRpm.className = rpmFrac > 0.95 ? 'hud-warn' : 'hud-val';
  hudThr.textContent = (state.throttle * 100).toFixed(0);
  hudCol.textContent = (state.collective * 100).toFixed(0);
  hudEng.textContent = state.engineRunning ? (rpmFrac > 0.9 ? 'RUN' : 'STARTING') : 'OFF';
  hudEng.className = state.engineRunning ? (rpmFrac > 0.9 ? 'hud-val' : 'hud-warn') : 'hud-danger';

  throttleFill.style.height = (state.throttle * 100) + '%';

  // ── Keep helicopter facing forward relative to movement ──
  // The yaw control already handles heading, we just need to make sure
  // the visual model follows correctly.
}

// ─── Render Loop ───────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  update();
  controls.update();
  renderer.render(scene, camera);
}

// ─── Window Resize ─────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─── Start ─────────────────────────────────────────────────────────
animate();

// Auto-start engine after a brief moment
setTimeout(() => {
  state.engineRunning = true;
}, 500);

</script>
</body>
</html>
