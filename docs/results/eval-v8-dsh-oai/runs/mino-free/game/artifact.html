<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Shooter</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; margin: 0 auto; background: #000; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // Resize canvas to fill window
  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Game state
  const State = { START: 0, PLAYING: 1, GAMEOVER: 2 };
  let gameState = State.START;
  let score = 0;
  let highScore = 0;
  let frameCount = 0;

  // Input
  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  // Player
  let player;
  function resetPlayer() {
    player = {
      x: canvas.width / 2,
      y: canvas.height - 80,
      w: 40, h: 40,
      speed: 5,
      alive: true,
      shootCooldown: 0,
      shootDelay: 12,
      invincible: 0
    };
  }

  // Bullets
  let bullets = [];
  function shootBullet() {
    if (player.shootCooldown > 0) return;
    bullets.push({ x: player.x, y: player.y - player.h / 2, w: 4, h: 12, speed: 8 });
    player.shootCooldown = player.shootDelay;
  }

  // Enemies
  let enemies = [];
  function spawnEnemy() {
    const w = 30 + Math.random() * 20;
    const h = 24 + Math.random() * 16;
    enemies.push({
      x: w / 2 + Math.random() * (canvas.width - w),
      y: -h,
      w, h,
      speed: 1.5 + Math.random() * 2 + score * 0.03,
      health: 1,
      wobble: Math.random() * Math.PI * 2
    });
  }
  let enemySpawnTimer = 0;

  // Enemy bullets
  let enemyBullets = [];
  let enemyShootTimer = 0;

  // Explosions
  let explosions = [];
  function createExplosion(x, y, size) {
    const particles = [];
    const count = 12 + size * 2;
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * (3 + size);
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 20 + Math.random() * 20,
        maxLife: 20 + Math.random() * 20,
        size: 2 + Math.random() * 3
      });
    }
    explosions.push({ particles });
  }

  // Stars background
  const stars = [];
  for (let i = 0; i < 120; i++) {
    stars.push({
      x: Math.random(),
      y: Math.random(),
      speed: 0.001 + Math.random() * 0.004,
      size: 0.5 + Math.random() * 2,
      brightness: 0.3 + Math.random() * 0.7
    });
  }

  // Collision helper
  function rectsOverlap(a, b) {
    return a.x - a.w / 2 < b.x + b.w / 2 &&
           a.x + a.w / 2 > b.x - b.w / 2 &&
           a.y - a.h / 2 < b.y + b.h / 2 &&
           a.y + a.h / 2 > b.y - b.h / 2;
  }

  // Draw player ship
  function drawPlayer() {
    if (!player.alive) return;
    if (player.invincible > 0 && Math.floor(frameCount / 3) % 2 === 0) return;

    const x = player.x, y = player.y;
    ctx.save();
    ctx.translate(x, y);

    // Ship body
    ctx.fillStyle = '#0af';
    ctx.beginPath();
    ctx.moveTo(0, -player.h / 2);
    ctx.lineTo(-player.w / 2, player.h / 2);
    ctx.lineTo(-player.w / 4, player.h / 3);
    ctx.lineTo(player.w / 4, player.h / 3);
    ctx.lineTo(player.w / 2, player.h / 2);
    ctx.closePath();
    ctx.fill();

    // Cockpit
    ctx.fillStyle = '#4df';
    ctx.beginPath();
    ctx.ellipse(0, -2, 5, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // Engine glow
    ctx.fillStyle = '#f80';
    ctx.beginPath();
    const flicker = 3 + Math.random() * 4;
    ctx.moveTo(-6, player.h / 3);
    ctx.lineTo(0, player.h / 3 + flicker + 5);
    ctx.lineTo(6, player.h / 3);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  // Draw enemy
  function drawEnemy(e) {
    const x = e.x, y = e.y;
    ctx.save();
    ctx.translate(x, y);

    ctx.fillStyle = '#f33';
    ctx.beginPath();
    ctx.moveTo(0, e.h / 2);
    ctx.lineTo(-e.w / 2, -e.h / 3);
    ctx.lineTo(-e.w / 4, -e.h / 2);
    ctx.lineTo(e.w / 4, -e.h / 2);
    ctx.lineTo(e.w / 2, -e.h / 3);
    ctx.closePath();
    ctx.fill();

    // Cockpit
    ctx.fillStyle = '#fa0';
    ctx.beginPath();
    ctx.ellipse(0, 2, 4, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // Draw bullet
  function drawBullet(b, color) {
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 6;
    ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    ctx.shadowBlur = 0;
  }

  // Draw explosion
  function drawExplosions() {
    for (const exp of explosions) {
      for (const p of exp.particles) {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = `hsl(${20 + 30 * alpha}, 100%, ${50 + 30 * alpha}%)`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  // Draw stars
  function drawStars() {
    for (const s of stars) {
      ctx.fillStyle = `rgba(255,255,255,${s.brightness})`;
      ctx.fillRect(s.x * canvas.width, s.y * canvas.height, s.size, s.size);
    }
  }

  // HUD
  function drawHUD() {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 15, 30);
    ctx.textAlign = 'right';
    ctx.fillText(`HIGH: ${highScore}`, canvas.width - 15, 30);
  }

  // Start screen
  function drawStartScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#0af';
    ctx.font = 'bold 52px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('SPACE SHOOTER', canvas.width / 2, canvas.height / 2 - 80);

    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText('Arrow Keys / WASD — Move', canvas.width / 2, canvas.height / 2 - 10);
    ctx.fillText('Space — Shoot', canvas.width / 2, canvas.height / 2 + 25);

    const blink = Math.sin(frameCount * 0.08) > 0;
    if (blink) {
      ctx.fillStyle = '#ff0';
      ctx.font = 'bold 26px monospace';
      ctx.fillText('PRESS ENTER OR SPACE TO START', canvas.width / 2, canvas.height / 2 + 90);
    }

    if (highScore > 0) {
      ctx.fillStyle = '#aaa';
      ctx.font = '18px monospace';
      ctx.fillText(`High Score: ${highScore}`, canvas.width / 2, canvas.height / 2 + 130);
    }
  }

  // Game over screen
  function drawGameOverScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#f33';
    ctx.font = 'bold 52px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 50);

    ctx.fillStyle = '#fff';
    ctx.font = '24px monospace';
    ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 10);

    const blink = Math.sin(frameCount * 0.08) > 0;
    if (blink) {
      ctx.fillStyle = '#ff0';
      ctx.font = 'bold 22px monospace';
      ctx.fillText('PRESS ENTER TO RESTART', canvas.width / 2, canvas.height / 2 + 70);
    }
  }

  // Reset game
  function startGame() {
    score = 0;
    bullets = [];
    enemies = [];
    enemyBullets = [];
    explosions = [];
    enemySpawnTimer = 0;
    enemyShootTimer = 0;
    resetPlayer();
    gameState = State.PLAYING;
  }

  // Update
  function update() {
    frameCount++;

    if (gameState === State.START) {
      if (keys['Enter'] || keys['Space']) {
        startGame();
      }
      // Update stars on start screen
      for (const s of stars) {
        s.y += s.speed;
        if (s.y > 1) s.y = 0;
      }
      return;
    }

    if (gameState === State.GAMEOVER) {
      if (keys['Enter']) {
        gameState = State.START;
      }
      // Still animate explosions
      for (const exp of explosions) {
        for (const p of exp.particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.life--;
        }
      }
      explosions = explosions.filter(e => e.particles.some(p => p.life > 0));
      return;
    }

    // --- Playing state ---

    // Player movement
    if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
    if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
    if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
    if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;

    // Clamp player
    player.x = Math.max(player.w / 2, Math.min(canvas.width - player.w / 2, player.x));
    player.y = Math.max(player.h / 2, Math.min(canvas.height - player.h / 2, player.y));

    // Shoot
    if (keys['Space']) shootBullet();
    if (player.shootCooldown > 0) player.shootCooldown--;

    // Invincibility timer
    if (player.invincible > 0) player.invincible--;

    // Bullets
    for (const b of bullets) b.y -= b.speed;
    bullets = bullets.filter(b => b.y > -20);

    // Enemy spawn
    enemySpawnTimer++;
    const spawnRate = Math.max(25, 60 - score * 0.5);
    if (enemySpawnTimer >= spawnRate) {
      spawnEnemy();
      enemySpawnTimer = 0;
    }

    // Enemy movement
    for (const e of enemies) {
      e.y += e.speed;
      e.wobble += 0.03;
      e.x += Math.sin(e.wobble) * 0.8;
    }
    enemies = enemies.filter(e => e.y < canvas.height + 40);

    // Enemy shooting
    enemyShootTimer++;
    if (enemyShootTimer >= 50 && enemies.length > 0) {
      const shooter = enemies[Math.floor(Math.random() * enemies.length)];
      enemyBullets.push({
        x: shooter.x, y: shooter.y + shooter.h / 2,
        w: 3, h: 10, speed: 4
      });
      enemyShootTimer = 0;
    }

    // Enemy bullets movement
    for (const b of enemyBullets) b.y += b.speed;
    enemyBullets = enemyBullets.filter(b => b.y < canvas.height + 20);

    // Collision: player bullets vs enemies
    for (let i = bullets.length - 1; i >= 0; i--) {
      for (let j = enemies.length - 1; j >= 0; j--) {
        if (rectsOverlap(bullets[i], enemies[j])) {
          createExplosion(enemies[j].x, enemies[j].y, 1);
          bullets.splice(i, 1);
          enemies.splice(j, 1);
          score += 10;
          break;
        }
      }
    }

    // Collision: enemies vs player
    if (player.invincible <= 0) {
      for (let j = enemies.length - 1; j >= 0; j--) {
        if (rectsOverlap(player, enemies[j])) {
          createExplosion(player.x, player.y, 2);
          createExplosion(enemies[j].x, enemies[j].y, 1);
          enemies.splice(j, 1);
          player.alive = false;
          if (score > highScore) highScore = score;
          gameState = State.GAMEOVER;
          return;
        }
      }
    }

    // Collision: enemy bullets vs player
    if (player.invincible <= 0) {
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        if (rectsOverlap(enemyBullets[i], player)) {
          enemyBullets.splice(i, 1);
          createExplosion(player.x, player.y, 2);
          player.alive = false;
          if (score > highScore) highScore = score;
          gameState = State.GAMEOVER;
          return;
        }
      }
    }

    // Update explosions
    for (const exp of explosions) {
      for (const p of exp.particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
      }
    }
    explosions = explosions.filter(e => e.particles.some(p => p.life > 0));

    // Stars
    for (const s of stars) {
      s.y += s.speed;
      if (s.y > 1) { s.y = 0; s.x = Math.random(); }
    }
  }

  // Render
  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background stars
    drawStars();

    if (gameState === State.PLAYING || gameState === State.GAMEOVER) {
      // Bullets
      for (const b of bullets) drawBullet(b, '#0f0');
      for (const b of enemyBullets) drawBullet(b, '#f55');

      // Enemies
      for (const e of enemies) drawEnemy(e);

      // Explosions
      drawExplosions();

      // Player
      drawPlayer();

      // HUD
      drawHUD();
    }

    if (gameState === State.START) {
      drawStartScreen();
    } else if (gameState === State.GAMEOVER) {
      drawHUD();
      drawGameOverScreen();
    }
  }

  // Game loop
  function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
  }

  gameLoop();
})();
</script>
</body>
</html>
