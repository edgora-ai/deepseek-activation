<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Black Hole</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ── Renderer ──────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// ── Scene & Camera ────────────────────────────────────────
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 10000);
camera.position.set(0, 18, 32);

// ── Controls ──────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 5;
controls.maxDistance = 120;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;

// ── Post-processing ───────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  1.8,   // strength
  0.4,   // radius
  0.2    // threshold
);
composer.addPass(bloomPass);

// ── Starfield ─────────────────────────────────────────────
{
  const count = 6000;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const r = 200 + Math.random() * 800;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = r * Math.cos(phi);
    const t = Math.random();
    colors[i * 3]     = 0.8 + 0.2 * t;
    colors[i * 3 + 1] = 0.85 + 0.15 * t;
    colors[i * 3 + 2] = 1.0;
    sizes[i] = 0.5 + Math.random() * 1.5;
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  starGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  starGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  const starMat = new THREE.ShaderMaterial({
    vertexShader: `
      attribute float size;
      varying vec3 vColor;
      void main() {
        vColor = color;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = size * (200.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        float a = smoothstep(0.5, 0.05, d);
        gl_FragColor = vec4(vColor, a);
      }
    `,
    transparent: true,
    vertexColors: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
  scene.add(new THREE.Points(starGeo, starMat));
}

// ── Black hole sphere ─────────────────────────────────────
const holeGeo = new THREE.SphereGeometry(2.2, 64, 64);
const holeMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec3 vWorldPos;
    void main() {
      vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vWorldPos;
    void main() {
      gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
    }
  `,
  side: THREE.FrontSide,
});
scene.add(new THREE.Mesh(holeGeo, holeMat));

// ── Photon ring (glow ring around the black hole) ─────────
{
  const ringGeo = new THREE.RingGeometry(2.4, 3.2, 128);
  const ringMat = new THREE.ShaderMaterial({
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying vec2 vUv;
      void main() {
        float dist = length(vUv - 0.5) * 2.0;
        float glow = exp(-3.0 * (dist - 0.7));
        vec3 col = mix(vec3(1.0, 0.6, 0.1), vec3(1.0, 1.0, 0.7), dist);
        gl_FragColor = vec4(col * glow * 2.5, glow);
      }
    `,
    transparent: true,
    side: THREE.DoubleSide,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI * 0.42;
  scene.add(ring);
}

// ── Accretion disk particles ──────────────────────────────
const DISK_COUNT = 22000;
const diskPositions = new Float32Array(DISK_COUNT * 3);
const diskVelocities = new Float32Array(DISK_COUNT);      // angular velocity per particle
const diskRadii = new Float32Array(DISK_COUNT);
const diskAngles = new Float32Array(DISK_COUNT);
const diskYOffsets = new Float32Array(DISK_COUNT);
const diskColors = new Float32Array(DISK_COUNT * 3);
const diskSizes = new Float32Array(DISK_COUNT);

for (let i = 0; i < DISK_COUNT; i++) {
  const r = 3.5 + Math.pow(Math.random(), 0.55) * 14;
  const angle = Math.random() * Math.PI * 2;
  const ySpread = (Math.random() - 0.5) * 0.6 * (r / 17);
  diskRadii[i] = r;
  diskAngles[i] = angle;
  diskYOffsets[i] = ySpread;
  diskPositions[i * 3]     = Math.cos(angle) * r;
  diskPositions[i * 3 + 1] = ySpread;
  diskPositions[i * 3 + 2] = Math.sin(angle) * r;

  // Keplerian-ish: inner particles orbit faster
  diskVelocities[i] = 0.15 / Math.pow(r / 3.5, 1.5);

  // Color gradient: hot inner (white-yellow) → cooler outer (orange-red)
  const t = (r - 3.5) / 14;
  diskColors[i * 3]     = 1.0;
  diskColors[i * 3 + 1] = 0.95 - t * 0.5;
  diskColors[i * 3 + 2] = 0.8 - t * 0.7;

  diskSizes[i] = 0.3 + (1 - t) * 0.8 + Math.random() * 0.3;
}

const diskGeo = new THREE.BufferGeometry();
diskGeo.setAttribute('position', new THREE.BufferAttribute(diskPositions, 3));
diskGeo.setAttribute('color', new THREE.BufferAttribute(diskColors, 3));
diskGeo.setAttribute('size', new THREE.BufferAttribute(diskSizes, 1));

const diskMat = new THREE.ShaderMaterial({
  vertexShader: `
    attribute float size;
    varying vec3 vColor;
    varying float vBright;
    void main() {
      vColor = color;
      vBright = 1.0;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * (180.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vBright;
    void main() {
      float d = length(gl_PointCoord - 0.5) * 2.0;
      float alpha = smoothstep(1.0, 0.0, d) * 0.85;
      vec3 col = vColor * vBright;
      // Add soft glow
      float glow = exp(-2.5 * d);
      col += glow * 0.3;
      gl_FragColor = vec4(col, alpha);
    }
  `,
  transparent: true,
  vertexColors: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});

const diskPoints = new THREE.Points(diskGeo, diskMat);
scene.add(diskPoints);

// ── Dusty outer halo particles ────────────────────────────
{
  const HALO_COUNT = 3000;
  const hPos = new Float32Array(HALO_COUNT * 3);
  const hCol = new Float32Array(HALO_COUNT * 3);
  const hSize = new Float32Array(HALO_COUNT);
  for (let i = 0; i < HALO_COUNT; i++) {
    const r = 16 + Math.random() * 25;
    const a = Math.random() * Math.PI * 2;
    hPos[i * 3]     = Math.cos(a) * r;
    hPos[i * 3 + 1] = (Math.random() - 0.5) * 4;
    hPos[i * 3 + 2] = Math.sin(a) * r;
    hCol[i * 3]     = 0.9;
    hCol[i * 3 + 1] = 0.4;
    hCol[i * 3 + 2] = 0.1;
    hSize[i] = 0.4 + Math.random() * 0.6;
  }
  const hGeo = new THREE.BufferGeometry();
  hGeo.setAttribute('position', new THREE.BufferAttribute(hPos, 3));
  hGeo.setAttribute('color', new THREE.BufferAttribute(hCol, 3));
  hGeo.setAttribute('size', new THREE.BufferAttribute(hSize, 1));
  const hMat = new THREE.ShaderMaterial({
    vertexShader: `
      attribute float size;
      varying vec3 vColor;
      void main() {
        vColor = color;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = size * (120.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      void main() {
        float d = length(gl_PointCoord - 0.5) * 2.0;
        float a = smoothstep(1.0, 0.2, d) * 0.3;
        gl_FragColor = vec4(vColor, a);
      }
    `,
    transparent: true,
    vertexColors: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
  scene.add(new THREE.Points(hGeo, hMat));
}

// ── Animation ─────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const elapsed = clock.getElapsedTime();

  // Rotate accretion disk particles (Keplerian orbit)
  const pos = diskGeo.attributes.position.array;
  for (let i = 0; i < DISK_COUNT; i++) {
    diskAngles[i] += diskVelocities[i] * dt;
    const r = diskRadii[i];
    const a = diskAngles[i];
    // Slight wobble for depth
    const wobble = Math.sin(elapsed * 0.5 + i * 0.01) * 0.08;
    pos[i * 3]     = Math.cos(a) * r;
    pos[i * 3 + 1] = diskYOffsets[i] + wobble;
    pos[i * 3 + 2] = Math.sin(a) * r;
  }
  diskGeo.attributes.position.needsUpdate = true;

  controls.update();
  composer.render();
}

animate();

// ── Resize ────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
