<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Analytics Dashboard</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #334155;
    --border: #3b4a63;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --green: #34d399;
    --purple: #a78bfa;
    --amber: #fbbf24;
    --rose: #fb7185;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 20px 28px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  header h1 span { color: var(--accent); }
  header .subtitle { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    align-items: flex-end;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
  }
  .control-group { display: flex; flex-direction: column; gap: 6px; }
  .control-group label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  select, input[type="range"] {
    font-size: 14px;
  }
  select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    min-width: 140px;
    cursor: pointer;
  }
  .range-wrap { display: flex; align-items: center; gap: 8px; }
  .range-wrap input[type="range"] { accent-color: var(--accent); width: 110px; cursor: pointer; }
  .range-wrap > span { font-size: 12px; color: var(--muted); }
  .range-label { font-size: 13px; font-weight: 600; color: var(--text); min-width: 18px; text-align: center; }
  .range-sep { color: var(--muted); }
  button {
    background: linear-gradient(135deg, var(--accent), #6366f1);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.05s ease;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: translateY(1px); }
  main {
    padding: 24px 28px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }
  .kpi-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .kpi-card .kpi-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .kpi-card .kpi-value { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .kpi-card .kpi-delta { font-size: 12px; font-weight: 600; }
  .kpi-card .kpi-delta.up { color: var(--green); }
  .kpi-card .kpi-delta.down { color: var(--rose); }
  .kpi-card .kpi-delta.sub { color: var(--muted); font-weight: 500; }
  .charts {
    padding: 0 28px 28px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    max-width: 1600px;
  }
  .chart-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .chart-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .chart-container { position: relative; width: 100%; }
  .chart-container svg { display: block; width: 100%; height: auto; }
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: #0b1120;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    line-height: 1.5;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    z-index: 10;
    opacity: 0;
    transition: opacity 0.1s ease;
    white-space: nowrap;
  }
  .tooltip .tip-label { font-weight: 600; color: var(--text); }
  .tooltip .tip-value { color: var(--muted); }
  @media (max-width: 1000px) {
    main { grid-template-columns: 1fr 1fr; }
    .charts { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    main { grid-template-columns: 1fr; }
    header { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Sales <span>Analytics</span> Dashboard</h1>
    <div class="subtitle">Interactive KPI dashboard with deterministic in-browser sample data</div>
  </div>
  <div class="controls">
    <div class="control-group">
      <label for="region-filter">Region</label>
      <select id="region-filter"></select>
    </div>
    <div class="control-group">
      <label for="category-filter">Category</label>
      <select id="category-filter"></select>
    </div>
    <div class="control-group">
      <label>Period Range</label>
      <div class="range-wrap">
        <span>From</span>
        <input type="range" id="period-from" min="1" max="6" value="1" step="1" list="period-ticks">
        <span class="range-label" id="range-from-label">1</span>
        <span class="range-sep">&mdash;</span>
        <span class="range-label" id="range-to-label">6</span>
        <input type="range" id="period-to" min="1" max="6" value="6" step="1" list="period-ticks">
        <span>To</span>
        <datalist id="period-ticks">
          <option value="1"></option><option value="2"></option><option value="3"></option>
          <option value="4"></option><option value="5"></option><option value="6"></option>
        </datalist>
      </div>
    </div>
    <button id="refresh-btn" type="button">Refresh data</button>
  </div>
</header>

<main>
  <div class="kpi-card">
    <div class="kpi-label">Revenue</div>
    <div class="kpi-value" id="kpi-revenue">$0</div>
    <div class="kpi-delta sub" id="kpi-revenue-delta">&mdash;</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label">Orders</div>
    <div class="kpi-value" id="kpi-orders">0</div>
    <div class="kpi-delta sub" id="kpi-orders-delta">&mdash;</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label">Avg Order Value</div>
    <div class="kpi-value" id="kpi-aov">$0</div>
    <div class="kpi-delta sub" id="kpi-aov-delta">&mdash;</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label">Profit Margin</div>
    <div class="kpi-value" id="kpi-margin">0%</div>
    <div class="kpi-delta sub" id="kpi-margin-delta">&mdash;</div>
  </div>
</main>

<section class="charts">
  <div class="chart-card">
    <h3>Revenue Trend</h3>
    <div class="chart-container" id="trend-chart"></div>
  </div>
  <div class="chart-card">
    <h3>Revenue by Category</h3>
    <div class="chart-container" id="bar-chart"></div>
  </div>
  <div class="chart-card">
    <h3>Revenue by Region</h3>
    <div class="chart-container" id="donut-chart"></div>
  </div>
  <div class="chart-card scatter">
    <h3>Spend vs Revenue</h3>
    <div class="chart-container" id="scatter-chart"></div>
  </div>
</section>

<div class="tooltip" id="tooltip"></div>

<script>
(function () {
  "use strict";

  // ----- deterministic PRNG (mulberry32) so refresh generates new but seeded data
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var REGIONS = ["North", "South", "West", "East"];
  var CATEGORIES = ["Electronics", "Apparel", "Home", "Grocery"];
  var PERIODS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun"];

  var state = {
    seed: 20260101,
    dataset: [],
    region: "All Regions",
    category: "All Categories",
    periodFrom: 1,
    periodTo: 6
  };

  function randomInt(rng, min, max) { return Math.floor(rng() * (max - min + 1)) + min; }
  function round2(n) { return Math.round(n * 100) / 100; }
  function randBetween(rng, min, max) { return rng() * (max - min) + min; }

  // Deterministic generation utilising seed drift across refresh cycles.
  // Hash of (region + category + period) yields stable rows for the current seed,
  // while a new seed on refresh produces a different (still deterministic) dataset.
  function hashStr(s) {
    var h = 1779033703;
    for (var i = 0; i < s.length; i++) {
      h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return h >>> 0;
  }

  function generateDataset(seed) {
    var data = [];
    REGIONS.forEach(function (region) {
      CATEGORIES.forEach(function (category) {
        PERIODS.forEach(function (period, pi) {
          var key = region + "|" + category + "|" + period + "|" + seed;
          var r = hashStr(key);
          var rng = mulberry32(r);
          var baseUnits = randomInt(rng, 60, 260);
          var seasonal = Math.sin((pi + 1) / PERIODS.length * Math.PI) * 1.6 + 0.4;
          var price = randBetween(rng, 18, 220);
          var units = Math.max(8, Math.round(baseUnits * (0.7 + seasonal * 0.3)));
          var revenue = round2(units * price);
          var cost = round2(units * price * randBetween(rng, 0.45, 0.8));
          var spend = round2(revenue * randBetween(rng, 0.12, 0.42));
          data.push({
            region: region,
            category: category,
            period: period,
            periodIndex: pi + 1,
            revenue: revenue,
            cost: cost,
            spend: spend,
            profit: round2(revenue - cost - spend),
            orders: randomInt(rng, 5, 80)
          });
        });
      });
    });
    return data.sort(function (a, b) { return a.periodIndex - b.periodIndex; });
  }

  // ----- filtering
  function isInRange(row) {
    return row.periodIndex >= state.periodFrom && row.periodIndex <= state.periodTo;
  }
  function passesFilters(row) {
    if (state.region !== "All Regions" && row.region !== state.region) return false;
    if (state.category !== "All Categories" && row.category !== state.category) return false;
    return isInRange(row);
  }
  function rows() {
    return state.dataset.filter(passesFilters);
  }

  // ----- KPI helpers
  function sum(arr, key) { return arr.reduce(function (acc, r) { return acc + (r[key] || 0); }, 0); }
  function fmtMoney(n) { return "$" + Math.round(n).toLocaleString("en-US"); }
  function fmtDelta(a, b) {
    if (!b) return "&mdash;";
    return ((a / b - 1) * 100).toFixed(1) + "%";
  }
  function deltaClass(a, b) { return a >= b ? "up" : "down"; }

  // AOV / margin compared against the previous full (pre-filter) period baseline.
  function prevFullBaseline(key, fn) {
    var prev = state.dataset.filter(function (r) {
      return r.periodIndex < state.periodFrom;
    });
    if (!prev.length) return null;
    if (key === "aov") {
      var rev = sum(prev, "revenue");
      var ord = sum(prev, "orders");
      return ord ? rev / ord : 0;
    }
    if (key === "margin") {
      var p = sum(prev, "profit");
      var rv = sum(prev, "revenue");
      return rv ? p / rv : 0;
    }
    return null;
  }

  // ----- SVG rendering utilities
  function svgEl(name, attrs) {
    var el = document.createElementNS("http://www.w3.org/2000/svg", name);
    for (var k in attrs) el.setAttributeNS(null, k, attrs[k]);
    return el;
  }

  var PALETTE = ["#38bdf8", "#a78bfa", "#34d399", "#fbbf24", "#fb7185", "#f472b6"];

  function showTip(html, x, y) {
    var tip = document.getElementById("tooltip");
    tip.innerHTML = html;
    tip.style.opacity = 1;
    var host = document.body.getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(x + 14, host.width - tip.offsetWidth - 8)) + "px";
    tip.style.top = Math.max(8, y + 10) + "px";
  }
  function hideTip() {
    document.getElementById("tooltip").style.opacity = 0;
  }
  function bindTip(evt, html, chartContainer) {
    evt.currentTarget.addEventListener("mouseenter", function (e) {
      var rect = chartContainer.getBoundingClientRect();
      showTip(html, e.clientX - window.scrollX, e.clientY - window.scrollY);
      void rect;
    });
    evt.currentTarget.addEventListener("mousemove", function (e) {
      showTip(html, e.clientX - window.scrollX, e.clientY - window.scrollY);
    });
    evt.currentTarget.addEventListener("mouseleave", hideTip);
  }

  function chartMetrics(n) {
    if (!n.length) return { max: 1, min: 0 };
    var max = Math.max.apply(null, n);
    var min = Math.min.apply(null, n);
    var pad = (max - min) * 0.15 || max * 0.15 || 1;
    return { max: max + pad, min: Math.max(0, min - pad) };
  }

  function axisText(x, y, text, opts) {
    opts = opts || {};
    var t = svgEl("text", { x: x, y: y, "font-size": opts.fontSize || 11, fill: opts.fill || "#94a3b8", "text-anchor": opts.anchor || "middle", "dominant-baseline": opts.baseline || "after-edge" });
    if (opts.transform) t.setAttributeNS(null, "transform", opts.transform);
    t.textContent = text;
    return t;
  }

  function makeGrid(svg, w, h, ticks, axisFn) {
    for (var i = 0; i < ticks.length; i++) {
      var p = axisFn(ticks[i]);
      svg.appendChild(svgEl("line", { x1: p.x, y1: p.y, x2: p.x, y2: h - 30, stroke: "#2a3950", "stroke-width": 1 }));
    }
  }

  // ===================== LINE CHART =====================
  function renderTrend() {
    var container = document.getElementById("trend-chart");
    var data = rows();
    var W = 620, H = 260, padL = 56, padB = 34, padT = 14, padR = 14;

    var byPeriod = {};
    data.forEach(function (r) {
      if (!byPeriod[r.periodIndex]) byPeriod[r.periodIndex] = { period: r.period, index: r.periodIndex, revenue: 0, orders: 0 };
      byPeriod[r.periodIndex].revenue += r.revenue;
      byPeriod[r.periodIndex].orders += r.orders;
    });
    var periods = Object.keys(byPeriod).map(Number).sort(function (a, b) { return a - b; });
    var points = periods.map(function (p) { return byPeriod[p]; });

    container.innerHTML = "";
    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, width: "100%" });

    var m = chartMetrics(points.map(function (p) { return p.revenue; }));
    var xStep = (W - padL - padR) / Math.max(points.length - 1, 1);
    function px(p) { return padL + xStep * (p.index - periods[0]); }
    function py(v) { return padT + (H - padT - padB) * (1 - (v - m.min) / (m.max - m.min)); }

    var gridTicks = 4;
    var yTicks = [];
    for (var i = 0; i <= gridTicks; i++) {
      yTicks.push(round2(m.min + (m.max - m.min) * i / gridTicks));
    }
    yTicks.forEach(function (t) {
      svg.appendChild(axisText(padL - 8, py(t) + 3, "$" + Math.round(t), { anchor: "end", baseline: "middle" }));
      svg.appendChild(svgEl("line", { x1: padL, y1: py(t), x2: W - padR, y2: py(t), stroke: "#2a3950", "stroke-width": 1 }));
    });
    periods.forEach(function (p) {
      svg.appendChild(axisText(px(byPeriod[p]), H - 12, byPeriod[p].period, {}));
    });

    // area fill
    var area = "M " + px(points[0]) + " " + py(points[0].revenue);
    var linePath = "M " + px(points[0]) + " " + py(points[0].revenue);
    points.forEach(function (p, idx) {
      if (idx === 0) return;
      linePath += " L " + px(p) + " " + py(p.revenue);
      area += " L " + px(p) + " " + py(p.revenue);
    });
    area += " L " + px(points[points.length - 1]) + " " + (H - padB) + " L " + px(points[0]) + " " + (H - padB) + " Z";
    var areaPath = svgEl("path", { d: area, fill: "url(#trendGrad)", stroke: "none" });
    var line = svgEl("path", { d: linePath, fill: "none", stroke: "#38bdf8", "stroke-width": 2.5, "stroke-linejoin": "round", "stroke-linecap": "round" });

    var defs = svgEl("defs", {});
    var grad = svgEl("linearGradient", { id: "trendGrad", x1: "0", y1: "0", x2: "0", y2: "1" });
    grad.appendChild(svgEl("stop", { offset: "0%", "stop-color": "#38bdf8", "stop-opacity": "0.28" }));
    grad.appendChild(svgEl("stop", { offset: "100%", "stop-color": "#38bdf8", "stop-opacity": "0" }));
    defs.appendChild(grad);
    svg.appendChild(defs);
    svg.appendChild(areaPath);
    svg.appendChild(line);

    points.forEach(function (p) {
      var cx = px(p), cy = py(p.revenue);
      var group = svgEl("g", { "class": "dot" });
      var halo = svgEl("circle", { cx: cx, cy: cy, r: 14, fill: "transparent" });
      var dot = svgEl("circle", { cx: cx, cy: cy, r: 4.5, fill: "#0f172a", stroke: "#38bdf8", "stroke-width": 2.5 });
      group.appendChild(halo);
      group.appendChild(dot);
      var tip = "<div class='tip-label'>" + p.period + "</div>" +
                "<div class='tip-value'>Revenue: " + fmtMoney(p.revenue) + "</div>" +
                "<div class='tip-value'>Orders: " + p.orders.toLocaleString("en-US") + "</div>";
      bindTip({ currentTarget: group }, tip, container);
      svg.appendChild(group);
    });

    container.appendChild(svg);
  }

  // ===================== BAR CHART =====================
  function renderBars() {
    var container = document.getElementById("bar-chart");
    var data = rows();
    var W = 620, H = 260, padL = 56, padB = 34, padT = 14, padR = 14;

    var byCat = {};
    data.forEach(function (r) {
      if (!byCat[r.category]) byCat[r.category] = 0;
      byCat[r.category] += r.revenue;
    });
    var cats = Object.keys(byCat);
    var values = cats.map(function (c) { return byCat[c]; });
    var m = chartMetrics(values);

    container.innerHTML = "";
    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, width: "100%" });

    var gridTicks = 4;
    var yTicks = [];
    for (var i = 0; i <= gridTicks; i++) {
      yTicks.push(round2(m.max * i / gridTicks));
    }
    yTicks.forEach(function (t) {
      svg.appendChild(axisText(padL - 8, (H - padB) - ((H - padT - padB) * t / m.max) + 3, "$" + Math.round(t), { anchor: "end", baseline: "middle" }));
      svg.appendChild(svgEl("line", { x1: padL, y1: (H - padB) - ((H - padT - padB) * t / m.max), x2: W - padR, y2: (H - padB) - ((H - padT - padB) * t / m.max), stroke: "#2a3950", "stroke-width": 1 }));
    });

    var slot = (W - padL - padR) / cats.length;
    var barW = Math.min(52, slot * 0.55);
    var grand = values.reduce(function (a, b) { return a + b; }, 0) || 1;
    cats.forEach(function (c, idx) {
      var v = byCat[c];
      var h = (H - padT - padB) * (v / m.max);
      var x = padL + slot * idx + (slot - barW) / 2;
      var y = H - padB - h;
      var color = PALETTE[CATEGORIES.indexOf(c) % PALETTE.length] || "#94a3b8";
      var rect = svgEl("rect", { x: x, y: y, width: barW, height: h, rx: 4, fill: color, "fill-opacity": 0.9 });
      var group = svgEl("g", {});
      group.appendChild(rect);
      var tip = "<div class='tip-label'>" + c + "</div>" +
                "<div class='tip-value'>Revenue: " + fmtMoney(v) + "</div>" +
                "<div class='tip-value'>Share: " + (v / grand * 100).toFixed(1) + "%</div>";
      bindTip({ currentTarget: group }, tip, container);
      svg.appendChild(group);
      svg.appendChild(axisText(x + barW / 2, H - 12, c, { fontSize: 10 }));
    });

    container.appendChild(svg);
  }

  // ===================== DONUT CHART =====================
  function renderDonut() {
    var container = document.getElementById("donut-chart");
    var data = rows();
    var W = 620, H = 260, cx = W / 2, cy = H / 2 - 6, R = 92, r = 56;

    var byRegion = {};
    data.forEach(function (r) {
      if (!byRegion[r.region]) byRegion[r.region] = 0;
      byRegion[r.region] += r.revenue;
    });
    var regions = Object.keys(byRegion);
    var total = regions.reduce(function (a, b) { return a + byRegion[b]; }, 0);

    container.innerHTML = "";
    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, width: "100%" });

    if (total <= 0) {
      svg.appendChild(axisText(cx, cy, "No data", { fontSize: 14 }));
      container.appendChild(svg);
      return;
    }

    var start = -Math.PI / 2;
    regions.forEach(function (reg) {
      var frac = byRegion[reg] / total;
      var end = start + frac * 2 * Math.PI;
      if (frac >= 0.999) end = start + 2 * Math.PI - 0.0001;
      var largeArc = end - start > Math.PI ? 1 : 0;
      var x1 = cx + R * Math.cos(start), y1 = cy + R * Math.sin(start);
      var x2 = cx + R * Math.cos(end), y2 = cy + R * Math.sin(end);
      var i1 = cx + r * Math.cos(start), j1 = cy + r * Math.sin(start);
      var i2 = cx + r * Math.cos(end), j2 = cy + r * Math.sin(end);
      var d = "M " + x1 + " " + y1 +
              " A " + R + " " + R + " 0 " + largeArc + " 1 " + x2 + " " + y2 +
              " L " + i2 + " " + j2 +
              " A " + r + " " + r + " 0 " + largeArc + " 0 " + i1 + " " + j1 + " Z";
      var color = PALETTE[REGIONS.indexOf(reg) % PALETTE.length] || "#94a3b8";
      var path = svgEl("path", { d: d, fill: color, stroke: "#0f172a", "stroke-width": 2 });
      var group = svgEl("g", {});
      group.appendChild(path);
      var tip = "<div class='tip-label'>" + reg + "</div>" +
                "<div class='tip-value'>Revenue: " + fmtMoney(byRegion[reg]) + "</div>" +
                "<div class='tip-value'>Share: " + (frac * 100).toFixed(1) + "%</div>";
      bindTip({ currentTarget: group }, tip, container);
      svg.appendChild(group);
      start = end;
    });

    svg.appendChild(axisText(cx, cy - 6, "Total", { fontSize: 11, fill: "#94a3b8" }));
    svg.appendChild(axisText(cx, cy + 16, (total >= 1000000 ? "$" + (total / 1000000).toFixed(2) + "M" : fmtMoney(total)), { fontSize: 16, fill: "#e2e8f0" }));

    // legend
    regions.forEach(function (reg, idx) {
      var lx = W - 150, ly = 24 + idx * 22;
      svg.appendChild(svgEl("rect", { x: lx, y: ly - 10, width: 12, height: 12, rx: 3, fill: PALETTE[REGIONS.indexOf(reg) % PALETTE.length] }));
      svg.appendChild(axisText(lx + 18, ly + 2, reg, { anchor: "start", fontSize: 12, baseline: "middle", fill: "#cbd5e1" }));
    });

    container.appendChild(svg);
  }

  // ===================== SCATTER CHART =====================
  function renderScatter() {
    var container = document.getElementById("scatter-chart");
    var data = rows();
    var W = 1260, H = 300, padL = 62, padB = 40, padT = 16, padR = 20;

    container.innerHTML = "";
    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, width: "100%" });

    if (!data.length) {
      svg.appendChild(axisText(W / 2, H / 2, "No data for current filters", { fontSize: 14 }));
      container.appendChild(svg);
      return;
    }

    var xv = data.map(function (r) { return r.spend; });
    var yv = data.map(function (r) { return r.revenue; });
    var mx = chartMetrics(xv), my = chartMetrics(yv);
    mx.max = mx.max * 1.05; my.max = my.max * 1.05;

    function px(v) { return padL + (W - padL - padR) * (v / mx.max); }
    function py(v) { return padT + (H - padT - padB) * (1 - v / my.max); }

    for (var i = 0; i <= 4; i++) {
      var tx = round2(mx.max * i / 4);
      svg.appendChild(axisText(padL - 8, py(my.max * i / 4) + 3, "$" + Math.round(my.max * i / 4).toLocaleString("en-US"), { anchor: "end", baseline: "middle" }));
      svg.appendChild(svgEl("line", { x1: padL, y1: py(my.max * i / 4), x2: W - padR, y2: py(my.max * i / 4), stroke: "#2a3950", "stroke-width": 1 }));
      svg.appendChild(axisText(padL + (W - padL - padR) * (i / 4), H - 14, "$" + Math.round(tx).toLocaleString("en-US"), { fontSize: 10 }));
      svg.appendChild(svgEl("line", { x1: px(tx), y1: padT, x2: px(tx), y2: H - padB, stroke: "#2a3950", "stroke-width": 1 }));
    }
    svg.appendChild(axisText(W / 2, H - 6, "Marketing Spend", { fontSize: 11, fill: "#94a3b8" }));
    svg.appendChild(axisText(20, H / 2 - 8, "Revenue", { fontSize: 11, fill: "#94a3b8", transform: "rotate(-90 20 " + (H / 2 - 8) + ")" }));

    data.forEach(function (r) {
      var color = PALETTE[REGIONS.indexOf(r.region) % PALETTE.length] || "#94a3b8";
      var group = svgEl("g", {});
      var circle = svgEl("circle", { cx: px(r.spend), cy: py(r.revenue), r: 6, fill: color, "fill-opacity": 0.75, stroke: "#0f172a", "stroke-width": 1 });
      group.appendChild(circle);
      var tip = "<div class='tip-label'>" + r.region + " &middot; " + r.category + "</div>" +
                "<div class='tip-value'>" + r.period + " &middot; Revenue: " + fmtMoney(r.revenue) + "</div>" +
                "<div class='tip-value'>Spend: " + fmtMoney(r.spend) + " &middot; Profit: " + fmtMoney(r.profit) + "</div>";
      bindTip({ currentTarget: group }, tip, container);
      svg.appendChild(group);
    });

    // legend
    var seen = {};
    var idx = 0;
    data.forEach(function (r) {
      if (!seen[r.region]) {
        seen[r.region] = true;
        var lx = W - 210, ly = 18 + idx * 20;
        svg.appendChild(svgEl("rect", { x: lx, y: ly - 9, width: 11, height: 11, rx: 3, fill: PALETTE[REGIONS.indexOf(r.region) % PALETTE.length] }));
        svg.appendChild(axisText(lx + 16, ly + 1, r.region, { anchor: "start", fontSize: 12, baseline: "middle", fill: "#cbd5e1" }));
        idx++;
      }
    });

    container.appendChild(svg);
  }

  // ===================== KPI RENDERING =====================
  function renderKpis() {
    var data = rows();
    var revenue = sum(data, "revenue");
    var orders = sum(data, "orders");
    var profit = sum(data, "profit");
    var aov = orders ? revenue / orders : 0;
    var margin = revenue ? profit / revenue : 0;

    document.getElementById("kpi-revenue").textContent = fmtMoney(revenue);
    document.getElementById("kpi-orders").textContent = orders.toLocaleString("en-US");
    document.getElementById("kpi-aov").textContent = fmtMoney(aov);
    document.getElementById("kpi-margin").textContent = (margin * 100).toFixed(1) + "%";

    // Deltas: revenue/orders vs previous period range, aov/margin vs previous-period baseline.
    var prevFiltered = state.dataset.filter(function (r) {
      if (state.region !== "All Regions" && r.region !== state.region) return false;
      if (state.category !== "All Categories" && r.category !== state.category) return false;
      return r.periodIndex < state.periodFrom;
    });
    var prevRevenue = sum(prevFiltered, "revenue");
    var prevOrders = sum(prevFiltered, "orders");

    var revDelta = document.getElementById("kpi-revenue-delta");
    if (state.periodFrom === 1) {
      revDelta.innerHTML = "All periods selected";
      revDelta.className = "kpi-delta sub";
    } else if (prevRevenue) {
      var d = ((revenue / prevRevenue - 1) * 100).toFixed(1);
      revDelta.innerHTML = (d >= 0 ? "&uarr; +" : "&darr; ") + d + "% vs prior " + (state.periodFrom - 1) + " mo";
      revDelta.className = "kpi-delta " + (d >= 0 ? "up" : "down");
    } else {
      revDelta.innerHTML = "vs prior periods";
      revDelta.className = "kpi-delta sub";
    }

    var ordDelta = document.getElementById("kpi-orders-delta");
    if (prevOrders) {
      var od = ((orders / prevOrders - 1) * 100).toFixed(1);
      ordDelta.innerHTML = (od >= 0 ? "&uarr; +" : "&darr; ") + od + "% vs prior";
      ordDelta.className = "kpi-delta " + (od >= 0 ? "up" : "down");
    } else {
      ordDelta.innerHTML = "orders total";
      ordDelta.className = "kpi-delta sub";
    }

    var baseAov = prevFullBaseline("aov");
    var aovDelta = document.getElementById("kpi-aov-delta");
    if (baseAov) {
      var ad = ((aov / baseAov - 1) * 100).toFixed(1);
      aovDelta.innerHTML = (ad >= 0 ? "&uarr; +" : "&darr; ") + ad + "% vs prior avg";
      aovDelta.className = "kpi-delta " + (ad >= 0 ? "up" : "down");
    } else {
      aovDelta.innerHTML = "per order";
      aovDelta.className = "kpi-delta sub";
    }

    var baseMargin = prevFullBaseline("margin");
    var marginDelta = document.getElementById("kpi-margin-delta");
    if (baseMargin) {
      var md = ((margin - baseMargin) * 100).toFixed(1);
      marginDelta.innerHTML = (md >= 0 ? "&uarr; +" : "&darr; ") + md + " pts vs prior";
      marginDelta.className = "kpi-delta " + (md >= 0 ? "up" : "down");
    } else {
      marginDelta.innerHTML = "profit / revenue";
      marginDelta.className = "kpi-delta sub";
    }
  }

  // ===================== RENDERING / FILTERS =====================
  function renderAll() {
    renderKpis();
    renderTrend();
    renderBars();
    renderDonut();
    renderScatter();
  }

  function populateSelects() {
    var rSel = document.getElementById("region-filter");
    var cSel = document.getElementById("category-filter");
    rSel.innerHTML = "";
    cSel.innerHTML = "";
    var opts = ["All Regions"].concat(REGIONS);
    opts.forEach(function (o) {
      var el = document.createElement("option");
      el.value = o; el.textContent = o;
      rSel.appendChild(el);
    });
    var copts = ["All Categories"].concat(CATEGORIES);
    copts.forEach(function (o) {
      var el = document.createElement("option");
      el.value = o; el.textContent = o;
      cSel.appendChild(el);
    });
  }

  function initControls() {
    var fromInput = document.getElementById("period-from");
    var toInput = document.getElementById("period-to");

    function clampPeriodRange() {
      var maxCount = PERIODS.length;
      var from = parseInt(fromInput.value, 10);
      var to = parseInt(toInput.value, 10);
      if (isNaN(from) || isNaN(to)) return;
      if (from > to) {
        var src = document.activeElement;
        if (src === toInput) {
          from = Math.min(from, to);
          fromInput.value = from;
        } else {
          to = Math.max(to, from);
          toInput.value = to;
        }
      }
      document.getElementById("range-from-label").textContent = from;
      document.getElementById("range-to-label").textContent = to;
      state.periodFrom = from;
      state.periodTo = to;
      renderAll();
    }

    fromInput.addEventListener("input", clampPeriodRange);
    toInput.addEventListener("input", clampPeriodRange);
    document.getElementById("region-filter").addEventListener("change", function (e) {
      state.region = e.target.value;
      renderAll();
    });
    document.getElementById("category-filter").addEventListener("change", function (e) {
      state.category = e.target.value;
      renderAll();
    });
    document.getElementById("refresh-btn").addEventListener("click", function () {
      state.seed = (state.seed ^ 0x9e3779b9) >>> 0;
      if (state.seed === 0) state.seed = 20260227;
      state.dataset = generateDataset(state.seed);
      renderAll();
    });
    clampPeriodRange();
  }

  // boot
  document.addEventListener("DOMContentLoaded", function () {
    populateSelects();
    state.dataset = generateDataset(state.seed);
    initControls();
  });
})();
</script>
</body>
