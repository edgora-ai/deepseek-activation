<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Analytics Dashboard</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent2: #818cf8;
    --green: #34d399;
    --amber: #fbbf24;
    --rose: #fb7185;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
    min-height: 100vh;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 20px;
  }
  .header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .header .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  label { font-size: 12px; color: var(--muted); margin-right: 6px; }
  select, button, input[type="range"] {
    font-size: 13px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    color: var(--text);
  }
  select:focus, input:focus { outline: 2px solid var(--accent); }
  input[type="range"] { padding: 0; }
  button.refresh {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    font-weight: 600;
    color: #0b1220;
    cursor: pointer;
  }
  button.refresh:hover { filter: brightness(1.1); }
  button.refresh:active { transform: scale(0.98); }
  .kpis {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 20px;
  }
  .kpi {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 16px;
  }
  .kpi .kpi-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .kpi .kpi-value { font-size: 28px; font-weight: 700; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .kpi .kpi-delta { font-size: 12px; margin-top: 6px; color: var(--muted); }
  .kpi .kpi-delta.up { color: var(--green); }
  .kpi .kpi-delta.down { color: var(--rose); }
  .charts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .chart-panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 16px;
  }
  .chart-panel h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  .chart-panel svg { width: 100%; height: auto; display: block; }
  .tooltip {
    position: fixed;
    pointer-events: none;
    background: #0b1220;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    color: var(--text);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    z-index: 50;
    opacity: 0;
    transition: opacity 0.1s;
    max-width: 260px;
    white-space: nowrap;
  }
  .tooltip .tt-title { font-weight: 600; margin-bottom: 2px; color: var(--accent); }
  .tooltip .tt-row { display: flex; justify-content: space-between; gap: 12px; }
  .tooltip .tt-row .l { color: var(--muted); }
  @media (max-width: 900px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .charts { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>Sales Analytics Dashboard</h1>
    <div class="sub" id="datasetInfo">Loading dataset...</div>
  </div>
  <div class="controls">
    <div>
      <label for="regionFilter">Region</label>
      <select id="regionFilter"></select>
    </div>
    <div>
      <label for="categoryFilter">Category</label>
      <select id="categoryFilter"></select>
    </div>
    <div>
      <label for="periodRange">Period <span id="periodLabel"></span></label>
      <input type="range" id="periodRange" min="0" max="5" value="5">
    </div>
    <button class="refresh" id="refreshBtn">Refresh data</button>
  </div>
</div>

<div class="kpis">
  <div class="kpi" id="kpi-revenue">
    <div class="kpi-label">Revenue</div>
    <div class="kpi-value" id="v-revenue">$0</div>
    <div class="kpi-delta" id="d-revenue"></div>
  </div>
  <div class="kpi" id="kpi-orders">
    <div class="kpi-label">Orders</div>
    <div class="kpi-value" id="v-orders">0</div>
    <div class="kpi-delta" id="d-orders"></div>
  </div>
  <div class="kpi" id="kpi-aov">
    <div class="kpi-label">Avg Order Value</div>
    <div class="kpi-value" id="v-aov">$0</div>
    <div class="kpi-delta" id="d-aov"></div>
  </div>
  <div class="kpi" id="kpi-margin">
    <div class="kpi-label">Profit Margin</div>
    <div class="kpi-value" id="v-margin">0%</div>
    <div class="kpi-delta" id="d-margin"></div>
  </div>
</div>

<div class="charts">
  <div class="chart-panel">
    <h2>Revenue Trend by Period</h2>
    <div id="trendChart"></div>
  </div>
  <div class="chart-panel">
    <h2>Revenue by Category</h2>
    <div id="categoryChart"></div>
  </div>
  <div class="chart-panel">
    <h2>Regional Share</h2>
    <div id="regionalChart"></div>
  </div>
  <div class="chart-panel">
    <h2>Spend vs Revenue</h2>
    <div id="scatterChart"></div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
(function () {
  "use strict";

  var REGIONS = ["North", "South", "East", "West"];
  var CATEGORIES = ["Electronics", "Apparel", "Home", "Outdoors"];
  var PERIODS = ["2026-01", "2026-02", "2026-03", "2026-04", "2026-05", "2026-06"];
  var MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun"];

  var seed = 42;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function generateDataset(seedValue) {
    var rng = mulberry32(seedValue);
    var rows = [];
    for (var r = 0; r < REGIONS.length; r++) {
      var regionBase = 0.6 + rng() * 0.8;
      for (var c = 0; c < CATEGORIES.length; c++) {
        var catBase = 0.5 + rng() * 0.9;
        for (var p = 0; p < PERIODS.length; p++) {
          var trend = 1 + p * 0.12;
          var season = 1 + 0.25 * Math.sin((p + c) * 1.1);
          var revenue = (8000 + rng() * 4000) * regionBase * catBase * trend * season;
          var orders = Math.round(60 + rng() * 90 + revenue / 120);
          var spend = revenue * (0.35 + rng() * 0.25);
          var profit = revenue - spend;
          rows.push({
            region: REGIONS[r],
            category: CATEGORIES[c],
            period: PERIODS[p],
            monthIndex: p,
            revenue: Math.round(revenue),
            orders: orders,
            spend: Math.round(spend),
            profit: Math.round(profit)
          });
        }
      }
    }
    return rows;
  }

  var fullDataset = generateDataset(seed);
  var regionFilter = "All";
  var categoryFilter = "All";
  var periodEnd = 5;

  var tooltipEl = document.getElementById("tooltip");

  var fmtMoney = function (n) {
    return "$" + n.toLocaleString("en-US");
  };
  var fmtCompact = function (n) {
    if (n >= 1000000) return "$" + (n / 1000000).toFixed(1) + "M";
    if (n >= 1000) return "$" + (n / 1000).toFixed(1) + "K";
    return "$" + n;
  };

  function filteredRows() {
    var start = 0;
    return fullDataset.filter(function (row) {
      if (row.monthIndex > periodEnd) return false;
      if (regionFilter !== "All" && row.region !== regionFilter) return false;
      if (categoryFilter !== "All" && row.category !== categoryFilter) return false;
      return true;
    });
  }

  function aggregate() {
    var rows = filteredRows();
    var revenue = 0, orders = 0, spend = 0, profit = 0;
    var trend = {}; var catMap = {}; var regionMap = {};
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      revenue += row.revenue; orders += row.orders; spend += row.spend; profit += row.profit;
      trend[row.period] = (trend[row.period] || 0) + row.revenue;
      catMap[row.category] = (catMap[row.category] || 0) + row.revenue;
      regionMap[row.region] = (regionMap[row.region] || 0) + row.revenue;
    }
    return { revenue: revenue, orders: orders, spend: spend, profit: profit, trend: trend, catMap: catMap, regionMap: regionMap };
  }

  function populateFilters() {
    var reg = document.getElementById("regionFilter");
    var cat = document.getElementById("categoryFilter");
    reg.innerHTML = "";
    cat.innerHTML = "";
    reg.appendChild(new Option("All regions", "All"));
    cat.appendChild(new Option("All categories", "All"));
    REGIONS.forEach(function (r) { reg.appendChild(new Option(r, r)); });
    CATEGORIES.forEach(function (c) { cat.appendChild(new Option(c, c)); });
  }

  function renderKpis(agg, prev) {
    var setVal = function (id, v) { document.getElementById(id).textContent = v; };
    setVal("v-revenue", fmtMoney(agg.revenue));
    setVal("v-orders", agg.orders.toLocaleString("en-US"));
    setVal("v-aov", fmtMoney(agg.orders ? Math.round(agg.revenue / agg.orders) : 0));
    setVal("v-margin", (agg.revenue ? (agg.profit / agg.revenue) * 100 : 0).toFixed(1) + "%");

    if (prev && prev.revenue > 0) {
      var dRevenue = ((agg.revenue - prev.revenue) / prev.revenue) * 100;
      var dOrders = ((agg.orders - prev.orders) / prev.orders) * 100;
      var dAov = ((agg.orders ? agg.revenue / agg.orders : 0) - (prev.orders ? prev.revenue / prev.orders : 0)) / (prev.orders ? prev.revenue / prev.orders : 1) * 100;
      var dMargin = ((agg.revenue ? agg.profit / agg.revenue : 0) - (prev.revenue ? prev.profit / prev.revenue : 0)) * 100;
      var setDelta = function (id, val, unit) {
        var el = document.getElementById(id);
        if (!isFinite(val)) { el.textContent = ""; el.className = "kpi-delta"; return; }
        el.textContent = (val >= 0 ? "+" : "") + val.toFixed(1) + unit + " vs refresh";
        el.className = "kpi-delta " + (val >= 0 ? "up" : "down");
      };
      setDelta("d-revenue", dRevenue, "%");
      setDelta("d-orders", dOrders, "%");
      setDelta("d-aov", dAov, "%");
      setDelta("d-margin", dMargin, " pts");
    }
  }

  function setupSvg(container, w, h) {
    container.innerHTML = "";
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
    container.appendChild(svg);
    return svg;
  }

  function text(svg, x, y, content, opts) {
    var t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", x); t.setAttribute("y", y);
    t.setAttribute("fill", opts && opts.fill ? opts.fill : "#94a3b8");
    t.setAttribute("font-size", opts && opts.size ? opts.size : 10);
    if (opts && opts.anchor) t.setAttribute("text-anchor", opts.anchor);
    t.textContent = content;
    svg.appendChild(t);
    return t;
  }

  function attachTooltip(node, html) {
    node.style.cursor = "pointer";
    node.addEventListener("mousemove", function (e) {
      tooltipEl.innerHTML = html;
      tooltipEl.style.opacity = "1";
      tooltipEl.style.left = (e.clientX + 14) + "px";
      tooltipEl.style.top = (e.clientY - 10) + "px";
    });
    node.addEventListener("mouseleave", function () {
      tooltipEl.style.opacity = "0";
    });
  }

  function renderTrend(agg) {
    var container = document.getElementById("trendChart");
    var w = 520, h = 260, padL = 56, padR = 16, padT = 16, padB = 34;
    var svg = setupSvg(container, w, h);
    var keys = PERIODS.slice(0, periodEnd + 1);
    var values = keys.map(function (k) { return agg.trend[k] || 0; });
    var maxV = Math.max.apply(null, values.concat([1]));
    var plotW = w - padL - padR, plotH = h - padT - padB;
    var x = function (i) { return padL + (plotW * (values.length === 1 ? 0.5 : i / (values.length - 1))); };
    var y = function (v) { return padT + plotH - (v / maxV) * plotH; };

    for (var i = 0; i <= 4; i++) {
      var gy = padT + plotH - (i / 4) * plotH;
      var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", padL); line.setAttribute("y1", gy);
      line.setAttribute("x2", w - padR); line.setAttribute("y2", gy);
      line.setAttribute("stroke", "#334155"); line.setAttribute("stroke-width", "1");
      svg.appendChild(line);
      text(svg, padL - 8, gy + 3, fmtCompact(Math.round(maxV * i / 4)), { anchor: "end" });
    }
    keys.forEach(function (k, i) {
      text(svg, x(i), h - padB + 18, MONTH_NAMES[i], { anchor: "middle" });
    });

    var path = "";
    var points = [];
    values.forEach(function (v, i) {
      var px = x(i), py = y(v);
      points.push([px, py]);
      path += (i === 0 ? "M" : "L") + px.toFixed(1) + " " + py.toFixed(1) + " ";
    });
    var lineEl = document.createElementNS("http://www.w3.org/2000/svg", "path");
    lineEl.setAttribute("d", path);
    lineEl.setAttribute("fill", "none");
    lineEl.setAttribute("stroke", "var(--accent)");
    lineEl.setAttribute("stroke-width", "3");
    lineEl.setAttribute("stroke-linecap", "round");
    svg.appendChild(lineEl);

    var area = path + "L" + x(values.length - 1).toFixed(1) + " " + (padT + plotH) + " L" + x(0).toFixed(1) + " " + (padT + plotH) + " Z";
    var areaEl = document.createElementNS("http://www.w3.org/2000/svg", "path");
    areaEl.setAttribute("d", area);
    areaEl.setAttribute("fill", "url(#trendGrad)");
    areaEl.setAttribute("opacity", "0.35");
    svg.appendChild(areaEl);

    var defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
    var grad = document.createElementNS("http://www.w3.org/2000/svg", "linearGradient");
    grad.setAttribute("id", "trendGrad");
    grad.setAttribute("x1", "0"); grad.setAttribute("y1", "0"); grad.setAttribute("x2", "0"); grad.setAttribute("y2", "1");
    var stop1 = document.createElementNS("http://www.w3.org/2000/svg", "stop");
    stop1.setAttribute("offset", "0"); stop1.setAttribute("stop-color", "#38bdf8");
    var stop2 = document.createElementNS("http://www.w3.org/2000/svg", "stop");
    stop2.setAttribute("offset", "1"); stop2.setAttribute("stop-color", "#38bdf8"); stop2.setAttribute("stop-opacity", "0.05");
    grad.appendChild(stop1); grad.appendChild(stop2);
    defs.appendChild(grad);
    svg.insertBefore(defs, svg.firstChild);

    values.forEach(function (v, i) {
      var px = x(i), py = y(v);
      var dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      dot.setAttribute("cx", px); dot.setAttribute("cy", py);
      dot.setAttribute("r", "5");
      dot.setAttribute("fill", "var(--accent)");
      dot.setAttribute("stroke", "#0f172a");
      dot.setAttribute("stroke-width", "2");
      attachTooltip(dot, '<div class="tt-title">' + keys[i] + '</div><div class="tt-row"><span class="l">Revenue</span><span>' + fmtMoney(v) + '</span></div>');
      svg.appendChild(dot);
    });
  }

  var CAT_COLORS = { "Electronics": "#38bdf8", "Apparel": "#818cf8", "Home": "#34d399", "Outdoors": "#fbbf24" };

  function renderCategory(agg) {
    var container = document.getElementById("categoryChart");
    var w = 520, h = 260, padL = 64, padR = 16, padT = 16, padB = 34;
    var svg = setupSvg(container, w, h);
    var cats = CATEGORIES;
    var values = cats.map(function (c) { return agg.catMap[c] || 0; });
    var maxV = Math.max.apply(null, values.concat([1]));
    var plotW = w - padL - padR, plotH = h - padT - padB;
    var slot = plotW / cats.length;
    var barW = Math.min(56, slot * 0.6);

    for (var i = 0; i <= 4; i++) {
      var gy = padT + plotH - (i / 4) * plotH;
      var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", padL); line.setAttribute("y1", gy);
      line.setAttribute("x2", w - padR); line.setAttribute("y2", gy);
      line.setAttribute("stroke", "#334155"); line.setAttribute("stroke-width", "1");
      svg.appendChild(line);
      text(svg, padL - 8, gy + 3, fmtCompact(Math.round(maxV * i / 4)), { anchor: "end" });
    }

    cats.forEach(function (c, i) {
      var v = values[i];
      var bx = padL + slot * i + (slot - barW) / 2;
      var by = padT + plotH - (v / maxV) * plotH;
      var rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      rect.setAttribute("x", bx); rect.setAttribute("y", by);
      rect.setAttribute("width", barW);
      rect.setAttribute("height", padT + plotH - by);
      rect.setAttribute("rx", "4");
      rect.setAttribute("fill", CAT_COLORS[c]);
      rect.setAttribute("opacity", "0.9");
      attachTooltip(rect, '<div class="tt-title">' + c + '</div><div class="tt-row"><span class="l">Revenue</span><span>' + fmtMoney(v) + '</span></div><div class="tt-row"><span class="l">Share</span><span>' + (agg.revenue ? ((v / agg.revenue) * 100).toFixed(1) : "0") + '%</span></div>');
      svg.appendChild(rect);
      text(svg, bx + barW / 2, h - padB + 18, c, { anchor: "middle", fill: "#cbd5e1" });
    });
  }

  function renderRegional(agg) {
    var container = document.getElementById("regionalChart");
    var w = 520, h = 260;
    var svg = setupSvg(container, w, h);
    var cx = 180, cy = 130, r = 86;
    var entries = REGIONS.filter(function (rg) { return (agg.regionMap[rg] || 0) > 0; });
    if (entries.length === 0) {
      text(svg, w / 2, h / 2, "No data for current filters", { anchor: "middle", fill: "#64748b" });
      return;
    }
    var total = entries.reduce(function (s, rg) { return s + agg.regionMap[rg]; }, 0);
    var colors = ["#38bdf8", "#818cf8", "#34d399", "#fbbf24"];
    var angles = [];
    var acc = 0;
    entries.forEach(function (rg, i) {
      var frac = agg.regionMap[rg] / total;
      angles.push({ region: rg, value: agg.regionMap[rg], start: acc, end: acc + frac * 2 * Math.PI, color: colors[i % colors.length] });
      acc += frac * 2 * Math.PI;
    });

    var arc = function (x0, y0, rad, a0, a1) {
      var large = (a1 - a0) > Math.PI ? 1 : 0;
      var p0 = [x0 + rad * Math.cos(a0), y0 + rad * Math.sin(a0)];
      var p1 = [x0 + rad * Math.cos(a1), y0 + rad * Math.sin(a1)];
      return "M" + x0 + " " + y0 + " L" + p0[0].toFixed(2) + " " + p0[1].toFixed(2) +
        " A" + rad + " " + rad + " 0 " + large + " 1 " + p1[0].toFixed(2) + " " + p1[1].toFixed(2) + " Z";
    };

    angles.forEach(function (a) {
      var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", arc(cx, cy, r, a.start, a.end));
      path.setAttribute("fill", a.color);
      path.setAttribute("stroke", "#0f172a");
      path.setAttribute("stroke-width", "2");
      attachTooltip(path, '<div class="tt-title">' + a.region + '</div><div class="tt-row"><span class="l">Revenue</span><span>' + fmtMoney(a.value) + '</span></div><div class="tt-row"><span class="l">Share</span><span>' + (a.value / total * 100).toFixed(1) + '%</span></div>');
      svg.appendChild(path);
    });

    var lx = w - 190, ly = 30;
    entries.forEach(function (a) {
      var sq = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      sq.setAttribute("x", lx); sq.setAttribute("y", ly - 8);
      sq.setAttribute("width", "10"); sq.setAttribute("height", "10");
      sq.setAttribute("rx", "2"); sq.setAttribute("fill", a.color);
      svg.appendChild(sq);
      text(svg, lx + 16, ly, a.region + "  " + (a.value / total * 100).toFixed(0) + "%", { fill: "#cbd5e1", size: 11 });
      ly += 20;
    });
  }

  function renderScatter(agg) {
    var container = document.getElementById("scatterChart");
    var w = 520, h = 260, padL = 56, padR = 16, padT = 16, padB = 34;
    var svg = setupSvg(container, w, h);
    var rows = filteredRows();
    var maxX = 0, maxY = 0;
    rows.forEach(function (r) { maxX = Math.max(maxX, r.spend); maxY = Math.max(maxY, r.revenue); });
    maxX = Math.max(maxX, 1); maxY = Math.max(maxY, 1);
    var plotW = w - padL - padR, plotH = h - padT - padB;
    var x = function (v) { return padL + (v / maxX) * plotW; };
    var y = function (v) { return padT + plotH - (v / maxY) * plotH; };

    for (var i = 0; i <= 4; i++) {
      var gx = padL + (i / 4) * plotW;
      var lineV = document.createElementNS("http://www.w3.org/2000/svg", "line");
      lineV.setAttribute("x1", gx); lineV.setAttribute("y1", padT);
      lineV.setAttribute("x2", gx); lineV.setAttribute("y2", padT + plotH);
      lineV.setAttribute("stroke", "#334155"); lineV.setAttribute("stroke-width", "1");
      svg.appendChild(lineV);
      text(svg, gx, h - padB + 18, fmtCompact(Math.round(maxX * i / 4)), { anchor: "middle" });
      var gy = padT + plotH - (i / 4) * plotH;
      var lineH = document.createElementNS("http://www.w3.org/2000/svg", "line");
      lineH.setAttribute("x1", padL); lineH.setAttribute("y1", gy);
      lineH.setAttribute("x2", w - padR); lineH.setAttribute("y2", gy);
      lineH.setAttribute("stroke", "#334155"); lineH.setAttribute("stroke-width", "1");
      svg.appendChild(lineH);
      text(svg, padL - 8, gy + 3, fmtCompact(Math.round(maxY * i / 4)), { anchor: "end" });
    }
    text(svg, padL + plotW / 2, h - 4, "Spend", { anchor: "middle", size: 10 });
    text(svg, 14, padT + plotH / 2, "Revenue", { anchor: "middle", size: 10, fill: "#94a3b8" });

    rows.forEach(function (r) {
      var px = x(r.spend), py = y(r.revenue);
      var dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      dot.setAttribute("cx", px); dot.setAttribute("cy", py);
      dot.setAttribute("r", "5");
      dot.setAttribute("fill", CAT_COLORS[r.category]);
      dot.setAttribute("opacity", "0.85");
      dot.setAttribute("stroke", "#0f172a");
      dot.setAttribute("stroke-width", "1");
      attachTooltip(dot,
        '<div class="tt-title">' + r.region + " · " + r.category + " · " + r.period + '</div>' +
        '<div class="tt-row"><span class="l">Revenue</span><span>' + fmtMoney(r.revenue) + '</span></div>' +
        '<div class="tt-row"><span class="l">Spend</span><span>' + fmtMoney(r.spend) + '</span></div>' +
        '<div class="tt-row"><span class="l">Profit</span><span>' + fmtMoney(r.profit) + '</span></div>'
      );
      svg.appendChild(dot);
    });
  }

  var lastAgg = null;

  function render() {
    var agg = aggregate();
    renderKpis(agg, lastAgg);
    renderTrend(agg);
    renderCategory(agg);
    renderRegional(agg);
    renderScatter(agg);
    var startName = MONTH_NAMES[0];
    var endName = MONTH_NAMES[periodEnd];
    document.getElementById("periodLabel").textContent = startName + " – " + endName;
    var rows = filteredRows();
    document.getElementById("datasetInfo").textContent =
      rows.length + " data points (" + new Set(rows.map(function (r) { return r.region; })).size + " regions, " +
      new Set(rows.map(function (r) { return r.category; })).size + " categories, " +
      new Set(rows.map(function (r) { return r.period; })).size + " months) · dataset seed " + seed;
  }

  function bindEvents() {
    document.getElementById("regionFilter").addEventListener("change", function (e) {
      regionFilter = e.target.value;
      lastAgg = null;
      render();
    });
    document.getElementById("categoryFilter").addEventListener("change", function (e) {
      categoryFilter = e.target.value;
      lastAgg = null;
      render();
    });
    document.getElementById("periodRange").addEventListener("input", function (e) {
      periodEnd = parseInt(e.target.value, 10);
      lastAgg = null;
      render();
    });
    document.getElementById("refreshBtn").addEventListener("click", function () {
      var prev = aggregate();
      seed = (seed * 2654435761 + 17) >>> 0;
      fullDataset = generateDataset(seed);
      lastAgg = prev;
      render();
    });
  }

  populateFilters();
  bindEvents();
  render();
})();
</script>
</body>
</html>
